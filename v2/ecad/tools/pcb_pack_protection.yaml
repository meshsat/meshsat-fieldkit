# THE PACK'S PROTECTION, FUNCTION BY FUNCTION, AGAINST THE CELL MAKER'S OWN NUMBERS (rule BAT-001, MESHSAT-862,
# 18 September 2026).
#
# BAT-001 asks that the cell block have over-voltage, under-voltage, over-current, short-circuit and
# over-temperature protection IN HARDWARE, INDEPENDENT OF ANY SOFTWARE, with the trip points set from the cell
# manufacturer's own limits, and that each function name the device that implements it, its configured
# threshold, the cell limit it is derived from and the test that will demonstrate it on the prototype. Until
# today nothing in this tree said what any of those thresholds are: the design carries a BQ4050 whose
# protection subsystem is configured in data flash, and a data-flash configuration that exists nowhere is not
# a design, it is an intention. This file is that configuration, written down before anything is programmed.
#
# EVERY LIMIT IS QUOTED FROM THE CELL'S OWN SPECIFICATION AND RE-EXTRACTED BY THE GATE (the rule the fuse
# derating table taught on 17 September): `quote` is the string as it appears in the PDF's text, and
# `pack_protection.py` refuses a row whose quote it cannot find in the document named by `spec`. A number typed
# from memory cannot survive that, which is the point.
#
# The 4S3P case is the WORST case for every current limit (three cells in parallel, not four), so the pack
# limits below are computed at parallel_min and the gate says so.
#
# BROUGHT TO THE DRAWN CIRCUIT (27 September 2026, stream w4dp, MESHSAT-1357; S-45). Until today `secondary_protection`
# quoted the generator of before round 4 ("no chemical fuse", PTC and PTCEN tied off, no second protector), and the gate's
# one failure repeated it while board P's committed netlist (085f8333, gen_sch_p.py since faf8c981 and d90f30e4) carries the
# owner's decision 40 floor: the TI BQ7720700 second level U2 on its own tap filters and thermistor, its COUT and the
# gauge's FUSE output driving the Eaton SCF9550-30-05 chemical fuse F2's heater through the arming jumper JP1 and Q3, its
# DOUT holding the discharge FET Q2 off through Q5, and the gauge's PTC input on the chip PTC RT1. So the table now says
# what the board carries, part by part (`devices`, every one checked on the netlist by reference, and
# tests/test_pack_protection.py holds the connections themselves), and it judges the HARDWARE LEVEL the same way it judges
# the gauge: the five functions BAT-001 names, each on the part that performs it without firmware, against the same cell
# limits (`functions`, the rows with `level: hardware`, after the nine rows of the gauge). Read that way, the floor meets
# the requirement's words for over-voltage and for short circuit, and it does NOT meet them for under-voltage (2.25 V
# against the guideline's 2.30 V), over-temperature (a fixed 70 C, 62.7 to 77.5 C at its network, against the cells' 60 C:
# finding BAT-F16) or over-current (no firmware-free element opens at or below the cells' 24 A), and the gate says so in
# three failures, each carrying its finding. The gauge's nine rows are unchanged. Finding BAT-F20 (S-46, Q1's body diode
# in discharge) is carried open on Q1's row and not answered here.
schema_version: "1.0.0"
generated: "2026-09-18"
revised: "2026-09-27"
board: p

pack:
  topology: "4S3P Samsung INR18650-35E, about 145 Wh"   # owner ruling D-06; gen_sch_p.py header
  series: 4
  parallel_min: 3
  parallel_max: 3                                # D-06: one parallel count
  declared_continuous_a: 10.0                    # pcb_energy_chain.yaml, stage PACK_CELLS
  declared_peak_a: 18.0
  prospective_fault_a: {low: 240.0, high: 480.0} # the same file, from the cells' own impedance
  secondary_protection:
    present: true
    parts: [U2, F2, Q3, JP1, Q5, RT1, J_TS2, F1]
    why: "owner decision 40 (D-15, ruled 26 September 2026) and board P as generated since faf8c981 and d90f30e4
      (gen_sch_p.py: the part lines of U2, F2, Q3, JP1, Q5 and RT1). A TI BQ7720700DSSR second level (SLUSEG7D Rev. D,
      Device Comparison Table: cell over-voltage 4.325 V with 100 mV hysteresis and a 1 s delay, cell under-voltage
      2.25 V, open wire enabled, over-temperature 70 C, latch disabled, Active High 6V outputs) on its own tap filters
      (R24 to R27, C15 to C18), its own supply (R23, C14) and its own Semitec 103AT-2 on J_TS2 behind R34 and R33. Its
      thresholds are fixed in silicon and it runs no firmware: COUT (over-voltage, open wire, over-temperature, oscillator)
      and the BQ4050's FUSE output both drive FUSE_G (R29, R30), which through the arming jumper JP1 turns on Q3 (AO3400A)
      and heats the Eaton SCF9550-30-05 chemical fuse F2 in the cell path until it opens; DOUT (under-voltage, open wire,
      over-temperature) turns Q5 (2N7002) on and holds the discharge FET Q2's gate at VSS. The gauge's PTC input is enabled
      on the Murata PRF15BB103RB6RC element RT1 beside the FETs, a comparator and latch in the gauge that turns the FETs
      off without its firmware (SLUSC67B 6.23; the battery packet's PROTECTION-ARCHITECTURE.md section 2). The 25 A mini
      blade F1 is the gross-fault element. JP1 is open as built and closed at commissioning, after the gauge's image is
      written and read back (FUSE-INTERPRETATION.md section 5): until then no path opens F2."
    what_it_does_not_give: "independence from the SAME ACTUATORS (a welded Q2 defeats both levels' discharge action,
      and a failed Q3 or an open JP1 removes the fuse from both; PROTECTION-ARCHITECTURE.md section 3), and trip points
      at the cell maker's own limits for three of the five functions: the `level: hardware` rows below say which, and
      the open items carry them (BAT-F16 for over-temperature; the under-voltage and over-current rows' own findings)."

cell:
  part: "Samsung INR18650-35E"
  spec: v2/vendor/battery/samsung-35e-orbtronic.pdf
  revision: "Ver. 1.1, 9 July 2015"
  chemistry_row: "NCA / NCM (an INR cell is nickel manganese cobalt), the Pack Design Guideline's own row"
  column: "Portable IT"
  _column_why: "the kit is a portable communications terminal carried by a person, which is the guideline's
    Portable IT column; it is also the strictest column for over-discharge on the NCA/NCM rows (terminate 2.50 V
    against Power-Tool's 2.50 and Medical's 2.50, protection 2.30 against 2.00)."
  limits:
    charge_voltage_v:       {value: 4.20,  clause: "3.2 Charging Voltage",                       quote: "4.2V"}
    guideline_charge_v:     {value: 4.20,  clause: "Pack Design Guideline, standard charging voltage (4.20V cell), Portable IT", quote: "Standard charging voltage (4.20V cell)"}
    recharge_v:             {value: 4.10,  clause: "Pack Design Guideline, voltage of re-charging (4.20V cell), Portable IT",    quote: "Voltage of Re-charging (4.20V cell)"}
    terminate_discharge_v:  {value: 2.50,  clause: "Pack Design Guideline, NCA/NCM min. voltage of terminate discharging, Portable IT", quote: "terminate discharging"}
    overdischarge_protect_v: {value: 2.30,  clause: "Pack Design Guideline, NCA/NCM min. voltage of over-discharging protection, Portable IT", quote: "over-discharging protection"}
    bms_shutdown_v:         {value: 2.00,  clause: "Pack Design Guideline, BMS shut down voltage",            quote: "BMS Shut Down Voltage"}
    do_not_charge_below_v:  {value: 1.00,  clause: "Pack Design Guideline, do not charge",                    quote: "Under 1.0V voltage, do not charge the cell"}
    precharge_window_v:     {low: 1.00, high: 3.00, clause: "Pack Design Guideline, pre-charging voltage range", quote: "1.0V ~ 3.0V"}
    discharge_cutoff_v:     {value: 2.65,  clause: "3.9 Discharge Cut-off Voltage",               quote: "2.65V"}
    max_charge_current_ma:  {value: 2000,  clause: "3.7 Max. Charge Current",                     quote: "2,000mA"}
    max_continuous_discharge_ma: {value: 8000, clause: "3.8 Max. Discharge Current",              quote: "8,000mA"}
    max_pulse_discharge_ma: {value: 13000, clause: "3.8 Max. Discharge Current",                  quote: "13,000mA"}
    charge_temp_c:          {low: 0.0, high: 45.0, clause: "3.12 Operating Temperature",          quote: "Charge : 0 to 45"}
    discharge_temp_c:       {low: -10.0, high: 60.0, clause: "3.12 Operating Temperature",        quote: "Discharge : -10 to 60"}

devices:
  U1: {part: "BQ4050RSMR", what: "SMBus gas gauge with the primary protection subsystem, 4S",
       spec: v2/vendor/battery/ti-bq4050.pdf, software: true,
       why: "its thresholds and delays live in data flash and its protection runs in the gauge's own firmware:
         independent of the host, not independent of software"}
  Q1: {part: "CSD17570Q5B", what: "the charge switch the gauge opens", spec: v2/vendor/battery/ti-csd17570q5b.pdf, software: true,
       open: "finding BAT-F20 (S-46, open, not answered here): with FET Options CHGIN = 1 the gauge holds Q1 off whenever
         the pack is not charging, discharge included (TI SLUUAQ3A 4.12, 4.13, 14.2.1.1), so the kit's discharge
         current crosses Q1's body diode, about 7 W on board P at 10 A; options (a) a FET Options setting that keeps
         discharge on, (b) a separate charge-path FET, (c) a thermal budget, put to the qualified reviewer (Q-P18) and
         to TI (Q-TI-10)"}
  Q2: {part: "CSD17570Q5B", what: "the discharge switch the gauge opens, and the one the second level's under-voltage
       holds off through Q5", spec: v2/vendor/battery/ti-csd17570q5b.pdf, software: true,
       why: "switched by the gauge's DSG drive (firmware) and, for the second level's under-voltage, by U2's DOUT through
         Q5 (no firmware); a Q2 welded short defeats both (PROTECTION-ARCHITECTURE.md section 3)"}
  F1: {part: "25 A MINI blade (Littelfuse 297 or Bussmann ATM, the sizes the Keystone 3568 holder takes)",
       what: "the pack's gross-fault fuse, in a Keystone 3568 holder, between the cell block's positive and F2",
       spec: v2/vendor/keystone/littelfuse-297-ficcorp.pdf, software: false,
       why: "the only element in the pack path that opens by itself on current alone at a short circuit: Littelfuse
         297, 1000 A interrupting at 32 VDC, 625 A2s typical at 25 A, and by the maker's time-current table it holds
         110 percent (27.5 A) for 360,000 s at least, opens 135 percent (33.75 A) in 0.75 to 600 s and 600 percent
         (150 A) in 0.030 to 0.100 s. This row said '25 A ATOF blade' with the Littelfuse 287 ATOF sheet until 27
         September 2026: the ATO is the regular size and the holder takes the MINI (Keystone catalogue page 42,
         v2/vendor/keystone/M65p42.pdf; finding BAT-F04 of the battery packet)"}
  R10: {part: "2 mOhm 2512 2 W sense resistor", what: "the coulomb counter's shunt in the pack negative, across which the
        gauge's SRP and SRN read every current protection of its own (OCC, OCD, AOLD, ASCC, ASCD)", software: true,
        why: "a sense element: the current protections that read it are the gauge's. Until 27 September 2026 this row
          called R10 '10k NTC x4', which is the thermistors' job (J_TS below; gen_sch_p.py F-PK-02)"}
  J_TS: {part: "JST B5B-PH-K-S(LF)(SN) socket for four Semitec 103AT-2 10 kohm NTC thermistors, one per series group",
         what: "TS1 to TS4, the cell-surface thermistors the gauge reads for every temperature window below",
         spec: v2/vendor/battery/semitec-at-p12-13.pdf, alternative_spec: v2/vendor/battery/murata-nxrt15xh103fa1b.pdf,
         software: true,
         why: "the gauge's sensors (SLUSC67B Figure 21, RT2 to RT5); Murata's NXRT15XH103FA1B is the documented
           alternative this row named until 27 September 2026, under R10"}
  U2: {part: "BQ7720700DSSR", what: "the second-level protector: cell over-voltage, under-voltage, open wire and
       over-temperature, 3S to 7S, fixed thresholds", spec: v2/vendor/battery/ti-bq77207.pdf, software: false,
       why: "its thresholds are fixed in silicon (SLUSEG7D Device Comparison Table) and it runs no firmware; its own supply
         (R23), its own tap filters (R24 to R27) and its own thermistor (J_TS2)"}
  J_TS2: {part: "JST B2B-PH-K-S(LF)(SN) socket for the second level's own Semitec 103AT-2", what: "TS of U2, through
          R34 (270 ohm) with R33 (18 kohm) to VSS, on the cell expected hottest", spec: v2/vendor/battery/semitec-at-p12-13.pdf,
          software: false}
  F2: {part: "Eaton SCF9550-30-05", what: "the chemical (self-control) fuse in the cell path between F1 and the charge
       FET: opens on its heater (commanded) or on its own element's over-current", spec: v2/vendor/battery/eaton-scf9550-elx1135.pdf,
       software: false,
       why: "Eaton ELX1135: 30 A, 4 to 5 cells, 100 percent of rating for 1 hour minimum and 200 percent opens within
         60 s maximum, 80 A breaking capacity, heater 4.8 to 8.0 ohm operating from 10.5 to 23.5 V, operating -20 to
         +60 C; not rated to interrupt the 240 to 480 A prospective fault, which is F1's job"}
  Q3: {part: "AO3400A", what: "the fuse heater switch, gate on FUSE_GQ behind JP1, drain on F2's heater terminal",
       spec: v2/vendor/power/aos-ao3400a-n-mosfet.pdf, software: false}
  JP1: {part: "solder jumper (copper, not a bought part)", what: "the arming jumper between FUSE_G and FUSE_GQ: open as
        built, closed at commissioning after the gauge's image is written and read back", software: false,
        why: "until it is closed nothing opens F2, and with it open R32 holds Q3 off (gen_sch_p.py JP1 and R32)"}
  Q5: {part: "2N7002 (JSCJ, LCSC C8545)", what: "the second level's under-voltage hold: DOUT on its gate, DSG_G on its
       drain, so Q2 is held off without firmware", spec: v2/vendor/power/jscj-2n7002-c8545.pdf, software: false}
  RT1: {part: "Murata PRF15BB103RB6RC", what: "the chip PTC element on the gauge's PTC input, beside Q1 and Q2",
        spec: v2/vendor/battery/murata-prf-series.pdf, software: false,
        why: "the gauge's PTC comparator turns the FETs off when the element passes 1.2 to 3.95 Mohm, about 110 to 133 C
          at the element, and works in SHUTDOWN too (SLUSC67B 6.23; SLUUAQ3A 3.15): a protection of the FETs, not of
          the cells' limits, and a permanent fail cleared only by a power-on reset"}

functions:

 - id: CELL_OVER_VOLTAGE
   what: "a cell is charged above its own charging voltage"
   device: U1
   threshold: {value: 4.25, unit: V, per: cell, delay_s: 2.0, recovery: "4.10 V, the guideline's own re-charge voltage"}
   derived_from: charge_voltage_v
   direction: above_limit_by_at_most
   allowance: {value: 0.05, unit: V,
               why: "the trip has to sit ABOVE a healthy CC-CV charge to 4.20 V or a correct charge terminates
                 as a fault, and as close to it as the measurement allows: the BQ4050's cell-voltage accuracy is
                 within tens of millivolts, so 50 mV is about two sigma of the measurement and well under the
                 guideline's own 4.35 V cell class"}
   test: "charge one cell block from a bench supply through the pack's own charge path with the gauge live,
     raise the supply until the gauge opens Q1, and read the cell voltage at the trip on the tap it measures:
     4.25 V +- 0.05 V, and the FET must open within 2 s of the threshold being crossed"

 - id: CELL_UNDER_VOLTAGE
   what: "a cell is discharged below the voltage the cell maker sets for over-discharge protection"
   device: U1
   threshold: {value: 2.50, unit: V, per: cell, delay_s: 4.0, recovery: "3.00 V"}
   derived_from: overdischarge_protect_v
   direction: at_or_above_limit
   test: "discharge the block at 1 A until the gauge opens Q2; read the lowest cell tap at the trip (2.50 V
     +0.05/-0.00) and confirm the pack terminal falls to zero and the gauge stays awake"

 - id: PACK_OVER_CURRENT_DISCHARGE
   what: "the pack delivers more than the cells are rated for, continuously"
   device: U1
   threshold: {value: 20.0, unit: A, per: pack, delay_s: 2.0}
   derived_from: max_continuous_discharge_ma
   direction: at_or_below_pack_limit
   test: "an electronic load stepped to 20 A on the pack terminal with the gauge live: Q2 opens within 2 s,
     and the same load at the declared 10 A continuous runs for an hour without tripping"

 - id: PACK_OVER_CURRENT_DISCHARGE_2
   what: "the pack delivers more than the cells' pulse rating"
   device: U1
   threshold: {value: 30.0, unit: A, per: pack, delay_s: 0.02}
   derived_from: max_pulse_discharge_ma
   direction: at_or_below_pack_limit
   test: "a 30 A pulse of 100 ms into the load: Q2 opens within 20 ms, and an 18 A pulse of the same length
     (the chain's declared peak) does not open it"

 - id: PACK_SHORT_CIRCUIT_DISCHARGE
   what: "a short across the pack terminal"
   device: U1
   threshold: {value: 60.0, unit: A, per: pack, delay_s: 0.0002}
   derived_from: max_pulse_discharge_ma
   direction: below_prospective_fault
   test: "a bolted short through a 1 mOhm shunt with a scope on the gate of Q2: the gate collapses within
     200 us and F1 does not blow, which is what tells the gauge protected the pack rather than the fuse"

 - id: PACK_OVER_CURRENT_CHARGE
   what: "the pack is charged above the cells' own charge-current limit"
   device: U1
   threshold: {value: 5.0, unit: A, per: pack, delay_s: 2.0}
   derived_from: max_charge_current_ma
   direction: at_or_below_pack_limit
   test: "the charger set to 5 A into a half-charged block: Q1 opens within 2 s; at the design's 4 A it does not"

 - id: CHARGE_TEMPERATURE_WINDOW
   what: "the cells are charged outside the temperature window the cell maker allows"
   device: U1
   threshold: {low: 1.0, high: 44.0, unit: C, per: cell, delay_s: 2.0, sensor: "TS1 to TS4 at the cell surface", why: "inside 0 to 45 C by the gauge's own error budget, THERMAL-COORDINATION.md section 3; the charge ranges T1 1 C, T3 42 C (no charge starts above it) and T4 43 C sit inside it"}
   derived_from: charge_temp_c
   direction: inside_window
   test: "the block in a chamber at -5 C and at +48 C with the charger live and a reference thermocouple on every cell: Q1 stays open at both and closes between 5 C and 39 C,
     and it is open before any cell surface reads above 45.0 C or below 0.0 C on the references; the thermistors read the CELL SURFACE, so the sensor's own position is part of the test"

 - id: DISCHARGE_TEMPERATURE_WINDOW
   what: "the cells are discharged outside the temperature window the cell maker allows"
   device: U1
   threshold: {low: -9.0, high: 57.5, unit: C, per: cell, delay_s: 2.0, sensor: "TS1 to TS4 at the cell surface", why: "inside -10 to 60 C by the gauge's own error budget, THERMAL-COORDINATION.md section 3"}
   derived_from: discharge_temp_c
   direction: inside_window
   test: "the block in a chamber at -15 C, then at +59 C raised in 0.5 K steps to +60 C at most, under a 2 A load with a reference thermocouple on every cell: Q2 opens at both before any cell surface
     passes -10.0 C or +60.0 C on the references, and closes inside the window; never above +60 C (the second level's lowest trip is 62.7 C, the gauge's SOT can act from 64.2 C)"

 - id: PRECHARGE_WINDOW
   what: "a deeply discharged cell is charged at full current, or a dead cell is charged at all"
   device: U1
   threshold: {low: 1.00, high: 3.00, unit: V, per: cell, current_a: 1.0,
               note: "pre-charge current 1.0 A at the pack, which is 0.1C of a 3P block (3 x 3.45 Ah), the
                 bottom of the guideline's own 0.1C to 0.5C window"}
   derived_from: precharge_window_v
   direction: inside_window
   test: "a block brought to 2.5 V per cell: the gauge pre-charges at about 1 A and does not raise the current
     until every cell is above 3.00 V; a block below 1.00 V per cell is not charged at all and the gauge says so"

# THE HARDWARE LEVEL (27 September 2026, stream w4dp, S-45). BAT-001's own words, function by function, on the parts that act
# with no firmware at all: the second level U2, the chemical fuse F2 it and the gauge fire through JP1 and Q3, the discharge
# hold Q5, and the blade F1. They sit BEYOND the gauge's thresholds by design (a backstop must not fire before the recoverable
# primary does), and each is judged against the same cell limit as the gauge's row for the same function, because the
# requirement asks for the trip points to be set from the cell maker's own limits and does not relax that for a second level.
# Three of the five do not meet it on the drawn circuit, and each such row names its finding under `open`. None of the numbers
# below is measured: every one is the maker's, and the bench tests are TEST-PLAN.md rows 10 to 14.

 - id: SECOND_LEVEL_CELL_OVER_VOLTAGE
   level: hardware
   what: "a cell is charged above its own charging voltage and the gauge has not stopped it"
   device: U2
   threshold: {value: 4.325, unit: V, per: cell, delay_s: 1.0, recovery: "4.225 V, the variant's 100 mV hysteresis",
               accuracy: "+-20 mV from 0 to 60 C and +-50 mV from -40 to 110 C (SLUSEG7D 6.5, VOV_ACC); delay 1 s +-150 ms
                 with +-10 percent drift over temperature (6.6)",
               action: "COUT high: FUSE_G through R29, and with JP1 closed Q3 heats F2 until it opens the cell path for good;
                 the gauge reads the same line on its FUSE pin as a second-level trip"}
   derived_from: charge_voltage_v
   direction: above_limit_by_at_most
   allowance: {value: 0.175, unit: V,
               why: "a second level must sit above the gauge's own 4.25 V trip at every corner of both parts' accuracy, or
                 it retires by fuse a pack the recoverable primary would have stopped: the 4.275 V variants can trip at
                 4.225 V, below it (gen_sch_p.py at U2). 4.325 V at its widest accuracy, +-50 mV from -40 to 110 C,
                 reaches 4.375 V, 0.175 V over the cell's 4.20 V; inside 0 to 60 C, where the gauge lets a charge run,
                 it reaches 4.345 V, 0.145 V over. No released variant sits lower and still clears the primary
                 (SLUSEG7D Device Comparison Table)"}
   test: "JP1 open and the gauge on TI's shipped image (FETs held off, so it cannot latch 2LVL): a 4S string simulator on
     J_CELL at 3.70 V per cell, one cell raised in 5 mV steps: TP11 (FUSE_G, COUT through R29) goes high with that cell
     between 4.305 and 4.345 V at room temperature, 0.85 to 1.15 s after the step that crosses it, and falls again once
     the cell is back 100 mV lower; F2 is untouched because JP1 is open"

 - id: SECOND_LEVEL_CELL_UNDER_VOLTAGE
   level: hardware
   what: "a cell is discharged below the voltage the cell maker sets for over-discharge protection and the gauge has not
     stopped it"
   device: U2
   threshold: {value: 2.25, unit: V, per: cell, delay_s: 1.0, recovery: "2.35 V, the variant's 100 mV hysteresis",
               accuracy: "+-50 mV from -40 to 110 C (SLUSEG7D 6.5, VUV_ACC), so 2.20 to 2.30 V",
               action: "DOUT high: Q5 holds DSG_G at VSS and the discharge FET Q2 off; charging continues through Q2's body
                 diode. The fuse is not fired: an under-voltage recovers by charging, and F2's heater needs 10.5 V"}
   derived_from: overdischarge_protect_v
   direction: at_or_above_limit
   open: "W4DP-F1 (27 September 2026): the only released BQ77207 variant whose over-voltage clears the gauge's 4.25 V trip
     carries a 2.25 V under-voltage, +-50 mV, which is up to 100 mV BELOW the Pack Design Guideline's 2.30 V 'min. voltage
     of over-discharging protection' for NCA/NCM cells in the Portable IT column (above its 2.00 V BMS shut-down). Round 4
     accepted it as a backstop behind the gauge's 2.50 V (gen_sch_p.py at U2); BAT-001's words do not, so it is carried open
     here. Options: a custom BQ77207xy at 4.325 V and 2.35 V (TI lists UV 1.0 to 3.5 V in 50 mV steps, 'contact TI': an
     outside contact, the owner's); another 4S protector whose fixed under-voltage sits at or above 2.30 V; or the
     owner accepting the residual, which D-15 contemplated for a firmware-only under-voltage"
   test: "JP1 open, the gauge on TI's shipped image: the string simulator at 3.70 V per cell, one cell lowered in 5 mV steps:
     Q5's gate (DOUT) goes high with that cell between 2.20 and 2.30 V, 0.85 to 1.15 s after the step that crosses it,
     Q2's gate (DSG_G, read on R18's FET-side pad) is held at VSS, and DOUT falls again once the cell is back above about
     2.35 V"

 - id: SECOND_LEVEL_OVER_TEMPERATURE
   level: hardware
   what: "the cells are hotter than the cell maker allows and the gauge has not stopped it"
   device: U2
   threshold: {low: -.inf, high: 70.0, unit: C, per: cell, delay_s: 4.0, sensor: "its own 103AT-2 on J_TS2, taped to the cell
                 expected hottest, through R34 (270 ohm) with R33 (18 kohm) to VSS",
               window: "62.7 to 77.5 C at its network on the conservative reading of TOT_ACC +-5 C (63.6 to 76.6 C on the
                 data sheet footnote's own); SECONDARY-OT-DECISION.md section 4",
               why_low: "no cold trip: the BQ7720700's variant row carries no under-temperature, and R33 holds the network
                 under every UT resistance the silicon may apply (gen_sch_p.py at U2), so this level allows any cold",
               action: "COUT and DOUT high: F2 opens once JP1 is closed, and Q2 is held off"}
   derived_from: discharge_temp_c
   direction: inside_window
