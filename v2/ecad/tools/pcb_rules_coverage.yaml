 SI-001: {implementation: "signal_class.py declarations", verification: {tool: edge_length.py, verdict: edge_length, fixtures: tests/test_edge_length.py},
   maturity: SOURCE_UNVERIFIED, gap_category: SOURCE_OR_APPLICABILITY_UNRESOLVED,
   note: "16 September 2026: half of this note was already wrong and the other half is now addressed. Every net
     IS classified, by spectral content, 413 declarations across the seven boards; what was missing was the
     arithmetic that turns a class into a LENGTH. edge_length.py computes the propagation delay of each layer
     from the board's own stackup (an outer layer is a microstrip and sees about (er+1)/2, an inner one sees er:
     5.5 and 6.9 ps/mm on FR-4), takes the rise time from the DECLARATION beside each class entry, because a
     rise time is a property of the driver and board A's fast nets are gate drives while board B's are a memory
     bus, and compares every signal net's routed length with t_r / (k * t_pd). The criterion k is declared per
     board with its reason and no source in this tree states one, so the rule stays GENERATED_ONLY however
     carefully it is chosen. A net whose class carries no declared edge is COUNTED AND NAMED, never estimated,
     and the verdict is INCONCLUSIVE while any remain: that is the gap made per-net instead of per-project 16 September 2026: TI SCAA082A Table 2 gives measured propagation delays on FR-4 at er 4.6, microstrip 171.9 mm/ns and stripline 139.8 mm/ns (5.82 and 7.15 ps/mm), which is within 6 percent of the 5.5 and 6.9 ps/mm edge_length.py computes from the board's own stackup: the arithmetic has a second opinion. The criterion k still has none. 16 September 2026, evening: BOTH HALVES OF THE INPUT ARE NOW PARTLY SOURCED AND THE REST IS MEASURED WORK, NOT SESSION WORK. The criterion is declared 6 on every board and calibrated against a document for the first time: ECSS-E-HB-20-07A section 6.1.2.3 (transcribed in v2/vendor/standards/) works a real case where a 35 mm clock track with a 200 ps edge failed a radiated emission test, and that track is ONE rise distance long, k = 1, so k = 6 is a sixth of a known failure. Fifteen entries over five boards now carry a rise time from a SPECIFICATION rather than from nobody: USB 2.0 gives 500 ps for high speed (7.1.2.2, THSR/THSF minimum) and 4 ns for full speed (Table 7-9, TFR/TFF minimum), both 10 to 90 percent, both minimums, which is the worst case a board is designed for. What the other classes need was CHECKED before it was called a gap: the RP2040 datasheet documents a slew-rate control bit and no number, the 74LVC family datasheets from TI and from Nexperia specify only the input transition rate they tolerate, and TI SCAA082A gives propagation delay and no edge. A rise time those parts do not publish cannot be declared by this session at all: it is an oscilloscope at bring-up or a vendor's answer, and putting it in the session queue put work in the critical path that no session could start. AND THE RULE NOW ASKS THE RIGHT QUESTION OF A LONG NET: being a transmission line is physics, not a defect, so a net past its critical length is asked whether it is impedance-controlled, series-terminated (a screen that says so: the board file knows neither which end drives nor what the far end is) or declared with a reason, and only what is left is the finding. The first version would have failed every net on every board at a sub-nanosecond edge and reported physics. 17 SEPTEMBER 2026, A SECOND ANCHOR FOR k, from the same handbook and independent of the first: 6.1.2.3's example track is one rise distance long (k = 1) and failed a radiated emission test, and the same clause describes that track as 'approximately lambda/6' at F2 = 1/(pi tr). Those two statements are the same length, because lambda/6 at F2 is exactly pi/6 of v*tr, so the handbook's own radiator sits at k = 6/pi, which is 1.9. This project's k = 6 is 3.1 times stricter than the length that failed, by the handbook's own arithmetic rather than by a second opinion about it. The criterion is still ours and still without a standard that states one; what it now has is a published failure it is a stated distance away from.",
   remediation: {action: "the criterion and the USB edges are declared; what is left is an edge rate for the classes whose drivers publish none (checked: RP2040, 74LVC from two vendors, SCAA082A), which is a measurement at bring-up or a vendor answer and not session work", owner: VENDOR, execution: VENDOR_OR_STANDARD_WAIT, depends_on: [], _depends_why: "NOT RET-001 (16 September 2026). RET-001 depended on SI-001 and SI-001 on RET-001, a cycle the ETA model absorbed in silence because its walk carries a seen-set and returns zero on a revisit, so the critical path was computed by truncating one of the two edges and nothing said which. The real direction is one way: RET-001's per-class tolerance is to come from a critical-length criterion, which needs the drivers' edge rates, which is SI-001. SI-001 itself needs datasheets and nothing from RET-001.", p50_h: 8, p80_h: 24}}

 CLK-001: {implementation: "gen_sch_*.py crystal networks",
   verification: {tool: clock_check.py, verdict: clock_check, fixtures: tests/test_clock_check.py},
