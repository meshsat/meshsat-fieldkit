# PHASE B: where each rule of pcb_rules.yaml is generated, where it is verified, and what its evidence is
# worth (MESHSAT-862, 16 September 2026). Written AFTER the registry, by reading the tools; the registry was
# written first so that the catalogue is not a description of the gates that happen to exist.
#
# maturity meanings (rules_lib.MATURITY), applied strictly:
#   ENFORCED           an executable decision gate exists, writes a machine-readable verdict, and has
#                      behavioural fixtures (a failing input that must fail, a passing input that must pass)
#   GENERATED_ONLY     generation intends to comply; no independent verification of the property
#   VERIFIED_MANUALLY  a controlled review, calculation, simulation or lab protocol exists with its artefact
#   DOCUMENTED_ONLY    prose exists, no current evidence
#   OPEN               no adequate implementation or verification
#   SOURCE_UNVERIFIED  the governing authority or threshold is not established
#   OWNER_DECISION_REQUIRED  more than one valid choice and the reserved decision is unresolved
#
# gap_category is one of the nine the audit separates:
#   ABSENT GENERATED_ONLY PROSE_ONLY NO_BEHAVIOURAL_TEST NO_PROTOCOL DUPLICATED_OR_STALE HEURISTIC_AS_LAW
#   SOURCE_OR_APPLICABILITY_UNRESOLVED CROSS_BOARD_INCONSISTENT   (or NONE when the rule is covered)

