 PI-003: {implementation: "prefanout.py, gen_pcb_*3.py stitch vias, gen_pcb_d3.py locked parallel barrels", verification: {tool: via_current.py, verdict: via_current, fixtures: tests/test_via_current.py, report: barrel_sites.py},
