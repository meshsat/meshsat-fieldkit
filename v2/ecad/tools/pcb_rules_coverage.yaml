 TRN-001: {implementation: "gen_sch_*.py protection parts and each board's external_ports declaration",
   verification: {tool: port_protect.py, verdict: port_protect_<letter>, fixtures: tests/test_port_protect.py},
   maturity: ENFORCED, gap_category: NONE,
   note: "16 September 2026: every conductor that leaves the enclosure is followed from its connector through fuses,
     beads, chokes and resistors until it meets a clamp. Board B passes: its wall Ethernet is behind the H5007NL
     magnetics, which is galvanic isolation and the strongest protection there is. The other four boards carry NINE
     conductors that reach a chip with nothing between, and they are owner decision 31: the USB-C outlet's two
     configuration channels (its VBUS pin is clamped and they are not), four conductors on board C's panel FACE which a
     person touches, two headset microphone lines, the sensor pod's supply through its sealed M8 receptacle, and board
     E's shore inlet whose SMCJ33A sits BEHIND the pass FET so that FET sees the transient the clamp exists to stop.
     The check took four rounds of false-positive removal to get there, each recorded in its own docstring: a part
     family matched with a word boundary that a part number does not have, galvanic isolation not recognised as
     protection, protection treated as a single net rather than a chain, and a search that walked out through a power
     rail and found a clamp on the other side of the board"}

 ISO-001: {implementation: "gen_pcb_a3.py HV class, gen_pcb_b3.py HV class", verification: {tool: spacing.py, verdict: spacing, fixtures: tests/test_spacing.py},
   maturity: OWNER_DECISION_REQUIRED,
   _maturity_why: "16 September 2026: a published table is in the tree now (ECSS-Q-ST-70-12C Table 13-3) and the two boards with high-voltage nets are measured against it: board B passes with 80 percent to spare and board A's 20 V bus is short by a factor of 2.3. What is missing is not a table, it is WHICH table governs a sealed terrestrial kit, which is decision 34: the ECSS numbers are a space standard covering any elevation and a terrestrial functional-insulation reading asks for a fraction of them.", gap_category: SOURCE_OR_APPLICABILITY_UNRESOLVED,
   note: "16 September 2026: it is MEASURED now, per board, which it never was. A net class is an instruction to
     the router and not a fact about the board, and the two differ wherever a pad, a zone edge or a hand-laid
     piece of copper is involved. spacing.py takes every conductor of a declared high-voltage rail (20 V and
     above: board A's VBUS20 and +54V_POE, board B's +54V_POE) and measures the real distance to the nearest
     conductor of any other net on the same layer, pads and fills included, and names the ten tightest. What it
     cannot do is say whether the number is ENOUGH: creepage and clearance come from a standard's table for a
     working voltage, a pollution degree and a material group, and IEC 60664-1 is not in this tree. A board
     declares hv_spacing_mm when it has an authority and is judged against it; where nothing is declared the
     measurement is reported and the rule stays unjudged, which is what 'no source' has to mean",
   remediation: {action: "declare the envelope's pollution degree and obtain the spacing table, then set hv_spacing_mm per board; the measurement is already there to judge against it", owner: OWNER, execution: OWNER, depends_on: [ENV-001], p50_h: 4, p80_h: 16}}

 THM-001: {implementation: "gen_pcb_*3.py copper and thermal vias", verification: {tool: thermal.py, verdict: thermal, fixtures: tests/test_thermal.py},
   maturity: OWNER_DECISION_REQUIRED,
   _maturity_why: "16 September 2026, second reading: the session half is done. Every rail on all five boards declares whether it converts and what that conversion costs, each figure read off the part's own datasheet at the conditions that datasheet states, and the five boards carry a dissipation table: about 28 W across the set at the typical load. What is left is not a source and not a tool, it is the maximum ambient a junction temperature has to be computed against, which is ENV-001 and owner decision 34. Recording it as SOURCE_UNVERIFIED put it in the queue of things a session can close.", gap_category: SOURCE_OR_APPLICABILITY_UNRESOLVED,
   note: "16 September 2026: the first half exists. thermal.py builds a per-board table from the board's own
     intent (rails, currents, the source part) and from what each board declares: a converter's loss is
     P_out * (1/efficiency - 1) with the efficiency declared PER RAIL and its basis in the note, and a part
     that dissipates for another reason (the power amplifier, a shunt, a linear regulator) is declared in
     boards/<letter>.json with its watts and its sentence. The thermal path is measured off the board, the
     part's own pad area and the vias inside its courtyard, because on a sealed case with no airflow that is
     what carries the heat out. What is MISSING is the second half: a junction temperature needs the envelope's
     maximum ambient, which is ENV-001 and is an owner decision nobody has written, so the rule stays short of
     its acceptance criteria and says which half is absent rather than inventing it. A rail with no declared
     efficiency is listed as unknown and makes the verdict INCONCLUSIVE, so the table is a floor until every
     converter carries its number",
   remediation: {action: "the efficiencies and the dissipators are DECLARED as of 16 September 2026 and five boards carry a dissipation table, about 28 W across the set at the typical load; what is left is ENV-001's maximum ambient, which is the only input a junction temperature still needs", owner: OWNER, execution: PARALLEL_AGENT, depends_on: [ENV-001], p50_h: 6, p80_h: 20}}

 PLC-001: {implementation: "gen_pcb_*3.py, regionfit.py", verification: {tool: "hardset.py, place_audit.py, carry_placed.py", verdict: "hardset-placed, place_audit", fixtures: "tests/test_region_fit.py, tests/test_board_gates.py, tests/test_carry_placed.py"},
   maturity: ENFORCED, gap_category: NONE, note: "the cheap gate runs before the expensive stage and blocks above a declared allowance. The measurement can only be taken on the PLACED board, in a route tree that is later thrown away, so it is carried into the board's routed snapshot: 17 September 2026 the carry is PROVED rather than copied (carry_placed.py compares every footprint position, orientation and side between the placed snapshot and the board being cut, and a part that moved refuses it), and hardset names the board it read, so a carried verdict can be compared with the board it is evidence for instead of trusted for sitting in the right directory. The first run of that tool found the thing it was built to find: board D's placed snapshot and its committed board differ by R20 and R21, 1.600 mm each, which is the pre-router's pair station swap and runs BEFORE the router. So there are two boards before the route and the placement that shipped is the one the PRE-ROUTE DRC measured, over the same fifteen hard types and after every part move: that verdict is the evidence when the placed snapshot no longer matches, carried under the name hardset-placed with its stage and both shas recorded in the verdict itself (a second verdict NAME here would make the fallback mandatory for every board and read a stale copy of it as this board's evidence, which is how board P came to read PRE_AUDIT from 11 September for ten minutes this morning), and place_audit is not carried with it because it was taken before the move. A pure exchange of seats between two parts of the same land is not a move at all: board D's R20 and R21 are in each other's seats, which is the swap, and the set of occupied seats is identical, so the placement measured is the placement that shipped"}

 PLC-002: {implementation: "closers declared in pcb_closers.yaml; the pour-island half predicted by place_audit.py", verification: {tool: closer_audit.py, verdict: closer_audit, fixtures: tests/test_closer_audit.py}, maturity: ENFORCED, gap_category: NONE,
   note: "the principle is written in the record and in the plan; the finish still carries ten copper-editing passes and the predictor covers two of the classes 16 September 2026: EVERY REPAIR IN THE FINISH IS DECLARED AND THE COVERAGE IS JUDGED PER BOARD. pcb_closers.yaml names all fourteen copper-changing stages with the defect class each repairs and why prevention was not possible, and closer_audit.py takes the list of stages from finish.sh itself, so a stage added and not declared is a failure rather than a silence. Three classes are repaired on every board and prevented by one thing, a ground-via grid laid BEFORE the route: a pour island with no via of its own net, a pad its plane cannot reach, and a stitch via the fill has retreated from. Boards D and E declare the grid and are covered; A, B, C and P do not and are not, which is a design item with a measured cost (board P measured the grid at 21 open connections against 0 without, which is why it declares none) and board C is measuring it on two arms right now. Board E5 has no chain, so no closer runs on it at all.",
   remediation: {action: "ALL THREE CLAUSES ARE ANSWERED (17 September 2026). The declarations were done; the two measurements are done, boards A and C having measured the ground-via grid against their own controls (board A: 4,000 locked ground vias take RET-004 from 46 lacking of 58 judged to 33 of 52 and cost the route nothing, 23 open against 25; board C: the grid costs 21 open connections against zero and makes the island count worse), and both refuse it with those numbers in their board files, which is the rule's second half answered rather than ignored; and place_audit PREDICTS the pour-island class now, as far as a placed board can. It reads the fill the board already carries, names every filled island of 1 mm2 or more that reaches no via and no plated pad of its own net with its area, its net and its layer, and says in as many words that the islands a ROUTER cuts out of a pour cannot be predicted from a placed board and are the other half of the class. It costs 1.9 s on board C and nothing measurable on board B, it never refuses a board (a WARN, because the repair stage exists and works), and it never takes a chain down: the geometry calls are guarded and a reading it cannot take is reported as a reading it cannot take. WHAT REMAINS IS ONE BOARD, not a tool: board B has never measured the grid on its own copper, which is a route of its own and waits for B21", owner: SESSION, execution: PARALLEL_AGENT, depends_on: [], p50_h: 1, p80_h: 3}}

