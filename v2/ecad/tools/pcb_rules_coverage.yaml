     14.4 V pack node feeding the converter that makes it. Where a rail's declared source is an inductor or a ferrite
     the tool says it CANNOT TELL a filter choke on an incoming feed from a converter's output, and lists those
     separately to be decided before powering, rather than choosing. It is a procedure and a person does it, which is
     why this is VERIFIED_MANUALLY and the record is the page"}

