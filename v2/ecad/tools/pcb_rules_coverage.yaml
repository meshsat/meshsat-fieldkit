 ANA-001: {implementation: "pcb_sensitive.yaml, the nodes and their filters", verification: {tool: sensitive_nodes.py, verdict: sensitive_nodes, fixtures: tests/test_sensitive_nodes.py}, maturity: ENFORCED, gap_category: GENERATED_ONLY,
