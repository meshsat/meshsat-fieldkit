     itself against the standard's own example (1 A at 5 K on 0.925 by 0.025 mm, reproduced to 1.0002 A). The
     project's internal-conductor bar turns out to BE the published one, to within 0.20 percent over 96 geometries.
     Two things the document does not settle are written into the rule rather than left implied: the external
     factor of two is fitted nowhere in the annex, and the two models CROSS at 0.268 mm2 at 10 K, above which our
     bar is the optimistic one (every 2 oz pour wider than 3.8 mm). dc_drop prints the other two numbers beside any
     conductor past that line and gates on neither: moving the bar changes MET on boards already cut, which is a
     decision with a number attached rather than a patch. Earlier: it reads its OWN verdict (dc_density), because
     one verdict served both power rules and a density miss failed the board through the drop rule",
