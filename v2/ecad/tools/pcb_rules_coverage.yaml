     net is classified by spectral content, and each class is asked its own question. This rule is the CRITERION,
     whether the class's adequacy question is the right one and is met; RET-002 is the per-net SCREEN the same pass
     prints. The sharing is harmless today because this rule's maturity is SOURCE_UNVERIFIED, so its verdict is
     never read: the per-class numbers are this project's own and no published source backs them.",
   verification: {tool: intent_checks.py, verdict: intent_return_path, fixtures: tests/test_signal_class.py},
   maturity: SOURCE_UNVERIFIED, gap_category: SOURCE_OR_APPLICABILITY_UNRESOLVED,
   note: "16 September 2026: the principle is implemented and the heuristic is no longer standing in for it. Every net
     gets a spectral-content class from EVIDENCE (the board's own impedance-targeted net class, or a declaration in
     boards/<letter>.json carrying a written basis naming the part or interface that decides it), and each class is asked
     the question it deserves: a fast net for an ADJACENT reference within a tolerance, a slow one for whether a return
     path EXISTS at all. Four properties keep a relaxation from becoming an exemption mechanism, each with a rule:
     a declaration without a reason is refused, an unclassified net is judged at the STRICTEST bar and named, a
     declaration cannot downgrade a net the board itself calls impedance-targeted, and the relaxed class asks a
     different QUESTION rather than a looser number. It is GENERATED_ONLY and not ENFORCED for one reason and it is
     the honest one: THE PER-CLASS TOLERANCES ARE THIS PROJECT'S OWN NUMBERS, not a standard's. The 10 mm or 5 percent
     of the fast classes is the 15 September ruling's figure calibrated on board A's anti-pad rows; the 30 mm or 15
     percent of CLOCKED_DIGITAL is a judgement. Until a source backs them, they are a written screen and say so 16 September 2026, an authority for the PRINCIPLE and not for the numbers: TI SCAA082A section 1.6 (v2/vendor/ti/ti-scaa082a-high-speed-layout-guidelines.pdf) states that at high frequency the return current flows along the lowest impedance path, directly beside the signal, and that a slot in the reference forces a loop whose area is what radiates. That is what this rule rests on and this tree held no source for it until today. It states NO per-class tolerance, so the millimetres here are still this project's own and the maturity does not move.",
   remediation: {action: "obtain an authoritative basis for the per-class tolerance (a critical-length criterion from the drivers' own edge rates, or a published guideline), and declare the remaining boards' nets the way E's are",
     owner: SESSION, execution: VENDOR_OR_STANDARD_WAIT, depends_on: [SI-001], p50_h: 8, p80_h: 26}}

