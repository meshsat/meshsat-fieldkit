     or level, and the measure taken (staking, support, strain relief, coating, mating cycle rating).
   rationale: "A kit that is carried in a vehicle sees more vibration in transport than in use."
   failure_mode: "A tall part shears its joints, a connector wears, a coated board traps moisture."
