 - id: SGN-001
   false_positive_analysis: >
     A false refusal would be a rule that does not apply to a board being counted as unresolved. Applicability is
     evaluated first and a rule that does not apply is NOT_APPLICABLE and leaves the denominator, so the only way
     to fail this is a rule that applies and reaches none of the five results.
   domain: VERIFICATION_SIGNOFF
   short_name: every applicable rule has a result
   requirement: >
     Before any board is released, every rule applicable to it has a result of PASS, WAIVED or
     NOT_APPLICABLE, computed from current evidence; absence, staleness or a failed check is INCONCLUSIVE and
     blocks.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [DOCUMENTATION, SAFETY]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     The board's computed status carries a result for every applicable rule, each with its evidence id; the
     readiness gate state is reported before any percentage.
   rationale: "This registry is worth only the computation that reads it."
   failure_mode: "A board is released because nobody asked a question that was never written down."
   verification_method: [SCRIPT]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [rule_set_fingerprint, manifest_version, board_sha256]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

