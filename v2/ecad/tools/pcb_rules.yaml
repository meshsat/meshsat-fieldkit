     elsewhere, and a locked stitch via the fill has retreated from after the router laid copper past it. The
     pruner judges on a copy and puts the board back if anything opened, and it refuses to run at all on an
     unfilled board, where it once offered to remove 366 of 660 locked vias.
   domain: PLANES_POURS
   short_name: no orphan copper
   requirement: >
     Every piece of filled copper is connected to its net, or it is not there; every plane pad reaches its
     plane; no pour piece floats.
