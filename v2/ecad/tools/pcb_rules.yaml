# THE PCB RULE REGISTRY (MESHSAT-862, owner instruction of 16 September 2026).
#
# This file is canonical. `v2/docs/PCB-GOLDEN-RULES.md` and every coverage, gap and board-status document are
# GENERATED from it by rules_render.py; nothing else is an authority, and a hand-edited document fails the suite.
# rules_lib.py is the only reader. rules_status.py computes each board's result. Every gate names the rule ids
# it decides, so a gate with no rule id, and a rule with no verification, are both visible.
#
# Phase A (16 September 2026) wrote the candidate catalogue from product and vendor sources BEFORE the existing
# gates were opened, to keep the catalogue from being a description of what the tools already do. The Phase A
# source set and what was deliberately NOT read are recorded in `phase_a` below. Maturity is UNASSESSED until
# Phase B maps each rule to its implementation and its evidence.
#
# Honesty rules this file enforces on itself (rules_lib.validate):
#   * a HEURISTIC may not be a BLOCKER;
#   * a BLOCKER whose source is unverified must carry maturity SOURCE_UNVERIFIED or OWNER_DECISION_REQUIRED,
#     so "we block on this" and "we cannot cite this" are never both invisible;
#   * a CONDITIONAL rule carries a machine-readable condition over pcb_board_facts.yaml, never prose;
#   * a VERIFIED source names title, issuer and a path or URL that resolves.

schema_version: "1.0.0"
registry_version: "2026-09-16.1"
manifest:
  boards: [a, b, c, d, e, e5, p]
  manifest_version: "2026-09-16.1"

phase_a:
  read:
    - v2/docs/V2-SPEC.md, TEST-PLAN.md, PANEL.md, ASSEMBLY.md, ARCH-PCB-B-IOHA.md
    - v2/docs/OWNER-DECISIONS-2026-09-11.md, LAYER-DECISIONS-2026-09-11.md
    - v2/ecad/tools/gen_sch_*.py, gen_pcb_*.py, gen_pcb_*3.py, boards/*.json, stackup_write.py, intent.py
    - v2/vendor/ (cm5, cluster, microchip, ti, quectel, weact, peli, rf, switches, m2, battery, seals)
    - the fabricator's published capability page as filed in v2/vendor/seals/
  not_read_in_phase_a:
    - the gate implementations (check_pcb_*.py, intent_checks.py, return_via.py, dc_drop.py, impedance_check.py,
      verify_deliverable.py, final_gate.py, hardset.py and the rest of tools/), so the catalogue is not a
      description of the tools
  claim: >
    These files were read and those were not. This is not a claim that the catalogue was written blind: the
    author of this registry has worked on the tools, and the only defence against that is the source column,
    which is why a rule with no authority is marked SOURCE_UNVERIFIED rather than presented as settled.

# ---------------------------------------------------------------------------------------------------------
# 1. PRODUCT ENVELOPE
# ---------------------------------------------------------------------------------------------------------
rules:
 - id: ENV-001
   domain: PRODUCT_ENVELOPE
   short_name: operating envelope declared
   requirement: >
     The product's electrical envelope, environmental limits, operating modes, expected life and foreseeable
     misuse are written down and dated, and every derating, spacing, thermal and reliability rule resolves its
     numbers against that declaration rather than against an assumption.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [SAFETY, RELIABILITY, DOCUMENTATION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     A dated envelope document exists naming, at minimum: ambient temperature range in use and in storage,
     humidity and ingress expectation, altitude, vibration and shock expectation, input voltage ranges, the
     defined operating modes, and the single-fault conditions the design is expected to survive. Every rule in
     this registry whose limit depends on one of those numbers cites it.
   rationale: >
     Derating, creepage, current capacity and thermal limits are all functions of the envelope. Without a
     declared envelope each rule silently picks its own, and two rules can then contradict each other while
     both look satisfied.
   failure_mode: >
     A board qualified at a bench temperature fails in a vehicle in summer; a spacing chosen for pollution
     degree 2 sits in a kit carried through rain.
   verification_method: [MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [manifest_version, rule_set_fingerprint]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

 - id: ENV-002
   false_positive_analysis: >
     A false refusal is a sentence that quotes a VENDOR's rating for a part this project buys, which is a fact
     about the bill of materials and not a claim about the kit. Nine such sentences exist and each is declared in
     claims-allow.txt with its reason. The second shape is a NEGATION: the sentence the project is required to
     carry, nothing here has been field deployed, contains every word a claim contains, and the first version of
     the screen refused it. Both are covered by fixtures.
   domain: PRODUCT_ENVELOPE
   short_name: no claim without a test
   requirement: >
     No environmental or protection rating is claimed in any public or shipped document unless the test that
     establishes it has been run and recorded.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [DOCUMENTATION, SAFETY]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Every rating word in README, BUILD, ASSEMBLY, the release notes and the order paperwork is either
     accompanied by the test record that establishes it, or is written as an intent ("designed to", "untested").
   rationale: "An ingress or environmental claim is a promise to whoever carries the kit."
   failure_mode: "A kit is trusted in conditions nobody tested it in."
   verification_method: [SCRIPT, MANUAL_REVIEW]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [manifest_version]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

# ---------------------------------------------------------------------------------------------------------
# 2. SCHEMATIC INTEGRITY
# ---------------------------------------------------------------------------------------------------------
 - id: SCH-001
   false_positive_analysis: >
     A false refusal is an ERC error that the design intends: an unconnected pin on a part that genuinely has
     none, a power pin fed from a net the checker cannot see as a source. Each is declared in the board's own
     erc-allow.txt with a reason, and a declaration with no reason waves nothing through (fixture).
   domain: SCHEMATIC_INTEGRITY
   short_name: ERC clean or explained
   requirement: >
     The schematic passes electrical rule checking with no error-severity violation that is not individually
     explained in writing.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {fact: has_schematic, op: ne, value: false}
   risk_class: [ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: "Zero error-severity ERC violations, or each one covered by an allow entry carrying a reason."
   rationale: "An unconnected or conflicting pin is the cheapest defect to find and the most expensive to find later."
   failure_mode: "A driver contention or a floating enable ships."
   verification_method: [ERC]
   verification_phase: SCHEMATIC
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, tools_tree_sha, kicad_build]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "a written reason per allowed violation",
                   scope: "one violation on one board", expiry: "the next schematic regeneration",
                   residual_risk: "the reason is the only thing standing behind it"}
   maturity_at_writing: UNASSESSED

 - id: SCH-002
   false_positive_analysis: >
     A false refusal came from KiCad's synthetic unconnected-(REF-PIN-PadN) placeholder being read as a net:
     1,007 of board B's 6,716 comparisons failed on a board every other gate passed (11 September). Both sides
     strip it now. The second shape is a board-only footprint that carries no net, which is inert copper and is
     reported rather than blocking.
   domain: SCHEMATIC_INTEGRITY
   short_name: board matches its netlist
   requirement: >
     The board being judged is the board that was placed from the schematic being shipped: every component,
     every net and every pin connection agrees between the netlist and the board file.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {fact: has_schematic, op: ne, value: false}
   risk_class: [ELECTRICAL_FUNCTION, DOCUMENTATION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Three comparisons, each with its denominator: every netlist component is on the board, every board
     footprint carrying a net is in the netlist, and every net's pin set agrees. KiCad's synthetic
     unconnected-pin placeholders are not nets on either side.
   rationale: >
     A stale netlist makes every downstream gate judge a design nobody is building. It has happened here: a
     comment swallowed three resistors and the board placed, routed and passed every gate three parts short.
   failure_mode: "A board is fabricated from a schematic that no longer describes it."
   verification_method: [SCRIPT]
   verification_phase: PLACED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, schematic_sha256, stage, tools_tree_sha]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

 - id: SCH-003
   false_positive_analysis: >
     A false refusal is a board whose netlist is absent from this tree, which made eleven contracts read as
     broken on 11 September. An absent board is INCONCLUSIVE and says so. The second shape is two boards using
     different names for the two ends of one net, which is a vocabulary difference and not a defect: those are
     listed as aliases with the reason.
   domain: SCHEMATIC_INTEGRITY
   short_name: cross-board contracts
   requirement: >
     Every signal that leaves one board and arrives on another agrees at both ends: pin for pin on the
     connector, in name, in direction, and in the number of drivers.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {any: [{fact: interfaces, op: contains, value: IDC_RIBBON},
                     {fact: interfaces, op: contains, value: SOLDER_LANDS}]}
   risk_class: [ELECTRICAL_FUNCTION, SAFETY]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Every declared contract passes on the netlists of the boards in the manifest; a board whose netlist is
     absent makes the check INCONCLUSIVE, never passing.
   rationale: >
     No single-board gate can see a contract. The EMCON line was once wired as a ring oscillator with its
     polarity inverted between two boards, and each board's own gate passed.
   failure_mode: "Asserting a safety line enables the thing it is meant to inhibit."
   verification_method: [SCRIPT]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, e5, p]
   interfaces_affected: [IDC_RIBBON, SOLDER_LANDS]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, manifest_version, tools_tree_sha]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

 - id: SCH-004
   domain: SCHEMATIC_INTEGRITY
   short_name: a safety line fails safe
   requirement: >
     Every line whose assertion inhibits a hazard (transmit inhibit, zeroize, shore inhibit, kill) is designed
     so that a disconnected cable, an unpowered board or a missing module leaves the system in the safe state.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {any: [{fact: rf_transmit, op: truthy}, {fact: carries_pack_node, op: truthy}]}
   risk_class: [SAFETY, ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     For each such line: the pull direction, the driver count and the behaviour with the far board absent are
     stated and verified on the netlist; the safe state is the unpowered state.
   rationale: "A hardware inhibit that depends on a cable being present is not an inhibit."
   failure_mode: >
     The panel is unplugged and the transmitter is enabled; or ZEROIZE is asserted and nothing wipes, which is
     the state recorded in the 9 September review and still open.
   verification_method: [SCRIPT, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d]
   interfaces_affected: [IDC_RIBBON]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, manifest_version]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

# ---------------------------------------------------------------------------------------------------------
# 3. COMPONENT SELECTION AND DERATING   4. LIFECYCLE AND SUPPLY
# ---------------------------------------------------------------------------------------------------------
 - id: CMP-001
   domain: COMPONENT_SELECTION
   short_name: absolute maximum never reached
   requirement: >
     No component is operated at or above any absolute maximum rating of its datasheet under any declared
     operating mode, including startup, shutdown, hot-plug and the single-fault conditions the envelope names.
   classification: COMPONENT_REQUIREMENT
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [SAFETY, RELIABILITY, ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     For every part on a net whose nominal voltage exceeds 80 percent of the part's rating, and for every part
     in a current path above 1 A, a recorded comparison of the applied stress against the datasheet maximum,
     citing the datasheet page. Capacitor DC bias derating is applied to every MLCC used for energy storage
     or filtering.
   rationale: >
     A 50 V capacitor on a 54 V output is not a margin question, it is a wrong part; the tree carried exactly
     that on the PoE stage until owner ruling 10.
   failure_mode: "A part fails short on the bench or in the field, often taking the stage with it."
   verification_method: [SCRIPT, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, manifest_version]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: CMP-002
   false_positive_analysis: >
     A false refusal is a code that is wrong on one land and right on another: board D's FB1 carries C1017, which
     is a package mismatch on C's 0603 land and correct on D's 0805 land (11 September). A blocked code may name
     the land it is wrong on, so the block is per part and not per code.
   domain: COMPONENT_SELECTION
   short_name: the package on the land is the package ordered
   requirement: "Every part's ordered package matches the land pattern it is placed on."
   classification: COMPONENT_REQUIREMENT
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [ASSEMBLY, ELECTRICAL_FUNCTION, SUPPLY_CHAIN]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Every BOM row's ordering code is checked against the supplier's own record for package, and the package
     agrees with the footprint the board places, with the check dated.
   rationale: >
     A TSSOP-38 order code sat on a QFN-38 land here, and a footprint key in a generator is a claim about a
     package that nothing checked for four board phases.
   failure_mode: "The assembler places a part that cannot solder to the land, or solders a wrong die."
   verification_method: [SCRIPT, VENDOR_CONFIRMATION]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [bom_sha256, certification_date, manifest_version]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "a written purchase route for a hand-fitted part",
                   scope: "one designator on one board", expiry: "the next BOM export",
                   residual_risk: "the part is fitted by hand and is not machine-verified"}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: SUP-001
   false_positive_analysis: >
     A false refusal is a part this project fits by hand or on the bench, which has no order code by design. Each
     is declared with its purchase route, and a declaration keyed on a character count rather than a rule once
     declared one of a matched pair and not the other, which is why the key is the reference.
   domain: LIFECYCLE_SUPPLY
   short_name: every placed part is buyable
   requirement: >
     Every part the assembler is asked to place is available in the quantity the order needs, at the time of
     the order, or is declared hand-fitted with a written purchase route.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [SUPPLY_CHAIN, ASSEMBLY]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Every BOM row is CERTIFIED against the supplier's live catalogue with its stock at a recorded date, or
     HAND_FIT with a route, or BENCH_FITTED and excluded from the placement file.
   rationale: "Stock of three against a need of five is a schedule risk that must be seen before the order, not after."
   failure_mode: "An order is placed that cannot be assembled."
   verification_method: [SCRIPT, VENDOR_CONFIRMATION]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [bom_sha256, certification_date]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "a purchase route", scope: "one part",
                   expiry: "the order", residual_risk: "a hand-fitted part is a build step and a lead time"}
   maturity_at_writing: UNASSESSED

# ---------------------------------------------------------------------------------------------------------
# 5. POWER TREE   6. DECOUPLING   7. POWER INTEGRITY
# ---------------------------------------------------------------------------------------------------------
 - id: PWR-001
   domain: POWER_TREE
   short_name: every rail is declared with its loads
   requirement: >
     Every rail on the board is declared with its nominal voltage, its typical and peak current, its source,
     its drop budget and the loads that draw it; a rail that exists in copper and not in the declaration is a
     rail nothing judges.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [POWER_INTEGRITY, ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     The count of rails in the board's intent declaration equals the count of distinct power nets carrying
     more than a declared threshold current on the board, and every declared rail names where its current goes.
   rationale: >
     The drop and density checks judge only declared rails. B's per-slot cores and E's downstream rails carry
     no declaration today, so nothing has ever measured them.
   failure_mode: "A rail droops or overheats and no check ever looked at it."
   verification_method: [SCRIPT]
   verification_phase: SCHEMATIC
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, tools_tree_sha]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the measured current of the undeclared rail",
                   scope: "one rail", expiry: "the next schematic regeneration",
                   residual_risk: "an undeclared rail is unmeasured"}
   maturity_at_writing: UNASSESSED

 - id: PWR-002
   domain: POWER_TREE
   short_name: sequencing and inrush
   requirement: >
     The order in which rails come up and go down is defined, and every rail's inrush, hot-plug and
     back-powering behaviour is bounded by design rather than by luck.
   classification: COMPONENT_REQUIREMENT
   applicability: CONDITIONAL
   condition: {fact: rails, op: ge, value: 2}
   risk_class: [ELECTRICAL_FUNCTION, RELIABILITY, SAFETY]
   release_effect: MUST_JUSTIFY
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     A written sequencing statement per board naming, for each rail, what enables it, what it depends on, the
     inrush limit and the device requirement it satisfies (for example a module's rail-order requirement).
   rationale: "Modules with multiple supplies latch up or brown out when their rails arrive in the wrong order."
   failure_mode: "A module fails to boot intermittently, or draws current through a protection diode at startup."
   verification_method: [MANUAL_REVIEW, SIMULATION]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the device requirement being met another way",
                   scope: "one rail", expiry: "prototype validation", residual_risk: "startup behaviour is untested"}
   maturity_at_writing: UNASSESSED

 - id: PWR-003
   domain: POWER_TREE
   short_name: protection coordination
   requirement: >
     Every fuse, eFuse, ideal diode and protection device is coordinated with what it protects: the clearing
     characteristic sits below the damage characteristic of the weakest element downstream and above the
     worst legitimate current.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {any: [{fact: fuses, op: truthy}, {fact: carries_pack_node, op: truthy}]}
   risk_class: [SAFETY, RELIABILITY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     For each protective element: the rated and peak current of the path, the element's rating and clearing
     curve reference, the fault current available at that point, and the element downstream it is protecting.
   rationale: >
     Four boards sit on one energy chain from the cells with two 25 A blades on it; a fuse that never opens
     before the conductor does is decoration.
   failure_mode: "A short in the kit is cleared by a track or a connector instead of by the fuse."
   verification_method: [CALCULATION, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, e, e5, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, manifest_version]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: DEC-001
   domain: DECOUPLING
   short_name: decoupling loop area
   requirement: >
     Every decoupling capacitor forms a loop with the pin it serves and its return that is small enough for
     the frequencies that pin's current actually contains.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [POWER_INTEGRITY, EMC, SIGNAL_INTEGRITY]
   release_effect: MUST_JUSTIFY
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Each declared decoupling entry states its pin, its distance, its via count and the loop it forms; an
     entry beyond the declared distance carries a written reason. The distance itself is derived per device
     from the current's spectral content, not taken as one project-wide number.
   rationale: >
     Loop inductance, not capacitance, decides high-frequency decoupling. The project's present 3 mm number is
     a heuristic and is recorded as one.
   failure_mode: "Rail collapse at switching edges, radiated emissions, and marginal digital timing."
   verification_method: [SCRIPT, CALCULATION]
   verification_phase: PLACED_BOARD
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stage, schematic_sha256]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the loop the part actually forms",
                   scope: "one capacitor", expiry: "the next placement", residual_risk: "measured at prototype"}
   maturity_at_writing: UNASSESSED

 - id: PI-001
   domain: POWER_INTEGRITY
   short_name: conductor current capacity
   requirement: >
     Every conductor carrying a rail's current is wide enough, in the copper weight it is actually built in,
     to carry that current within the temperature rise the envelope allows, judged on the narrowest piece of
     copper that carries a meaningful share of the current.
   classification: STANDARD
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [SAFETY, THERMAL, RELIABILITY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources:
    - {title: "IPC-2221 generic standard on printed board design, current-carrying capacity charts",
       issuer: IPC, revision: "unknown to this tree", clause: "current capacity charts",
       url_or_path: "NOT IN THIS TREE", accessed: ""}
    - {title: "IPC-2152 standard for determining current-carrying capacity", issuer: IPC,
       revision: "unknown to this tree", clause: "", url_or_path: "NOT IN THIS TREE", accessed: "",
       note: "the modern replacement for the IPC-2221 charts; this project has never considered it"}
   acceptance_criteria: >
     For every declared rail: the narrowest conductor carrying above a declared share of the rail current,
     its cross-section computed from the board's own stackup copper weight, and the resulting temperature rise
     against the envelope's limit. The limit and the standard edition are cited.
   rationale: >
     The project's density check was lenient by up to 98 percent for two weeks and twelve rails on four boards
     exceeded the published limit while every one read MET, because the verdict was taken on voltage drop.
   failure_mode: "A track runs hot, its resin degrades, and the failure is progressive rather than sudden."
   verification_method: [SCRIPT, CALCULATION]
