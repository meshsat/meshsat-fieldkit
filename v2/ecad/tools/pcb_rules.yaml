 - id: RET-001
   domain: RETURN_PATH
   short_name: a continuous adjacent return path
   requirement: >
     Every signal's return current has a continuous, low-impedance path adjacent to its outgoing conductor for
     the whole of the conductor's length, adequate for the spectral content that signal's edge rate produces.
     Adequacy is judged from edge rate, electrical length, the reference structures the signal actually runs
     over, the discontinuities it crosses and the interface's own requirement, not from a single geometric
     proxy.
   false_positive_analysis: >
     A false refusal has three shapes and each has an instrument.
     ONE, A NET CLASSIFIED FASTER THAN IT IS: the rule is applied per spectral class and the class comes from
     signal_class.py's per-net declaration, 413 of them across seven boards, each carrying its basis. Four
     rules stop that declaration becoming an exemption mechanism, and a net with no declaration is not
     quietly demoted.
     TWO, A REFERENCE THE TOOL DOES NOT COUNT: the first version read a PREFIX LIST of pour names and missed
     board E's In2 power pours, so a net with a reference under it read as having none. It counts every
     filled zone now.
     THREE, A HOLE IN A REFERENCE READ AS AN ABSENT REFERENCE: of board B's 675.2 mm of uncovered run, 884
     runs and 601.3 mm were another conductor's via anti-pad, median 0.7 mm. return_gaps separates any
     conductor's anti-pad, counts the millimetres and reports them, and how perforated a reference may be is
     RET-003's question rather than this one.
     AND THE NUMBER ITSELF is this project's calibration and not an authority's, ruled as such by decision 39
     on 21 September 2026 with ECSS-E-HB-20-07A 6.1.2.5.2 as the qualitative authority. A criterion 50
     percent looser clears fourteen of the thirty-two nets failing across the set, so the number decides
     about half of them and is labelled wherever it appears.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [SIGNAL_INTEGRITY, EMC]
   release_effect: BLOCKER
   source_status: PARTIALLY_VERIFIED
   sources:
   - title: >
       ECSS-E-HB-20-07A, Electromagnetic compatibility handbook, clause 6.1.2.5.2 PCB design techniques: a
       clock on a layer adjacent to a solid, not split, ground or power plane; a slot or gap in that plane
       crossed by such a track as a source of common-mode current; and the lateral spread of the return current
     issuer: ECSS Secretariat, ESA-ESTEC Requirements and Standards Division
     revision: A, 5 September 2012
     clause: '6.1.2.5.2'
     url_or_path: v2/vendor/standards/ecss-e-hb-20-07a-2012-09-05.md
     accessed: '2026-09-16'
     note: >
       THE MECHANISM HAS A PUBLISHED AUTHORITY AND THE LIMIT DOES NOT, which is the state PARTIALLY_VERIFIED
       exists for. The handbook recommends clocks routed on a layer adjacent to a solid (not split) ground or
       power plane, says slots or gaps crossed by clock tracks lead to common-mode currents which increase the
       radiated emission dramatically, and gives the lateral spread of the return current (97 percent within
       plus and minus 20 h for a microstrip and 99 percent within plus and minus 3 h for a stripline, its
       reference [12], Ott 2009), which is what makes a reference wide enough to BE a reference. What it does
       not give is a tolerance: its position is that a clock should not run without an adjacent plane at all,
       so the number an uncovered run is judged against here is this project's own and is owner decision 39.
       The transcription in this tree records that under 'What this handbook does NOT say'
   acceptance_criteria: >
     Every signal net is classified by edge rate and electrical length. For each class, the adequacy criterion
     is stated (for a fast edge: an uninterrupted reference plane on an adjacent layer for the length of the
     run, with every reference change accompanied by a return transition; for a slow edge: a return path whose
     loop area is bounded). Each net is then judged against its own class's criterion, with the classification
     recorded.
   rationale: >
     Return current flows under its conductor at high frequency and takes the lowest-resistance path at low
     frequency. What must be continuous is the RETURN, and what makes a discontinuity matter is the current's
     spectrum, not the existence of copper on a neighbouring layer.
   failure_mode: >
     Radiated emission from an enlarged loop, crosstalk into neighbouring nets, reflections at the
     discontinuity, and common-mode conversion on differential pairs.
   verification_method: [SCRIPT, CALCULATION, MANUAL_REVIEW]
   verification_phase: ROUTED_BOARD
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [PCIE, USB2, USB3, HDMI, ETHERNET, RF_TX, RF_RX]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, stage, rule_set_fingerprint, tools_tree_sha]
   owner: OWNER
   waiver_policy: {allowed: true, authority: OWNER,
                   evidence: "the edge rate, the loop the signal actually forms and why it is acceptable here",
                   scope: "one net class on one board", expiry: "prototype EMC measurement",
                   residual_risk: "emission and coupling are unmeasured until a chamber sees the kit"}
   maturity_at_writing: OWNER_DECISION_REQUIRED

 - id: RET-002
   domain: RETURN_PATH
   short_name: plane-adjacency screen
   requirement: >
     As a screening test for RET-001, the fraction of each signal net's track length that has no filled
     reference zone on an adjacent layer is measured and reported, and a net above the screening threshold is
     examined against RET-001 rather than failed outright.
   classification: HEURISTIC
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [SIGNAL_INTEGRITY, EMC]
   release_effect: MUST_JUSTIFY
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     The screen reports, per net: total track length, uncovered length, the runs that make it up, and what
     sits on the neighbouring layers at each run. The present threshold, the larger of 10 mm or 5 percent, is
     a calibration against one board's measured behaviour and is recorded as such, not as a limit from an
     authority.
   rationale: >
     The screen is cheap, mechanical and finds real discontinuities. It is not a law: it counts a net's own
     via anti-pads as uncovered, which is how D and E read 11 and 9 nets over while their reference structure
     is continuous everywhere a signal actually runs.
   failure_mode: >
     Used as a law it refuses good boards (false positives at every via) and passes bad ones (a covered net
     whose reference changes layer with no return transition).
   verification_method: [SCRIPT]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, stage, tools_tree_sha, sample_pitch_mm]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the RET-001 judgement for the net",
                   scope: "one net", expiry: "the next route", residual_risk: "none: it is a screen"}
   maturity_at_writing: UNASSESSED

 - id: RET-003
   domain: RETURN_PATH
   short_name: return transition at a reference change
   requirement: >
     Where a signal changes layer and its reference conductor changes with it, a return path for that
     transition exists: a via between the two reference conductors when they are different nets at the same
     potential, a stitching capacitor when they are different potentials, or no transition at all.
   false_positive_analysis: >
     A false refusal is a via this screen has no business judging, and the classification is written beside
     the board rather than inferred here. A via whose reference does not change is not this rule's subject; a
     via that changes to another NET's reference is RET-004's; an unclassified via stands rather than being
     assumed innocent. ref_change.py writes that classification and return_via.py reads it, and where the
     file is absent the screen declares its missing input instead of guessing. The second shape is a via at a
     plane change to a POWER reference with no capacitor near it: board A's thirteen are real, and a false
     one would be a change to a plane that is at the same potential as the one it left, which the
     classification distinguishes by net and not by name.
     AND THE DISTANCE is this project's calibration, ruled by decision 39 on 21 September 2026 and recorded
     as such.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {all: [{fact: has_tracks, op: truthy}, {fact: layers, op: ge, value: 4}]}
   risk_class: [SIGNAL_INTEGRITY, EMC]
   release_effect: BLOCKER
   source_status: PARTIALLY_VERIFIED
   sources:
   - title: >
       ECSS-E-HB-20-07A, Electromagnetic compatibility handbook, clause 6.1.2.5.2 PCB design techniques:
       minimisation of changes of layer for clock tracks, and the reference plane under a fast track being
       solid and unsplit
     issuer: ECSS Secretariat, ESA-ESTEC Requirements and Standards Division
     revision: A, 5 September 2012
     clause: '6.1.2.5.2'
     url_or_path: v2/vendor/standards/ecss-e-hb-20-07a-2012-09-05.md
     accessed: '2026-09-16'
     note: >
       The same clause, for the other half of the question. A via that moves a signal from one reference
       conductor to a DIFFERENT one is the change of layer the handbook asks to minimise, and the return
       current has to cross between the two references somewhere. The handbook gives no distance for that
       return transition, so the 1.5 mm this project judges against is its own number, measured on the boards
       and put to the owner as decision 32
   acceptance_criteria: >
     For each signal via, the reference conductor before and after the transition is determined. A transition
     that does not change the reference needs nothing. A transition that changes it carries a return path
     whose form is stated and whose position is close enough for the signal's spectral content.
   rationale: >
     The discontinuity is the reference CHANGE, not the via. A via between two layers that share one reference
     plane needs no companion; a via that moves a signal from one plane's field to another's does.
   failure_mode: "The return current detours around the anti-pad or through a decoupling capacitor, enlarging the loop."
   verification_method: [SCRIPT, CALCULATION]
   verification_phase: ROUTED_BOARD
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e]
   interfaces_affected: [PCIE, USB2, USB3, HDMI, ETHERNET]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, stage, rule_set_fingerprint]
   owner: OWNER
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the reference structure at the transition",
                   scope: "one class of transition on one board", expiry: "prototype EMC measurement",
                   residual_risk: "unmeasured until a chamber sees it"}
   maturity_at_writing: OWNER_DECISION_REQUIRED

 - id: RET-004
   domain: RETURN_PATH
   short_name: ground-via proximity screen
   requirement: >
     As a screening test for RET-003, every signal via outside a fine-pitch escape fan is measured for the
     distance to the nearest ground via, and a via beyond the screening distance is examined against RET-003
     rather than failed outright.
   classification: HEURISTIC
   applicability: CONDITIONAL
   condition: {all: [{fact: has_tracks, op: truthy}, {fact: layers, op: ge, value: 4}]}
   risk_class: [SIGNAL_INTEGRITY, EMC]
   release_effect: MUST_JUSTIFY
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     The screen reports signal vias judged, vias exempt with the reason, vias satisfied, and vias lacking with
     their positions and nets. The present 1.5 mm distance and the 0.5 mm fine-pitch exemption are project
     calibrations and are recorded as such.
   rationale: >
     Ground vias beside a transition are the usual implementation of RET-003 and are cheap to place before a
     route. The distance that matters follows from the signal's spectrum and the via field geometry, not from
     one number.
   failure_mode: "Used as a law it demands vias where the reference never changed, and it says nothing about a transition that has a via at the wrong potential."
   verification_method: [SCRIPT]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stage, tools_tree_sha, screen_distance_mm]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the RET-003 judgement for that transition",
                   scope: "one via", expiry: "the next route", residual_risk: "none: it is a screen"}
   maturity_at_writing: UNASSESSED

