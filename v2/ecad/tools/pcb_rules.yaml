 - id: INT-001
   domain: INTERFACE_COMPLIANCE
   short_name: each interface is designed to its own specification
   requirement: >
     Every implemented interface is designed against its current official specification and the device
     documentation of both ends: impedance, skew, termination, coupling, isolation, protection and pin map.
   classification: INTERFACE_REQUIREMENT
   applicability: CONDITIONAL
   condition: {fact: interfaces, op: truthy}
   risk_class: [ELECTRICAL_FUNCTION, SIGNAL_INTEGRITY, EMC]
   release_effect: BLOCKER
   source_status: PARTIALLY_VERIFIED
   sources:
    - {title: "Raspberry Pi Compute Module 5 datasheet", issuer: "Raspberry Pi Ltd", revision: "in this tree",
       clause: "2.2.1 connector and design guidance; 2.3 and 2.3.1 PCIe, routing guidance; pin table, Ethernet pairs",
       url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16",
       note: "READ 16 September 2026 and it decided three open items. PCIe is to be routed as 90 ohm differential
         with intra-pair match within 0.1 mm, which settles the 85 against 90 ohm question for THIS host in favour
         of 90. External AC coupling capacitors of 220 nF are required on every PCIe receive line before it enters
         the IC, and board B had none; TX and RX must be swapped for a direct IC connection, and board B does that
         correctly. Ethernet: the pin table reads connect to transformer or MagJack and 2.2.1 reads Ethernet
         connects to CM5 using a standard 1:1 RJ45 MagJack, with the pairs routed as 100 ohm differential and
         intra-pair match within 0.15 mm."}
   acceptance_criteria: >
     A per-interface sheet naming the specification and revision used, the requirement lines taken from it,
     and where each is implemented. An interface whose specification is not in the tree is SOURCE_UNVERIFIED
     and says so.
   rationale: >
     The PCIe lanes on board B are assigned to a 90 ohm class because they inherited the USB class, and no
     PCIe or M.2 specification is in this tree to say otherwise.
   failure_mode: "A link that does not meet its own specification and cannot be certified."
   verification_method: [MANUAL_REVIEW, SCRIPT]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e]
   interfaces_affected: [PCIE, USB2, USB3, USBC_PD, HDMI, ETHERNET, POE, SMBUS, I2C, SPI, UART, CAN, GNSS, M2_SOCKET]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, spec_revision]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the deviation and its measured consequence",
                   scope: "one interface on one board", expiry: "prototype validation",
                   residual_risk: "the interface may not certify"}
