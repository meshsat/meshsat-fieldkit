 - id: RTE-001
   false_positive_analysis: >
     A false refusal is a board whose stackup this tool cannot read, which would otherwise be compared against
     the wrong capability row: that case is INCONCLUSIVE and says so, and boards A and B are in it today. The
     second shape is a copper weight the document has no row for, where the tool takes the next HEAVIER row,
     which is the coarser limit and therefore the safe direction, and says in its output that it did. The third
     is a board rule that is deliberately tighter than the process because a part demands it: that is not a
     false refusal at all, since this rule only refuses a rule LOOSER than the process.
   domain: ROUTING
   short_name: geometry a fabricator will build
   requirement: >
     Every track, gap, annular ring, hole and copper-to-edge distance on the finished board is at or above the
     chosen fabricator's current published capability for the process being ordered.
   classification: FAB_LIMIT
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [FABRICATION, YIELD]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources:
    - {title: "fabricator capability, current at the order date", issuer: "the selected fabricator",
       revision: "", clause: "", url_or_path: "NOT USABLY IN THIS TREE", accessed: ""}
   acceptance_criteria: >
     Every geometric minimum in the board's design rules is compared against a dated capability record from
     the fabricator, and the DRC runs with those rules.
   rationale: "The board's own rules are only as good as the capability record they were copied from."
   failure_mode: "The order is rejected, re-quoted at a finer process, or built at reduced yield."
   verification_method: [DRC, VENDOR_CONFIRMATION]
   verification_phase: ROUTED_BOARD
