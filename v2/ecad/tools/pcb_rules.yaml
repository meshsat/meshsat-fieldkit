                   scope: "one part", expiry: "prototype thermal measurement",
                   residual_risk: "the sealed enclosure's real rise is unmeasured"}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: PLC-001
   false_positive_analysis: >
     A false refusal was measured and fixed on 15 September: the predictor's new class refused board A's placed
     board for 244 plane pads, which is the normal state of a pre-route board. The class is narrowed to a pad
     with no free via site within 1.5 mm or a track keep-out over it. The second shape is a region overflow that
     the board has measured and accepted, which is declared with its number.
   domain: PLACEMENT
   short_name: the placement is legal before anything is routed
   requirement: >
     The placed board carries no violation of the project's hard rule set before the router is asked to route
     it, and no part sits outside the area assigned to it.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [FABRICATION, ASSEMBLY, ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     The placed board's hard violation count is zero, or at a declared allowance carrying its number and the
     section that measured it; every packer region holds the parts assigned to it.
   rationale: >
     A board's whole pair programme was once measured on a placement carrying 150 hard violations that nothing
     had read. A cheap gate belongs in front of an expensive stage.
   failure_mode: "Hours of routing on a board that was never buildable."
   verification_method: [DRC, SCRIPT]
   verification_phase: PLACED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stage, hardset_policy_version, tools_tree_sha]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the allowance with its measured number",
                   scope: "one board", expiry: "the next placement", residual_risk: "named in the allowance"}
   maturity_at_writing: UNASSESSED

