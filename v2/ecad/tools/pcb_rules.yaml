 - id: IMP-001
   domain: CONTROLLED_IMPEDANCE
   short_name: an impedance target is feasible and asked for
   requirement: >
     Every net whose interface specifies a characteristic impedance is routed in a geometry that achieves it
     on the board's own stackup, the target and tolerance are stated to the fabricator, and the fabricator
     confirms it can build and test it.
   classification: INTERFACE_REQUIREMENT
   applicability: CONDITIONAL
   condition: {fact: impedance_controlled, op: truthy}
   risk_class: [SIGNAL_INTEGRITY, FABRICATION]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources:
    - {title: "JLCPCB rigid PCB manufacturing capabilities", issuer: JLCPCB,
       revision: "the live capability page as it read on 16 September 2026; no revision number is published",
       clause: "FR-4 dielectric constants: 4.5 (2-layer), 4.4 (7628 prepreg), 4.1 (3313 prepreg), 4.16 (2116 prepreg); impedance control tolerance +-10 percent; impedance control layer counts 4 and above",
       url_or_path: "v2/vendor/fabricator/jlcpcb-pcb-capabilities-2026-09-16.md", accessed: "2026-09-16",
       note: "this sources the DIELECTRIC CONSTANTS the stackup uses and the tolerance the fabricator holds,
         which is half of what this rule needs. It does NOT source the closed-form impedance model itself:
         IPC-2141 is not in this tree and cannot be bought without a licence, and the 2D field solver disagrees
         with the closed form by 38 percent on the stripline case from one solved point. So the rule stays
         unverified, and it is unverified for a reason that is now written down precisely rather than generally"}
    - {title: "JLCPCB impedance-controlled stackups", issuer: JLCPCB,
       revision: "the live impedance page as it read on 16 September 2026",
       clause: "JLC04161H-7628 four layers 1.6 mm, and JLC06161H-3313 six layers 1.6 mm: every layer with its material, thickness and dielectric constant",
       url_or_path: "v2/vendor/fabricator/jlcpcb-impedance-stackups-2026-09-16.md", accessed: "2026-09-16",
       note: "the two stackups this project writes into its boards come from here. Until today the numbers
         were in a code comment citing a reading of 8 September with no file behind it, and the two-layer core
         had picked up this page's multilayer 4.6 where the capability page says 4.5 for a 2-layer board"}
    - {title: "IPC-2141 controlled impedance circuit boards and high speed logic design", issuer: IPC,
       revision: "unknown to this tree", clause: "microstrip and stripline closed forms",
       url_or_path: "NOT IN THIS TREE", accessed: ""}
   acceptance_criteria: >
     Per controlled class: the target, the tolerance, the geometry as built, the computed impedance from the
     board's own stackup, a second opinion from a field solver where the closed form is known to be weak, and
     the fabricator's written confirmation with a coupon where the tolerance demands it.
   rationale: >
     The closed forms and the 2D solver in this tree disagree by 38 percent on the stripline case and only one
     solved point exists, so an impedance claimed from the closed form alone is not yet a claim.
   failure_mode: "Reflections, failed compliance testing, and a link that works on the bench and not in the field."
   verification_method: [SCRIPT, SIMULATION, VENDOR_CONFIRMATION]
   verification_phase: ROUTED_BOARD
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, d]
   interfaces_affected: [PCIE, USB2, USB3, HDMI, ETHERNET]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, vendor_capability_revision, solver_version]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the interface's own tolerance and the link budget",
                   scope: "one class on one board", expiry: "prototype measurement",
                   residual_risk: "the link is unverified until a prototype is measured"}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: IMP-002
   false_positive_analysis: >
     A false refusal would be a class value of 0, which KiCad writes to mean inherit the board default and is not
     a violation; it is skipped. A board with no project file beside it is INCONCLUSIVE, never a pass, because
     the classes live in the project file and the router reads them there.
   domain: CONTROLLED_IMPEDANCE
   short_name: a class clearance is never below the board minimum
   requirement: >
     No net class carries a clearance or width below the board's own manufacturing minimum, in any file that
     reaches the router or the fabricator.
   classification: FAB_LIMIT
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [FABRICATION, YIELD, ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Every class in the project file and every class the generator writes has clearance and width at or above
     the board's declared minimum; the project file and the generator agree.
   rationale: >
     A class clearance below the board minimum is a lie the router believes, and it put 25 clearance
     violations into one A route. Board B's project file ships USB and DIFF100 at 0.10 mm against a 0.127 mm
     board minimum today.
   failure_mode: "The router lays copper the fabricator will not build, and the DRC only finds it afterwards."
   verification_method: [SCRIPT]
   verification_phase: PLACED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, project_file_sha256, tools_tree_sha]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

 - id: PAIR-001
   false_positive_analysis: >
     A false refusal is a pair whose two legs are correctly coupled for most of their length and diverge only at
     the pads, where the geometry is the part's and not the router's. The board declares a coupled fraction with
     its measurement (board B, 0.80 by length, owner decision 24) rather than a per-pair exception, which would
     have been 78 copies of one sentence.
   domain: DIFFERENTIAL_PAIRS
   short_name: a pair is coupled and matched
   requirement: >
     A differential pair is routed as a pair: the two conductors run together at the geometry its target
     demands, their lengths match inside the budget the interface allows, and both ends of the pair are
     symmetrical.
   classification: INTERFACE_REQUIREMENT
   applicability: CONDITIONAL
   condition: {fact: pair_classes, op: truthy}
   risk_class: [SIGNAL_INTEGRITY, EMC]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Per pair: the coupled length as a fraction of the judged length, the intra-pair length difference against
     the interface's own skew budget, and the via and station symmetry. The project's present 1 mm gate is a
     project decision, and the interface's own budget is cited beside it.
   rationale: "An uncoupled pair is two single-ended nets with the wrong impedance and a common-mode current."
   failure_mode: "Common-mode conversion, radiated emission at the pair's own rate, and link errors."
   verification_method: [SCRIPT]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e]
   interfaces_affected: [PCIE, USB2, USB3, HDMI, ETHERNET]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, stage]
   owner: OWNER
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the measured coupled fraction and the interface budget",
                   scope: "one class on one board", expiry: "prototype measurement",
                   residual_risk: "the link margin is unmeasured"}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: SI-001
   domain: SIGNAL_INTEGRITY
   short_name: transmission-line classification
   requirement: >
     Every net is classified by whether it behaves as a transmission line, from its rise time, propagation
     delay and electrical length, and its topology and termination follow from that classification, not from
     its bit rate or clock frequency.
   false_positive_analysis: >
     A false refusal is a net judged against an edge rate it does not have. The rule judges only nets whose
     edge rate is DECLARED, counts the ones that are not (60 on board A, 380 on board B) and says so in its
     own verdict rather than passing them, so the reading is INCONCLUSIVE with its missing input named until
     the declarations exist. The second shape is a long net that IS answered: a run over the criterion whose
     reference is continuous underneath is reported as long_and_answered and is not a refusal.
     AND THE CRITERION is this project's calibration, ruled by decision 39 on 21 September 2026, with the
     numbers unchanged by that ruling.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [SIGNAL_INTEGRITY, EMC]
   release_effect: MUST_JUSTIFY
   source_status: PARTIALLY_VERIFIED
   sources:
   - title: >
       ECSS-E-HB-20-07A, Electromagnetic compatibility handbook, clauses 6.1.2.2 (the spectrum of a trapezoidal
       signal and its break points) and 6.1.2.3 (the worked example)
     issuer: ECSS Secretariat, ESA-ESTEC Requirements and Standards Division
     revision: A, 5 September 2012
     clause: '6.1.2.2 and 6.1.2.3'
     url_or_path: v2/vendor/standards/ecss-e-hb-20-07a-2012-09-05.md
     accessed: '2026-09-16'
     note: >
       THE INPUT TO THIS RULE IS SOURCED AND ITS THRESHOLD IS NOT. The envelope of a trapezoidal signal breaks
       at F2 = 1/(pi tr), so the highest frequency a signal puts on a conductor comes from its RISE TIME and
       not from its clock or data rate: a 12 Mbit/s bus on a 1 ns edge carries energy to 318 MHz. The
       handbook's own worked example is a 35 mm track at about a sixth of the wavelength at that frequency
       radiating enough to matter from an 872 kHz clock. What it does not give is a critical length: 'a net
       longer than X is a transmission line' is this project's own criterion and is stated with its reason
   acceptance_criteria: >
     A per-board table: net class, driver edge rate from the device datasheet, the length above which that
     edge rate makes the net a transmission line on this stackup, and the nets that exceed it with their
     topology and termination.
   rationale: >
     A 100 kHz bus with a 1 ns edge is a transmission line; a 10 MHz clock with a 20 ns edge over 30 mm is not.
     Frequency alone decides nothing.
   failure_mode: "Overshoot into a protection diode, double-clocking, and emissions from an unterminated stub."
   verification_method: [CALCULATION, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, stackup]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the edge rate and the length", scope: "one net class",
                   expiry: "prototype measurement", residual_risk: "measured at the prototype"}
   maturity_at_writing: UNASSESSED

 - id: CLK-001
   false_positive_analysis: >
     A SERIES DAMPING RESISTOR on a crystal node is not a stub, it is what the oscillator's own datasheet asks
     for, and the first version of this check called every one of them a defect on four boards at once. One
     resistor is allowed and named in the output; a second, or a second driving part, is refused. The other
     shape is a board with no crystal at all, which is INCONCLUSIVE rather than passing, because "nothing to
     check" and "everything checked" print the same way otherwise. The load capacitor VALUE is deliberately
     not judged: C_L is per part, it is in a datasheet this tool does not read, and refusing a board on a
     guessed value would be the heuristic-as-law this audit exists to remove.
   domain: CLOCKS_RESET_BOOT
   short_name: oscillators, straps and boot pins
   requirement: >
     Every crystal, oscillator, reset and boot or configuration strap is loaded, referenced and placed as its
     device's own documentation requires, and every strap's state at reset is defined by hardware.
   classification: COMPONENT_REQUIREMENT
   applicability: CONDITIONAL
   condition: {any: [{fact: interfaces, op: contains, value: CAN}, {fact: interfaces, op: contains, value: ETHERNET},
                     {fact: interfaces, op: contains, value: USB2}]}
   risk_class: [ELECTRICAL_FUNCTION, EMC, RELIABILITY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Per oscillator: load capacitance against the crystal's own specification, keep-out and reference under
     the loop, and a bounded return path. Per strap: the resistor, the state it sets and the device page that
     defines it.
   rationale: "A mis-loaded crystal and a floating strap are the two defects that make a board 'sometimes work'."
   failure_mode: "Intermittent boot, frequency error, and a clock that radiates."
   verification_method: [SCRIPT, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e]
   interfaces_affected: [CAN, ETHERNET, USB2]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: ANA-001
   domain: ANALOG_MIXED_SIGNAL
   short_name: sensitive analogue nodes
   requirement: >
     Every high-impedance or low-level analogue node is identified and protected: its source impedance, its
     reference, its filtering and its distance from switching copper are decided rather than inherited.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {any: [{fact: interfaces, op: contains, value: AUDIO_ANALOG},
                     {fact: energy_source, op: truthy},
                     {fact: carries_pack_node, op: truthy}]}
   risk_class: [ELECTRICAL_FUNCTION, SIGNAL_INTEGRITY]
   release_effect: MUST_JUSTIFY
   source_status: SOURCE_UNVERIFIED
   sources:
    - {title: 'LM5176 four-switch buck-boost controller, pin table and layout section',
       where: 'v2/vendor/ti/lm5176-datasheet.pdf, pin 15 CSG and section 9.1',
       says: 'Connect CSG directly to the low-side (ground) of the current sense resistor; use Kelvin connections to RSENSE and run the lines in parallel to the IC pins; avoid crossing SW1 and SW2; place the filter capacitor as close to the IC pins as possible; section 8.2.2.7 permits a filter network whose resistance may not exceed 100 Ohm'}
    - {title: 'LT8705A buck-boost controller, current sense',
       where: 'v2/vendor/power/lt8705a.pdf',
       says: 'the inductor current is sensed differentially across a shunt into CSP and CSN, which is the pair this rule protects on board E rather than the shunt terminals themselves'}
   acceptance_criteria: >
     A list per board of the sensitive nodes (microphone inputs, current-shunt sense pairs, cell taps,
     thermistors, reference inputs) with, for each, its reference, its filter and its clearance from switching
     nodes, and Kelvin connections where the measurement demands them. A declared node is the node the
     amplifier sees, BEHIND its filter: a net carrying a transistor or inductor terminal is a conductor of the
     switching loop and naming it here is a declaration about the wrong side of the filter (18 September 2026,
     board E's TRK_LSENSE and board A's five raw CS nodes).
   rationale: >
     A 2 milliohm shunt measured 100 millimetres from its sense amplifier through shared copper measures the
