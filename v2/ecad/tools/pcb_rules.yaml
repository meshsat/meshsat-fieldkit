 - id: PWR-003
   domain: POWER_TREE
   short_name: protection coordination
   requirement: >
     Every fuse, eFuse, ideal diode and protection device is coordinated with what it protects: the clearing
     characteristic sits below the damage characteristic of the weakest element downstream and above the
     worst legitimate current.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {any: [{fact: fuses, op: truthy}, {fact: carries_pack_node, op: truthy}]}
   risk_class: [SAFETY, RELIABILITY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     For each protective element: the rated and peak current of the path, the element's rating and clearing
     curve reference, the fault current available at that point, and the element downstream it is protecting.
   rationale: >
     Four boards sit on one energy chain from the cells with two 25 A blades on it; a fuse that never opens
     before the conductor does is decoration.
   failure_mode: "A short in the kit is cleared by a track or a connector instead of by the fuse."
   verification_method: [CALCULATION, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, e, e5, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, manifest_version]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED
   false_positive_analysis: >
     These tests compare declared numbers, so a false refusal is a wrong DECLARATION rather than a wrong board,
     and it takes one of three shapes. A peak declared for a whole node while the element protects a branch of
     it, which is the first run's own error and is now two stages. A conductor rating left blank, which is
     skipped rather than read as zero, because an absent number must not fail a stage. And an interrupting
     rating of null, which an eFuse legitimately has, since it limits current rather than breaking a fault:
     that test is skipped for such an element instead of failing it. Every refusal prints the stage, both
     numbers and their sources, and the melting time is printed and never asserted, because one point of an
     I2t figure is not a clearing curve.

 - id: DEC-001
