 - id: VIA-002
   domain: VIAS
   short_name: the annular ring is one the fabricator makes
   false_positive_analysis: >
     A false refusal here is a VIA judged against the row that governs a PLATED COMPONENT HOLE, and it is not
     hypothetical: on 16 September board D12 routed 0 hard and 0 unrouted and was refused for one 0.45/0.20 via
     at 0.125 mm of ring, a via nearly two and a half times the same document's own via minimum. The two rows
     cannot both be about vias, because no via at the stated minimum 0.25 mm on 0.15 mm can carry 0.20 mm of
     ring, so the annular ring row is about a component hole and the via rows are about a via. The second shape
     is a NON-PLATED hole, a mounting hole with no copper of its own, failed for a ring it was never meant to
     have: those are counted and left unjudged, because their row is a different one again. The third is a
     board at a copper weight the document does not state the rows for, which is E5 and P at 2 oz: they declare
     no floor and read INCONCLUSIVE rather than being judged against a 1 oz number.
   requirement: >
     The copper left around every drilled hole, (pad or via diameter minus drill) divided by two, is at or
     above the minimum the chosen fabricator publishes FOR THAT KIND OF HOLE at the chosen process and copper
     weight: the annular ring row for a plated component hole, and what the via rows leave for a via. The
     aspect ratio of every hole is inside the same document's limit.
   classification: FAB_LIMIT
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [FABRICATION, RELIABILITY]
   release_effect: BLOCKER
   source_status: PARTIALLY_VERIFIED
   sources:
    - {title: "JLCPCB rigid PCB manufacturing capabilities", issuer: JLCPCB,
       revision: "the live capability page as it read on 16 September 2026; no revision number is published",
       clause: "two rows, two kinds of hole. PLATED COMPONENT HOLE, section Annular ring: PTH multilayer 1 oz recommended 0.20 mm or above, absolute minimum 0.15 mm; PTH 2-layer 1 oz recommended 0.25 mm or above, absolute minimum 0.18 mm; NPTH pad >= 0.45 mm. VIA, section Holes and vias: minimum via diameter 0.25 mm on a minimum via hole of 0.15 mm for 2 or more layers, which leaves 0.05 mm of copper per side. The 2 oz case is NOT stated for the annular rows, so boards E5 and P stay unjudged on the ring",
       url_or_path: "v2/vendor/fabricator/jlcpcb-pcb-capabilities-2026-09-16.md", accessed: "2026-09-16",
       note: "transcribed row by row from https://jlcpcb.com/capabilities/pcb-capabilities. It replaces the
         4 September scrape in v2/vendor/seals/, which is a JavaScript-blocked page with no capability data in
         it. A fabricator's capability page is not a controlled document and can change without notice, which
         is why the date it was read travels with every limit taken from it"}

   acceptance_criteria: >
     Each board declares TWO floors from the fabricator's own document with the clause cited, annular_min_mm
     for a plated component hole and via_ring_min_mm for a via, every hole of each kind on the board is at or
     above the floor for its own kind, and a board that declares only one of them reads INCONCLUSIVE.
   rationale: >
     The annular ring is the number a fabricator quotes and the one a via actually fails at: a 0.45 mm via on a
     0.35 mm drill leaves 0.05 mm per side, and a process guaranteeing 0.075 will not make it reliably. The
     drill and the diameter can be judged against the board; the ring can only be judged against the process.
   failure_mode: "A breakout: the hole misses its own pad, and the net is open on a board that passes every check this project can run."
   verification_method: [SCRIPT, VENDOR_CONFIRMATION]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: via_audit.py
   evidence_scope: [board_sha256, vendor_capability_revision]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the fabricator's written confirmation for that hole",
                   scope: "one via class", expiry: "the order", residual_risk: "a breakout found at electrical test"}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: VIA-001
   domain: VIAS
   short_name: every via is a via the process makes
   false_positive_analysis: >
     A false refusal is a via deliberately smaller than the board's own stated minimum, and there is no such
     thing: the minimums are the board's own design settings, which the DRC already judges every track and via
     against, so a via under them is a via the board itself says it does not make. The second shape is a VIA IN
     A PAD read as a defect. It is not one here: it is a deliberate technique on exposed pads and fine-pitch
     escapes, so those vias are counted and named for the order paperwork and never refused. The annular ring
     is deliberately NOT in this rule, because it is judged against a fabricator capability this tree does not
     hold, and refusing a board on it would be the heuristic-as-law this audit exists to remove.
   requirement: >
     Every via's diameter and drill is at or above the board's own stated minimum, and every via that sits in a
     pad is counted and declared to the assembler with the treatment it needs.
   classification: FAB_LIMIT
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [FABRICATION, ASSEMBLY, RELIABILITY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     A via table per board: every via's diameter and drill against the board's own minimums, and the count of
     vias in pads with the assembly note that accompanies them.
   rationale: "A via in a pad without a declared treatment is a solder thief the assembler does not expect."
   failure_mode: "Voided joints, open barrels, and a board that passes electrical test and fails in vibration."
   verification_method: [SCRIPT, VENDOR_CONFIRMATION]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, vendor_capability_revision]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the fabricator's confirmation for that treatment",
