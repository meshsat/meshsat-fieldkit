 - id: BAT-002
   domain: ENERGY_STORAGE
   short_name: the energy chain is bounded end to end
   requirement: >
     From the cells to every load, the maximum fault current is bounded at each stage by a protective element
     sized for the conductors and connectors of that stage.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {fact: carries_pack_node, op: truthy}
   risk_class: [SAFETY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     A chain diagram with, at each stage, the conductor and connector rating, the protective element and its
     rating, and the prospective fault current.
   rationale: "Four boards, two blade fuses, a pre-charge pin and 12 AWG wiring are one circuit, not four."
   failure_mode: "A fault in one board is cleared by copper in another."
   verification_method: [CALCULATION, MANUAL_REVIEW]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, e, e5, p]
   interfaces_affected: [SOLDER_LANDS]
   implementation_location: NONE_YET
   evidence_scope: [manifest_version, schematic_sha256]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED
   false_positive_analysis: >
     A false refusal here has three shapes and each is answered mechanically. The first is a CITATION refused
     for its punctuation: the gate's first run rejected two true sources for a trailing colon and a trailing
     parenthesis, so a basis token is trimmed of sentence punctuation before the file is looked for, and the
     name it looked for is printed when it still does not resolve. The second is a stage whose protective
     element is named on a board whose netlist is not in this tree: that is a note and never a failure,
     because a board that cannot be read says nothing about the chain. The third is a MODELLING error mistaken
     for a design error, which is what the first run found: a stage carried the pack node's 18 A peak while
     naming a 2 A eFuse as its protection, and the honest answer was to split the stage, not to loosen the
     test. What stops a wrong refusal from standing is that every refusal names the stage, the two numbers it
     compared and the file each came from, so it can be checked in one line.

 - id: DOC-001
   false_positive_analysis: >
     A false refusal is a folder deliberately cut as a quote for a held board, which is marked QUOTE ONLY and
     counted separately. What is NOT a false refusal, and was read as one for weeks, is a folder that is not the
     phase the tree declares: verify_deliverable judges a folder against itself and cannot know.
   domain: DOCUMENTATION_CONTROL
   short_name: the folder is the board
   requirement: >
     Every deliverable folder names the board phase it was cut from, and that phase is the phase the tree
     declares; a folder is never judged only against itself.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [DOCUMENTATION, FABRICATION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     The folder's phase equals the board file's declared phase; the board hash in the folder equals the board
     hash in the tree; the silk carries the same phase.
   rationale: >
     Five folders passed the final gate while predating the rules they were judged under, because
     verify_deliverable judges a folder against itself.
   failure_mode: "An order is placed from a folder describing a board nobody is building any more."
   verification_method: [SCRIPT]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [folder_sha256, board_sha256, manifest_version]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

