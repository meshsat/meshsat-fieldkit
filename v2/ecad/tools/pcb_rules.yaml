 - id: RF-001
   false_positive_analysis: >
     A wrong refusal here has four shapes and each is answered. A net is judged only because its CLASS carries
     a single-ended target, so a DC feed that happens to sit in the RF class would be measured as a
     transmission line: the classes are declared per board and the RF class holds RF conductors only, which
     the netlist shows. A line on an inner layer is judged against the copper layers above and below it
     whether or not they are a reference under that particular track, which is impedance_check's harder
     question for a pair and is not asked here, so a line over a routing layer is reported with the form used
     and not silently excused. A stub of a millimetre is not a transmission line at any frequency this kit
     uses, and the length is printed beside every verdict so a short one can be read as what it is. And the
     closed form is the closed form: this project's 2D-solver calibration was measured on differential
     geometries and is deliberately NOT applied to a single-ended line, so the number carries the form's own
     few percent and the tolerance is ten. The finding it produced on its first run is not marginal: eleven
     lines at 25.5 ohm against 50.
   domain: RF
   short_name: RF paths are designed as RF
   requirement: >
     Every RF conductor is a transmission line of the intended impedance from launch to connector, its
     reference is continuous beneath it, its matching and filtering are as the module's own documentation
     requires, and the keep-outs the modules demand are respected.
   classification: INTERFACE_REQUIREMENT
   applicability: CONDITIONAL
   condition: {any: [{fact: rf_transmit, op: truthy}, {fact: interfaces, op: contains, value: BLIND_MATE_RF}]}
   risk_class: [ELECTRICAL_FUNCTION, EMC, SAFETY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Per RF path: the line geometry and its computed impedance on this stackup, the ground continuity beneath
     it, the module's keep-out honoured, the filter's topology and part values with their source, and the
     connector transition.
   rationale: "A 30 W stage and eleven coaxial paths in a sealed metal box are an RF system, not a set of nets."
   failure_mode: "Power reflected into a PA, harmonics outside the licensed band, and desense of the receivers beside it."
   verification_method: [SCRIPT, SIMULATION, MANUAL_REVIEW, PROTOTYPE_MEASUREMENT]
   verification_phase: ROUTED_BOARD
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, d, e]
   interfaces_affected: [RF_TX, RF_RX, BLIND_MATE_RF]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stackup, stage, module_datasheet_revision]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
