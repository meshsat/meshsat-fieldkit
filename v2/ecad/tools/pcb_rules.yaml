 - id: INT-002
   domain: INTERFACE_COMPLIANCE
   short_name: a transformerless Ethernet link is verified at both ends
   requirement: >
     Where an Ethernet link is built PHY-to-PHY without magnetics, both PHYs' own documentation is checked to
     permit it, and the coupling, termination, common-mode handling and bias are as both require.
   classification: INTERFACE_REQUIREMENT
   applicability: CONDITIONAL
   condition: {fact: interfaces, op: contains, value: ETHERNET}
   risk_class: [ELECTRICAL_FUNCTION, EMC, RELIABILITY]
   release_effect: BLOCKER
   source_status: PARTIALLY_VERIFIED
   sources:
    - {title: "KSZ989x/KSZ956x/KSZ9477 hardware design checklist", issuer: Microchip, revision: "DS00004151A (2021)",
       clause: "6.6 Capacitive Coupling Option, page 12",
       url_or_path: "v2/vendor/cluster/ksz989x-hw-design-checklist.pdf", accessed: "2026-09-16",
       note: "READ 16 September 2026, and it PERMITS what board B does, in terms that match the implementation
         exactly: the family may be used in transformer-less applications where the PHY-to-PHY connection is
         within one PCB or interconnected PCBs and a cable is not needed; a single DC blocking 0.1 uF capacitor
         in series on each of the eight signals; no additional components between the switch and the capacitor;
         keep auto-negotiation enabled at 1000M. The same clause states the open half in one sentence: the
         other device may require termination or other circuitry. Section 6.2 requires 1:1 isolation
         transformers at the MEDIA interface, which is the RJ45 side and is where board B already fits the
         Pulse H5007NL on port 4."}
    - {title: "Raspberry Pi Compute Module 5 datasheet", issuer: "Raspberry Pi Ltd", revision: "in this tree",
       clause: "2.2.1 connector and design guidance; pin table, Ethernet pairs",
       url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16",
       note: "the other end, READ 16 September 2026. It describes ONE topology: Ethernet connects to CM5 using a
         standard 1:1 RJ45 MagJack, and every Ethernet pin reads connect to transformer or MagJack. It neither
         permits nor forbids capacitive coupling; it does not discuss it. So one end permits the link and the
         other has not been asked."}
    - {title: "BCM54210PE datasheet", issuer: Broadcom, revision: "", clause: "", url_or_path: "NOT IN THIS TREE",
       accessed: "",
       note: "the PHY inside the module, named in the CM5 datasheet section 2.2. Broadcom does not publish it, so
         the termination and bias question the switch vendor's clause 6.6 raises cannot be answered from
         documents this project can obtain: it needs a vendor answer or a prototype measurement."}
   acceptance_criteria: >
     Both PHYs' documents on file, the permitted topology quoted from each, and the implemented coupling and
     termination compared against both.
   rationale: "One end's permission is not the link's permission."
   failure_mode: "Link instability, bias fighting between the two PHYs, and emissions from an unbalanced pair."
   verification_method: [MANUAL_REVIEW, VENDOR_CONFIRMATION]
   verification_phase: SCHEMATIC
   automation_feasibility: HUMAN_OR_LAB_ONLY
   boards_affected: [b]
   interfaces_affected: [ETHERNET]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256, vendor_document_revision]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED

