 - id: OUT-001
   false_positive_analysis: >
     A false refusal is an order set for a subset of the boards, which is never the set and is INCONCLUSIVE
     rather than FAIL. A real refusal names the board whose folder the order paperwork describes and the phase
     the tree actually holds.
   domain: MANUFACTURING_OUTPUTS
   short_name: the order set is the current set
   requirement: >
     The order package is built from the current deliverable folder of every board in the manifest, and its
     prose describes those boards.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [DOCUMENTATION, SUPPLY_CHAIN]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Every board in the manifest has a current folder in the order set; the notes name that phase; no board is
     quote-only; the checksums in the set match the folders.
   rationale: "The set on disk today is built from folders three to five phases behind the tree."
   failure_mode: "The wrong gerbers are uploaded under the right name."
   verification_method: [SCRIPT]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
