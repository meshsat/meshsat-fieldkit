 - id: DFA-001
   domain: ASSEMBLY_DFA
   short_name: the assembly set is buildable
   requirement: >
     The placement file names every part the assembler places, with a position, a side and a rotation that
     matches the part's own datasheet orientation, and excludes every part fitted by hand.
   classification: ASSEMBLY_LIMIT
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [ASSEMBLY, YIELD]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Every designator in the parts list appears in the placement file or is declared hand-fitted; every
     polarised part's rotation is verified against its own drawing and against the assembler's convention,
     with the verification dated.
   rationale: >
     Rotation conventions differ per footprint and are the classic assembly defect; this project's rotations
     come from a table that has never been re-verified per footprint.
   failure_mode: "Polarised parts placed backwards across a whole batch."
   verification_method: [SCRIPT, VENDOR_CONFIRMATION, MANUAL_REVIEW]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e, e5, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [cpl_sha256, bom_sha256, rotation_table_sha]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the assembler's own preview check",
                   scope: "one footprint family", expiry: "the order", residual_risk: "a whole batch is at stake"}
   maturity_at_writing: SOURCE_UNVERIFIED
   false_positive_analysis: >
     A wrong refusal here is a footprint reported as unchecked that does not actually need checking, and the
     shape it takes is the POLARISED list: the pattern that decides which footprints have an orientation that
     can be wrong is named in assembly_set.py and errs wide, so a symmetric two-pin land that happens to match
     one of those prefixes is listed. That costs the ordering session a glance at a preview it is already
     looking at, which is the cheap direction; the expensive direction is a part placed backwards. The tool
     also separates the two answers rather than merging them: a footprint with NO rotation row makes the
     verdict INCONCLUSIVE, because zero can be the right offset and nobody has looked, while a row that exists
     and carries no date is a FAILURE, because someone wrote an offset down without checking it. And the
     comparison between the CSV and the literal in make_handoff.py reports a difference rather than resolving
     it, because that line is on the never-auto floor and only the ordering session may change what is
     applied to a CPL.

