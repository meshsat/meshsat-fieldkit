     Each protection function names the device that implements it, its configured threshold, the cell
     datasheet limit it is derived from, and the test that will demonstrate it on the prototype.
   rationale: "A 200 Wh lithium block is the one part of this kit that can hurt somebody."
   failure_mode: "Thermal runaway from an over-charge, a deep discharge, or an external short."
