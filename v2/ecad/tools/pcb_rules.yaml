 - id: GND-001
   domain: GROUNDING_SHIELDING
   short_name: one deliberate ground system
   requirement: >
     The board's ground system is deliberate: every partition, moat or separate ground is there for a written
     reason, and every conductor crossing between them does so at a defined point.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [EMC, SIGNAL_INTEGRITY, SAFETY]
   release_effect: MUST_JUSTIFY
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Either the board has one ground and says so, or every partition is drawn deliberately with its crossing
     points named and the signals that cross listed.
   rationale: "An accidental split is the commonest cause of a return path taking the long way round."
   failure_mode: "Radiated emissions, coupled noise into analogue nodes, and common-mode current on cables."
