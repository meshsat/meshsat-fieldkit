 - id: PLN-001
   false_positive_analysis: >
     A false refusal is a pour island that is legitimately isolated because the net is carried by tracks
     elsewhere, and a locked stitch via the fill has retreated from after the router laid copper past it. The
     pruner judges on a copy and puts the board back if anything opened, and it refuses to run at all on an
     unfilled board, where it once offered to remove 366 of 660 locked vias.
   domain: PLANES_POURS
   short_name: no orphan copper
   requirement: >
     Every piece of filled copper is connected to its net, or it is not there; every plane pad reaches its
     plane; no pour piece floats.
   classification: PROJECT_DECISION
   applicability: CONDITIONAL
   condition: {fact: has_tracks, op: truthy}
   risk_class: [EMC, ELECTRICAL_FUNCTION, FABRICATION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: "Zero isolated copper pieces of any net on the filled board; every zone's islands either connected or removed."
   rationale: "Floating copper is an antenna and a manufacturing question nobody asked."
   failure_mode: "Radiation from a floating island; a pad that looks connected and is not."
   verification_method: [DRC, SCRIPT]
   verification_phase: ROUTED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stage]
   owner: SESSION
   waiver_policy: {allowed: true, authority: SESSION, evidence: "the piece's size and why it is harmless",
                   scope: "one piece", expiry: "the next fill", residual_risk: "EMC only"}
   maturity_at_writing: UNASSESSED

