 - id: MEC-001
   false_positive_analysis: >
     A false refusal is a pour measured against the rectangle it was drawn in rather than the board it sits on:
     board C's panel backer is a U with the display window through it, and the gate read 24 failures on a board
     with none (10 September). The denominator is the outline clipped to the board.
   domain: MECHANICAL
   short_name: the board fits what it is fitted to
   requirement: >
     Outline, mounting holes, keep-outs, connector positions and part heights agree with the enclosure, the
     plate, the neighbouring boards and the cables, with the tolerances stated.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [MECHANICAL, ASSEMBLY]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     Every mechanical number in the board is checked against the single source that owns it (the panel and
     case geometry module, the vendor drawings), and the stack height between boards is computed rather than
     assumed.
   rationale: "A board that does not fit is discovered at assembly, when five of each have been made."
   failure_mode: "The stack does not close, a connector fouls a rib, a part touches the board above it."
   verification_method: [SCRIPT, MANUAL_REVIEW]
   verification_phase: PLACED_BOARD
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, mechanical_source_sha]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

 - id: DFM-001
   false_positive_analysis: >
     A false refusal is a gerber set whose layer count differs from the board's because the board is two-layer
     and the export named four; the count is read off the board. The second shape is a BOM line that is blank by
     design, a bench-fitted part, which is declared with its route.
   domain: FABRICATION_DFM
   short_name: the fabrication set is complete and consistent
   requirement: >
     The fabrication package contains every layer the board has, the drill data that matches it, the stackup
     and impedance notes, and nothing that contradicts the board file.
   classification: PROJECT_DECISION
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [FABRICATION, DOCUMENTATION]
   release_effect: BLOCKER
   source_status: NOT_REQUIRED_FOR_PROJECT_DECISION
   sources: []
   acceptance_criteria: >
     One copper layer file per copper layer of the board, mask, paste, silk, edge, drill and map present and
     non-empty; the note file names the stackup and copper weight the board file carries.
   rationale: "A gerber set that dropped two inner layers shipped here once; the zip's layer count is now counted."
   failure_mode: "Boards are built without an inner layer, or on the wrong stack."
   verification_method: [SCRIPT]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: AUTOMATABLE
   boards_affected: [ALL]
   interfaces_affected: [NONE]
   implementation_location: NONE_YET
   evidence_scope: [gerber_zip_sha256, board_sha256, stackup]
   owner: SESSION
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: UNASSESSED

 - id: DFA-001
   domain: ASSEMBLY_DFA
   short_name: the assembly set is buildable
   requirement: >
     The placement file names every part the assembler places, with a position, a side and a rotation that
     matches the part's own datasheet orientation, and excludes every part fitted by hand.
   classification: ASSEMBLY_LIMIT
   applicability: UNIVERSAL_FOR_THIS_PROJECT
   risk_class: [ASSEMBLY, YIELD]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     Every designator in the parts list appears in the placement file or is declared hand-fitted; every
     polarised part's rotation is verified against its own drawing and against the assembler's convention,
     with the verification dated.
   rationale: >
     Rotation conventions differ per footprint and are the classic assembly defect; this project's rotations
     come from a table that has never been re-verified per footprint.
   failure_mode: "Polarised parts placed backwards across a whole batch."
   verification_method: [SCRIPT, VENDOR_CONFIRMATION, MANUAL_REVIEW]
   verification_phase: RELEASE_PACKAGE
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e, p]
