 - id: BAT-001
   domain: ENERGY_STORAGE
   short_name: the cell block is protected in hardware
   requirement: >
     The cell block has over-voltage, under-voltage, over-current, short-circuit and over-temperature
     protection in hardware, independent of any software, with the trip points set from the cell
     manufacturer's own limits.
   classification: REGULATORY
   applicability: CONDITIONAL
   condition: {fact: energy_source, op: truthy}
   risk_class: [SAFETY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
