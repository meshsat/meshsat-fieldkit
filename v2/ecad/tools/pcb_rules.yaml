     INCONCLUSIVE. A real refusal names the device that drives the line, and the rule is that no device may: the
     panel toggle is the only source.
   domain: RF
   short_name: transmit inhibit is hardware
   requirement: >
     Every transmitter can be inhibited by a hardware path that does not depend on software, and the inhibit
     is asserted by the unpowered and disconnected states.
