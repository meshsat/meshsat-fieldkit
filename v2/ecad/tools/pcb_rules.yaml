# ---------------------------------------------------------------------------------------------------------
# 18 to 25. TRANSIENTS, ISOLATION AND SPACING, THERMAL, PLACEMENT, ROUTING, VIAS, PLANES, EMC
# ---------------------------------------------------------------------------------------------------------
 - id: TRN-001
   false_positive_analysis: >
     This check produced four distinct false positives before it produced a finding, and each is closed in a
     way the next reader can see. A part FAMILY is followed by its part number with no word boundary, so
     "SMBJ58A" was read past. GALVANIC ISOLATION is protection and the strongest kind: eight Ethernet lines
     behind their magnetics were called unprotected because the part's value says "magnetics". PROTECTION IS A
     CHAIN: a DC inlet's clamp normally sits behind the fuse, and demanding it on the connector's own net
     refused an inlet for having its fuse in the right place. And a search must not walk out through a POWER
     RAIL, because every part on a board touches one: a sensor pod was reported as protected by a choke on the
     other side of the board. A fifth case is reported rather than refused: a clamp reached only THROUGH an
     active part protects everything except that part, which is a different finding from no protection at all
     and is counted separately. An internal connector is never judged: the board declares which of its
     connectors leave the enclosure, with a reason for each, because nothing else knows.
   domain: TRANSIENT_PROTECTION
   short_name: every exposed port is protected
   requirement: >
     Every conductor that leaves the enclosure or touches a user is protected against electrostatic discharge
     and, where the port can see them, against surge and fast transients; the protection device is rated for
     the working voltage, clamps below the protected part's absolute maximum, and its own parasitics are
     acceptable to the signal.
   classification: PHYSICS_PRINCIPLE
   applicability: CONDITIONAL
   condition: {any: [{fact: external_ports, op: truthy}, {fact: interfaces, op: contains, value: ETHERNET},
                     {fact: interfaces, op: contains, value: USBC_PD},
                     {fact: interfaces, op: contains, value: BLIND_MATE_RF}, {fact: panel_face, op: truthy},
                     {fact: carries_pack_node, op: truthy}]}
   # THE BOARD THAT DECLARES A CONDUCTOR LEAVING THE CASE IS IN SCOPE (17 September 2026). The condition was a
   # list of interfaces and board properties, and it missed board D, which carries TWO HEADSET JACKS ON THE
   # FACE, a VHF antenna SMA and a 30 W power amplifier output. Its gate has been measuring them all along:
   # `port_protect` reads 7 of 14 conductors reaching a semiconductor with nothing between (J_HS1 and J_HS2
   # three each, J_PAOUT one; J_ANT is protected off board by the arrestor at the bulkhead) and it REFUSED
   # board D's deliverable this morning for exactly that. So the gate and the registry disagreed about whether
   # the rule applies, and the rule's own rationale settles it: "a discharge at a panel switch or an antenna
   # jack destroys the device behind it". Every board declares which of its connectors leave the enclosure and
   # why; that declaration is the fact now, so the scope cannot drift from the thing being judged again.
   risk_class: [SAFETY, RELIABILITY, ELECTRICAL_FUNCTION]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources: []
   acceptance_criteria: >
     A port table: every external conductor, its working voltage, the threat it is exposed to, the device
     fitted, its standoff and clamping voltage against the protected part's maximum, its capacitance against
     the signal's needs, and the discharge path to the enclosure.
   rationale: "A sealed kit is handled, plugged and unplugged in the field; the connector is where the energy arrives."
   failure_mode: "A discharge at a panel switch or an antenna jack destroys the device behind it."
   verification_method: [MANUAL_REVIEW, SCRIPT]
   verification_phase: SCHEMATIC
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, c, d, e, e5, p]
   interfaces_affected: [ETHERNET, USBC_PD, BLIND_MATE_RF, USB2, SMBUS]
   implementation_location: NONE_YET
   evidence_scope: [schematic_sha256]
   owner: SESSION
   waiver_policy: {allowed: true, authority: OWNER, evidence: "the port's exposure and the device's own rating",
                   scope: "one port", expiry: "prototype validation", residual_risk: "untested until a discharge gun sees it"}
   maturity_at_writing: SOURCE_UNVERIFIED

 - id: ISO-001
   domain: ISOLATION_SPACING
   short_name: creepage and clearance
   requirement: >
     Every conductor pair whose working voltage difference is significant is separated by enough creepage and
     clearance for the working voltage, the transient it can see, the pollution degree the enclosure allows
     and the material group of the laminate.
   false_positive_analysis: >
     A false refusal has four shapes here and each is named, because this rule became ENFORCED by a session
     ruling (decision 34, 21 September 2026) rather than by a source arriving.
     ONE, THE STANDARD ITSELF: it is judged against ECSS-Q-ST-70-12C Table 13-3, a SPACE standard transcribed
     in this tree, because IEC 60664-1, the terrestrial framework this requirement is written in, is paywalled
     and not here. ECSS is the more conservative of the two at these voltages, so a refusal can be stricter
     than a terrestrial functional-insulation reading would be; the verdict says which table and which column
     it used, and if IEC 60664-1 ever enters the tree the rows move and every reading is re-taken.
     TWO, THE COATED COLUMN AT A MASKED POINT: the column follows the board's conformal_coated declaration and
     ASSEMBLY.md section 5 masks the connector faces, the RF bodies, the module and M.2 receptacles, the
     spring-pin and pack targets and the bench test points. A pair measured at one of those is bare copper
     judged on the coated row, which is a wrong ACCEPT rather than a wrong refusal; what stops it is that the
     verdict names its tightest pairs with their positions so the reading can be checked against that list.
     THREE, THE WORKING VOLTAGE: the row is chosen from the rail's declared v_work, so a rail that declares a
     transient peak as its working voltage is judged one band too strictly. intent.rail() carries v_work and
     v_max separately for exactly that reason and this reads the working value.
     FOUR, TWO CONDUCTORS OF ONE CIRCUIT: the measurement is taken between a high-voltage net and any other
     net, so a shunt's two pads or a sense tap beside the rail it senses are measured as an insulation pair
     where no isolation is required between them. The evidence carries both net names for that reason; on the
     three boards judged on 21 September not one of the tightest rows is such a pair.
   classification: REGULATORY
   applicability: CONDITIONAL
   condition: {fact: max_rail_voltage_v, op: ge, value: 30}
   risk_class: [SAFETY]
   release_effect: BLOCKER
   source_status: SOURCE_UNVERIFIED
   sources:
    - {title: "IEC 60664-1 insulation coordination for equipment within low-voltage systems", issuer: IEC,
       revision: "unknown to this tree", clause: "creepage and clearance tables",
       url_or_path: "NOT IN THIS TREE", accessed: "",
       note: "the terrestrial framework this rule's acceptance criteria is written in (pollution degree,
         material group). It is paywalled and not in this tree, and the pollution degree is owner decision 34"}
    - {title: "ECSS-Q-ST-70-12C, Design rules for printed circuit boards, clause 13.8.2 and Table 13-3,
         minimum insulation distance as a function of voltage",
       issuer: "ECSS Secretariat, ESA-ESTEC Requirements and Standards Division", revision: "C, 14 July 2014",
       clause: "13.8.2, Table 13-3", url_or_path: "v2/vendor/standards/ecss-q-st-70-12c-2014-07-14.md",
       accessed: "2026-09-16",
       note: "A published, free table for a question this project could not answer at all, and the CONSERVATIVE
         envelope rather than the requirement: it is written for space hardware and its own Note 2 says it
         covers ANY elevation. MEASURED against it on 16 September 2026: board B's +54V_POE is 0.900 mm from
         another net's conductor against the table's 0.500 mm floor and passes with 80 percent to spare; board
         A's 20 V VBUS20 runs 0.129 mm from FE_FB on an outer layer against the table's 0.300 mm, short by a
         factor of 2.3. Whether that is a defect depends on which standard governs a sealed terrestrial kit,
         which is decision 34, and a terrestrial functional-insulation reading of 20 V asks for a small
         fraction of 300 um. Nothing is gated on this table"}
   acceptance_criteria: >
     For every net pair above the declared threshold: the working voltage, the required creepage and clearance
     for the declared pollution degree and material group, and the measured minimum spacing on the board,
     including under parts and across the assembly, with the standard edition cited.
   rationale: >
     The kit carries 54 V PoE on two boards and a 14.4 V pack on four, in an enclosure that is carried
     outdoors. Nothing in this tree has ever measured a creepage distance.
   failure_mode: "Tracking or flashover in humidity, at a connector or under a part."
   verification_method: [SCRIPT, MANUAL_REVIEW]
   verification_phase: ROUTED_BOARD
   automation_feasibility: PARTIALLY_AUTOMATABLE
   boards_affected: [a, b, e]
   interfaces_affected: [POE]
   implementation_location: NONE_YET
   evidence_scope: [board_sha256, stage, envelope_version]
   owner: OWNER
   waiver_policy: {allowed: false, authority: OWNER, evidence: "", scope: "", expiry: "", residual_risk: ""}
   maturity_at_writing: SOURCE_UNVERIFIED

