# The product facts a rule's applicability is resolved against (MESHSAT-862, Phase A, 16 September 2026).
#
# DATA ABOUT THE PRODUCT, never about the gates. Read from the schematic and placement generators, the board
# declarations and the stackup table on 16 September 2026; every entry is traceable to a file, and where the
# tree contradicts itself the contradiction is recorded here rather than resolved silently, because a rule
# that is applicable "depending on which file you read" is the shape this whole exercise exists to remove.
#
# Sources read for this file (Phase A source set):
#   v2/ecad/tools/gen_sch_{a,b,c,d,e,p}.py, gen_pcb_{a,b,c,d,e,p}.py, gen_pcb_{a,b,c,d,e,p}3.py, gen_pcb_e5.py
#   v2/ecad/tools/boards/*.json, stackup_write.py, intent.py, make_handoff.py, jlc-handfit.txt, panel1450.py
#   v2/docs/V2-SPEC.md, OWNER-DECISIONS-2026-09-11.md, LAYER-DECISIONS-2026-09-11.md
#
# `interfaces` uses these names and no others, so a condition can be written against them:
#   PCIE USB2 USB3 USBC_PD HDMI EPAPER ETHERNET POE SMBUS I2C SPI UART CAN AUDIO_ANALOG RF_TX RF_RX GNSS
#   M2_SOCKET SIM IDC_RIBBON BLIND_MATE_RF SOLDER_LANDS

