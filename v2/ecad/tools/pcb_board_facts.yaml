# Product-level facts, for rules whose applicability is about the kit rather than one board.
_product:
  enclosure: Peli 1450 with a 3 mm aluminium face plate, sealed, no vent opening anywhere
  ingress_claim: IP67-class construction, untested; never labelled IP68
  operating_modes: [lid open full power, lid closed reduced, blackout, NVG, EMCON]
  environment: field portable, unconditioned, vehicle transport; no temperature range ruled yet
  energy_chain: "cells (P) -> XT60 -> E (F3 25 A) -> 12 AWG -> e5 (four 9 A targets) -> A (F1 25 A) -> everything"
  galvanic_barriers: 1          # B's H5007NL on the wall Ethernet port
  above_48v: [a, b]             # +54V_POE only
  transmitters: [b, d]
  prototype_built: false        # nothing has been fabricated or powered
