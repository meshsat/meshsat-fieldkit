      protection: "VIN_RAW has a one-way clamp at each end: A D2 SMCJ40A in the netlist (gen_sch_a.py:691; the committed A32 board
        carries SMCJ33A, A04-D2); E's clamps corrected at faf8c981 (D10 SMCJ40CA at the entry, D1 SMCJ40A behind the ideal diode)"
      hot_plug: "INFERRED hazard: the stack lifts off live spring contacts whenever the pack or shore is connected, and the E5
        targets are exposed live while the stack is out. Owner ruling D-14: the procedure (kit off, the vehicle, shore and
        solar leads out, the pack's XT60 unplugged) plus an insulating cap over E5 while the stack is out (ASSEMBLY.md
        section 7; the cap is not yet drawn or sourced); lifting live is an accepted, recorded residual risk; a hardware
        stack-present interlock is studied at Review D."
      ground_return: "W3DE-DOCK-R1 (27 September 2026): the ground current from A to E shares every ground contact of the
        dock, the Mill-Max return pins behind their pours and 12 AWG wires and the 813 ground contacts behind their 24 AWG
        wires, in the ratio of the two groups' resistances, which the makers bound only from above. As drawn before EQ-16
        (4 CN and 4 x 813 GND), with every Mill-Max pin at its 20 mOhm maximum, an 813 ground contact carries 3.06 A at
        24.1 A of ground current (this rail's 14.10 A with the pack's 10.0 A) and 4.08 A at 32.1 A (with the pack's 18.0
        A peak), 88 and 117 percent of 3.5 A. With EQ-16 (4 CN, 4 VN, 8 x 813 GND) the same case is 1.57 and 2.09 A,
        and 2.24 A with one 813 open (64 percent); the coincidence of both currents at their maxima is the conservative
        bound, not an operating point (INFERRED arithmetic, v2/docs/records/w3de/dock_contacts.py). The residual: at the +55 C
        qualification margin with that 32.1 A peak and the Mill-Max pins at their maximum, an 813 ground contact reaches
        86 to 90 C under the assumed 60 K rise at 3.5 A (the maker publishes none), over its 85 C; with a 2:1 resistance
        spread among the eight 813 ground contacts (the independent check of w3de) the lowest carries 2.44 A, 2.58 A with
        one open, which reads 80.3 and 83.6 C at the 51 C inside air and 94 to 98 C at the +55 C margin; a bench measurement
        of the dock's contact resistances and of an 813 ground contact's temperature at the declared currents is owed
        to TEST-PLAN.md"
      levels: "VIN_RAW and the pack pins as vin_raw and pack_pins state; the signal contacts at board A's +3V3 logic (SHORE_INHIBIT,
        HOT-R1) and the USB_E6 pair at USB full speed; pin 1 VSYS_DOCK 9.688 to 17.375 V under (B1) (pin1_vsys_dock, DRAFTED)"
      current: "VIN_RAW 14.10 A declared on four 9 A pins (vin_raw: in service at most 5.983 A, the fault at most 11.65 A); the pack
        pins 10.0 A continuous and 18.0 A peak on four 9 A pins, the charge at most 3.0 A (pack_pins); pin 1 at most 1.802 A behind
        U42 under (B1) (pin1_vsys_dock); the 813 signal contacts at logic currents; the ground return shared as ground_return states"
      harness: "none: a blind-mate dock; board A's spring pins land on the E5 block's plated targets, and the block's lands carry 24
        AWG (J_BLK) and 12 AWG (P_CP, P_CN, P_VR, P_VN) leads to board E (ASSEMBLY.md section 4)"
      mating: "blind-mate on the E5 block's targets at the stack's seating (ASSEMBLY.md section 1); the D-14 procedure for every
