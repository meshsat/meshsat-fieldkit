# WHAT EACH INTERFACE ON THESE BOARDS REQUIRES, FROM THE PART THAT DEFINES IT (rule INT-001, MESHSAT-862,
# 16 September 2026).
#
# The rule asks that every interface be designed to ITS OWN specification rather than to a house number. Until
# today one interface had a source in this tree: the Compute Module 5's PCIe clauses, read on 16 September. Its
# datasheet turns out to state the requirement for every high-speed interface this design carries, and the
# 5G module's hardware design does the same for the M.2 socket's own side, so the numbers below are the
# HOSTS' and the MODULES' own, each with the document and the section it was read from.
#
# WHAT A NUMBER HERE IS. It is the requirement the part states, not a target this project chose. Where two
# parts at the two ends of one link state different numbers, both are listed and the rule checks that the
# board satisfies both, which is a real question: the CM5 asks 90 ohm of PCIe and the RM520N-GL asks
# 85 ohm plus or minus 10 percent, and 90 is inside 76.5 to 93.5, so one class satisfies both ends.
schema_version: 1
generated: "2026-09-16"

interfaces:
  PCIE_CM5:
    what: "PCIe Gen 2 between a Compute Module 5 and the PCIe switch on board B"
    impedance_ohm: 90
    impedance_tol_percent: 10
    intra_pair_mm: 0.10
    inter_pair_mm: null            # the datasheet says length matching between pairs is unnecessary
    max_length_mm: null
    sources:
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "2.3 PCIe, routing guidance",
         quote: "PCIe differential signals should be routed as 90 Ohm differential pairs with proper clearances.
           Length matching between pairs is unnecessary, but the signals within a pair must be length-matched,
           ideally within 0.1 mm",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16"}

  PCIE_M2_MODULE:
    what: "PCIe from the switch to the M.2 B-key socket, where the RM520N-GL 5G module sits"
    impedance_ohm: 85
    impedance_tol_percent: 10
    intra_pair_mm: 0.70
    inter_pair_mm: null
    max_length_mm: 200
    sources:
      - {title: "Quectel RM520N-GL hardware design", clause: "PCIe interface design principles",
         quote: "Keep the maximum trace length less than 200 mm. Keep the intra-pair length matching of each
           differential data pair (P/M) less than 0.7 mm. Keep the differential impedance of PCIe data trace
           as 85 Ohm plus or minus 10 percent",
         url_or_path: "v2/vendor/quectel/quectel-rm520n-gl-hardware-design-v1.0.pdf", accessed: "2026-09-16"}

  USB2_CM5:
    what: "USB 2.0 high speed, 480 Mb/s, on the Compute Module 5"
    impedance_ohm: 90
    impedance_tol_percent: 10
    # 0.15 mm, NOT 0.10: the USB 2.0 clause of this datasheet gives no number at all, and the entry carried
    # 0.10 from the USB 3.0 clause beside it while quoting the clause that says nothing (17 September 2026).
    # What applies where an interface clause is silent is the datasheet's own general recommendation, 4.2.2,
    # and it says 0.15 mm. Both are "recommend" and "ideally": guidance from the host, not conformance.
    intra_pair_mm: 0.15
    inter_pair_mm: null
    max_length_mm: null
    sources:
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "2.4 USB interfaces",
         quote: "Both USB 3.0 and USB 2.0 require 90 Ohm differential impedance, with length matching within
           each pair",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16"}
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "4.2.2 Differential pairs",
         quote: "We recommend that positive and negative (P/N) signals within a differential pair are
           length-matched to within 0.15 mm",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-17"}
      - {title: "USB 2.0 Specification, the scale this interface tolerates", clause: "7.1.3 Cable Skew",
         quote: "The maximum skew introduced by the cable between the differential signaling pair (i.e., D+
           and D- (TSKEW)) must be less than 100 ps",
         url_or_path: "v2/vendor/standards/usb-2-0-specification-2024-09-27.md", accessed: "2026-09-17"}

  USB3_CM5:
    what: "USB 3.0 SuperSpeed, 5 Gb/s, on the Compute Module 5"
    impedance_ohm: 90
    impedance_tol_percent: 10
    intra_pair_mm: 0.10
    inter_pair_mm: null
    max_length_mm: null
    sources:
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "2.4.1 USB 3.0 (SuperSpeed)",
         quote: "The USB differential pairs should be routed with 90 Ohm differential impedance. Length
           matching between separate pairs is unnecessary, but the P and N signals within each differential
           pair must be length-matched, ideally within 0.1 mm",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16"}

  USB_M2_MODULE:
    what: "USB 2.0 and USB 3.1 at the M.2 B-key socket, the 5G module's own side"
    impedance_ohm: 90
    impedance_tol_percent: 10
    intra_pair_mm: 0.70            # USB 3.1; the module allows 2 mm on USB 2.0, so 0.7 is the binding one
    inter_pair_mm: 10.0
    max_length_mm: 225
    sources:
      - {title: "Quectel RM520N-GL hardware design", clause: "USB interface design principles",
         quote: "The impedance of differential trace of USB 2.0 and USB 3.1 are 90 Ohm. For USB 2.0 signal
           traces, the trace length should be less than 225 mm and the intra-pair length matching (P/M) should
           be less than 2 mm. For USB 3.1, the intra-pair length matching (P/M) should be less than 0.7 mm,
           while the inter-pair length matching (Tx/Rx) should be less than 10 mm",
         url_or_path: "v2/vendor/quectel/quectel-rm520n-gl-hardware-design-v1.0.pdf", accessed: "2026-09-16"}

  ETHERNET_CM5:
    what: "Gigabit Ethernet between a Compute Module 5 and the switch chip on board B"
    impedance_ohm: 100
    impedance_tol_percent: 10
    intra_pair_mm: 0.15
    inter_pair_mm: 50.0
    max_length_mm: null
    sources:
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "2.2 Ethernet, routing guidance",
         quote: "Route the differential Ethernet signals as 100 Ohm differential pairs with appropriate spacing
           and clearances. Length matching between different pairs is generally not required if differences
           are less than 50 mm. However, the signals within each pair need to be length matched for optimal
           signal integrity, ideally within 0.15 mm",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16"}

  HDMI_CM5:
    what: "HDMI 2.0 out of a Compute Module 5, through the display switch, to the face plate"
    impedance_ohm: 100
    impedance_tol_percent: 10
    intra_pair_mm: 0.15
    inter_pair_mm: 25.0
    max_length_mm: null
    sources:
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "2.5.1 Dual HDMI 2.0",
         quote: "HDMI signals must be routed as 100 Ohm differential pairs. Within a pair, each signal should
           be length-matched within 0.15 mm. Between pairs, length matching within 25 mm is sufficient",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16"}

  MIPI_CM5:
    what: "MIPI CSI and DSI on the Compute Module 5"
    impedance_ohm: 100
    impedance_tol_percent: 10
    intra_pair_mm: 0.15
    inter_pair_mm: null
    max_length_mm: null
    sources:
      - {title: "Raspberry Pi Compute Module 5 datasheet", clause: "2.5.2 MIPI (CSI and DSI)",
         quote: "The MIPI signals must be routed as 100 Ohm differential pairs. Within a pair, the signals
           should be length-matched within 0.15 mm",
         url_or_path: "v2/vendor/cm5/cm5-datasheet.pdf", accessed: "2026-09-16"}

  USB_FULL_SPEED:
    what: "USB 1.1 and 2.0 FULL speed, 12 Mb/s, between parts on one board"
    impedance_ohm: null            # no target: see the note
    impedance_tol_percent: null
    intra_pair_mm: null
    inter_pair_mm: null
    max_length_mm: null
    note: "Boards C and D carry USB only at full speed and declare their USB class with NO impedance target,
      which is the 16 September reading of the parts' own datasheets (a TUSB2046B full-speed hub, a PCM2912A
      full-speed codec, CP2102N bridges). At 12 Mb/s with the specification's own 4 to 20 ns edges a 30 mm pair
      is electrically short, so a 90 ohm target is a wrong requirement rather than a strict one. It is listed
      here so that a board declaring no target is a DECLARED zero with a reason rather than a silence."
    sources:
      - {title: "TI TUSB2046B datasheet", clause: "features, first page",
         quote: "Full-Speed Hub. All Downstream Ports Support Full-Speed and Low-Speed Operations",
         url_or_path: "v2/vendor/ti/ti-tusb2046b.pdf", accessed: "2026-09-16"}
      - {title: "TI PCM2912A datasheet", clause: "features",
         quote: "apply USB revision 2.0, full-speed",
         url_or_path: "v2/vendor/ti/ti-pcm2912a.pdf", accessed: "2026-09-16"}

  SMBUS_GAUGE:
    what: "the pack gauge's SMBus, board P's only bus and the one conductor pair that leaves its board"
    impedance_ohm: null            # a 100 kHz two-wire bus has no transmission-line requirement
    impedance_tol_percent: null
    intra_pair_mm: null
    inter_pair_mm: null
    max_length_mm: null
    sources:
      - {title: "TI BQ4050 datasheet", clause: "SMBus timing, fSMB",
         quote: "SMBus operating frequency SLAVE mode, SMBC 50% duty cycle: 100 kHz",
         url_or_path: "v2/vendor/battery/ti-bq4050.pdf", accessed: "2026-09-17"}

# Which nets on which board belong to which interface, by the net-name patterns the placement generators
# already use for their classes. A pattern that matches nothing on its board is reported, never silent.
boards:
  b:
    name: pcb-b-compute
    assignments:
      - {interface: PCIE_CM5, patterns: ["PCIE*"], class: USB}
      - {interface: PCIE_M2_MODULE, patterns: ["CARD*_RX_*", "CARD*_TX_*", "CARD*_CLK_*"], class: USB}
      - {interface: PCIE_M2_MODULE, patterns: ["NVME*_RX_*", "NVME*_TX_*", "NVME*_CLK_*"], class: USB}
      - {interface: USB3_CM5, patterns: ["HOST*", "BANK*", "MUX*", "LIME_SS*"], class: USB}
      - {interface: USB2_CM5, patterns: ["USB*", "HUB*", "LIME_D*", "CAM_D*", "QMX_D*"], class: USB}
      - {interface: ETHERNET_CM5, patterns: ["ETH*", "SWP*"], class: DIFF100}
      - {interface: HDMI_CM5, patterns: ["HDMI*_D*", "HDMI*_CK_*"], class: DIFF100}
  c:
    name: pcb-c-display
    assignments:
      - {interface: USB_FULL_SPEED, patterns: ["USB*"], class: USB}
  d:
    name: pcb-d-aprs
    assignments:
      - {interface: USB_FULL_SPEED, patterns: ["USB*", "HUB*"], class: USB}
  a:
    name: pcb-a-power
    assignments:
      - {interface: USB2_CM5, patterns: ["USB_D8*", "USB_E6*", "USB_WALL*"], class: USB}
  e:
    name: pcb-e1-dock
    assignments:
      - {interface: USB_FULL_SPEED, patterns: ["USB*"], class: USB}
  p:
    name: pcb-p-pack
    assignments:
      - {interface: SMBUS_GAUGE, patterns: ["SMB*"], class: Default}
  e5:
    name: pcb-e5-block
    assignments: []
    no_interface_targets_why: "The dock block carries no interface of its own. Its every net is board A's, read
      off A's board file by position under each spring pin, and what it holds is twelve plated contact targets,
      four pack targets, a pre-charge target and the wire lands beneath them. The interfaces those conductors
      belong to are declared on the boards at their ends, and what this board owes them is contact and current,
      which MEC-001 and PI-001 judge."

# ======================================================================================================================
# BOARD-TO-BOARD CONTRACTS (MESHSAT-1357). First integrated 26 September 2026 at 82dd1e4d from workstream W3's round-2
# draft with the adjudications A01, A03, A04, A07, A08, A09 and A11 applied; RE-READ AGAINST THE CORRECTED NETLISTS the
# same evening at main eadbe571 (faf8c981 boards C, D, E and P; 458b2873 boards A, B and D; d90f30e4 board P).
#
# WHAT THIS SECTION IS. The connector contract between two boards (or a board and a device it cables to): both ends,
# the pin map, the state of every control line when the cable is out, the power it carries, whether it may be mated
# live, and which tool judges which part of it. It is the "interfaces owned on both mating ends" record of Review C
# (v2/docs/EXECUTION-PLAN.md) and the data behind v2/docs/ARCHITECTURE.md section 12.
#
# WHO READS IT. NOTHING YET, deliberately. interfaces.py (rule INT-001) reads only `interfaces` and `boards` above, and
# so do its fixtures (tests/test_interfaces.py) and review_packet.py's interfaces_for(): a new top-level key is ignored
# by all three. check_contracts.py holds the map-identity checks it names in `judged_by`, as code; moving those checks
# onto this data is a later tool change with its own fixtures. So a line here is a CONTRACT, not a verdict. (This file
# is a declared configuration input of interfaces.py in rules_status.CONFIG_INPUTS, so an edit here dates every
# interfaces.py reading; those readings are already AWAITING_REVALIDATION for TOOL_CHANGED, which rules_status decides
# first.)
#
# EVIDENCE WORDS. VERIFIED = read in the generator line or document cited, at eadbe571; RECORDED = a box result written
# into a commit, not re-run here; INFERRED = reasoned from verified facts, not measured; TBD = no source in this tree,
# effect stated. Prototype design: nothing here has been built, mated or powered. The generator lines are the corrected
# design; the committed board files (A32, B21, C24, D12, E17, P4) predate it and carry the older netlists. Finding IDs
# are defined in v2/docs/ARCHITECTURE.md sections 13 and 14; a contract that lists one is NOT met by the design until it
# closes. Pin maps are given from the FIRST end named; `aliases` lists nets that are one conductor under two names.
board_to_board:
  schema: 1
  read_at: {commit: eadbe571, date: "2026-09-26", phases: {a: A32, b: B21, c: C24, d: D12, e: E17, e5: E5, p: P4},
            netlists_sha256_16: {a: 2e8923d6853ee4e1, b: 6048ee56c48a028b, c: 2834f0d8c4071d56, d: f13d8b70099ab03e,
                                 e: d910e49c5f5f50b2, p: 4342c4cbe1b43dc4},
            note: "generator and netlist lines are read at eadbe571; the phases are the committed LAYOUTS, which predate
              these netlists (SCH-002 reads FAIL on A and B and INCONCLUSIVE on C, D, E and P, v2/docs/CURRENT-EVIDENCE.md).
              check_contracts.py read PASS 91 of 91 across the corrected set in the integration tree of 458b2873
              (RECORDED). The committed INT-001 readings on main are PASS on all seven boards (interfaces_<letter>, and
              check_contracts at PASS 73 of 73 in every board's committed evidence of 21 September 2026);
              CURRENT-EVIDENCE.md classes each AWAITING_REVALIDATION (TOOL_CHANGED) until check_contracts.py and
              interfaces.py record by sha the netlists they read"}
  rulings: "the owner's D-01 to D-17 of 25 and 26 September 2026, D-08a and the reversal of D-08 (v2/docs/CONOPS.md
    section 7, appendix 32.367) apply to these contracts where named; which of their engineering is in a generator is
    v2/docs/ARCHITECTURE.md section 1.3"
  power_up_reference: "v2/docs/ARCHITECTURE.md section 4.3 (the power-up sequence as generated at eadbe571)"
  contracts:

    IF-BC-PANEL:
      title: "panel ribbon, board B J_PANEL to board C J_PANEL"
      kind: board_to_board
      ends:
        - {board: b, ref: J_PANEL, part: "IDC 2x13 2.54 mm box header", src: "v2/ecad/tools/gen_sch_b.py:1061-1063"}
        - {board: c, ref: J_PANEL, part: "IDC 2x13 SMD box header, underside", src: "v2/ecad/tools/gen_sch_c.py:99-101"}
      cable: {what: "26-way 1.27 mm flat ribbon, IDC both ends, 350 mm", src: "v2/docs/ASSEMBLY.md section 4, panel ribbon row",
              rating: "TBD: no ribbon or IDC contact datasheet is held; effect: the PANEL_5V fault-current check below cannot close"}
      aliases: [["PANEL_5V", "+5V"]]
      map_identity: {status: VERIFIED, judged_by: "check_contracts.py:196-207"}
      pins: {1: PANEL_5V, 2: PANEL_5V, 3: GND, 4: SDA, 5: SCL, 6: EXP_INT, 7: TR_APRS, 8: EMCON_HW, 9: GND,
             10: ZEROIZE_HW, 11: TX_INHIBIT_n, 12: HDMI_SEL1, 13: HDMI_SEL2, 14: GND, 15: USB_PNL_P, 16: USB_PNL_N, 17: GND,
             18: HB1, 19: HB2, 20: HB3, 21: SLOT_EN1, 22: SLOT_EN2, 23: SLOT_EN3, 24: PI_SHDN_REQ, 25: PI_KILL,
             26: SHORE_INHIBIT}
      power: {rail: PANEL_5V, from: "+5V_DEV through B's F1, 2.0 A hold polyfuse", declared_a: 0.60,
              src: "gen_sch_b.py:1053-1060", note: "the panel's only supply; +5V_DEV starts by design since 458b2873 (R42 on A)",
              protection: "NOT COORDINATED on board B (B_PANEL_5V, ARCHITECTURE.md sections 4.5 and 13.2): F1 holds 2.0 A and
                trips at 3.5 A, and B21's 0.4 mm PWR-class PANEL_5V track is rated 1.23 A at 10 K, so the copper is the weaker
                element. Rule PWR-003 reads FAIL on board B (energy_chain_b; pcb_energy_chain.yaml stage B_PANEL_5V and its
                known finding, :217-245, :306-313), and a re-run on the corrected netlists repeats it (F1 is unchanged,
                gen_sch_b.py:1053). Closes on B's next placement and route with the 0.8 mm PANEL class of gen_pcb_b3.py:563-567
                (2.03 A at 10 K), or with an MF-MSMF110 (1.1 A hold, 2.2 A trip) in F1's place"}
      bus: "the kit I2C bus: C's RP2040 (GPIO0/1) is its ONLY master; pull-ups 2.2k on B (R54, R55, gen_sch_b.py:1044) and
        on C; every target and its address, read from the netlists' straps: v2/docs/ARCHITECTURE.md section 5.5. The three
        supervisors are I2C targets on I2C1 since 458b2873, and the TPS23861 (B U5, A3 unconnected) answers the broadcast
        address 0x30: the supervisors take 0x34 to 0x36 (I3-F01, the session's choice, firmware only)"
      cable_out_states:   # VERIFIED from the pulls cited; what each far board sees with the ribbon out
        EMCON_HW: "LOW, EMCON asserted (A R102 100k, B R58 10k to GND; gen_sch_a.py:1112, gen_sch_b.py:1024); the hold with
          the source gone is UNDECIDED as drawn (feasibility/EMCON.md L2: remedy R102 10k 1% and R58 4.7k 1% with single gates)"
        TX_INHIBIT_n: "LOW, transmit inhibited (A R145, B R59, D R2, 100k to GND)"
        ZEROIZE_HW: "HIGH, no wipe (A R117 10k to A's +3V3, gen_sch_a.py:1150); nothing acts on this line since faf8c981: C
          reads its own ZEROIZE_SW and U12 drives a buffered copy here (gen_sch_c.py:168-178)"
        SLOT_EN1..3: "LOW, every compute slot OFF (A R30, R34, R38, 100k to GND; gen_sch_a.py:840-841, :879)"
        SHORE_INHIBIT: "LOW, shore and vehicle inputs allowed (A R118, E R26)"
        PI_KILL: "LOW, no kill (A R5 1k, gen_sch_a.py:263; three back-driving slots stay under Q1's threshold, INFERRED)"
        PI_SHDN_REQ: "HIGH, no request (A R3 10k to A's +3V3, gen_sch_a.py:261; open-drain drivers only, by contract FW-A10)"
        HDMI_SEL1..2: "LOW nominally (B R15, R16 100k, gen_sch_b.py:903); not a guaranteed low at the switch's input current
          (feasibility/FAILOVER-FABRIC.md FAB-04: remedy 10k)"
        HB1..3: "HIGH on B (10k to +3V3_DEV per slot, FAILOVER-FABRIC.md section 4.9): a dark module reads as a held-high
          line, so liveness is the 1 Hz toggle; no pull on C"
      zeroize_semantics: "owner ruling D-03 (decision 30): a crypto-erase through the secure element; the ONLY wipe trigger is
        the covered toggle held 5 s, read on the local net ZEROIZE_SW by the panel controller's GPIO22 (gen_sch_c.py:217,
        :126-127); LEVEL-SENSITIVE after power loss (read at boot before any slot powers). ZEROIZE_HW on this ribbon is a
        buffered copy for test points; no board acts on it. Design: v2/docs/feasibility/ZEROIZE.md (blocker FB-ZER-1)"
      slot_power_semantics: "the panel is the only path to slot power, by D-03's boot order; SLOT_EN powers up OFF. OWED
        (the session's choice, ARCHITECTURE.md section 4.3): SLOT_EN holds its state across a panel reset (for example a
        latch the panel sets and clears), so a panel reset or update no longer drops the running slots; in no generator"
      emcon_semantics: "owner ruling D-05: radios dark. Since 458b2873 EMCON_HW gates the three CM5 radios through open drains
        and removes the two WiFi cards' supplies (via Q11 and EMCON_ON on B). The per-transmitter table and what is open
        (L1 to L4, L7, SD-EMC-1 for the 5G module, SD-EMC-2 back-feed) is v2/docs/feasibility/EMCON.md (blocker FB-EMC)"
      hot_plug: "not hot-pluggable (proposed): mate and unmate with the kit off; PANEL.md section 7 already forbids
        switching the panel's 3.3 V with the ribbon attached"
      back_power: "INFERRED risk: EXP_INT (A R110, B R56) and PI_SHDN_REQ (A R3) are pulled to rails that can be up while C
        is unpowered; up to about 0.33 mA per line into an unpowered RP2040 pad (IOVDD + 0.5 V allowed, RP2040 Table 622).
        ZEROIZE_HW no longer back-feeds C: U12's Ioff disables its output with C unpowered (faf8c981)"
      not_judged: ["pull state of SLOT_EN, ZEROIZE_HW and SHORE_INHIBIT", "back-power", "PANEL_5V conductor current in the cable",
                   "which radios EMCON_HW actually reaches (RF-002 judges the line, not every transmitter)"]
      findings: [W5-F4, I3-F01, FAB-04, EMCON-L1, EMCON-L2, B_PANEL_5V]
      serves: [NEED-03, NEED-04, NEED-08, NEED-10, NEED-19]

    IF-AB-RIBBON:
      title: "A to B control ribbon, A J_AB1 (top) to B J_AB1 (underside), same case XY"
      kind: board_to_board
      ends:
        - {board: a, ref: J_AB1, part: "IDC 2x13, top side", src: "v2/ecad/tools/gen_sch_a.py:1143-1145"}
        - {board: b, ref: J_AB1, part: "IDC 2x13, underside", src: "v2/ecad/tools/gen_sch_b.py:1077-1079"}
      cable: {what: "26-way 1.27 mm flat ribbon, 80 mm, folded once", src: "v2/docs/ASSEMBLY.md section 4, A to B ribbon row"}
      map_identity: {status: VERIFIED, judged_by: "check_contracts.py:267-269"}
      pins: {1: USB_D8_P, 2: USB_D8_N, 3: GND, 4: GND, 5: GND, 6: GND, 7: GND, 8: GND, 9: PI_SHDN_REQ, 10: PI_KILL,
             11: SDA, 12: SCL, 13: EXP_INT, 14: TR_APRS, 15: EMCON_HW, 16: TX_INHIBIT_n, 17: SLOT_EN1, 18: SLOT_EN2,
             19: SLOT_EN3, 20: ZEROIZE_HW, 21: SHORE_INHIBIT, 22: GND, 23: GND, 24: GND, 25: USB_E6_P, 26: USB_E6_N}
      usb: "USB_D8 is B bank 3 hub port 1 to board D's TUSB2046I (full speed); USB_E6 is B bank 3 hub port 2 to board E's
        RP2040 through A and the dock (gen_sch_b.py:764-766); each pair on an END row"
      cable_out_states: "as IF-BC-PANEL for every control line: the pulls sit on board A (VERIFIED). TR_APRS also feeds A's
        outlet interlock (U30); R116 holds it low with the ribbon out, so the outlets are not dropped"
      hot_plug: "not hot-pluggable (proposed): no power crosses it, but a partly seated ribbon can assert PI_KILL or drop SLOT_EN"
      findings: [W5-F4, EMCON-L2]
      serves: [NEED-03, NEED-08]

    IF-AB-WALL:
      title: "A to B wall-port ribbon, A J_AB2 to B J_AB2, then A's lead to the sealed Glenair 233-370"
      kind: board_to_board
