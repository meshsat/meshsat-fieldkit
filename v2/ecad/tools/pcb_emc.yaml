# SOURCE, PATH, VICTIM (rule EMC-001, MESHSAT-862, 16 September 2026).
#
# The rule asks for an EMC sheet per board: the switching sources with their frequencies and edge rates, the
# sensitive victims, the coupling paths considered and the measure taken at each, and a pre-compliance
# measurement plan for what cannot be decided on paper. It read "no verification" on six boards.
#
# WHAT IS HERE AND WHAT IS NOT. Every frequency below comes from the part's own datasheet or from the timing
# resistor this project's generator sets, and `emc_sheet.py` refuses a source whose basis file is not in the
# tree. EDGE RATES ARE MOSTLY NOT PUBLISHED for these converters, and no number is invented for them: where a
# datasheet gives none the entry says so, and the measure recorded against that source is the one that does not
# depend on knowing it, which is the loop area of the switch node and its return. The spectrum of a 500 kHz
# converter with an unknown edge is bounded below by its harmonics and not bounded above by anything on paper,
# which is exactly why the pre-compliance plan at the end of each board is not optional.
#
# NOTHING HERE IS A MEASUREMENT. No board has been built and no scan has been run. This is the paper half of
# EMC-001, and the plan names the other half.

