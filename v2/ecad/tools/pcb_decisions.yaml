  - n: 47
    title: >-
      board A's ten Kelvin current-sense taps are enumerated as differential PAIRS and held to the 1
      mm length rule, and every board A finish is refused because the two legs of a Kelvin tap
      cannot be the same length
    asked: 2026-09-21
    status: ruled
    authority: SESSION
    authority_why: >-
      it changes no line the never-auto floor protects, spends nothing, claims nothing new about the kit and
      accepts no residual risk. It is a criterion question answered by the two boards' own finish logs, and
      PAIR-001's own waiver policy already names SESSION as the authority for a pair's deviation.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      HOLD THE 1 mm LENGTH RULE TO PAIRS WHOSE CLASS DECLARES AN IMPEDANCE TARGET. A _P/_N name is a naming
      convention and not a claim about the copper: a Kelvin tap's two legs run to opposite ends of its shunt
      by construction, so matching their length would mean running the two sense lines together, which is the
      one thing a Kelvin connection must not do. tools/pair_gate.py is the criterion, both board gates ask it,
      and a pair with no target is MEASURED and REPORTED as INFO rather than refused. It FAILS CLOSED: where
      the class table or the intent cannot be read the pair is judged exactly as before, because a declaration
      that cannot be found must never be the reason a rule stops applying.
    reversed_by: >-
      delete the pair_gate.judged call from check_pcb_a.py and check_pcb_b.py and both gates hold every _P/_N
      pair to 1.00 mm again, which is what they did before this commit; the ten taps would then refuse every
      board A finish as they did from 18 to 21 September.
    ask: >-
      hold the 1 mm length rule to pairs whose CLASS declares an impedance target, or keep it on
      every _P/_N pair in the netlist and accept that board A produces no finished board
    recommendation: >-
      HOLD THE RULE TO PAIRS WITH AN IMPEDANCE TARGET. The ruling of 5 September 17:00 was made
      about differential pairs, whose two legs carry one signal and whose mismatch is a propagation-
      delay error, and it is being asked of copper it was not written for. A Kelvin tap's two legs
      run to OPPOSITE ENDS of a shunt by construction, which is what makes it a Kelvin connection at
      all, and what it owes electrically is common-mode rejection at the amplifier and distance from
      switching copper, which ANA-001 and kelvin_check already measure on this board. Keeping the
      rule where it belongs costs nothing that is measured anywhere and unblocks the whole of board
      A's finish; equalising the legs would UNDO the Kelvin connection, which is TI's own layout
      item 7 and the reason the ISNS filters went in on 18 September. The residue is named and stays
      under the rule: USB_D8 at 1.81 mm and USB_WALL at 1.54 mm are real differential pairs over the
      gate on A99's board, and the meander fixes both in one pass each.
    evidence: >-
      MEASURED ON TWO FINISHED BOARDS, each read from its own finish log (21 September 2026). A99's
      finish ends A99 PAIRS NOT MATCHED, not finishing, with PA_ISNS P 64.15 mm against N 5.78
      (mismatch 58.38 mm), PD_ISNS 3.76 and POE_ISNS 12.19, and A98's finish ends the same way, so
      it is not one arm's accident: no board A arm since the ten filtered ISNS nets were declared
      has produced a board its own finish would sign off. meander.py runs three rounds on each and
      reports could not place the last 58.37 mm on PA_ISNS_N and could not place the last 12.19 mm
      on POE_ISNS_P, while the two USB pairs it CAN fix it fixes in one pass each. THE MECHANISM IS
      ONE LINE: check_pcb_a.py line 105 enumerates every pair of the netlist as any net ending _P
      whose _N partner exists, which was written on 8 September for the three USB pairs and now
      sweeps in the ten ISNS taps the filter created on 18 September; pair_match.sh reads exactly
      those lines and refuses at 1.00 mm. WHAT IT COSTS TODAY: the finish is where the closers, the
      quality pass, dc_drop, via_current, the board gate and the deliverable are, so a board that
      cannot pass the pair gate cannot answer RTE-002 or anything behind it, and A98 and A99 are
      readable at all only because routeflow saves the finished round-1 board before the refusal.
      AND THE PHYSICS IS NOT IN DISPUTE: the same record that added these nets says a Kelvin tap
      wants its resistors at opposite ends of the shunt while a pair station wants them side by
      side, which is why the pair pre-router answered 0 of 0 on them and was right.
    blocks: {}
    holds_nothing_today: >-
      board A's committed phase A32 is 0 hard and 0 unrouted and its deliverable predates the ISNS
