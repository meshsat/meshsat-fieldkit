    ask: widen this rule's denominator to include a switching device's GATE DRIVE, or leave it at the switching
      NODE and record that the gate drives are unjudged
    recommendation: 'LEAVE THE RULE AS IT IS FOR THIS REVISION AND RECORD THE NUMBERS. The exclusion is not an
      oversight: switch_list.py excludes a gate by PIN FUNCTION because a gate drives the switching and is not
      the switching copper, which is the right predicate for the question that tool asks, whether a board has
      an undeclared switching NODE. Widening the denominator would fail boards A and E on rows nobody has
      ruled a number for, on placements already cut, and the clearance this rule asks (0.50 mm on board E,
      0.50 on board A) was chosen for a switching node''s dV/dt into a current-sense pair rather than for a
      gate driver''s. What is owed instead is that the rows are measured and reported, which sense_reach.py now
      does on every board, so whoever rules it rules against numbers. If the envelope of decision 34 lands on
      a level that makes the coupling matter, this is the rule that changes and the same tool says what it
      would cost.'
    evidence: 'MEASURED ON BOTH BOARDS THAT DECLARE A SENSITIVE NODE, read-only on their own finished round-1
      boards with each sha printed before and after (21 September 2026, tools/sense_reach.py). BOARD E, E37,
      sha 246563debc363acd: sensitive_nodes reports TRK_CSP at 0.433 mm from TRK_SW1 as the failure, because
      TRK_SW1 is one of the six nets pcb_sensitive.yaml declares for this board; the tightest approaches on
      the board are TRK_CSN at 0.204 mm from TRK_TG2 and TRK_CSP at 0.212 from TRK_BG2, and TRK_TG1, TRK_TG2,
      TRK_BG1 and TRK_BG2 are the LT8705A''s own gate drives, which the declaration does not carry. Of the 23
