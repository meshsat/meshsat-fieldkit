      declared share, so only one option is standing
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      LEAVE THE SPLIT AS DECLARED: board A four points of the codec's six percent and board D two. Both boards
      meet their own share on every run, the cross-board contract adds them up and passes, and the six percent
