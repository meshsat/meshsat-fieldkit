      switch_list.py excludes a gate by PIN FUNCTION because a gate drives the switching node and is not the
      switching copper, which is the right predicate for the question that tool asks. The clearance this rule asks
      was chosen for a switching node's dV/dt into a current-sense pair and not for a gate driver's, so widening
      the denominator would fail boards A and E on placements already cut against a number nobody has set.
