  - n: 34
    title: "the kit has never had a written operating envelope and four rules resolve against nothing"
    asked: 2026-09-16
    status: ruled
    authority: SESSION
    authority_why: >-
      it changes no line the never-auto floor protects, spends nothing and accepts no residual risk a measurement
      here could remove: every bound in the envelope is the operating range a part's own maker publishes, read out
      of a sheet in v2/vendor named beside it, so for each bound only one option is standing. The one number that
      is this project's own, the inside-air rise, is declared an estimate with TEST-PLAN.md E3 named as the
      measurement that replaces it. What is NOT taken here and stays the owner's: ADVERTISING the kit to this
      envelope, which is a claim about the product and belongs with the public copy.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      ADOPT v2/docs/OPERATING-ENVELOPE.md section 4 AS THE DESIGN ENVELOPE, and section 6's first row as the
      transient level. In use -20 to +40 C ambient with its three declared carve-outs (the pack warmed below -10 C
      before charge, the e-paper degraded below -15 C, the reduced mode above +35 C); storage -20 to +45 C for
      three months and -20 to +25 C for a year at the pack's ex-factory charge; non-condensing, with the closed
      case Peli's IP67 and the face designed to an IP67-class construction that is never labelled IP68 and carries
      no rating until the bench procedure of appendix 32.34 has run. Electrostatic discharge is IEC 61000-4-2
      level 4, 8 kV contact and 15 kV air, which is the level decision 31 needs to choose a clamp against and is
      traceable to the USBLC6-2SC6 this design already buys. The electrical fast transient row is recorded as NOT
      A REQUIREMENT of this project, because nothing in this tree is a source for it. AND ISO-001 IS JUDGED
      AGAINST ECSS-Q-ST-70-12C TABLE 13-3, per voltage band, per layer, on the column the board's own coating
      selects: that table is stated for an as-manufactured rigid PCB without an altitude derating and without a
      pollution degree, so the two numbers ISO-001 was said to be waiting for are not needed to judge it. The
      altitude, the vibration and shock severities and the service life stay OPEN for the rules that genuinely
      need them and are not invented here.
    reversed_by: >-
      set status to reopened and the envelope returns to a draft. The ISO-001 half reverses on its own by removing
      conformal_coated from tools/boards/*.json, which puts every board back on the bare column of Table 13-3 and
      the rule back to INCONCLUSIVE; the ESD level reverses by removing section 6's first row from the ruling,
      which re-opens decision 31's choice of clamp
    ask: "the temperature, altitude and transient levels the kit is designed to"
    recommendation: "the draft in v2/docs/OPERATING-ENVELOPE.md, whose two narrowest parts are the battery-bay VOC sensor and the e-paper"
    evidence: "THE DRAFT'S OWN NUMBERS, so the ruling can be read without opening it (17 September 2026). It
      proposes AMBIENT -20 to +40 C in use with three carve-outs, each traceable to a part: below -10 C the pack
      is warmed by its heater mat before charge and discharges to the cells' -10 C surface limit; below -15 C
      the e-paper is outside its range and updates slowly or not at all, which is a degraded display and not a
      dead kit, because it carries identity with the power off; above +35 C the kit runs its reduced mode so the
      inside air stays under the +55 C the battery-bay sensor and the pack need. STORAGE -20 to +45 C for three
      months and -20 to +25 C for a year, at the pack's ex-factory charge, the pack being the only part that
      makes storage narrower than use. The parts that bound it, each with its datasheet in the tree: the
      Pervasive Displays e-paper at -15 to +60, the Sensirion SGP41 in the battery bay at -20 to +55, the cells
      at 0 to +45 charging and -10 to +60 discharging, the Xenarc monitor at -20 to +70. The sharp line is the
      third: a sealed case with three loaded modules puts the pack in air about 16 K over ambient, so charging
      holds off above about +25 C ambient, which the pack thermistor on the charger's JEITA input already does
      in hardware. Four rules resolve against this and nothing else: ENV-001, ISO-001, THM-001 and REL-001.
      ISO-001 HAS ITS NUMBERS NOW, AND THEY MOVED WHEN THE VOLTAGE DID (17 September 2026). spacing.py measures
      every conductor of a high-voltage net against the nearest conductor of any other net, and it was choosing
      those nets by each rail's NOMINAL voltage: board E, whose facts entry declares 36 V because its inlet is
      specified 9 to 36, read no rail at or above 20 and ISO-001 was answered about nothing on it. At the
      working voltage the intent has carried all along, the table reads board A's VIN_RAW 0.129 mm, board A's
      VBUS20 0.130, board B's +54V_POE 0.900 and board E's VIN_RAW 0.128, over 6,739, 32 and 2,860 conductor
      pairs. Against the only published table this tree holds, ECSS-Q-ST-70-12C Table 13-3, the 31 to 500 V row
      asks 0.500 mm on an outer layer with no conformal coating: board B passes with 80 percent to spare and
      boards A and E miss by a factor of about four. That standard covers ANY ELEVATION and is written for
      space hardware, so what it means for a sealed terrestrial kit is exactly this decision. The cost of the
      strict reading is a re-route of two finished boards; the cost of the loose one is a sentence naming which
      terrestrial standard and which pollution degree governs instead.
      AND THE TRANSIENT LEVELS ARE IN THE DRAFT NOW (section 6), because owner decision 31 cannot be ruled
      without one: a clamp is chosen against a level. The electrostatic row is free, being the level the part
      this design already buys is guaranteed to, and the qualification plan gained the test method it had never
      had."
    blocks:
      ENV-001: [a, b, c, d, e, e5, p]
      ISO-001: [a, b, c, d, e, e5, p]
      THM-001: [a, b, c, d, e, p]
  - n: 35
    title: "which published current-rating model this project's copper is judged against"
    asked: 2026-09-16
    status: ruled
    authority: SESSION
    authority_why: >-
      it moves a bar in ONE DIRECTION ONLY, down: the ruled model never reads higher than any published fit,
      so no conductor that failed can pass and nothing this project has measured becomes better by it. It
      spends nothing, orders nothing, changes no committed board and is reversible in one function. It touches
      no line the never-auto floor protects: that floor covers the fab rules and board minimums and the net
      class widths, and this is the published current-rating model the judge and the sizer read, which is on
      no list. And the alternative to ruling it is worse than the ruling: until today THREE files carried the
      IPC-2221A constants typed into them, so the question had three answers in one tree.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      TAKE THE MOST CONSERVATIVE OF THE THREE ECSS-Q-ST-70-12C ANNEX D FITS AT EACH AREA, in ONE place:
      `track_current.conservative(area, dT)` returns the lowest current any published model allows that
      cross-section and names the model, and `dc_drop.ipc_limit`, `power_copper.width_for` and
      `via_current.ampacity` all ask it. The external factor of 2.0 is NOT what this decision ruled and is not
      touched: it is IPC-2221's own two curves (its figure 6-4 publishes the external chart and derates an
      internal conductor to about half of it), and the fits above are all of the INTERNAL curve. WHAT IT
      CHANGES, MEASURED BEFORE IT WAS RULED: nothing that is measured today. On the committed A32
      (58e26c67987b1daa, read-only where KiCad is, sha identical before and after) dc_drop reads FAIL of 27
      with 24 met, 3 missed and 13 density missed, which is its committed verdict exactly, and every ratio is
      unchanged to two decimals (VBAT 3.70, VIN_RAW 2.00, VBUS20 2.04, +13V8_PA 1.53, FE_OUT 3.13, CH_ACN
      3.03, CH_SRP 15.84 against 15.83, S1_OUT 1.44). THE REASON IS THE CROSSOVER, AND THE NUMBER THAT DECIDES IT IS NOT THE
      ONE THIS DECISION'S OWN EVIDENCE QUOTED: IPC-2221A stops being the LOWEST of the three at 0.1706 mm2 at
      10 K, where CNES crosses it, and not at the 0.2677 mm2 where IPC-2152 does. That is 4.88 mm of outer
      1 oz copper, 9.75 mm of half-ounce inner or 2.44 mm at 2 oz, and every conductor this project measures
      is narrower than that while the pour bar is one 0.5 mm raster CELL, an order below it again. A fixture
      written for this ruling caught the wrong crossover before it reached the record. A barrel is smaller still (a 0.4 mm hole at 18 um of
      plating is 0.0236 mm2) and its rating is unchanged, which was checked rather than assumed. SO WHAT THE
      RULING DECIDES IS WHAT THE COPPER MUST BECOME, not what today's readings say: the SIZER moves, and a
      band for 18 A on outer 1 oz goes from 16.14 mm to 23.91, 10 A from 7.18 to 8.15, and 3 A not at all.
      That sharpens board A's copper-weight question rather than answering it, and every board's own next
      generation is where its copper follows; no committed board changed when this was ruled.
    reversed_by: >-
      make `track_current.conservative` return `rating(area, dT, "IPC-2221A")` and every tool is back on the
      single fit it used before this commit; nothing else moves, because no board was regenerated for it.
    ask: "keep the IPC-2221A bar, take the most conservative of the three models, or move to IPC-2152"
    recommendation: "the most conservative at each area: it never reads higher than any published model"
    evidence: "MEASURED FROM THE THREE CURVE FITS ECSS-Q-ST-70-12C ANNEX D PUBLISHES, 17 September 2026, and the
      answer is the opposite of what the word 'newer standard' suggests. At a 10 K rise IPC-2221A stops being
      the conservative model above 0.268 mm2 of cross-section: below that it reads lower than IPC-2152, above it
      HIGHER. At 1 mm2 it allows 1.28 times IPC-2152, at 4 mm2 1.66 times. So for this project's power copper,
      which is pours and bands well above the crossover, moving to IPC-2152 or taking the most conservative
      model makes every failing rail WORSE, not better, and cannot rescue one of them: board A misses on VBAT at
      3.69 of its limit, VBUS20 2.03, VIN_RAW 2.00, +13V8_PA 1.53, and board E on CELL_F at 1.12. The decision
      therefore does not change whether these five pass; it changes by how much they fail and what the copper
      must become. AND THE BAR IN USE IS OUTSIDE ITS OWN STATED VALIDITY: D.4a states the IPC-2221A fit for
      conductors up to 1.2 mm2 at a 10 K rise, and this project's rails run to 18 A, which needs 1.47 mm2 under
      that fit and 2.68 under IPC-2152. What each model asks for at 10 K: 10 A needs 0.65 mm2 (IPC-2221A),
      0.90 (IPC-2152) or 1.01 (CNES); 18 A needs 1.47, 2.68 or 2.98. AND THE DEVICE RAIL PUTS A NUMBER ON WHAT THE
      RULING BUYS (21 September 2026, read off A95): /+5V_DEV, 6.00 A, has its bank at case x -13 and its loads at the
      USB-C outlet cluster at x +85 to +103, on the far side of every converter block, and the router lays nothing
      across the 91.6 mm; a band for it on outer 1 oz copper wants about 2.7 mm at 10 K under IPC-2221A and on the
      half-ounce inner layer about fifteen, and every alternative model asks for more. It is copper weight and a
      corridor, not a route. CORRECTED 21 September 2026: that run is ONE of the rail's five open pre-route
      pairs and not all of them. The 21 September count read the DRC's item list, where a pair is a two-ended
      item; asked again on A98's own pre-route board, /+5V_DEV has five pairs, of which this 99.78 mm run to
      the bank is the only one this ruling holds. The other four are inside the outlet cluster itself, 8.47 to
      46.27 mm apart, and they are a generator item measured the same day: an In3 island over the cluster fills
      as one piece holding four of its five sites, where an F.Cu one leaves U18 pin 17 outside. So the ruling
      decides the rail's LONG run and the cluster closes itself without it. AND THAT HALF IS NOW BUILT AND
      MEASURED (21 September 2026): the corrected island is the slot rails' pattern, an F.Cu island holding
      barrels beside the cluster's own pads with an In3 union under the whole of it, and on its chain the
      device rail goes from FIVE open pre-route pairs to TWO, the survivors being this ruling's 99.78 mm run
      to the bank and one 46 mm via in the cluster's south. Its FIRST version, an In3 pour alone, connected
      NOTHING and its own chain probe said so: an inner pour cannot reach a surface pad without a barrel, and
      containment is not connection. A100 is routing that island against A100C and will say what it costs at
      the router. None of it changes what this ruling decides: the long run is still the only pair it holds,
