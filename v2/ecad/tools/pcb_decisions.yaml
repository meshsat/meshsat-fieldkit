# THE OWNER DECISIONS, as data (MESHSAT-862, 17 September 2026).
#
# `v2/docs/OWNER-DECISIONS-2026-09-11.md` is the RECORD: it carries each decision's evidence, its options with
# their costs and the recommendation, in the order they were asked, and it is 2,400 lines because that is what
# the evidence is worth. What it cannot do is answer "what is open, and what does each one hold up", which is
# the question that decides what this project can finish. This file is that index and nothing else: one entry
# per decision, its status, and the rule-board pairs it holds. `decisions_render.py` generates
# v2/docs/OWNER-DECISIONS-OPEN.md from it and a test refuses a decision that appears in the record and not
# here, so the index cannot fall behind the record.
#
# `blocks` names rules and the boards each one holds on this decision. It is the reason a decision matters
# rather than a claim that nothing else is wrong with those boards.
decisions:
  - n: 23
    title: "ruling 9's 1.2 mm PWR class is sized for a current board D's rail does not carry in one place"
    asked: 2026-09-13
    status: closed
    outcome: "superseded by the third reading of decision 9: the class is wider than 191 of the 230 pads it must reach, and D routes at 0.5 mm with the rail in locked inner copper"
  - n: 24
    title: "board B lays 65 of its 113 pairs and the pair hold releases no board under 113"
    asked: 2026-09-13
    status: ruled
    outcome: "owner ruling 15 September 02:40: the decision is the session's; option 2 taken, boards/b.json declares pair_coupled_fraction 0.80 by length"
  - n: 25
    title: "board A's USB_WALL pair is 1.47 mm apart and nothing in the tree can close it"
    asked: 2026-09-14
    status: closed
    outcome: "closed the same day and needs nothing: the pair took a ribbon of its own (J_AB2, end row)"
  - n: 26
    title: "board C is one connection short and no tool in this tree can close it"
    asked: 2026-09-14
    status: closed
    outcome: "closed by the route: six-layer C and then C17 reached 0 hard and 0 unrouted"
  - n: 27
    title: "the four-layer boards cannot carry a plane under their back-side signals as built"
    asked: 2026-09-15
    status: open
    ask: "four layers or six for board C, against a like-for-like price the ordering session has not yet given"
    recommendation: "six layers for C if the price is close; the measurement is in the record and the cost side is the only part missing"
    blocks:
      RET-002: [c]
      RET-001: [c]
    evidence: "C24's eighteen failing nets are all B.Cu runs whose only neighbour is In2, the routing layer; the longest is 172.9 mm of SCL"
  - n: 28
    title: "board P cannot hold the return-path rule on two layers and the ruled P5 does not route"
    asked: 2026-09-15
    status: open
    ask: "two layers or four for board P"
    recommendation: "four layers: measured at 0 hard and 0 unrouted where two layers leave 43 open at the corrected 0.16 mm rules"
    blocks:
      RET-002: [p]
      STK-001: [p]
    evidence: "P6, the first route at the fabricator's own 0.16 mm floor, ended 0 hard and 43 unrouted. The
      committed P4 board still reads 0 unrouted because it was routed at the 0.127 mm rules the fabricator
      does not build, which is what STK-001 fails on."
  - n: 29
    title: "board B's three compute-module Ethernet links have no magnetics and one end's maker has never been asked"
    asked: 2026-09-16
    status: open
    ask: "capacitive coupling as the switch vendor's clause 6.6 permits, or magnetics on all three links"
    recommendation: "ask the module's maker before changing copper; the switch vendor's own clause permits what is built"
    blocks:
      GND-002: [a, b, c, d, e, p]
      INT-002: [b]
  - n: 30
