  - n: 40
    title: "the pack's cell-level protection is one firmware-configured device, and the rule asks for hardware independent of any software"
    asked: 2026-09-18
    status: ruled
    authority: OWNER
    ruled_by: OWNER
    ruled_on: 2026-09-26
    outcome: >-
      owner ruling 26 September 2026 (foundation question D-15 of MESHSAT-1357), asked one decision at a time with
      the options and the recommendation, and ruled at the recommendation. THE FLOOR, which is the session's
      engineering and stands under either branch: a 4S secondary over-voltage protector across the four taps, a
      chemical fuse in the pack path that the secondary protector AND the BQ4050's own FUSE output (its pin 25) can
      both blow, and the BQ4050's PTC input turned on instead of tied off. THE OWNER'S PART: cell UNDER-voltage,
      which the floor leaves on the gauge's data flash. If a 4S secondary protector that also covers under-voltage
      can be sourced near the cost of the over-voltage-only part, it is used; otherwise the under-voltage
      protection stays in the BQ4050's firmware and the residual is accepted, with a verification of the gauge's
      data flash (the thresholds and the enabled protections read back against `pcb_pack_protection.yaml`) as a
      commissioning step. The two parts this entry named on 18 September (ABLIC S-8261 and TI bq2970) are
      single-cell protectors and cannot protect a 4S block (W2 finding F-DEC40, confirmed by its challenger:
      S-8261 is "FOR 1-CELL PACK", bq2970's PACK+ is limited to 12 V), so neither is the part; no 4S secondary
      protector's datasheet is in this tree yet, and the choice between the two branches is made on the sourced
      part and its price. Nothing is laid for this ruling yet: it is a board P schematic change, a re-route of
      board P and a data-flash setting, and BAT-001 on board P stays open until that copper exists and is judged.
    reversed_by: >-
      reopen this decision; nothing has been laid for this ruling yet, because the secondary protector, the
      chemical fuse and the PTC input are a board P schematic change that has not been made
    ask: "add a protector that needs no firmware (a dedicated cell protector IC on the taps, or the gauge's chemical-fuse output with a fuse that has one), or accept the BQ4050 alone with that written down against the rule"
    recommendation: >-
      add the second protector. It is one small part, its datasheets are already in this tree, and it is the
      difference between a pack whose safety depends on a data-flash image being right and a pack that is safe
      with the gauge unprogrammed, unpowered or crashed. The cheapest shape is a dedicated cell protector across
      the four taps driving a separate FET, or the BQ4050's own chemical-fuse output with a fuse that has one,
      which costs a part and a board change on board P alone and no re-route of any other board
    evidence: "MEASURED, 18 September 2026, by the instrument rule BAT-001 never had. `pcb_pack_protection.yaml`
      writes the intended BQ4050 configuration down function by function and `pack_protection.py` makes 45
      checks over it: every protection the requirement names is present, every threshold is inside the cell
      maker's own limit at the pack's WORST parallel count (over-voltage 4.25 V against a 4.20 V charging
      voltage with a declared 0.05 V allowance, under-voltage 2.50 V against the guideline's 2.30 V
      over-discharge protection, 20 A against 24, 30 A against 39, 5 A against 6, the charge window 0 to 45 C
      and the discharge window -10 to 60 C), every quoted limit is re-read from the Samsung INR18650-35E
      specification in this tree, and every device is on board P's netlist. ONE check fails and it is the
      requirement's own words: `in hardware, INDEPENDENT OF ANY SOFTWARE`. All nine functions are the BQ4050's,
      a device whose thresholds live in data flash and whose protection subsystem is firmware; board P carries
      no second protector IC, no chemical fuse (gen_sch_p.py says so in as many words: the 25 A mini blade is
      the fuse) and its PTC input is tied off. So the only protective element on the board that needs no
      firmware is a 25 A blade fuse, which is a gross-fault device: it does not protect a cell from
      over-voltage, from over-discharge or from heat. The parts are documented here already, ABLIC S-8261
      (v2/vendor/battery/ablic-s8261.pdf) and TI bq2970 (ti-bq2970.pdf), both filed on 4 September for this
      question. What the decision costs is a part, a schematic change and a re-route of board P, which is 0/0
      today and the smallest board of the set; what it buys is that the 200 Wh block in this case is protected
      by something that cannot be mis-programmed."
