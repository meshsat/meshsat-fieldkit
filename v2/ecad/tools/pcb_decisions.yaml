  - n: 39
    title: "the criterion a break in a signal's reference is judged against"
    asked: 2026-09-17
    status: ruled
    authority: SESSION
    authority_why: >-
      it changes no line the never-auto floor protects, spends nothing and accepts no residual risk: the numbers
      are UNCHANGED by this ruling and the boards' readings are already taken, so what moves is whether a
      measurement is allowed to decide. SI-001's own waiver policy already names SESSION as its authority, and the
      third option, holding the rule until a standards body publishes a per-class return-path tolerance for a kit
      like this one, is not an option that anybody is going to close.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      RULE THIS PROJECT'S OWN PER-CLASS CRITERION AS A DECLARED CALIBRATION, WITH THE NUMBERS EXACTLY AS THEY
      STAND. Not one tolerance is moved by this ruling: a limit moved to make a rule pass is an exemption wearing
      a number, and a criterion 50 percent looser would clear fourteen of the thirty-two failing nets, which is
      precisely why it is not touched. What changes is that the rule is allowed to DECIDE: signal_class.py already
      carries 413 per-net declarations across seven boards, each with its basis, and ECSS-E-HB-20-07A section
      6.1.2.5.2 is cited as the qualitative authority for the principle while the numbers are recorded as this
      project's own calibration and are labelled as such wherever they appear. The readings this releases are
      already on disk: RET-001 reads PASS on A, D and E, FAIL on B (1 net of 658), C (15 of 127) and P (5 of 29),
      and has nothing to judge on E5; RET-003 reads FAIL on board A (13 vias changing to a power reference with no
      capacitor) and has nothing to judge elsewhere; SI-001 stays INCONCLUSIVE and now says why in its own words,
      60 nets on board A and 380 on board B carrying no declared edge rate, which is a session item and not a
      standards wait.
    reversed_by: >-
      set status to reopened and put the three maturities back to SOURCE_UNVERIFIED in
      tools/pcb_rules_coverage.yaml; every reading stays where it is, because this ruling moved no number and took
      no measurement away
    ask: "rule this project's own per-class tolerances, derive them per net from a declared edge rate, or hold the rule until a standard publishes a number"
    recommendation: "rule the project's criterion, and read the re-measurement below before deciding how loose: of the 32 nets failing today TWO are inside a factor of 1.1 of their limit and FOURTEEN are inside 1.5, so the number decides about half of them (the earlier reading, one net inside 1.1, was taken before board B was adopted)"
    evidence: "RE-MEASURED 18 September 2026 WITH BOARD B IN THE SET, AND THE ANSWER CHANGED. The 17 September
      reading below was taken before B21 was adopted, and board B's eleven failures are all marginal: of the 32
      failing nets across the set, TWO are inside a factor of 1.1 of their own limit, FOURTEEN are inside 1.5,
      TWENTY-ONE are inside 2.0, and seven are over 3.0. The tight end is board B's controlled-impedance pairs
      (USB_E6_N 10.5 mm of uncovered run against a 10.0 mm limit, HDMI2_D1_N 10.9, SWP3_C_N 14.0 against 12.7,
      six USB nets between 11.4 and 13.9) and board C's EPD_CS at 66.1 against 58.5; the loose end is board C's
      panel USB pair at 5.4 times its limit and board P's SMBus at 3.4. So the criterion is no longer a number
      that decides almost nothing: a criterion 50 percent looser than today's clears fourteen of the
      thirty-two, and one 10 percent looser clears two. What has not changed is that the rule needs an
      authority at all, which is what this decision is about. THE 17 SEPTEMBER READING, kept because it is the
      one the recommendation was written against: across the set 32 signal nets fail this rule and exactly
      ONE sits inside a factor of 1.1 of its limit. So the choice between this project's own per-class tolerances, a per-net figure derived
      from a declared edge rate, and holding the rule until a standard publishes a number, changes the verdict
      on ONE net of thirty-two. What it does change is whether the rule has an authority behind it at all, which
      is why it is asked: RET-001, RET-003 and SI-001 are the three rules this decision holds and all three
      carry maturity SOURCE_UNVERIFIED for exactly that reason."
