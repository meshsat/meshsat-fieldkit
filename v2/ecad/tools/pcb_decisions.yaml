  - n: 35
    title: "which published current-rating model this project's copper is judged against"
    asked: 2026-09-16
    status: open
    ask: "keep the IPC-2221A bar, take the most conservative of the three models, or move to IPC-2152"
    recommendation: "the most conservative at each area: it never reads higher than any published model"
    evidence: "MEASURED FROM THE THREE CURVE FITS ECSS-Q-ST-70-12C ANNEX D PUBLISHES, 17 September 2026, and the
      answer is the opposite of what the word 'newer standard' suggests. At a 10 K rise IPC-2221A stops being
      the conservative model above 0.268 mm2 of cross-section: below that it reads lower than IPC-2152, above it
      HIGHER. At 1 mm2 it allows 1.28 times IPC-2152, at 4 mm2 1.66 times. So for this project's power copper,
      which is pours and bands well above the crossover, moving to IPC-2152 or taking the most conservative
      model makes every failing rail WORSE, not better, and cannot rescue one of them: board A misses on VBAT at
      3.69 of its limit, VBUS20 2.03, VIN_RAW 2.00, +13V8_PA 1.53, and board E on CELL_F at 1.12. The decision
      therefore does not change whether these five pass; it changes by how much they fail and what the copper
      must become. AND THE BAR IN USE IS OUTSIDE ITS OWN STATED VALIDITY: D.4a states the IPC-2221A fit for
      conductors up to 1.2 mm2 at a 10 K rise, and this project's rails run to 18 A, which needs 1.47 mm2 under
      that fit and 2.68 under IPC-2152. What each model asks for at 10 K: 10 A needs 0.65 mm2 (IPC-2221A),
      0.90 (IPC-2152) or 1.01 (CNES); 18 A needs 1.47, 2.68 or 2.98."
    blocks:
      PI-001: [a, e]
  - n: 36
    title: "the intra-pair tolerance a differential pair is judged against"
    asked: 2026-09-16
    status: open
    ask: "this project's 1.00 mm, or each interface's own number from its host's datasheet"
    evidence: "BOARD A'S THREE PAIRS ARE MEASURED AND THE RULING IS NEARLY FREE ON IT (17 September 2026, read
      off both A40 and A41, which give IDENTICAL numbers because the pre-router lays a pair from the PLACEMENT
      and the route does not touch it): USB_D8 P 139.47 mm against N 139.75, mismatch 0.29 mm; USB_E6 0.12 mm;
      USB_WALL 0.01 mm. The compute module's own datasheet asks 0.15 mm of this interface, so ONE of board A's
      three pairs is outside it and two are comfortably inside. Closing it is 0.14 mm of length added to the
      short leg, which `meander.py` does and `pair_match.sh` already runs three rounds of in every finish. Board
      B's number needs its routed board and B21 is mid-route. So on the evidence that exists, ruling the
      interface's own number costs one small meander on one pair of one board, and ruling this project's 1.00 mm
      leaves a pair at twice the budget its host states."
    blocks:
      INT-001: [a, b]
  - n: 37
    title: "board D asks for two crystals that do not exist and the part it was certified against is four times the frequency"
    asked: 2026-09-16
    status: open
    ask: "a bigger land for a passive 6 MHz crystal, or an active oscillator and the loss of USB suspend and resume"
    recommendation: "the HC-49S-SMD land with a passive crystal, and Rd re-chosen for the part's own ESR: it is the
      one package where 6 MHz exists at this project's temperature range with stock, and it keeps the suspend
      and resume behaviour the hub's own datasheet says a passive crystal is required for"
    evidence: "MEASURED against JLCPCB's catalogue on 17 September 2026, and the premise is now exact rather than
      a claim. EVERY 6 MHz part JLCPCB lists in a SMD3225-4P land is an ACTIVE OSCILLATOR (a supply voltage, a
      CMOS output and a supply current: C2901554, C7431330, C7434923, C557218 and five more), and not one is a
      passive crystal, which is a property of the blank rather than of the catalogue: a 3.2 x 2.5 mm blank does
      not resonate at 6 MHz in fundamental mode. Passive 6 MHz crystals at the design's own CL of 20 pF exist in
      quantity one package up: HC-49S-SMD C252308 (stock 379) and C518119 (239) at -40 to +85 C, C240973 (1188)
      and C5346078 (2279) at -20 to +70, and one part listed as SMD7050-4P, C5181484, stock 306, whose own
      datasheet contradicts its title by calling the package 3225 in its table, so its land is NOT established.
      THE HOST'S OWN DATASHEET decides the rest (TI SLLS413, TUSB2046B, clause 8.3.2 and figure 6): the
      reference circuit is a CL 20 pF crystal with C0 at most 7 pF and ESR AT MOST 50 OHM, with C1 = C2 = 27 pF
      and Rd 1.5 kOhm, which is exactly what board D draws; and the same page says a 6 MHz oscillator may drive
      XTAL1 with XTAL2 left open, but that IF LOW-POWER SUSPEND AND RESUME ARE DESIRED A PASSIVE CRYSTAL OR
      RESONATOR MUST BE USED. Of the passive candidates only C279600 publishes an ESR inside TI's 50 Ohm (and
      it is a -20 to +70 part with 52 in stock); the wide-temperature ones read 80 Ohm, so Rd is re-chosen for
      the part that is bought and the negative-resistance margin is a bench measurement, which is the same shape
      as the 24 MHz load-capacitance correction of 16 September."
    blocks:
      CMP-002: [d]
      SUP-001: [d]
  - n: 38
    title: "board B's two pair classes are 0.100 mm and its own minimum is 0.127, and the fabricator's floor is 0.09"
    asked: 2026-09-17
    status: open
    ask: "lower board B's own minimum to the fabricator's floor, or widen the two classes"
    evidence: "MEASURED FROM THE PROJECT FILE AND THE FABRICATOR'S OWN PAGE, 17 September 2026. Board B declares
      DIFF100 and USB at a clearance of 0.100 mm while the board's own minimum is 0.127, which is what
      `class_floor` refuses in its own words, a class below the board minimum is a lie the router believes.
      Buildability is not the question: the capability page in this tree gives 0.09 / 0.09 mm at 1 oz multilayer
      and board B is six layers at 1 oz, so 0.100 is inside what the fabricator offers. The 0.127 is the CM5
      0.4 mm receptacle escape scheme's own clearance, which is where that minimum came from.
      WIDENING THE TWO CLASSES CHANGES NO PAIR GEOMETRY: DIFF100's pair gap is 0.200 mm and USB's is 0.127, both
      at or above 0.127, so raising the CLEARANCE to the board's minimum leaves both differential impedances
      exactly as they are and no pair needs re-tuning. What it can cost is routing room between a pair and other
      nets, and only a route prices that; B21 is mid-route and would have to be re-run to say by how much.
      Lowering the board's minimum instead legalises the classes by moving the bar rather than the copper, and it
      loosens the escape scheme the 0.127 was taken from, which is the one geometry on this board that three
      compute modules at 0.4 mm pitch depend on."
    blocks:
      IMP-002: [b]
