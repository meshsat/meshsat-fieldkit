  - n: 29
    title: "board B's three compute-module Ethernet links have no magnetics and one end's maker has never been asked"
    asked: 2026-09-16
    status: ruled
    authority: SESSION
    authority_why: >-
      the question was written as a wait on a vendor answer and it cannot be one: the module's PHY is a
      Broadcom part whose datasheet is not published, so no amount of waiting produces the document, and the
      owner is not an engineer who can weigh two datasheets against each other. It spends nothing, orders
      nothing and changes no copper: what it rules is that the design as built stands, so the reversible
      thing is the RULING and not a board. The residual risk it accepts is named, bounded and discovered at
      bring-up rather than in the field, and the mitigation is a test that is already in the plan.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      KEEP THE THREE MODULE LINKS CAPACITIVELY COUPLED, AS BUILT, and do not fit magnetics on them. The one
      document in this tree that describes THIS topology, a PHY-to-PHY gigabit link inside one PCB with no
      cable, is the switch vendor's own clause 6.6, and it permits exactly what board B has: a single 0.1 uF
      in series on each of the eight signals with nothing else between. Three of its four conditions are met
      conductor by conductor; the fourth defers to the other device's documentation, which does not exist
      publicly. The compute module's own datasheet says of all eight Ethernet pins 'connect to transformer or
      MagJack' (Table 4, pinout), and that is a description of the cable application it was written for, not a
      prohibition of the transformer-less one: no conductor of these three links leaves the enclosure, so
      there is nothing for a transformer to isolate. THE RESIDUAL RISK, named: if the module's PHY needs the
      centre-tapped transformer for bias or termination, the three inter-module links do not come up. It is
      discovered by the bring-up test that already exists (each module link up at 1000M), it costs no field
      failure and no safety margin, and the fallback is the magnetics this ruling declines. AND THE FALLBACK
      HAS A COST THIS DECISION DID NOT KNOW WHEN IT WAS ASKED: the H5007NL is rated 0 to +70 C by its own
      datasheet while the adopted envelope is -20 to +40 C, so fitting three more would triple a part that is
      already outside its own range over the coldest 20 K of the envelope (boards/b.json carries the reading
      and the HX family's note). Two things travel with this ruling and are not optional. FIRST, the software
      requirement of the same clause: auto-negotiation must stay enabled on ports 1 to 3 whenever 1000M is
      used, which is written in v2/docs/ARCH-PCB-B-IOHA.md and binds the bridge, the OS image and any switch
      configuration; a forced fixed speed there breaks a transformer-less link for a reason no gate here can
      see. SECOND, GND-002's strategy can now be written, because this ruling settles what is isolated: the
      external port through T1 and nothing else.
    reversed_by: >-
      set status back to open and fit three H5007NL (or an extended-temperature part of the same family) in
      place of the twenty-four coupling capacitors in gen_sch_b.py; no copper has been laid for this ruling
      and board B's phase is unchanged by it, so the reversal is a schematic change in the next board B
      generation and nothing else.
    ask: "capacitive coupling as the switch vendor's clause 6.6 permits, or magnetics on all three links"
    recommendation: "ask the module's maker before changing copper; the switch vendor's own clause permits what is built"
    evidence: "MEASURED ON BOTH SIDES AND ON THE MAKER'S OWN CARRIER (17 September 2026), and the answer is that
      three of the switch vendor's four conditions are met by the copper as built and the fourth cannot be met by
      anyone in this project. THE LINK AS BUILT, from board B's netlist: each of the three module links carries
      eight conductors, and every one of the twenty-four runs from a module receptacle pin (U30A, U31A, U32A) to
      ONE 100 nF 0402 capacitor and on to a KSZ9897RTXI port pin, with no other node on any of those nets. The
      fourth switch port is the one that leaves the case and it is not transformer-less: it goes through T1, a
      Pulse H5007NL 1:1 magnetics module, into the RJ45.
      THE CLAUSE, quoted from the document in this tree (v2/vendor/cluster/ksz989x-hw-design-checklist.pdf,
      DS00004151A page 12, section 6.6 'Capacitive Coupling Option'): the family 'may be used in transformer-less
      applications where the PHY-to-PHY connection is within one PCB or interconnected PCBs, and a cable is not
      needed', with 'a single DC blocking 0.1 uF capacitor placed in series on each of the eight signals' and 'no
      additional components between the KSZ989x and the capacitor'. Both are true of this board, conductor by
      conductor. The third bullet is the open half and it is the vendor pointing away from itself: 'The other
      device may require termination or other circuitry. Refer to Microchip documentation for that device.' The
      other device is not Microchip's: it is the Broadcom PHY inside the compute module, whose datasheet is not
      published, so the document this clause sends the reader to does not exist for this link.
      WHAT THE MODULE'S OWN MAKER DOES, read today from their design files in this tree
      (v2/vendor/cm5/cm5io-kicad.zip, sheet CM5_GPIO.kicad_sch): the module's TRD0 to TRD3 pairs run straight into
      U3, a TRJG0926HENL MagJack with integrated magnetics, with no series capacitor and no termination network on
      the module side at all. So the maker's own reference is magnetics, and because it is magnetics it says
      nothing about what their PHY needs when the transformer is removed. That is the question to put to them, and
      it is one question: does the CM5's PHY support transformer-less operation, and does it need termination.
      THE COST OF THE FALLBACK, measured rather than estimated: the part is the one this board already carries,
      Pulse H5007NL (C6384935, 1.75 USD, stock 761 at JLCPCB on 17 September 2026), so three more cost 5.26 USD a
      board and 982 mm2 of board area (courtyard 18.6 x 17.6 mm each, 327 mm2), and the twenty-four coupling
      capacitors come off. The checklist itself offers that route in the same clause: 'Another option is to achieve
      DC isolation using single magnetics, with or without Common-mode chokes.'
      WHAT THE BOARD IS ASKING THESE LINKS TO DO, from the placed board: the conductors run 96 to 115 mm from the
      receptacle to the capacitor and 121 to 252 mm from the capacitor to the switch, so the longest of the three
      links is about 345 mm of gigabit copper end to end on a 330 x 200 mm board. That is inside one PCB, which is
      the clause's own case, and it is long enough that the loss budget is worth stating whichever way this is
      ruled.
      ONE CONDITION IS NOT COPPER AND IS IN NO CONTRACT YET: the same clause requires auto-negotiation to stay
      enabled when the link runs at 1000M. Nothing in this tree's software contract records that, so a bridge that
      ever forces a fixed-speed link on ports 1 to 3 would break a transformer-less link and nothing would say why.
      AND THE HOST'S OWN DOCUMENT WAS READ ON 21 September 2026, which is what let this be ruled rather than
      waited on. The compute module's datasheet has one sentence about these pins and it is in the pinout,
      Table 4: every one of the eight Ethernet pins reads 'connect to transformer or MagJack'. That is the
      ONLY statement the host makes about them, it is a description of the cable application the module was
      designed for, and it is not a prohibition of a PHY-to-PHY link inside one board, where nothing leaves
      the enclosure and there is nothing to isolate. Two more readings of the same hour: the Microchip
      application note in this tree that DOES permit omitting coupling capacitors on one PCB
      (v2/vendor/cluster/an6048-daisy-chain-ksz.pdf, '100 nF AC coupling capacitors can be omitted if the
      switches are on the same PCB') is about SGMII, switch to switch, and must not be cited for this
      question; and the fallback's own part, the Pulse H5007NL, is rated 0 to +70 C against an adopted
      envelope of -20 to +40, so fitting three more would triple a part already outside its range over the
      coldest 20 K (boards/b.json carries the reading, and the sheet's note 1 names the HX extended-temperature
      family). Board B has room for the fallback in the gross sense, measured on B21's own placed board with
      freebox.py: 36,115 free 18.6 by 17.6 mm centres on the front side and 124,196 on the back. Where they
      would go in the corridor between each receptacle and the switch is the floor plan, which is decision 43.
      CORRECTED 21 September 2026, BY READING THE NETLIST: THE FOUR MDI PAIRS ARE NOT THESE LINKS. MDI_A to
      MDI_D run between T1, the Pulse H5007NL magnetics, and J_ETH, the RJ45, which is the CABLE side of the
      one port that is not transformer-less; the capacitively coupled module links are SWP1 to SWP3, which run
      from the switch U1 to their own 100 nF capacitors. So the sentence below, carried since 18 September,
      named the wrong pairs on both halves: the transformer-less links DO carry a declared tolerance
      (ETHERNET_CM5's 0.15 mm, from the compute module's own datasheet) and on B21 they MEET it, reading 0.00
      to 0.01 mm of mismatch on every routed one. What the measurement really found is about the MDI pairs
      themselves and it stands as a finding for board B's next phase: T1 to J_ETH carries no impedance target
      in any class and no declared tolerance, reads 2.74 to 14.68 mm on B21, and this switch's own checklist
      (DS00004151A sections 6.2 to 6.4) gives the media side magnetics characteristics and a chassis-ground
      rule and NO intra-pair number, so this project has nothing to declare one from today.
      AND ONE MORE THING ABOUT THESE FOUR PAIRS, found while measuring decision 36 on the adopted B21 board
      (18 September 2026, as it was written then): their intra-pair tolerance is not declared anywhere. Every other interface on this
      board carries a number from its host's datasheet in pcb_interfaces.yaml (0.10 mm for the module's USB 3
      and PCIe, 0.15 for its USB 2 and Ethernet, 0.70 for the M.2 modules); the MDI pairs, which are these
      links, carry none, and on B21 they read 2.74 to 14.68 mm of mismatch. Whichever way this decision goes,
      those four need a budget from the same clause it turns on, because a capacitively coupled link with no
      magnetics has less margin for skew than one with them, not more."
    blocks:
      GND-002: [a, b, c, d, e, p]
      INT-002: [b]
  - n: 30
    title: "ZEROIZE is a switch wired to nothing that can act on it"
    asked: 2026-09-16
    status: ruled
    authority: OWNER
    ruled_by: OWNER
    ruled_on: 2026-09-26
    outcome: >-
      owner ruling 26 September 2026 (foundation question D-03 of MESHSAT-1357), asked one decision at a time with
      the options and the recommendation: ZEROIZE is a CRYPTO-ERASE THROUGH THE SECURE ELEMENT. Every drive and eMMC
      key is wrapped by a key only the secure element holds; ZEROIZE destroys that key first, then the running
      modules drop the keys they hold in RAM, then the panel controller cuts the three slot rails. It is firmware
      and provisioning with no board change. Its precondition is that the ATECC608B slot map lets that key be
      erased, which the summary datasheet the tree holds (DS40002239A) does not state and the full datasheet, under
      NDA, is needed for; a TPM 2.0 is the fallback appendix 32.50 item 5 already names. The ONLY trigger is the covered toggle held 5 s: the tamper or
      lid switch logs and never wipes, and a remote wipe is deferred. The line is LEVEL-SENSITIVE across a power
      loss: the panel controller reads ZEROIZE_HW at boot before any slot powers, a wipe-pending record in its flash
      resumes an interrupted wipe, and the kit re-arms only when the toggle is returned. Residual risk accepted by
      the owner: a drive's unlock at boot depends on the secure element, the panel controller and the kit I2C bus.
      This is the recommendation the D-03 question carried (option Z-B of the W5 contract draft); it replaces this
      entry's own recommendation of 17 September, kept in its `recommendation` field as history (the panel wipes
      the secure element and messages the running modules), whose named gap, a powered-off module keeping its
      drive keys, is what the crypto-erase closes.
    reversed_by: >-
      reopen this decision; nothing has been laid for this ruling yet, because it is panel firmware, module
      provisioning and a slot map, and no conductor changes
    ask: "which device performs the wipe, and on what edge"
    recommendation: >-
      the panel controller does the wipe on the falling edge, because it is the only device that both sees the
      switch and can reach the secure element, and the drives are erased by the modules on its message with the
      limitation written down: a module that is not running cannot be erased by anything on this line. It is
      firmware and a sentence in the software contract, not a conductor
    evidence: "THE TITLE IS TOO HARSH ON THE HARDWARE AND THE NETLISTS SAY SO (read 17 September 2026). The
      line reaches exactly one processor and that processor can reach the thing to be erased. On board C,
      ZEROIZE_HW carries the panel switch SW_ZERO, its pull R10 and its capacitor C20 to U3 PIN 34, the RP2040
      panel controller, so operating the switch is a falling edge ON A GPIO OF A LIVE CONTROLLER. That same
      controller sits on the panel I2C bus (U3.2 and U3.3 on SDA and SCL), the bus leaves board C on J_PANEL
      pins 4 and 5, and on board B the SECURE ELEMENT IS ON IT: U8, the ATECC608B at 0x60, whose own value
      string in the schematic reads 'keys behind ZEROIZE'. So the hardware path from the switch to the secure
      element is complete today, through the panel controller and its own bus.
      What is true of the rest of the line is that it only travels: board B carries it from J_AB1 pin 20 to
      J_PANEL pin 10 with a test point, board A from J_AB1 pin 20 to J_MEZZ1 pin 15 with a pull, and on board D
      it arrives at J_HARN1 pin 15 and ends at a test point. No device on A, B or D listens to it.
      So this is a choice and a piece of firmware rather than a missing conductor, FOR THE SECURE ELEMENT. The
      encrypted drives are the other half and they hang off the compute modules, which do not see this line at
      all: erasing those needs a module that is running, which is the part the ask has to settle."

    blocks:
      SCH-004: [a, b, c, d, e, p]
  - n: 31
    title: "conductors leave the case and meet a chip with nothing in between, or only through an active part"
    asked: 2026-09-16
    status: ruled
    authority: SESSION
    authority_why: >-
      the engineering here is a part choice against a level that is already ruled, and every input is a document
      in this tree or on a maker's own server: what is left for the owner is money, and this costs one new part
      number and about 0.44 USD a board over five boards. The session took it because asking the owner which ESD
      array to fit is asking a non-engineer a question whose answer is in the datasheets. WHAT IS NOT TAKEN:
      boards D and E are finished copper, so each fix costs a placement, a route and a NEW DELIVERABLE FOLDER, and
      cutting a folder is promotion, which stays frozen and the owner's.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      CLAMP AT THE ENTRY, and ask each conductor what is actually in front of it first, which takes the packet
      from thirteen failures to six conductors and five placements. ONE, BOARD A IS ANSWERED BY THE PART IT
      REACHES AND COSTS NOTHING: its two failing conductors are J_USBC_OUT.2 and .3, the CC pair into U18, and
      TI's own datasheet section 9.1.1 says 'The device has ESD protection built into the CC1 and CC2 pins so that
      no external protection is necessary' (v2/vendor/ti/ti-tps25740.pdf; absolute maximum on those pins -0.3 to 6
      V, and the VBUS path TI's Figure 37 clamps is already D4, an SMBJ18A). Board A needs no part and no copper:
      it needs a declaration form saying the protection is INSIDE the part the conductor reaches, with its
      citation, which port_protect.py does not have today. TWO, BOARD D'S J_PAOUT IS NOT AN ENCLOSURE PORT: read
      off its own netlist the chain is RF_PAOUT to L1 to RF_LPF_M to L2 to RF_LPF_OUT to K1.5, K1.6 to RF_ANT to
      J_ANT, and J_PAOUT's coax goes to the RA30H1317M1 on the plate INSIDE the case, so every path from outside
      reaches it through the same PolyPhaser GTH-SFF-AL at the antenna bulkhead that J_ANT already declares, plus
      the T/R relay contacts and a two-section low-pass filter. It declares that arrestor with its path. No part,
      no copper. THREE, BOARD D'S TWO HEADSET JACKS ARE THE REAL WORK AND THEY ARE BIDIRECTIONAL BY MEASUREMENT:
      U7 is a TPA6132A2 DirectPath headphone amplifier with a charge pump (AMP_CPP, AMP_CPN and a negative
      AMP_HPVSS), so the speaker conductors swing BELOW GROUND; the microphone conductor carries a 5 V electret
      bias through JP1 and R43 from +5V_D8 when that jumper is closed; PTT is a 3.3 V line pulled up through R68
      into U9 and Q4. TWO Nexperia PESD5V0S2BT per jack (C49338, SOT-23, 23,525 in stock at 0.0858 USD):
      low-capacitance BIDIRECTIONAL double array, VRWM 5 V, Cd 35 pF typical, rated IEC 61000-4-2 contact
      discharge 30 kV against the 8 kV decision 34 ruled. Four packages, 0.34 USD a board. FOUR, BOARD E'S POD IS
      ONE PART THIS DESIGN ALREADY BUYS: a USBLC6-2SC6 (C7519) on J_POD.1, .3 and .4, guaranteed to IEC 61000-4-2
      level 4 at 8 kV contact and 15 kV air in its own datasheet, which is exactly the ruled level, and no new
      part number. FIVE, BOARD E'S SHORE INLET IS NOT ACCEPTED AS IT STANDS AND THE FIX IS ONE PART: its netlist
      reads J_DCIN.1 to F1 to DC_F to Q1 (the BSC039N06NS ideal-diode FET, source pins 1 to 3, drain tab 5 to 8)
      to DC_P to D1, so the FIRST semiconductor a strike meets is the FET and the clamp sits behind it. Accepting
      that means accepting the FET's own rating for an 8 kV contact discharge, and a power FET's published ESD
      figure is a human-body-model handling number, which is a different test: Nexperia's PESD5V0S2BT sheet gives
      both for ONE part, 30 kV IEC 61000-4-2 contact against 10 kV MIL-STD-883 HBM, so one cannot be read as the
      other, and Infineon publishes the BSC039N06NS as a scan with no text layer and no ESD row that can be read
      at all. A SECOND SMCJ40A goes on DC_F, between the fuse and the FET: the part number board E already
      carries, after the fuse so a sustained overvoltage blows the fuse rather than the clamp, and at the entry,
      which is where Nexperia's own layout clause 1 and every TVS application note put it. SO THE WHOLE RULING IS
      FIVE PLACEMENTS OVER TWO BOARDS, ONE NEW PART NUMBER AND ABOUT 0.44 USD A BOARD, plus two declarations that
      cost nothing. Board E's three pod conductors and board D's six headset conductors are the six that get
      copper; boards D and E are regenerating anyway.
    reversed_by: >-
      set status to reopened. The declarations reverse by removing the protected_in_part entry from
      tools/boards/a.json and the off_board line from board D's J_PAOUT, which puts TRN-001 back to FAIL on A and
      D; the parts reverse by removing them from gen_sch_d.py and gen_sch_e.py and regenerating, which is a
      netlist change and moves the schematic, the netlist, the sidecar and the intent with it
    ask: "clamp every exposed conductor at its entry, or accept the three paths that reach their clamp through an active part"
    recommendation: >-
      rule decision 34 first, then clamp at the entry every conductor that reaches a semiconductor with nothing
      between it, which is board D's seven and board E's three and is the cheap half: those are parts and board
      area on boards whose copper is finished. The three paths that reach their clamp through an active part are
      the expensive half and are worth accepting only where that active part is itself rated for the level the
      envelope states, which is why the envelope comes first
    blocks:
      TRN-001: [a, d, e]
      # 19 September 2026: the hold's downstream half, which the per-board set gate has been writing in its
      # own words the whole time ("this board is HELD by an open owner decision, so its paperwork is not
      # current and cannot be made current while the hold stands") while the register said this decision held
      # three pairs. A folder cannot be cut for a held board, so DOC-001 on those three boards is this
      # decision's too. OUT-001 is NOT added: the set gate names three causes today, this hold, board B's
      # quote folder and a certification that could not ask, so attributing it here would be an over-claim.
      DOC-001: [a, d, e]
    evidence: "BOARD D IS IN THIS DECISION TOO, AND ITS GATE HAD BEEN SAYING SO WHILE THE REGISTRY SAID THE RULE
      DID NOT APPLY TO IT (17 September 2026). Board D declares four connectors whose conductors leave the case
      and `port_protect` reads SEVEN of its SEVEN judged conductors reaching a semiconductor with nothing
      between: J_HS1 and J_HS2, the two headset jacks on the face that a person plugs a headset into, three
      conductors each (speaker, microphone, push to talk), and J_PAOUT, the 30 W power amplifier output. Its
      antenna jack J_ANT is the one that is answered: it is protected off board by the PolyPhaser GTH-SFF-AL
      arrestor at the bulkhead. The measurement was taken by cutting board D's deliverable folder, which the
      gate refused at that stage, so this is what stands between board D and the folder DOC-001 asks for.
      Boards A and E carry the rest: three boards, TWENTY-FIVE judged conductors and THIRTEEN of them failing,
      and boards E and D are finished copper held on it.
      THE WHOLE PACKET, CONDUCTOR BY CONDUCTOR, AND THREE OF ITS ROWS WERE WRONG UNTIL THIS EVENING (17
      September 2026). The chain that follows a conductor to its clamp could cross a semiconductor and keep
      going, step onto a ground, or leave a rail through a pull-up, and board E's sensor pod took the SHORE
      INLET'S SMCJ40A as its protection three times over: SDA1 crossed the RP2040 onto SHORE_INHIBIT, crossed a
      transistor onto GND_V and read the clamp sitting there, and the pod's 3.3 V feed left its own rail through
      a 10k pull-up onto the hot-swap controller's power-good net and arrived at the same part. A clamp more
      than one hop past the first active part belongs to another circuit; a ground is where the search stops
      whatever the board calls it; a rail continues through a fuse, a bead, a choke or a series diode and never
      through a pull-up. No board's result moves, and the packet does:
      of TWENTY-FIVE judged conductors (board A thirteen, board D seven, board E five) THIRTEEN fail, TEN of
      them reaching a semiconductor with nothing between and THREE meeting their clamp only through an active
      part. The other twelve are answered where they stand, and one of them is the shape the rest should take:
      board E's solar input meets its own clamp before anything else.
      The three: board A J_USBC_OUT.2 and .3, the USB-C outlet's two CC conductors, which reach U18 (TPS25740A
      PD source controller) and whose clamp D4 (SMBJ18A) sits on PD_VBUS, a different conductor of the same
      connector; and board E J_DCIN.1, the shore inlet, connector to F1 (10 A) to Q1 (BSC039N06NS ideal-diode
      FET) to D1 (SMCJ40A on DC_P), which is the textbook shape of this question, the fuse and the clamp in the
      right places with one semiconductor in front of the clamp.
      The ten: board D J_PAOUT.1 (the 30 W amplifier output), J_HS1.1, .3, .5 and J_HS2.1, .3, .5 (both headset
      jacks, speaker, microphone and push to talk each), and board E J_POD.1, .3 and .4, the outside sensor
      pod's 3.3 V feed and its two I2C conductors, which run to the RP2040 with nothing in between.
      Board B's eight Ethernet conductors and board C's four switch conductors are answered where they stand,
      by T1's magnetics and by the optocouplers, and board P declares that nothing of its own leaves the case.
      WHAT THE CHEAP HALF COSTS, AND BOARD E'S THREE ARE ONE PART THIS DESIGN ALREADY BUYS (17 September 2026,
      prices from JLCPCB's own parts API). The pod's 3.3 V feed and its two I2C conductors are the shape the
      USBLC6-2SC6 is drawn for, two lines and their supply rail in one SOT-23-6, and this project already uses
      it through kisch.esd on five USB ports of board B and, conductor for conductor the same case, on board P's
      SMBus pair. It is C7519, 25,352 in stock at about 0.08 USD, it has its datasheet in the tree
      (v2/vendor/st/st-usblc6-2-esd-protection.pdf), its footprint is drawn and its net-tie pad groups are
      handled, so board E's whole pod costs ONE part and no new part number.
      Board D's two headset jacks are not that case: each carries a speaker line, a microphone line and a push
      to talk, and an audio output that swings below ground wants a BIDIRECTIONAL clamp rather than the
      rail-referenced array a data line takes. The shape that fits is a four-channel bidirectional array, one
      per jack, three conductors and a spare: the Semtech RClamp0524P is C40960, 153,808 in stock at 0.066 USD,
      rated plus and minus 5 V working, and the alternatives are Littelfuse's SP3012-04UTG (C151304, 10,629 at
      0.2368) and ST's ESDA6V1W5 (C48677, 20,825 at 0.16). Two parts a board, about 0.66 USD over the owner's
      five boards. Which of them is a circuit question for board D's generation, because it turns on the
      codec's own output swing and the microphone bias, and none of them is a choice until decision 34 states
      the level.
      So the parts are pennies either way, and the price of the ruling is not the parts: it is that boards D and
      E are FINISHED COPPER, so each one costs a placement, a route and a new folder. Board E's is owed whatever
      this decision says, since 17 September evening: its hot-swap pass FET Q7 was written with a three-pin map
      on a five-pad land, gate and drain on two SOURCE pins and the drain tab floating (appendix 32.219, rule
      SCH-005), so the E11 copper is not a candidate for anything and the clamps ride the same regeneration.
      Board D's J_PAOUT is the one conductor of the ten that a clamp on the board cannot answer: it carries 30 W
      of transmitter output, where a diode array's capacitance would spoil the match, and its sibling J_ANT is
      already answered off board by the PolyPhaser GTH-SFF-AL at the bulkhead. Its honest options are a second
      arrestor of the same kind, declared off board the way J_ANT is, or the ruling that it shares J_ANT's.
      The parts above are candidates with stock and a price, not a choice: what clamps at what voltage and what
      pulse rating is decided by the level in decision 34, which is why that one is asked first. And that level
      had no proposal at all until the evening of 17 September: the envelope settled temperature, storage and
      the carve-outs and said in its own words that it settled no transient level, while the approved test plan
      ran MIL-STD-461's CE102, CS101, CS114, RE102 and RS103 and carried no electrostatic discharge method at
      all, so the one transient a person actually applies to this kit, by touching a connector after walking
      across a floor, was neither specified nor planned for. Section 6 of v2/docs/OPERATING-ENVELOPE.md now
      PROPOSES the levels and TEST-PLAN.md carries M7 as the method, and the proposal says which of its three
      rows has an authority: the electrostatic row is traceable to a part this design already buys and is the
      one this decision needs, the surge row describes what is fitted rather than constraining it, and the
      fast-transient row has no source in this tree and is marked unverified rather than required. A clamp is
      chosen against a level, so what stands between this decision and a part number is a RULING on that first
      row, not a gap."
  - n: 32
    title: "board D's last return via sits at 2.25 mm where every site inside 1.5 mm is another net's copper"
    asked: 2026-09-16
    status: ruled
    authority: SESSION
    authority_why: >-
      the number is the TOOL'S OWN and no owner judgement is standing: return_via's fixer already places a ground
      via on rings out to 3.0 mm, so a judge that refuses at 1.5 what its own fixer places at 3.0 is two rules
      rather than one. It spends nothing, moves no copper and accepts no residual risk a measurement here could
      remove, because every via it accepts now carries its own distance in the verdict. WHAT IS NOT TAKEN: the
      vias beyond the reach, which stay failures with their numbers.
    ruled_by: SESSION
    ruled_on: 2026-09-21
    outcome: >-
      ACCEPT THE REACH AT 3.0 MM, THE DISTANCE THIS PROJECT'S OWN FIXER ALREADY PLACES AT, AND RECORD THE DISTANCE
      PER VIA. The screen stays at 1.5 mm for every board; a board that has measured what it cannot satisfy inside
      it declares `return_reach_mm` with this decision as the reason, and boards C, D and E do. `return_via`
      measures instead of answering yes or no: every flagged via carries the distance to its nearest ground via, a
      via within the declared reach is SATISFIED with that distance on the record, and one beyond it or with none
      at all stays a failure with its number. MEASURED ON THE THREE COMMITTED BOARDS, read-only with each sha
      identical before and after: BOARD D goes FAIL to PASS of 37, its single via answered at 1.58 mm. BOARD E
      goes six lacking to TWO, five answered between 1.50 and 2.27 mm, and what stands is FAN1_PWM with NO ground
      via within six millimetres and one SDA0 at 3.39. BOARD C goes THIRTY-TWO lacking to ELEVEN, twenty-one
      answered between 1.50 and 3.00, and what stands is 3.18 to 5.99 mm on eight of them and THREE WITH NO GROUND
      VIA WITHIN SIX MILLIMETRES (USB_DP_R, HB1, HB3). SO THE RULING ANSWERS BOARD D AND MAKES BOARDS C AND E
      SMALLER AND TRUE, and the residue is a different finding from the one this decision was asked about: it is
      not a screening distance, it is vias whose return has to travel four to six millimetres or has nowhere to
      go, and it belongs to each board's next phase with the coordinates now on the record. The decision's own
      evidence, written from the FIXER's log on 17 September, said board C's thirty-two sat at 1.50 or 1.75 mm;
      the JUDGE reads twenty-one inside 3.0 and eleven past it, so that half of the evidence was the fixer's view
      of what it had placed and not the board's.
    reversed_by: >-
      set status to reopened and remove return_reach_mm from tools/boards/c.json, d.json and e.json, which puts
      all three back to the 1.5 mm screen as written (board D returns to FAIL with one via at 1.58 mm). The
      per-via distances stay recorded either way: measuring is not the decision
    ask: "accept the reach beyond 1.5 mm where every nearer site is occupied, or move the parts"
    recommendation: >-
      accept the reach beyond 1.5 mm and record the distance per via, because a longer return loop is a shorter
      one than none: it is five vias on boards D and E at 1.75 to 2.25 mm and thirty-two on board C, and buying
      the last 0.75 mm costs a placement and a route on boards that are finished copper
    evidence: "BOARD E IS THE SAME CASE AND IS MEASURED NOW (17 September 2026). Of its 131 signal vias the rule
      judges 60: 79 sit in fine-pitch fans and 65 carry a signal with no edge worth a return loop. Four are
      left, and for each one the fixer searched outward and found the nearest FREE ground site beyond the
      declared 1.5 mm: E6_BST at 1.75 mm, Q1_G at 1.75, Q2_G at 1.75, USB_E6_N at 2.25. It takes them, because
      a longer return loop is a shorter one than none, and the judge is not moved by a via outside the radius,
      so they reach this decision as a measured choice rather than disappearing into a pass. Board D's single
      site reads 2.25 mm the same way. The two boards together are five vias.
      BOARD C IS THE SAME CASE AND IT IS THE LARGEST OF THE THREE (17 September 2026). Its cut board C24 has
      THIRTY-TWO of 85 judged signal vias with no ground via inside the declared 1.5 mm, and the fixer log shows
      the same sentence over and over: the nearest FREE ground site is 1.50 or 1.75 mm away, beyond the
      declaration, and it was taken. The ground-via grid was run on this board as the alternative answer and it
      does move this rule, 32 lacking of 85 down to 12 of 69, but it costs the board its route (21 open
      connections against zero) and is refused with those numbers in boards/c.json. So board C has no second
      way to satisfy the 1.5 mm as written, and the question this decision asks is the only one left for it."
    blocks:
      RET-004: [c, d, e]
