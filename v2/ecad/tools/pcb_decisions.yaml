      GND-002: [a, b, c, d, e, p]
      INT-002: [b]
  - n: 30
    title: "ZEROIZE is a switch wired to nothing that can act on it"
    asked: 2026-09-16
    status: open
    ask: "which device performs the wipe, and on what edge"
    recommendation: >-
      the panel controller does the wipe on the falling edge, because it is the only device that both sees the
      switch and can reach the secure element, and the drives are erased by the modules on its message with the
      limitation written down: a module that is not running cannot be erased by anything on this line. It is
      firmware and a sentence in the software contract, not a conductor
    evidence: "THE TITLE IS TOO HARSH ON THE HARDWARE AND THE NETLISTS SAY SO (read 17 September 2026). The
      line reaches exactly one processor and that processor can reach the thing to be erased. On board C,
      ZEROIZE_HW carries the panel switch SW_ZERO, its pull R10 and its capacitor C20 to U3 PIN 34, the RP2040
      panel controller, so operating the switch is a falling edge ON A GPIO OF A LIVE CONTROLLER. That same
      controller sits on the panel I2C bus (U3.2 and U3.3 on SDA and SCL), the bus leaves board C on J_PANEL
      pins 4 and 5, and on board B the SECURE ELEMENT IS ON IT: U8, the ATECC608B at 0x60, whose own value
      string in the schematic reads 'keys behind ZEROIZE'. So the hardware path from the switch to the secure
      element is complete today, through the panel controller and its own bus.
      What is true of the rest of the line is that it only travels: board B carries it from J_AB1 pin 20 to
      J_PANEL pin 10 with a test point, board A from J_AB1 pin 20 to J_MEZZ1 pin 15 with a pull, and on board D
      it arrives at J_HARN1 pin 15 and ends at a test point. No device on A, B or D listens to it.
      So this is a choice and a piece of firmware rather than a missing conductor, FOR THE SECURE ELEMENT. The
      encrypted drives are the other half and they hang off the compute modules, which do not see this line at
      all: erasing those needs a module that is running, which is the part the ask has to settle."

    blocks:
      SCH-004: [a, b, c, d, e, p]
  - n: 31
    title: "conductors leave the case and meet a chip with nothing in between, or only through an active part"
    asked: 2026-09-16
    status: open
    ask: "clamp every exposed conductor at its entry, or accept the three paths that reach their clamp through an active part"
    recommendation: >-
      rule decision 34 first, then clamp at the entry every conductor that reaches a semiconductor with nothing
      between it, which is board D's seven and board E's three and is the cheap half: those are parts and board
      area on boards whose copper is finished. The three paths that reach their clamp through an active part are
      the expensive half and are worth accepting only where that active part is itself rated for the level the
      envelope states, which is why the envelope comes first
    blocks:
      TRN-001: [a, d, e]
      # 19 September 2026: the hold's downstream half, which the per-board set gate has been writing in its
      # own words the whole time ("this board is HELD by an open owner decision, so its paperwork is not
      # current and cannot be made current while the hold stands") while the register said this decision held
      # three pairs. A folder cannot be cut for a held board, so DOC-001 on those three boards is this
      # decision's too. OUT-001 is NOT added: the set gate names three causes today, this hold, board B's
      # quote folder and a certification that could not ask, so attributing it here would be an over-claim.
      DOC-001: [a, d, e]
    evidence: "BOARD D IS IN THIS DECISION TOO, AND ITS GATE HAD BEEN SAYING SO WHILE THE REGISTRY SAID THE RULE
      DID NOT APPLY TO IT (17 September 2026). Board D declares four connectors whose conductors leave the case
      and `port_protect` reads SEVEN of its SEVEN judged conductors reaching a semiconductor with nothing
      between: J_HS1 and J_HS2, the two headset jacks on the face that a person plugs a headset into, three
      conductors each (speaker, microphone, push to talk), and J_PAOUT, the 30 W power amplifier output. Its
      antenna jack J_ANT is the one that is answered: it is protected off board by the PolyPhaser GTH-SFF-AL
      arrestor at the bulkhead. The measurement was taken by cutting board D's deliverable folder, which the
      gate refused at that stage, so this is what stands between board D and the folder DOC-001 asks for.
      Boards A and E carry the rest: three boards, TWENTY-FIVE judged conductors and THIRTEEN of them failing,
      and boards E and D are finished copper held on it.
      THE WHOLE PACKET, CONDUCTOR BY CONDUCTOR, AND THREE OF ITS ROWS WERE WRONG UNTIL THIS EVENING (17
      September 2026). The chain that follows a conductor to its clamp could cross a semiconductor and keep
      going, step onto a ground, or leave a rail through a pull-up, and board E's sensor pod took the SHORE
      INLET'S SMCJ40A as its protection three times over: SDA1 crossed the RP2040 onto SHORE_INHIBIT, crossed a
      transistor onto GND_V and read the clamp sitting there, and the pod's 3.3 V feed left its own rail through
      a 10k pull-up onto the hot-swap controller's power-good net and arrived at the same part. A clamp more
      than one hop past the first active part belongs to another circuit; a ground is where the search stops
      whatever the board calls it; a rail continues through a fuse, a bead, a choke or a series diode and never
      through a pull-up. No board's result moves, and the packet does:
      of TWENTY-FIVE judged conductors (board A thirteen, board D seven, board E five) THIRTEEN fail, TEN of
      them reaching a semiconductor with nothing between and THREE meeting their clamp only through an active
      part. The other twelve are answered where they stand, and one of them is the shape the rest should take:
      board E's solar input meets its own clamp before anything else.
      The three: board A J_USBC_OUT.2 and .3, the USB-C outlet's two CC conductors, which reach U18 (TPS25740A
      PD source controller) and whose clamp D4 (SMBJ18A) sits on PD_VBUS, a different conductor of the same
      connector; and board E J_DCIN.1, the shore inlet, connector to F1 (10 A) to Q1 (BSC039N06NS ideal-diode
      FET) to D1 (SMCJ40A on DC_P), which is the textbook shape of this question, the fuse and the clamp in the
      right places with one semiconductor in front of the clamp.
      The ten: board D J_PAOUT.1 (the 30 W amplifier output), J_HS1.1, .3, .5 and J_HS2.1, .3, .5 (both headset
      jacks, speaker, microphone and push to talk each), and board E J_POD.1, .3 and .4, the outside sensor
      pod's 3.3 V feed and its two I2C conductors, which run to the RP2040 with nothing in between.
      Board B's eight Ethernet conductors and board C's four switch conductors are answered where they stand,
      by T1's magnetics and by the optocouplers, and board P declares that nothing of its own leaves the case.
      WHAT THE CHEAP HALF COSTS, AND BOARD E'S THREE ARE ONE PART THIS DESIGN ALREADY BUYS (17 September 2026,
      prices from JLCPCB's own parts API). The pod's 3.3 V feed and its two I2C conductors are the shape the
      USBLC6-2SC6 is drawn for, two lines and their supply rail in one SOT-23-6, and this project already uses
      it through kisch.esd on five USB ports of board B and, conductor for conductor the same case, on board P's
      SMBus pair. It is C7519, 25,352 in stock at about 0.08 USD, it has its datasheet in the tree
      (v2/vendor/st/st-usblc6-2-esd-protection.pdf), its footprint is drawn and its net-tie pad groups are
      handled, so board E's whole pod costs ONE part and no new part number.
      Board D's two headset jacks are not that case: each carries a speaker line, a microphone line and a push
      to talk, and an audio output that swings below ground wants a BIDIRECTIONAL clamp rather than the
      rail-referenced array a data line takes. The shape that fits is a four-channel bidirectional array, one
      per jack, three conductors and a spare: the Semtech RClamp0524P is C40960, 153,808 in stock at 0.066 USD,
      rated plus and minus 5 V working, and the alternatives are Littelfuse's SP3012-04UTG (C151304, 10,629 at
      0.2368) and ST's ESDA6V1W5 (C48677, 20,825 at 0.16). Two parts a board, about 0.66 USD over the owner's
      five boards. Which of them is a circuit question for board D's generation, because it turns on the
      codec's own output swing and the microphone bias, and none of them is a choice until decision 34 states
      the level.
      So the parts are pennies either way, and the price of the ruling is not the parts: it is that boards D and
      E are FINISHED COPPER, so each one costs a placement, a route and a new folder. Board E's is owed whatever
      this decision says, since 17 September evening: its hot-swap pass FET Q7 was written with a three-pin map
      on a five-pad land, gate and drain on two SOURCE pins and the drain tab floating (appendix 32.219, rule
      SCH-005), so the E11 copper is not a candidate for anything and the clamps ride the same regeneration.
      Board D's J_PAOUT is the one conductor of the ten that a clamp on the board cannot answer: it carries 30 W
      of transmitter output, where a diode array's capacitance would spoil the match, and its sibling J_ANT is
      already answered off board by the PolyPhaser GTH-SFF-AL at the bulkhead. Its honest options are a second
      arrestor of the same kind, declared off board the way J_ANT is, or the ruling that it shares J_ANT's.
      The parts above are candidates with stock and a price, not a choice: what clamps at what voltage and what
      pulse rating is decided by the level in decision 34, which is why that one is asked first. And that level
      had no proposal at all until the evening of 17 September: the envelope settled temperature, storage and
      the carve-outs and said in its own words that it settled no transient level, while the approved test plan
      ran MIL-STD-461's CE102, CS101, CS114, RE102 and RS103 and carried no electrostatic discharge method at
      all, so the one transient a person actually applies to this kit, by touching a connector after walking
      across a floor, was neither specified nor planned for. Section 6 of v2/docs/OPERATING-ENVELOPE.md now
      PROPOSES the levels and TEST-PLAN.md carries M7 as the method, and the proposal says which of its three
      rows has an authority: the electrostatic row is traceable to a part this design already buys and is the
      one this decision needs, the surge row describes what is fitted rather than constraining it, and the
      fast-transient row has no source in this tree and is marked unverified rather than required. A clamp is
      chosen against a level, so what stands between this decision and a part number is a RULING on that first
      row, not a gap."
  - n: 32
    title: "board D's last return via sits at 2.25 mm where every site inside 1.5 mm is another net's copper"
    asked: 2026-09-16
    status: open
    ask: "accept the reach beyond 1.5 mm where every nearer site is occupied, or move the parts"
    recommendation: >-
      accept the reach beyond 1.5 mm and record the distance per via, because a longer return loop is a shorter
      one than none: it is five vias on boards D and E at 1.75 to 2.25 mm and thirty-two on board C, and buying
      the last 0.75 mm costs a placement and a route on boards that are finished copper
    evidence: "BOARD E IS THE SAME CASE AND IS MEASURED NOW (17 September 2026). Of its 131 signal vias the rule
      judges 60: 79 sit in fine-pitch fans and 65 carry a signal with no edge worth a return loop. Four are
      left, and for each one the fixer searched outward and found the nearest FREE ground site beyond the
      declared 1.5 mm: E6_BST at 1.75 mm, Q1_G at 1.75, Q2_G at 1.75, USB_E6_N at 2.25. It takes them, because
      a longer return loop is a shorter one than none, and the judge is not moved by a via outside the radius,
      so they reach this decision as a measured choice rather than disappearing into a pass. Board D's single
      site reads 2.25 mm the same way. The two boards together are five vias.
      BOARD C IS THE SAME CASE AND IT IS THE LARGEST OF THE THREE (17 September 2026). Its cut board C24 has
      THIRTY-TWO of 85 judged signal vias with no ground via inside the declared 1.5 mm, and the fixer log shows
      the same sentence over and over: the nearest FREE ground site is 1.50 or 1.75 mm away, beyond the
      declaration, and it was taken. The ground-via grid was run on this board as the alternative answer and it
      does move this rule, 32 lacking of 85 down to 12 of 69, but it costs the board its route (21 open
      connections against zero) and is refused with those numbers in boards/c.json. So board C has no second
      way to satisfy the 1.5 mm as written, and the question this decision asks is the only one left for it."
