far_ends:
  # THE KIT'S OWN BOARD-TO-BOARD NETS: answered from the continued boards' committed netlists, pin by pin (the kit I2C
  # bus, the expanders' wired-OR interrupt, the supervisors' heartbeats, the transmit request, the gauge's SMBus).
  - id: KIT-I2C
    board: a
    nets: ["SCL", "SDA"]
    via: ["J_AB1", "J_MEZZ1"]
    continues: [b, c, d]
    basis: >
      the kit I2C bus runs on boards A, B, C and D under the same net names (v2/docs/HW-FW-CONTRACT.md section 6;
      v2/docs/records/hc5/kit_i2c_budget.py lists its parts from the committed netlists)
    members: ["A: INA226 x6, PCA9555 x2, BQ25731", "B: KSZ9897, TMP117, STM32H743 x3, TPS23861, PCA9555 x2, ATECC608B, DS3231",
              "C: PCA9555 x2, RP2040, VEML7700", "D: PCA9555, ADS1115"]
  - {id: KIT-I2C-B, board: b, nets: ["SCL", "SDA"], via: ["J_AB1", "J_PANEL"], continues: [a, c, d], basis: "as KIT-I2C", members: ["as KIT-I2C"]}
  - {id: KIT-I2C-C, board: c, nets: ["SCL", "SDA"], via: ["J_PANEL"], continues: [a, b, d], basis: "as KIT-I2C", members: ["as KIT-I2C"]}
  - {id: KIT-I2C-D, board: d, nets: ["SCL", "SDA"], via: ["J_HARN1"], continues: [a, b, c], basis: "as KIT-I2C", members: ["as KIT-I2C"]}
  - id: KIT-EXP-INT
    board: a
    nets: ["EXP_INT"]
    via: ["J_AB1", "J_MEZZ1"]
    continues: [b, c, d]
    basis: >
      the wired-OR expander interrupt to the panel controller's GPIO24 (HW-FW-CONTRACT.md FW-C14: A:U27 pin 1 with
      R110, J_AB1 pin 13, B:J_PANEL pin 6), EXP_INT on boards A, B, C and D
    members: ["A: PCA9555 x2", "B: PCA9555 x2, DS3231, KSZ9897, TPS23861, TMP117", "C: PCA9555 x2, RP2040", "D: PCA9555"]
  - {id: KIT-EXP-INT-B, board: b, nets: ["EXP_INT"], via: ["J_AB1", "J_PANEL"], continues: [a, c, d], basis: "as KIT-EXP-INT", members: ["as KIT-EXP-INT"]}
  - {id: KIT-EXP-INT-C, board: c, nets: ["EXP_INT"], via: ["J_PANEL"], continues: [a, b, d], basis: "as KIT-EXP-INT", members: ["as KIT-EXP-INT"]}
  - {id: KIT-EXP-INT-D, board: d, nets: ["EXP_INT"], via: ["J_HARN1"], continues: [a, b, c], basis: "as KIT-EXP-INT", members: ["as KIT-EXP-INT"]}
  - {id: PANEL-HEARTBEATS, board: b, nets: ["HB?"], via: ["J_PANEL"], continues: [c],
     basis: "the supervisors' heartbeats HB1 to HB3 run over the panel ribbon to the panel controller (board C's HB1 to HB3)", members: ["C: RP2040 U3"]}
  - {id: PANEL-HEARTBEATS-C, board: c, nets: ["HB?"], via: ["J_PANEL"], continues: [b],
     basis: "the heartbeats' drivers are board B's three supervisors", members: ["B: STM32H743 U41, U51, U61"]}
  - {id: C-TR-APRS, board: c, nets: ["TR_APRS"], via: ["J_PANEL"], continues: [a, b, d],
     basis: "TR_APRS runs D's J_HARN1 pin 7, A's J_MEZZ1 and J_AB1, B's J_AB1 pin 14 and J_PANEL pin 7 to board C; board D drives it from its PTT mirror U18 across R48 (220 ohm)", members: ["D: 74LVC1G34 U18"]}
  # the same net as the boards it passes through see it: their connectors lead back into the set (second pass: a
  # connector of a continued board that no record names leaves the net UNDECIDED, so the links are written)
  - {id: A-TR-APRS, board: a, nets: ["TR_APRS"], via: ["J_AB1", "J_MEZZ1"], continues: [b, c, d], basis: "as C-TR-APRS", members: ["as C-TR-APRS"]}
  - {id: B-TR-APRS, board: b, nets: ["TR_APRS"], via: ["J_AB1", "J_PANEL"], continues: [a, c, d], basis: "as C-TR-APRS", members: ["as C-TR-APRS"]}
  - {id: D-TR-APRS, board: d, nets: ["TR_APRS"], via: ["J_HARN1"], continues: [a, b, c], basis: "as C-TR-APRS", members: ["as C-TR-APRS"]}
  - {id: E-SMBUS, board: e, nets: ["SMB?"], via: ["J_SMB"], continues: [p],
     basis: "the SMBus lead to board P's gauge (HW-FW-CONTRACT.md FW-E01)", members: ["P: BQ4050 U1"]}
  - {id: P-SMBUS, board: p, nets: ["SMBC", "SMBD"], via: ["J_SMB"], continues: [e],
     basis: "the SMBus lead to board E's sensor controller (HW-FW-CONTRACT.md FW-E01)", members: ["E: RP2040 U10"]}
  # beyond the kit's boards: the parts named by the connector's value field and the records cited
  - {id: USBC-OUTLET-CC, board: a, nets: ["PD_CC?"], via: ["J_USBC_OUT"], families: [FAR-USB-PD-SINK],
     basis: "the wall USB-C outlet: the plugged device's CC", members: ["an external USB PD sink"]}
  - {id: M2-5G-SOCKET, board: b, nets: ["SIM*", "5G_*"], via: ["J_M2C2"], families: [FAR-QUECTEL-RM520N],
     basis: "the M.2 B-key socket's RM520N-GL (J_M2C2's value field)", members: ["Quectel RM520N-GL"]}
  - {id: SIM-SOCKETS, board: b, nets: ["SIMC*"], via: ["J_SIM1", "J_SIM2"], families: [FAR-SIM-CARD],
     basis: "the nano-SIM sockets", members: ["a SIM card"]}
  - {id: ROCKBLOCK, board: b, nets: ["RB_*"], via: ["J_RB9704"], families: [FAR-ROCKBLOCK-9704],
     basis: "J_RB9704's value field: RockBLOCK 9704 16-pin", members: ["RockBLOCK 9704"]}
  - {id: B-FANS, board: b, nets: ["FAN_*"], via: ["J_FAN?"], families: [FAR-FAN-TACH],
     basis: "the CM5 coolers' fans (J_FAN1 to J_FAN3: 5V GND TACHO PWM)", members: ["IP68 cooler fans"]}
  - {id: B-HDMI-OUT, board: b, nets: ["HDMIO_*"], via: ["J_HDMI"], families: [FAR-HDMI-SINK],
     basis: "the HDMI receptacle's cable to the face-plate monitor", members: ["Xenarc 709GNK"]}
  - {id: B-BENCH, board: b, nets: ["*"], via: ["J_DBG?", "J_ZBDBG?", "J_GNSS2", "J_SPI3", "U42", "U52", "U62"], families: [FAR-BENCH-PROBE],
     basis: "bench headers and pads (their value fields say bench, breakout or SWD)", members: ["a bench probe or adapter"]}
  - {id: C-EPD, board: c, nets: ["EPD_*"], via: ["J_EPD"], families: [FAR-PDI-EPD],
     basis: "the E2370KS0C1 flex on J_EPD", members: ["PDi E2370KS0C1"]}
  - {id: E-LIGHTNING, board: e, nets: ["LTG_IRQ", "SCL1", "SDA1"], via: ["J_LTG"], families: [FAR-AMS-AS3935],
     basis: "J_LTG's value field: AS3935 lightning sensor module", members: ["AS3935 module"]}
  - {id: E-POD, board: e, nets: ["SCL1", "SDA1"], via: ["J_POD"], families: [BOSCH-BME688, FAR-AMS-AS7331],
     basis: "the outside pod's sensors (appendix 32.53; the BME688 outside and the AS7331 UV sensor)", members: ["BME688", "AS7331"]}
  - {id: E-DCF, board: e, nets: ["DCF_PULSE"], via: ["J_DCF"], families: [FAR-DCF77-MODULE],
     basis: "J_DCF's value field: DCF77 receiver module", members: ["DCF77 module"]}
  - {id: E-GEIGER, board: e, nets: ["GEIGER_PULSE"], via: ["J_GEIGER"], families: [FAR-GEIGER-MODULE],
     basis: "J_GEIGER's value field: Geiger counter module", members: ["Geiger module"]}
  - {id: E-FANS, board: e, nets: ["FAN*"], via: ["J_FAN?"], why_none: "the mixer fans' motor leads: the fan drives no signal edge onto its switched lead", basis: "J_FAN1 and J_FAN2: 12 V class fans, low-side PWM", members: ["mixer fans"], families: []}
  - {id: B-HDMI-DDC, board: b, nets: ["HDMI*_SCL", "HDMI*_SDA"], via: ["U3", "U4"], families: [RPI-CM5-RECEPTACLE, FAR-HDMI-SINK],
     basis: "through the display switches TS3DV642 U3 and U4: the three CM5s' DDC (their receptacles) and the monitor's", members: ["CM5 x3", "Xenarc 709GNK"]}
  - {id: C-SWD, board: c, nets: ["SWCLK"], via: ["TP*"], undriven_land: true, families: [FAR-BENCH-PROBE],
     basis: "the RP2040's SWCLK is an input driven only by a probe on its test pad at bring-up", members: ["a bench SWD probe"]}
  - {id: E-SWD, board: e, nets: ["SWCLK"], via: ["TP*"], undriven_land: true, families: [FAR-BENCH-PROBE],
     basis: "the RP2040's SWCLK is an input driven only by a probe on its test pad at bring-up", members: ["a bench SWD probe"]}

# THE RISE OF THE OPEN-DRAIN NETS (ER-D14). The fall is in the families above, per pin. The rise is stated here for the
# kit I2C bus, whose capacitance a record of this tree has computed; for the other open-drain nets (the expanders'
# interrupt EXP_INT, the gauge's SMBus, board E's sensor bus, the modules' and the monitor's DDC) no record states a
# capacitance, so no rise is written for them: the fall governs each of them all the same.
open_drain:
  - id: KIT-I2C-RISE
    nets: {a: ["SCL", "SDA"], b: ["SCL", "SDA"], c: ["SCL", "SDA"], d: ["SCL", "SDA"]}
    fall: >
      the governing edge: each driver's pull-down, per pin, from the families above (an IBIS dV/dt_f, a published
      minimum, or a bound); the reading takes the fastest and names every driver on the net without a figure
    rise:
      kind: MODEL
      edge_ns: 150.5
      measure: "30 to 70 percent of VDD"
      derivation: >
        T = 0.8473 x Rp x Cb (UM10204 Rev. 6, 7.1) with Rp 1019 ohm, the drawn pull-ups at their low tolerance (board
        B's R54 and R55 and board C's R7 and R8, 2.2 kOhm each, with the KSZ9897R's internal 58 kOhm), and Cb
        174.3 pF on SCL: the pins at their makers' TYPICAL capacitance, 151.0 pF, and the three ribbons, 23.3 pF,
        with no copper at all, which only adds. 0.8473 x 1019 ohm x 174.3 pF = 150.5 ns (SDA, 153.0 pF of pins:
        152.2 ns). A MODEL and not a minimum: no maker publishes a least pin capacitance
      document: v2/vendor/standards/nxp-um10204-rev6-i2c-bus-specification.pdf
      sha256_16: "b7619700e8bb9dd4"
      page: 55
      quote: "T = t2 − t1 = 0.8473 × RC"
      checked:
        - {document: v2/docs/records/hc5/kit_i2c_budget.round8-d.out.txt, sha256_16: "7967404c281d4e12", quote: "pins total: bound 264.5 pF, nominal 151.0 pF; ribbons 490 mm at 47.5 pF/m = 23.3 pF", where: "the section headed SCL"}
        - {document: v2/docs/records/hc5/kit_i2c_budget.round8-d.out.txt, sha256_16: "7967404c281d4e12", quote: "effective Rp: 1019 ohm at -5 % (sink check), 1080 nominal, 1138 at +5 % (rise check)", where: "the section headed Pull-up window"}
    applicability: >
      the kit I2C bus as one segment, as the committed netlists draw it at c23c5e76. The three-segment design of
      HW-FW-CONTRACT.md 6.5 (SC-HF-02), once drawn, changes Rp and Cb per segment, and this record with them
    verification_owed: "bench item V-K01 of HW-FW-CONTRACT.md: the rise and the fall on each segment's farthest pin"
