# HOW FAST EACH DRIVER ON THESE BOARDS CAN MOVE A NET: the input of rule SI-001 (transmission-line classification)
#
# Written 27 September 2026 (MESHSAT-1357, layer 9, pre-layout design analysis) by stream w5si, on the third checkpoint
# review's instruction (sections 5 and 6): "for undocumented signal edge rates, do not insert convenient values simply
# to turn SI-001 green. Record a justified design bound or suitable model, its applicability and the verification
# still required. If the uncertainty decides feasibility, keep that decision open."
# Prototype design work: nothing here has been built or measured. Every number below is a maker's (read out of its
# datasheet or IBIS model), a standard's, or a bound stated with its derivation. None was chosen so that a rule passes.
#
# THIS FILE IS A CONFIGURATION INPUT of the edge_length verdict (rule SI-001): edge_length.py reads it on every run and
# records its sha in the reading's inputs (edge_rates). An edit here makes every board's SI-001 reading stale until it
# is re-taken, and an integration must COMMIT this file before running rules_status / rules_render (the integration
# recipe: an uncommitted configuration input reads CONFIG_CHANGED). The makers' IBIS models it cites are NOT committed
# and need not be: the tracked manifest v2/vendor/ibis-manifest.yaml pins them and is the configuration input in
# their place (ER-D17).
#
# ------------------------------------------------------------------------------------------------------------------
# THE SCHEMA
#   interfaces  decide every net of a board's signal-class entry (covers: {board letter: [entry patterns]}):
#     kind STANDARD   a specification that binds EVERY conforming driver of the interface, with the minimum it allows
#                     (statistic: min); the board table's own rise_ns, where one is written, must equal it (else FAIL)
#     kind MODEL      an edge computed from a maker's figures by a stated derivation
#     kind BOUND      a lower bound on the edge stated with its derivation and the documents checked (checked:)
#   families    decide a DRIVER, matched by `parts` (regular expressions matched at the START of the netlist's value
#               field, which begins with the part number the schematic names; never a distributor order code):
#     kind IBIS       the maker's IBIS model, read per pin by ibis_read.py: `ibis: {file, component, models}`; `models`
#                     is a regular expression admitting the model variants the circuit can select (the supply
#                     voltage, a firmware speed setting); `edge_ns` is what the file gives for the fastest admitted
#                     pin that has a figure, and a record whose edge_ns the file does not give is refused as
#                     CONTRADICTED; `flagged_pins` names the pins whose [Ramp] cell the model's own V-t table
#                     contradicts (ER-D16), which take the instantaneous bound; `supply` names the supply pins and
#                     the rail pattern the admitted models cover. The file is NOT in the repository: it is pinned by
#                     v2/vendor/ibis-manifest.yaml and fetched by tools/ibis_fetch.py (ER-D17)
#     kind DATASHEET  a published MINIMUM transition time (statistic: min) with its table and conditions
#     kind MODEL, BOUND  as above, for the driver
#     kind NOT_A_DRIVER   a part that drives no signal net (an ESD array), with the words that say so
#     kind PASSIVE_SWITCH a switch that makes no edge and passes its far side's through the pins `through` matches
#     kind CONNECTOR      a land whose far side drives its pins (a debug pad set)
#     `inputs` (a regular expression on the netlist's pin function) and `input_pins` (pin numbers) name pins that
#     drive nothing; `inputs_cited` quotes the maker's pin table for them. A PASSIVE_SWITCH names its through pins
#     (`through`, or `through_pins` by number where a netlist writes net names as pin functions) and its control
#     inputs; a pin of it that is neither leaves its net UNDECIDED, named
#     `pin_edges` give one pin its own figure. A row of kind STANDARD is a specification's minimum, and it binds a
#     part only where the part's own datasheet claims the specification: `claimed_by` quotes that claim
#   far_ends    the drivers beyond a connector (or a passive switch) on a board's named nets: `families` by id, the
#               record that names them (`basis`) and the parts it names (`members`)
#   open_drain  the RISE of open-drain nets, which no driver sets (the pull-up charging the net): `rise` with its
#               derivation. Attached to the net for the reader; never the net's governing edge (ER-D14)
#   Every record that gives an edge carries `applicability` (where the number holds) and `verification_owed` (what
#   would replace or confirm it).
#   EVERY CITATION carries the document's path, the sha256/16 of the held file it was read from (`sha256_16`), where
#   in it the words are (`page`, as pdftotext counts the pages of a PDF, the first being 1; `clause` or `where` for a
#   transcription), and the words quoted (`quote`). An IBIS record carries its model's `sha256_16`, the keyword its
#   number is under (`keyword`) and the cell as the file writes it (`ramp`). edge_length.py checks all of it on every
#   run: a document that is not held, is not the file cited, or does not say the words on the page named, and a
#   model whose keyword, cell or number differ, leave the record deciding nothing (its nets read UNDECIDED; a number
#   the model contradicts FAILs the reading). The fields were written by v2/docs/records/w5si/tools/cite_fill.py.
#   A BOUND OR MODEL SAYS WHAT WAS SEARCHED: `search_listing` below names the listing of every line, in every document
#   a bound or model cites, that carries the words a transition time is written with (rise time, fall time,
#   transition, slew rate, tr, tf and the like), written by v2/docs/records/w5si/tools/edge_search.py. A bound whose
#   cited document the listing does not hold at the held file's sha256/16 decides nothing: a quote of the part's
#   name proves a document is held, not that anyone looked in it (the independent check of 27 September 2026).
#
# ------------------------------------------------------------------------------------------------------------------
# SESSION DECISIONS, 27 September 2026, taken under the owner's standing rule of 26 September 2026 (never ask; take the
# recommended option). Each is the session's, not the owner's. ruled_by: SESSION (stream w5si). Reverse any of them
# by editing the rule named, in this file or in edge_length.py.
#   ER-D1  The data file is the declaration of every edge. Why: an edge in a board table (rise_ns) or a code constant
#          (EDGE_SOURCES) had no place for the document's conditions, the applicability or the verification owed,
#          and a board table is regenerated by the generators. A board table's own rise_ns still has to agree.
#          Reverse: restore edge_length.EDGE_SOURCES as a constant.
#   ER-D2  A driver is an IC or module (reference U...) or a transistor (Q...); a connector's pin is its far side.
#          A part with no record leaves its net UNDECIDED and is named. Why: the rule asks for the DRIVER's edge, and
#          a part nobody looked up must not be read as a slow one. Reverse: edge_length.DRIVER_PREFIXES.
#   ER-D3  A part is recognised by the part number at the start of its value field, the way intent_checks.PIN_ROLES
#          recognises one. Why: the third review (section 5) separates the manufacturer part number from the
#          distributor order code; an LCSC code names a purchase, not a part.
#   ER-D4  The FASTEST candidate on a net decides. Why: the critical length shrinks with the edge, so the fastest
#          driver is the worst case; any slower one only lengthens it.
#   ER-D5  From an IBIS model: the fastest DRIVEN 20 to 80 percent transition over every admitted model and all three
#          corners, used as it stands and not stretched to 10 to 90 percent; an open-drain output drives only its
#          fall. Why: stretching (a linear ramp's 10 to 90 percent is 4/3 of its 20 to 80) lengthens the critical
#          length, and the fixture pull-up of an open-drain model is not the part. Reverse: ibis_read.model_edge.
#          What a model cannot say: it describes the die TI or ST modelled ([File Rev] names it: d_die, k_die, x_die),
#          and the fitted part's die is not read from its order code; a later die is a question for the maker.
#   ER-D6  A net takes the drivers one two-pin resistor away (a series resistor to another signal net), once. Why:
#          their edge reaches it through the resistor, only slower, so counting it unslowed is the safe side.
#   ER-D7  A far end's family contributes its fastest pin: which of its pins sits on the far side is not read. A
#          board of this set that a net continues onto is read pin by pin from its own netlist instead, and on it a
#          connector no record names leaves the net UNDECIDED (second pass: it used to contribute nothing, silently).
#   ER-D8  A published TYPICAL or MAXIMUM transition is not an edge for SI-001, only a MINIMUM bounds the fastest
#          edge. Where a maker publishes none and no model is held, the bound is INSTANTANEOUS (0 ns): the net is
#          then a transmission line at any length and must carry an impedance target, a termination or a
#          declaration. Why: it is the one bound that needs no assumption about the part, and it can only turn a
#          verdict against the design, never for it. What it costs: a critical length of 0 mm tells a layout
#          nothing, so such a net is named under BOUND_DECIDES and its owed verification says what would narrow it.
#   ER-D9  A LAYOUT_BOUND net whose governing edge is a bound or a model (ER-D13) is named BOUND_DECIDES, with the
#          drivers on it that have no published minimum, and holds the reading INCONCLUSIVE, as every LAYOUT_BOUND net
#          does (TSN-D18 of 26 September 2026, not changed).
#   ER-D10 A firmware-set drive, slew or pin direction (the STM32H743's OSPEEDR, the RP2040's SLEWFAST, drive and
#          output enable, the CM5's GPIO drive and slew) is taken at its fastest setting, and a pin firmware holds as an
#          input is still asked as a driver. Why (corrected in the second pass; the first said the contract holds no
#          pin slow, which is wrong): v2/docs/HW-FW-CONTRACT.md DOES hold two of these pins. Row FW-K02 holds the
#          panel RP2040's GPIO0 and GPIO1 (the kit I2C bus) at the default 4 mA drive and slow slew, and row FW-B08
#          limits the STM32H743's PB6 and PB7 to I2C1 target duty (never a master, SCL stretched at most 1 ms). Neither
#          changes a figure here: Raspberry Pi publishes no transition for the RP2040 at either slew setting, so the
#          slow setting has no number to admit, and FW-B08 fixes no OSPEEDR, so every speed model of the STM32H743's
#          pads stays admitted. A contract row that fixed OSPEEDR 00 on named pins would admit only io8_ft_ls_3v3 for
#          them (6.70 ns); that row is a layer 5 proposal of this stream's record, not a fact of this file. The
#          contract is a working document and is not cited as a document by any record (it would stale every reading
#          on each edit).
#   ER-D12 (CORRECTED in the second pass.) A net decided by a bound that is ANSWERED in the netlist (an impedance
#          target, a series termination, a declaration) counts as decided, under bound_edge_nets and never under a
#          maker's figure: it is a designed transmission line whatever its edge, so its verdict does not depend on
#          the bound. The first pass also called a layout-bound net "maker-held" when any maker's figure on it gave a
#          length, on the reason that the bound then "changes a number in the table and no outcome". That reason was
#          wrong: the number is the critical length handed to the layout, and with a bound beside the maker's figure
#          that length is the bound's. ER-D13 replaces that half. Reverse the remaining half: in
#          edge_length.schematic_result, count every net decided by a bound as undecided.
#   ER-D13 THE GOVERNING EDGE of a net is the fastest edge any driver on it can produce. A driver whose maker
#          publishes no minimum has no known fastest edge, so ONE such driver on a net makes the net decided by a
#          bound, whatever the makers of the other drivers publish; their figures are recorded (maker_edge_ns) and
#          decide nothing. A net is decided by a maker's figure only when EVERY driver on it has a published minimum:
#          a maker's IBIS model, a maker's published minimum, or a standard's minimum the part's own datasheet claims.
#          Why: the independent check of 27 September 2026 found 40 of the 83 nets the first pass called maker-held
#          governed by a bound in the tool's own table (critical length 0.0 mm) and described by a maker's figure in
#          the records. Counts: decided = decided by a maker's figure + decided by a bound; layout-bound = held by a
#          maker's figure + BOUND_DECIDES. Reverse: edge_length.net_edge.
#   ER-D14 AN OPEN-DRAIN NET HAS TWO EDGES. Its FALL is the driver's pull-down: the figure every record here states
#          for an open-drain pin (an IBIS [Ramp] dV/dt_f, a published fall-time minimum). Its RISE is the pull-up
#          resistor charging the net's capacitance, T(30 to 70 percent) = 0.8473 Rp Cb (UM10204 Rev. 6, 7.1), which no
#          driver sets and which is two orders slower than the falls on the kit bus. For reflections the governing
#          edge is the fall; the rise is stated in `open_drain` and never governs. A SPECIFICATION'S MINIMUM FALL
#          (UM10204 Rev. 6 Table 9, tof, Fast-mode: 20 ns x VDD / 5.5 V, so 12 ns at 3.3 V; Table 11, Hs-mode: 10 ns;
#          Standard-mode states NO minimum) is a published figure only for a part whose own datasheet claims the
#          specification's timing. Of the parts on the kit bus one does: the KSZ9897R ("The I2C interface timing
#          adheres to the NXP I2C-Bus Specification (UM10204, Rev. 6)", DS00002330 section 6.4). The DS3231 and the
#          TPS23861 print their own minimum in their own tables. The BQ25731, ATECC608B and VEML7700 call themselves
#          I2C-compatible and print only a MAXIMUM fall or an input requirement, so they keep their bound; the
#          RP2040 (the bus master) publishes nothing. Such a minimum is measured into a capacitive bus load (10 pF or
#          more), not into a line: each record says so under conditions.
#   ER-D15 Every citation carries the held file's sha256/16 and the page of its words, and every bound names what was
#          searched (see THE SCHEMA). Why: the acceptance of this pass, and the check's finding that a part-name
#          quote proves nothing about a search. Reverse: edge_length._cite_shape and the search_listing check.
#   ER-D16 (28 September 2026, stream w5si2, on two AI reviews' findings.) A [RAMP] CELL IS HELD TO ITS MODEL'S OWN
#          V-t TABLE. Where the model carries a waveform table of the same edge in the [Ramp]'s own fixture, the cell's
#          dV must be 50 to 70 percent of the table's swing (the keyword defines it as the 20 to 80 percent swing) and
#          its dt within 25 percent of the time the table itself takes from 20 to 80 percent. A pin any of whose
#          admitted driven cells fails either has NO maker's figure: it takes the instantaneous bound (ER-D8) and its
#          net is decided by a bound. A family's edge_ns is the fastest of its pins that are not flagged, the record
#          names the flagged pins (flagged_pins) and is held to the file on both. A far end that names such a family
#          takes the bound, because which pin is on the far side is not read (ER-D7). Why: the first lens found
#          TMP117's SDA cells with dV at 15 percent of the swing, and the drafts check found PCA9555's INT cell at a
#          fifth of its table's time. Both erred short, which is the safe side, but a reader that takes a cell its own
#          model contradicts is right by luck. Why these tolerances: measured on the thirteen models, 522 of the 537
#          cells that have a table lie inside both (504 within 10 percent on dt) and the 15 outside are all of those
#          two pins' models, with dV at 11 to 39 percent or dt at 0.14 to 0.65; the tolerances sit in the gap. What it
#          changes on the six netlists: no count, because both pins sit on nets a bound already decided; the two
#          records' edge_ns (PCA9555 0.121 to 5.89 ns, TMP117 7.68 to 12.61 ns) now state the fastest pin that HAS a
#          figure. A limit, said: 48 driven cells of the thirteen models have no table of their edge (ST's reset and
#          VBUS models, TI's USB 3 and PCIe transmitter models); nothing in the file can contradict them and they are
#          read as before. Reverse: ibis_read.RAMP_DV and RAMP_DT, or ibis_read.pin_edge's FLAGGED branch.
#   ER-D17 (28 September 2026, stream w5si2.) THE MODELS ARE PINNED BY A TRACKED MANIFEST AND ARE NOT IN THE REPOSITORY.
#          v2/vendor/ibis-manifest.yaml names each model's maker, address, how the .ibs is taken out of what the
#          address serves, the sha256 of the extracted file and the words of its header on copying. A model is read
#          only when the manifest pins it, the file present is that file (full sha256) and this file's record cites
#          the same file. A model that is absent decides nothing: its nets read UNDECIDED naming it (reason kind
#          MODEL_ABSENT), the reading is INCONCLUSIVE and records the state it was taken in (inputs.model_state). An
#          IBIS record's own edge_ns is never used in the model's absence: it is a copy the model is there to hold.
#          Why: five of the thirteen headers forbid distribution and the rest grant nothing, this repository is
#          mirrored publicly, and publication is the owner's decision (held back). What it costs: a clean clone reads
#          397 more nets UNDECIDED than a tree with the models (set 6: 73 against 470) until tools/ibis_fetch.py has
#          fetched them. Reverse: commit the models (the owner's decision), and drop the ignore rule.
#   ER-D11 The STM32H743's HSLV-capable pins (IBIS selector io8_hslv_ft) are read at 3.3 V with the io8_ft 3.3 V
#          models. Why: ST's file gives that selector only the 1.2, 1.8 and 2.5 V variants of the HSLV option, which
#          DS12110 section 6.3.16 says is for supplies below 2.5 V; with it off, Table 53 ("Output timing
#          characteristics (HSLV OFF)") is one table for every FT I/O, and io8_ft_*_3v3 is ST's model of it.
schema_version: 2
written: "2026-09-27"
search_listing: {path: v2/docs/records/w5si/readings/edge-search.txt, sha256_16: "d08bc489782c976b"}

interfaces:
  - id: USB2-HS
    kind: STANDARD
    edge_ns: 0.5
    statistic: min
    measure: "10 to 90 percent"
    document: v2/vendor/standards/usb-2-0-specification-2024-09-27.md
    sha256_16: "2ecb40606d4b84fe"
    clause: "USB 2.0 section 7.1.2.2, THSR and THSF, 10 to 90 percent, a minimum"
    quote: "high-speed differential rise and fall times must be 500 ps or longer"
    conditions: "a high-speed transmitter into its specified load"
    applicability: "every USB 2.0 high-speed transmitter on these lines, the hub's and the host's alike"
    verification_owed: "none for the edge; the lines' impedance and length match are the layout gate's"
    covers:
      a: ["USB_*_P", "USB_*_N"]
      b: ["USB_*_N", "USB_*_P", "USB_OTG_*", "*_DM", "*_DP"]
      d: ["USB1_?R", "USB*_P", "USB*_N", "HUB_DP*", "HUB_DM*"]
  - id: USB2-FS
    kind: STANDARD
    edge_ns: 4.0
    statistic: min
    measure: "10 to 90 percent"
    document: v2/vendor/standards/usb-2-0-specification-2024-09-27.md
    sha256_16: "2ecb40606d4b84fe"
    clause: "USB 2.0 Table 7-9, TFR and TFF, 10 to 90 percent, a minimum"
    quote: "| Rise time | TFR | Figure 7-8, Figure 7-9 | 4 | 20 | ns |"
    conditions: "a full-speed driver into the specified 50 pF load"
    applicability: "every USB 2.0 full-speed driver on these lines (the RP2040's device port, board E's hub port)"
    verification_owed: "none for the edge"
    covers:
      c: ["USB_PNL_*", "USB_D*_R"]
      e: ["USB_*"]
  - id: LINK-CONTROLLED-B
    kind: BOUND
    edge_ns: 0.0
    derivation: >
      The multi-gigabit links of board B (PCIe from the Compute Modules and the three PCIe switches, the USB 3 lanes
      of the hubs and the host multiplexers, HDMI TMDS through the display switches, the Gigabit Ethernet MDI of the
      modules and the switch) each carry at least one transmitter whose maker publishes no lowest edge that applies
      here: the CM5 datasheet gives the links' impedance and matching and no transmitter edge, the KSZ9897R's only
      published transition (3 to 5 ns) is its 100BASE-TX mode and not the 1000BASE-T these ports run, and TI's own
      IBIS model of the TUSB8041 gives its USB 3 transmitter a 20 to 80 percent ramp of 6 to 23 ps. One maker does
      publish a minimum: the PI7C9X2G404SL's PCIe transmitter, 0.125 and 0.15 unit intervals (25 to 60 ps at 5 and
      2.5 GT/s); the far end of each of its lanes is a module or a card that publishes none, so the lanes stay on the
      bound (ER-D13). The bound is instantaneous (ER-D8): every net of these entries is a transmission line at any
      length on this board and must carry an impedance target, which is the question the reading then asks.
    checked:
      - {document: v2/vendor/cm5/cm5-datasheet.pdf, sha256_16: "80070fefd8db6e8a", page: 9, quote: "PCIe differential signals should be routed as 90 Ω differential pairs"}
      - {document: v2/vendor/microchip/microchip-ksz9897-datasheet.pdf, sha256_16: "72b89179ed6a42a7", page: 170, quote: "100BASE-TX Transmit (Measured Differentially After 1:1 Transformer)"}
      - {document: v2/vendor/ti/ibis/tusb8041rgc.ibs, sha256_16: "925a6c7f6917401e", where: "the keyword quoted", quote: "[Model]       usb3_DE"}
      - {document: v2/vendor/diodes/diodes-pi7c9x2g404sl.pdf, sha256_16: "675fa7ee40c91ad6", page: 83, quote: "Transmitter rise and fall time"}
    applicability: "board B's controlled high-speed classes named in covers, whatever drives them"
    verification_owed: >
      none decides a verdict here while every net of these entries carries an impedance target; were one to lack
      it, the net would be named under BOUND_DECIDES, and the link's own specification (PCIe Base 2.0, USB 3.2, HDMI,
      IEEE 802.3 clause 40, none held) or the transmitter's IBIS-AMI model would give it a length
    covers:
      b: ["PCIE*_RX_*", "PCIE*_TX_*", "PCIE*_RXSW_*", "PCIE*_CLK_*", "PCIE*_RCLK*", "NVME*_RX_*", "NVME*_TX_*",
          "NVME*_CLK_*", "CARD*_RX_*", "CARD*_TX_*", "CARD*_CLK_*", "HOST*_*", "HUB*_D*TX_*", "BANK*_UP*", "MUX*_A*",
          "SWP*_*", "ETH*_P*", "MDI_*", "HDMI*_CK_*", "HDMI*_D*_*", "LIME_SS*"]
  - id: RF-LINES
    kind: BOUND
    edge_ns: 0.0
    derivation: >
      An RF line carries a radio's carrier and its modulation: a signal band-limited to the band's upper edge f, whose
      fastest 10 to 90 percent swing is no shorter than 0.255 / f by Bernstein's inequality (a slope of at most 2 pi f
      times the amplitude). No record here holds each radio's f yet, so the bound written is the instantaneous one
      (ER-D8), which every band satisfies: each line is then a transmission line at any length and must carry an
      impedance target (the kit's 50 ohm RF classes).
    checked:
      - {document: v2/vendor/nicerf/nicerf-sa868-datasheet-v1.3.pdf, sha256_16: "938ef5ef5007df6b", page: 2, quote: "SA868"}
      - {document: v2/vendor/quectel/lg290p03-hardware-design-v1.1.pdf, sha256_16: "422ca9a2aa5495c1", page: 1, quote: "LG290P"}
    applicability: "the RF classes named in covers: antenna feeds, the blind-mate RF lines, the WiFi changeover ports"
    verification_owed: >
      the band edge of each radio from its datasheet would give a line its 0.255 / f length (LoRa 930 MHz: 0.27 ns;
      GNSS L1 1.61 GHz: 0.16 ns); none of that changes a verdict while each line carries its 50 ohm target
    covers:
      a: ["RF_*"]
      b: ["*_ANT", "*_RF_IN", "W?A_CARD", "W?B_CARD", "SW?_IN", "SW?_O?"]
      d: ["RF_*"]
  - id: POWER-STAGE-NODES
    kind: BOUND
    edge_ns: 0.0
    derivation: >
      A converter's switch node, bootstrap node and gate drives, and a hot-swap or ideal-diode controller's gate, move
      at a rate the controller's driver and the power FET's charge set together. The makers publish driver
      resistances and typical switching times at a test load, and LM5176's own datasheet says of the switching
      times that they come from the MOSFET's data sheet or the lab. No maker states a lowest edge for these
      circuits, so the bound is instantaneous (ER-D8).
    checked:
      - {document: v2/vendor/ti/lm5176-datasheet.pdf, sha256_16: "98191bec36d43771", page: 26, quote: "The rise (tr) and the fall (tf) times are based on the MOSFET data sheet information or measured in the lab."}
    applicability: "the gate, bootstrap and switch nodes of the power stages on boards A, B and E, and board C's e-paper boost switch"
    verification_owed: >
      the node's edge measured at bring-up, or a model per stage from the driver resistance and the FET's input and
      Miller charge; the SI-001 question for these nodes is ruled in the reading as open: the rule's failure modes
      (overshoot into a receiver's clamp, double clocking) name a receiver these nodes do not have, and their length
      is held by the power-loop and return rules, which a declaration in edge_allow would have to name
    covers:
      a: ["*_SW", "*_SW1", "*_SW2", "*_BOOT1", "*_BOOT2", "*_BOOT", "*_BST", "*_BTST?", "*_HDRV?", "*_LDRV?", "*_HIDRV?", "*_LODRV?"]
      b: ["*_BST", "*_BOOT"]
      c: ["EPD_SW"]
      e: ["*_BST", "TRK_BOOST*", "TRK_TG*", "TRK_BG*", "TRK_CS", "HS_GATE", "Q?_G"]
  - id: OSCILLATOR-NODES
    kind: BOUND
    edge_ns: 0.0
    derivation: >
      A crystal oscillator's input and output nodes carry the amplifier's output shaped by the crystal and its load
      capacitors. No maker of these oscillators (the RP2040's XOSC, the STM32H743's HSE, the KSZ9897R's, the TUSB2046B's
      and the PCM2912A's) states the amplifier's transition, and the pin's GPIO model does not describe it. The bound
      is instantaneous (ER-D8).
    checked:
      - {document: v2/vendor/rp2040/rpi-rp2040-datasheet.pdf, sha256_16: "be56fbb75ba0ae9e", page: 217, quote: "The Crystal Oscillator (XOSC) uses an external crystal to produce an accurate reference clock."}
      - {document: v2/vendor/st/st-stm32h743xi-datasheet-rev11.pdf, sha256_16: "f6e620179006c8c4", page: 123, quote: "High-speed external user clock generated from an external source"}
    applicability: "the crystal nodes named in covers"
    verification_owed: >
      none a desk can do: the placement and loading of each crystal are rule CLK-001's, and whether SI-001 asks
      anything of a node a few millimetres long is the declaration question the reading leaves open
    covers:
      b: ["*_XI", "*_XO"]
      c: ["XIN", "XOUT*"]
      d: ["HUB_XTAL*", "PCM_XT*"]
      e: ["XIN", "XOUT*"]
  - id: CABLE-SIDE-TERMINATION
    kind: BOUND
    edge_ns: 0.0
    derivation: >
      Board B's BOB is the common node of the line-side (Bob Smith) termination of the wall Ethernet port: the
      magnetics' cable-side centre taps of pairs C and D (MCT3, MCT4) through R9 and R10, 75 ohm, to this node, and
      C33, 1 nF 2 kV, from it to ground. No part of the board drives it. What it carries is the cable's: the
      common-mode part of both ends' transmitters through the magnetics, and whatever the cable brings (a discharge,
      a fast transient), whose edge no document of this board bounds. The bound is instantaneous (ER-D8)
    checked:
      - {document: v2/vendor/cluster/ksz989x-hw-design-checklist.pdf, sha256_16: "2a9d80931a0bed4b", page: 10, quote: "The common node is then connected to chassis ground through a 1000 pF, 2 kV capacitor."}
      - {document: v2/vendor/ti/tps23861-datasheet.pdf, sha256_16: "65262ce4766a5f8e", page: 91, quote: "bypassed to a chassis ground (or system earth ground) with a high-voltage capacitor"}
    applicability: "board B's BOB, the one net of the entry"
    verification_owed: >
      none a desk can do for an edge: SI-001 asks what terminates a driven line, and this net IS a termination. What
      holds its copper is not a critical length: it is the maker's layout guidance (no signal ground under the
      magnetics, the connector and the area between; the termination returned to chassis ground), the isolation
      clearance its 2 kV capacitor implies (ISO-001) and the chassis strategy (GND-002). No signal class of this
      project asks those questions today; the class proposed for it is a finding for the integrator,
      v2/docs/records/w5si/F-BOB-common-mode-termination.md. The reading's series-resistor screen answers the net
      with R9 and R10 (75 ohm to MCT3 and MCT4), which are the termination itself and no source termination of a
      driver: the screen says of itself that it cannot tell. No declaration is written for the net
    covers:
      b: ["BOB"]

