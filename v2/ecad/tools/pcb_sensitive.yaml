    # milliohm resistor on all six committed netlists says the set carries TWENTY current-sense shunts and the
    # report had been told about FOUR. Board A alone carries seventeen and declared two, both the charger's.
    # Ten of the fifteen it never mentioned are declarable today and they are here: each LM5176 stage has an
    # ISNS shunt in its own output path, and the controller reads it with NO filter at all, ISNS(-) on pin 13
    # and ISNS(+) on pin 14 straight onto the two nets the shunt separates (the stage helper writes pin 13 to
    # the output rail and pin 14 to the stage's OUT net). So the tap IS the IC pin, the element is the shunt's
    # own pad, and the error is the drop in the rail's copper between them.
