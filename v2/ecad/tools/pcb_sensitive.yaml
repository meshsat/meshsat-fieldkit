# THE NODES THAT MUST NOT BE DISTURBED (rule ANA-001, MESHSAT-862, 16 September 2026).
#
# The rule asks for a list per board of the sensitive nodes with, for each, its reference, its filter and its
# clearance from switching nodes, and Kelvin connections where the measurement demands it. It read "generation
# intends to comply and nothing verifies it" on four boards.
#
# A sensitive node here is one where a few millivolts change the answer: a feedback divider that sets a rail's
# voltage, a shunt sense pair that measures a current, a cell tap, a thermistor, a microphone input. Each entry
# names the FILTER that makes it quiet and, where the measurement is a difference, the KELVIN pair that makes
# it a measurement rather than an IR drop.
#
# `keep_mm` is this project's own number and is stated as such: it is the clearance asked of the layout between
# that node's copper and the copper of any switching node, and no standard in this tree sets it. The tool
# measures the real distance on the routed board and reports it beside the asked-for one, so the number can be
# argued with from evidence rather than defended.

schema_version: "1.0.0"
generated: "2026-09-16"

boards:

 e5:
   switch_nets: []
   switch_nets_why: "nothing on this board switches: it is plated contact targets, wire lands and mounting holes,
     generated from board A's own board file, and every conductor on it belongs to a circuit that lives on
     another board"
   nodes: []
   nodes_why: "THIS BOARD HAS NO ANALOGUE NODE OF ITS OWN, which is a declared zero and not a gap (17
     September 2026, when ANA-001 reached it because it carries the pack node). The pack node crosses it as
     four targets and four returns; the conductors that SENSE anything, the coulomb counter's Kelvin pair and
     the thermistor, are board P's and are declared there, and the twelve signal targets carry board A's nets
     and are declared on board A, where the parts that read them live. What this board owes the analogue rule
     is contact resistance and current, which MEC-001 and PI-001 judge."

 a:
   switch_nets: ["*_SW", "*_SW1", "*_SW2", "B33_SW", "FE_CS", "PA_CS", "HF_CS", "PD_CS", "POE_CS"]
   # WHERE A CURRENT SENSE MEETS ITS SHUNT (18 September 2026, read by kelvin_check.py, which is a REPORT and
   # decides nothing). A sense is a measurement only if both taps meet the shunt AT the shunt; a tap that lands
   # on a pour carrying the same current adds that copper's own drop to the signal. `element` is the pad that
   # defines the true node and `tap` is where the sense line actually connects, both on `rail`, because the
   # error is the drop in that rail's copper between them. The numbers come from dc_drop's solved mesh.
   kelvin:
    - {sense: CH_ACP_F, rail: VBUS20, element: "R16.1", tap: "R147.1", full_scale_mv: 60.0,
       why: "the BQ25731's input-current sense across R16, a 10 mOhm shunt carrying the rail's 6.0 A: 60 mV of
         full scale. The high side taps VBUS20 through R147 rather than R16's own pad, so this is the one the
         generator comment of 16 September called owed; boards/a.json carries it as _charger_acp_kelvin_why"}   # the five raw CS nodes are the low-side FETs' common source: switching conductors, not sense lines (18 September 2026)
    - {sense: CH_ACN_F, rail: CH_ACN, element: "R16.2", tap: "R146.1", full_scale_mv: 60.0,
       why: "THE OTHER HALF OF THE SAME PAIR, and it was not declared until 20 September 2026. The record had
         only ever asked about the high side, because that is the one that taps a pour called VBUS20; the LOW
         side taps CH_ACN, which is the charge bus behind the shunt and carries the same 6.0 A over the same
         26 mm to the same filter at the IC. TI's own layout table (bq25731 datasheet, item 7) asks for
         Kelvin sensing on BOTH of RAC and RSR: 'Connect the current sense traces to the center of the pads,
         and run current sense traces as differential pairs.' A pair sensed at one end and not the other is
         not a differential measurement, and the two errors do not cancel: they are drops in different
         conductors between different pads. Read the two rows together"}
   nodes:
    - {net: CH_SRP_F, what: "the charger's charge-current sense, positive half of the pair across R17",
       filter: "10 R into the pin and 100 nF across the pair, which is what the BQ25731's own pin table asks
         for (pin 19) and what this board did not have until 16 September 2026",
       kelvin_with: CH_SRN_F, keep_mm: 0.5}
    - {net: CH_SRN_F, what: "the charger's charge-current sense, negative half of the pair across R17",
       filter: "10 R into the pin and 100 nF across the pair (BQ25731 pin 19)", kelvin_with: CH_SRP_F, keep_mm: 0.5}
    - {net: CH_ACP_F, what: "the charger's input-current sense, positive half of the pair across R16",
       filter: "10 R into the pin and 10 nF across the pair, a 100 ns time constant inside the 47 to 200 ns
         window the datasheet's section 10.2.2.2 asks for", kelvin_with: CH_ACN_F, keep_mm: 0.5}
    - {net: CH_ACN_F, what: "the charger's input-current sense, negative half of the pair across R16",
       filter: "10 R into the pin and 10 nF across the pair (BQ25731 10.2.2.2)", kelvin_with: CH_ACP_F, keep_mm: 0.5}
    # THE SENSITIVE NET IS THE FILTERED SIDE, NEVER THE SHUNT'S OWN TERMINALS (18 September 2026, appendix
    # 32.224 addendum). `<stage>_CS` is the node the four low-side FETs' SOURCES sit on: it carries the whole
    # switched current of the stage, and asking it to keep 0.50 mm from switching copper asks it to keep away
    # from the pads it is bonded to. It is a switching conductor and is declared as one below. What ANA-001
    # must protect is the LM5176's own pair of amplifier inputs, which since 18 September sit behind 100 R in
    # each line with 1 nF across them at the IC (the datasheet's clause 8.2.2.7 and its layout section), the
    # same shape board A's charger already had in its `_F` nets and board E's tracker in TRK_CSP/TRK_CSN.
    - {net: FE_CSF, what: "the front end's filtered current-sense input at pin 16", filter: "100 R from the
        shunt's top with 1 nF across the pins (LM5176 8.2.2.7: the filter resistance may not exceed 100 R)",
       kelvin_with: FE_CSGF, keep_mm: 0.5}
    - {net: FE_CSGF, what: "the front end's filtered current-sense ground at pin 15", filter: "100 R from the
        shunt's ground pad, the Kelvin return the pin table asks for", kelvin_with: FE_CSF, keep_mm: 0.5}
    - {net: PA_CSF, what: "the PA stage's filtered current-sense input", filter: "100 R and 1 nF at the pins",
       kelvin_with: PA_CSGF, keep_mm: 0.5}
    - {net: PA_CSGF, what: "the PA stage's filtered current-sense ground", filter: "100 R from the shunt's ground pad",
       kelvin_with: PA_CSF, keep_mm: 0.5}
    - {net: HF_CSF, what: "the HF stage's filtered current-sense input", filter: "100 R and 1 nF at the pins",
       kelvin_with: HF_CSGF, keep_mm: 0.5}
    - {net: HF_CSGF, what: "the HF stage's filtered current-sense ground", filter: "100 R from the shunt's ground pad",
       kelvin_with: HF_CSF, keep_mm: 0.5}
    - {net: PD_CSF, what: "the PD stage's filtered current-sense input", filter: "100 R and 1 nF at the pins",
       kelvin_with: PD_CSGF, keep_mm: 0.5}
    - {net: PD_CSGF, what: "the PD stage's filtered current-sense ground", filter: "100 R from the shunt's ground pad",
       kelvin_with: PD_CSF, keep_mm: 0.5}
    - {net: POE_CSF, what: "the PoE stage's filtered current-sense input", filter: "100 R and 1 nF at the pins",
       kelvin_with: POE_CSGF, keep_mm: 0.5}
    - {net: POE_CSGF, what: "the PoE stage's filtered current-sense ground", filter: "100 R from the shunt's ground pad",
       kelvin_with: POE_CSF, keep_mm: 0.5}
    - {net: FE_FB, what: "the front end's feedback divider", filter: "the divider's own top and bottom resistors
        at the controller, with the tap taken at the output island", kelvin_with: null, keep_mm: 0.5}
    - {net: PA_FB, what: "the PA rail's feedback divider", filter: "the divider at the controller", kelvin_with: null, keep_mm: 0.5}
    - {net: HF_FB, what: "the HF rail's feedback divider", filter: "the divider at the controller", kelvin_with: null, keep_mm: 0.5}
    - {net: PD_FB, what: "the PD rail's feedback divider", filter: "the divider at the controller", kelvin_with: null, keep_mm: 0.5}
    - {net: POE_FB, what: "the PoE rail's feedback divider", filter: "the divider at the controller", kelvin_with: null, keep_mm: 0.5}
    - {net: S1_FB, what: "slot rail 1's feedback divider", filter: "31.6k/10k at the buck", kelvin_with: null, keep_mm: 0.5}
    - {net: S2_FB, what: "slot rail 2's feedback divider", filter: "31.6k/10k at the buck", kelvin_with: null, keep_mm: 0.5}
    - {net: S3_FB, what: "slot rail 3's feedback divider", filter: "31.6k/10k at the buck", kelvin_with: null, keep_mm: 0.5}
    - {net: SD_FB, what: "the device rail's feedback divider", filter: "31.6k/10k at the buck", kelvin_with: null, keep_mm: 0.5}
    - {net: B33_FB, what: "the 3.3 V logic buck's feedback", filter: "the divider at U12", kelvin_with: null, keep_mm: 0.5}

 d:
   switch_nets: []
   switch_nets_why: "this board carries no switching converter; the disturbance here is the 1 W transmitter, and
     the clearance that matters is from the exciter's own supply and antenna rather than from a switch node"
   nodes:
    - {net: MIC_IN, what: "the microphone summing input, millivolts", filter: "47k/1k divider and the AC
        coupling capacitor at the codec", kelvin_with: null, keep_mm: 1.0}
    - {net: MIC_SUM, what: "the summed microphone node", filter: "the summing network's own resistors", kelvin_with: null, keep_mm: 1.0}
    - {net: MICAMP_IN_N, what: "the microphone amplifier's inverting input", filter: "the feedback network",
       kelvin_with: null, keep_mm: 1.0}
    - {net: VREF, what: "the codec's reference", filter: "1 uF at the pin", kelvin_with: null, keep_mm: 1.0}
    - {net: HS1_MIC, what: "headset 1's microphone input, on a lead that leaves the board",
       filter: "the AC coupling capacitor and the bias resistor at the jack", kelvin_with: null, keep_mm: 1.0}
    - {net: HS2_MIC, what: "headset 2's microphone input", filter: "the AC coupling capacitor and the bias
        resistor at the jack", kelvin_with: null, keep_mm: 1.0}

 e:
   switch_nets: ["TRK_SW1", "TRK_SW2", "E6_SW", "FAN1_SW", "FAN2_SW", "TRK_LSENSE"]   # TRK_LSENSE is the inductor's second terminal, 5 mOhm from TRK_SW2: a switching conductor (18 September 2026)
   nodes:
    # THE FILTERED PAIR, NOT THE SHUNT'S TERMINALS (18 September 2026). TRK_LSENSE was declared as the tracker's
    # current sense and it is L1 pin 2, one end of the 5 mOhm shunt R5 whose other end IS TRK_SW2: it swings with
    # the boost half every cycle, so E17's reading of it 0.171 mm from TRK_SW1 measured a power conductor. The
    # design's own sense pair is behind R6, R7 and C16 (100 R each with 1 nF across, LT8705A), which is what the
    # controller's CSP and CSN pins see and what ANA-001 has to protect.
    - {net: TRK_CSP, what: "the tracker's filtered inductor-current sense, positive half across the 5 mOhm shunt",
       filter: "100 R (R6) from the shunt's inductor end with 1 nF (C16) across the pair at the controller",
       kelvin_with: TRK_CSN, keep_mm: 0.5}
    - {net: TRK_CSN, what: "the tracker's filtered inductor-current sense, negative half across the 5 mOhm shunt",
       filter: "100 R (R7) from the shunt's bridge end with 1 nF (C16) across the pair", kelvin_with: TRK_CSP, keep_mm: 0.5}
    - {net: WATER_SENSE, what: "the floor water sensor input, a high-impedance node on a lead that leaves the
        board", filter: "the pull-up and the 100 nF at the controller", kelvin_with: null, keep_mm: 1.0}

 p:
   switch_nets: []
   switch_nets_why: "the pack board is linear: the only edges on it are the SMBus and the FET gate drive, and the
     disturbance that matters is the pack's own load current in the copper, which is why every entry below is
     a Kelvin connection rather than a clearance. AND THE ONE CANDIDATE IS NAMED HERE RATHER THAN LEFT OUT
     (19 September 2026, found by switch_list.py, the report that asks whether this list is complete): /SW
     carries Q1 pin 5 and Q2 pin 5, the common DRAIN of the pack's back-to-back protection pair, so it is
     switching shaped and this list does not hold it. It is excluded as a JUDGEMENT, ranked WEAK by the report
     itself because no inductor sits on it: it moves at a protection event and at a charge or discharge enable,
     never at a converter's switching frequency, which is the disturbance this rule exists for. THE JUDGEMENT
     WAS ALSO MEASURED SO IT DOES NOT HAVE TO BE ARGUED: with /SW declared as switching in a throwaway copy,
     read on board P's own frozen board (sha d79865e7b1aceb95, identical before and after), all seven nodes are
     measured and all seven PASS, the nearest being SRN_F at 1.717 mm and VC2_F at 2.487 mm against the 0.50
     they ask and the rest 5.3 to 10.1 mm. So the exclusion costs this reading nothing either way, and that is
     the reason to believe it rather than the argument above it."
   nodes:
    - {net: SRP_F, what: "the coulomb counter's positive sense, filtered", filter: "100 R and 100 nF",
       kelvin_with: SRN_F, keep_mm: 0.5}
    - {net: SRN_F, what: "the coulomb counter's negative sense, filtered", filter: "100 R and 100 nF",
       kelvin_with: SRP_F, keep_mm: 0.5}
    - {net: VC1_F, what: "cell 1's tap, filtered", filter: "100 R and 100 nF", kelvin_with: null, keep_mm: 0.5}
    - {net: VC2_F, what: "cell 2's tap, filtered", filter: "100 R and 100 nF", kelvin_with: null, keep_mm: 0.5}
    - {net: VC3_F, what: "cell 3's tap, filtered", filter: "100 R and 100 nF", kelvin_with: null, keep_mm: 0.5}
    - {net: VC4_F, what: "cell 4's tap, filtered", filter: "100 R and 100 nF", kelvin_with: null, keep_mm: 0.5}
    - {net: TS1, what: "the cell block's thermistor", filter: "10k pull-up and the 100 nF at the gauge",
       kelvin_with: null, keep_mm: 0.5}
