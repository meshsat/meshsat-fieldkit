    # declared a node too. dc_drop solves a potential only on a declared RAIL, so a row there would read 'the
    # mesh solved no pad' for ever. Board P's R8 is refused for exactly this reason and so is board E's R19
    # hot-swap sense. SIX SHUNT HALVES ON THREE BOARDS ARE SENSED THROUGH COPPER NO POWER RULE SOLVES, which
    # is a question about the GROUND declaration and not about any one board's layout.
    - {sense: FE_ISNS_P, rail: FE_OUT, element: "R11.1", tap: "R160.1", full_scale_mv: 50.0,
       why: "the FE stage's constant-current loop, 10 mOhm across R11, read at ISNS(+) with no filter of any
         kind. This is the SHARP half: FE_OUT is the conductor between the boost-side high-side FET's drain and
         the shunt and it carries the stage's WHOLE current, 3.80 A into the charge bus, so every millivolt of it between R11.1 and
         the pin is current the loop believes is in the inductor and is not"}
