    # ISNS(+) and ISNS(-) to 50 mV (lm5176-datasheet.pdf, electrical characteristics, VSNS 43 min / 50 typ /
    # 57 max; the pin table says it in words at pin 13, 'if the sensed voltage across the ISNS(+) and ISNS(-)
