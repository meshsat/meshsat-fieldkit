       measure: "through-hole holder inside the pack enclosure, reached only when the pack is open"}

 e5:
   classes:
    - {name: "the dock block's contact targets", refs: ["TP*", "P_*"], cycles: null,
       basis: "the targets are gold-plated pads rather than parts, and what has a cycle rating is the SPRING
         PIN on board A that lands on them; no wear figure for the pad is published anywhere held here",
       load: "every mate of the kit: the block is what board A's eleven spring pins land on, so this board
         takes the whole insertion force of the stack and the wiping action of every pin",
       measure: "ENIG on 2 oz copper, a target 1.8 mm across against a 0.5 mm pin tip so the wipe stays inside
