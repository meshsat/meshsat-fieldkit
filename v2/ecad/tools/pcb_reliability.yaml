  # 73ae2f21), and the ones a later board may bring (X, MP). `mechanical`: a part of this class is always a
  # candidate. `electrical`: its land decides (see `footprint`).
  reference_classes:
    J:   {kind: mechanical, what: "a connector, jack, socket, header or lead land"}
    P:   {kind: mechanical, what: "a plug, or a pad drawn as a connector"}
    X:   {kind: mechanical, what: "a socket or holder drawn as X (none on the set 6 boards)"}
    BT:  {kind: mechanical, what: "a battery holder or retainer"}
    H:   {kind: mechanical, what: "a mounting hole, a standoff or a screw joint"}
    MP:  {kind: mechanical, what: "a mechanical part (none on the set 6 boards)"}
    SW:  {kind: mechanical, what: "a switch"}
    W:   {kind: mechanical, what: "a wire land"}
    WH:  {kind: mechanical, what: "a wire hole (board E5)"}
    F:   {kind: mechanical, what: "a fuse: in a holder it is a mated part, soldered it is excluded by name"}
    JP:  {kind: mechanical, what: "a jumper: a header with a shunt is a mated part, a solder jumper is copper"}
    K:   {kind: mechanical, what: "a relay: moving contacts with an operations life"}
    BZ:  {kind: mechanical, what: "a sounder mounted in the panel"}
    CAM: {kind: mechanical, what: "the camera module's mounting holes"}
    PAD: {kind: mechanical, what: "a pad a lead is soldered to"}
    TP:  {kind: mechanical, what: "a test point"}
    C:   {kind: electrical, what: "a capacitor"}
    R:   {kind: electrical, what: "a resistor"}
    L:   {kind: electrical, what: "an inductor (board E5 draws its wire lands as L_SIG: found by the land)"}
    D:   {kind: electrical, what: "a diode or a light-emitting diode"}
    Q:   {kind: electrical, what: "a transistor"}
    FB:  {kind: electrical, what: "a ferrite bead"}
    LED: {kind: electrical, what: "a light-emitting diode"}
    Y:   {kind: electrical, what: "a crystal or an oscillator"}
    RT:  {kind: electrical, what: "a thermistor"}
    T:   {kind: electrical, what: "a transformer or magnetics (board E5 draws its contact targets as T_*: found by the land)"}
    U:   {kind: electrical, what: "an integrated circuit or a soldered module; a module receptacle drawn as U is found by its land"}
  footprint:
    # A land of an ELECTRICAL reference class. Mechanical is asked first. A land in neither list is a candidate.
    mechanical_libraries: ["Connector*", "Battery*", "MountingHole*", "TestPoint*", "Button_Switch*", "Jumper*"]
    mechanical_names: ["*Conn*", "*Socket*", "*Header*", "*Holder*", "*holder*", "*Jack*", "*Switch*", "*Toggle*",
                       "*MountingHole*", "*Standoff*", "*Screw*", "*Pogo*", "*Mill-Max*", "*Target*", "*target*",
                       "*WireLands*", "*WireHole*", "*LeadLands*", "*SolderPad*", "*SolderWire*", "*Sounder*"]
    soldered_libraries: ["Package_*", "Capacitor_*", "Resistor_*", "Inductor_*", "Diode_*", "LED_*", "Crystal*",
                         "Oscillator*"]
    # The project's own library, each land read on the set 6 netlists: leaded and leadless packages, and the
    # five modules that are soldered to the board (castellated or land grid). A soldered module is not mated;
    # the joints under it are outside this inventory, which sees no mass (open item REL-O-08).
    soldered_names: ["LQFP-*", "TQFP-*", "Texas_R??00???_?QFN-*", "Sensirion_DFN-*", "Skyworks_SKY13351_MLPD-*",
                     "Vishay_VEML7700", "Ebyte_E22-900M30S", "Ebyte_E72-2G4M20S1E", "NiceRF_SA868",
                     "Quectel_LG290P", "Pulse_H5007NL"]

