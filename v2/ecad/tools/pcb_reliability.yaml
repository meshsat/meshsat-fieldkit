       basis: "the 1x12 socket strip's own specification",
       load: "the SA868 module is pushed into two socket strips and held by M2.5 standoffs",
       measure: "two standoffs take the module's weight; the sockets take contact force only"}
    - {name: "the antenna jack and the PA ports", refs: ["J_ANT", "J_PAIN", "J_PAOUT", "J_VGG"], cycles: 500,
       basis: "the SMA standard's 500 cycles",
       load: "a coax mated at build; the bulkhead is in the case wall",
       measure: "the board-side connector is an edge-launch SMA whose body is soldered on both sides"}
    - {name: "the power and harness headers", refs: ["J_PWR1", "J_HARN1", "J_USB3"], cycles: 30,
       basis: "the JST-VH and IDC families' own figures",
       load: "service access",
       measure: "through-hole with the leads tied"}

 e:
   classes:
    - {name: "the pack lead connector", refs: ["J_BATT"], cycles: 1000,
       basis: "v2/vendor/battery/amass-xt60-spec-tme.pdf: the XT60 is specified for 1000 mating cycles",
       load: "the pack is unplugged whenever it is swapped, which is the most-cycled connector in the kit",
       measure: "the XT60 is through-hole with 12 AWG leads, and the strip is screwed to the case floor so the
         pull goes into the case rather than into the joint"}
    - {name: "the blade fuse holders", refs: ["F1", "F2", "F3"], cycles: null,
       basis: "Keystone 3568 publishes no cycle figure",
       load: "extraction force, straight up",
       measure: "through-hole holders"}
    - {name: "the DC inlet, the solar input, the SMBus header and the lid sensor lead",
       refs: ["J_DCIN", "J_SOLAR", "J_SMB", "J_TAMP"], cycles: 30,
       basis: "the JST families' own figures; the wall receptacle itself is in the case",
       load: "the leads from the wall receptacle, from the pack and from the lid reed sensor under the frame",
       measure: "each lead is tied within 40 mm of its header"}

 p:
   classes:
    - {name: "the pack terminals", refs: ["W_P", "W_N"], cycles: null,
       basis: "solder lands rather than connectors: the 12 AWG leads are soldered and there is no mating cycle",
       load: "the whole pack current and the pull of the lead when the pack is handled",
       measure: "2.5 mm2 lands with a strain relief hole beside each, and the lead is tied to the pack's own
