# WHAT CARRIES LOAD AND WHAT SEES CYCLING (rule REL-001, MESHSAT-862, 16 September 2026; rewritten 28 September
# 2026, MESHSAT-1357, for the inventory of `wear_inventory.py` and the input rules of `reliability.py`).
#
# The rule asks for a per-board list of the parts and joints that carry mechanical load or see cycling, the
# expected cycles or level, and the measure taken. This kit is CARRIED: every connector that is mated in the
# field is a wear item and every board-mounted jack is a lever with the case as its fulcrum.
#
# WHAT THIS FILE DECLARES
#   inventory    which parts of a board are CANDIDATES: every reference class the artefacts use, classed
#                mechanical or electrical, and the lands that are mechanical or soldered. A reference class or a
#                land that is declared nowhere makes its part a candidate, and an undeclared class is refused.
#   open_items   what is owed, each with the next action. A class whose figure is OWED names one of them, and
#                its board reads INCONCLUSIVE until the item is closed. An item that is about a board and not
#                about one class names the boards it holds (`holds: all`, or a list), and holds them the same
#                way. An item that names no board and that no class names is refused by the tool's check of
#                this list: every open item here holds a reading.
#   boards       per board, the CLASSES (each with the lands it speaks of, its cycle figure or the reason it has
#                none, its load and its measure) and the EXCLUSIONS (each with its reason and its lands).
#                Every candidate falls in exactly one class or under exactly one exclusion, or the gate refuses.
#                Each board's declaration is BOUND to the artefact its author read (`written_against`: the
#                declared phase's netlist, or board E5's board file, by sha256 and for a netlist by its content
#                identity). The gate cannot read a part off the value text, so a netlist of another sha is not the
#                one this list speaks of and reads INCONCLUSIVE until a person re-reads the values and re-pins
#                (`reliability.py --pins` prints the lines; it never writes them).
#
# THE FIGURES ARE THE MAKERS' RATINGS OF THE PARTS, each cited to the document held under v2/vendor/ by its
# sha256, its page and its words. They are not a claim about the kit: no service life, duty cycle or mating-cycle
# count is stated or claimed for prototype 1 (REQ-028), and the expected number of mates over a service life is
# not defined anywhere, so no figure here is compared with one (open item REL-O-07).
#   cycles: N + source        the maker's document states it. Where the document gives a range or several
#                             figures, the LOWEST is carried and the words say so: a bound is named a bound.
#   no_figure none_published  the maker's documents named in `looked_in` were read and state no figure. The
#                             class is UNDECIDED and holds its board INCONCLUSIVE, named, as an owed figure
#                             does: a class whose maker publishes no figure never lets a board read PASS
#                             (the integrator's decision of 28 September 2026 after the fresh check, m1).
#   no_figure not_mated       nothing is mated: a solder land, a screw joint. What it has is a load and a measure.
#   no_figure owed            the part or its document is not identified. No number is invented for it.
#
# WHAT WAS CORRECTED ON 28 SEPTEMBER 2026 against the list of 16 September, each read on the set 6 netlists and
# the held documents (the record is v2/docs/records/d6rel/):
#   * board B's module receptacles carried 60 cycles; Amphenol's product sheet of the 10164227 gives 30;
#   * board A's class "blind-mate dock contacts" named Mill-Max spring pins and covered the eleven Radiall SMP-MAX
#     receptacles, while the seventeen Mill-Max pins and the Preci-Dip dock connector were in no class;
#   * board D's class "the radio module's sockets" covered the two JST-PH headset headers, and its 500 cycle class
#     of the SMA standard covered a U.FL socket (30 cycles) and a JST-PH header;
#   * board E5's classes named references (TP*, P_*, W_*) that its board file does not carry;
#   * the JST classes carried 30 cycles from "the series specification"; the held JST catalogues and JST's
#     handling precautions state no mating-cycle figure;
#   * board B's class for three soldered PCIe switches is gone: they are not candidates (their land is a
#     soldered package), which supersedes v2/docs/records/r8int6/fix/apply_drop_pcie_switch_class.py.
#
# Nothing here has been tested: no board exists, and REL-001's own verification phase is PROTOTYPE. This list is
# the desk half and replaces no physical verification.

