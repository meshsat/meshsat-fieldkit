              "J_5V_*", "J_54V"], cycles: 30,
       basis: "the JST and box-header families on this board all publish 30 cycles or more",
       load: "service access",
       measure: "through-hole where the lead is pulled, and every internal lead is tied to a standoff"}
    - {name: "the PCIe switches' own sockets on the carrier", refs: ["U101", "U201", "U301"], cycles: null,
       basis: "these are soldered ICs and not connectors: they appear in this list because the search finds
         their package names, and they carry no mating load at all",
       load: "none: a soldered QFN",
       measure: "none needed; recorded so the list is complete rather than filtered"}

 c:
   classes:
    - {name: "the panel ribbon header", refs: ["J_PANEL"], cycles: 30,
       basis: "the box header's own specification",
       load: "the ribbon to board B, mated at build",
       measure: "through-hole, and the ribbon is captive inside the case"}
    - {name: "the face plate's mounting holes", refs: ["H*"], count_expected: 8, cycles: null,
       basis: "a screw hole has no mating cycle; what it has is a torque and a thread",
       load: "the face plate carries the display, the e-paper and sixteen light guides, and the whole assembly
         is screwed to the case's own frame",
       measure: "the holes are plated and the plate is screwed to standoffs rather than to the board, so the
         board is not a structural member"}

 d:
