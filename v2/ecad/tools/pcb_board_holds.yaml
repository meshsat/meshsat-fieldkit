# Boards held by an open decision (MESHSAT-862, 16 September 2026).
#
# A HOLD IS NOT A RULE RESULT. Every rule on a held board may read PASS and the board is still not promotable,
# because what holds it is a question nobody has answered, not a measurement nobody has taken. Keeping it in
# the rule results would mean either inventing a failing rule, which is false, or leaving the board looking
# releasable, which is worse. So it is its own data, read by the three places that could otherwise let a held
# board through: the generated status page, the final gate, and the order-set builder.
#
# LIFTING A HOLD IS A DATA EDIT, and that is the point. When the owner rules, the entry is deleted with the
# ruling quoted in the commit message; until then no tool can promote the board and no argument in a log can
# either.
#
# The four status fields are the owner's own words of 16 September 2026 and are carried verbatim wherever the
# board is reported.

schema_version: "1.0.0"

holds:

 a:
   decision: 31
   opened: "2026-09-17"
   title: "board A's exposed-port protection"
   ROUTING_STATUS: OPEN
   ELECTRICAL_PROTECTION_STATUS: BLOCKED_DECISION_31
   FAB_READINESS: NOT_READY
   PUBLICATION_STATUS: HELD
   why: "the same decision, measured on this board: TRN-001 reads FAIL on board A with TWO of its twenty-one
     judged conductors meeting their clamp only THROUGH an active part, which therefore sees the transient
     itself. The file listed board E alone until 17 September, and decision 31 names three boards: a hold that
     names one of them would let the other two into an order set the moment E's is lifted"
   permitted: "a review package clearly quarantined as NOT_FOR_FAB may be generated"
   forbidden: "any orderable fabrication package, any promotion of the board or its folder"
   lifts_when: "decision 31 is ruled and this entry is deleted"

 d:
   decision: 31
   opened: "2026-09-17"
   title: "board D's exposed-port protection"
   ROUTING_STATUS: PASS
   ELECTRICAL_PROTECTION_STATUS: BLOCKED_DECISION_31
   FAB_READINESS: NOT_READY
   PUBLICATION_STATUS: HELD
   why: "measured on 17 September by cutting this board's deliverable, which the finish refused at that gate:
     SEVEN of board D's fourteen judged conductors reach a semiconductor with nothing between them, three each
     on the two headset jacks a person plugs a headset into and one on the 30 W amplifier output. Its antenna
     jack is the one that is answered, by the arrestor at the bulkhead. The rule did not even APPLY to board D
     until that morning, because its applicability was a list of interfaces this board does not carry"
   permitted: "a review package clearly quarantined as NOT_FOR_FAB may be generated"
   forbidden: "any orderable fabrication package, any promotion of the board or its folder"
   lifts_when: "decision 31 is ruled and this entry is deleted"

 e:
   decision: 31
   opened: "2026-09-16"
   title: "board E's exposed-port protection"
   ROUTING_STATUS: PASS
   ELECTRICAL_PROTECTION_STATUS: BLOCKED_DECISION_31
   FAB_READINESS: NOT_READY
   PUBLICATION_STATUS: HELD
   why: "rule TRN-001 is a BLOCKER and reads FAIL on board E, and the reading was corrected on the evening of
     17 September: ONE conductor has a clamp behind an active part, the shore inlet, whose path is the fuse F1,
     the ideal-diode FET Q1 and then the SMCJ40A, and THREE reach a semiconductor with nothing between them at
     all, the sensor pod's 3.3 V feed and its two I2C lines. Until that evening the pod's three read as clamped
     by the shore inlet's own part, which the chain reached by crossing the RP2040 and a ground: a clamp on the
     other side of the board is not this conductor's. The fix is a schematic change, which a route cannot make, and which of the options is
     taken is the owner's to rule because it trades parts, board area and the operating envelope against each
     other. The envelope itself is decision 34, which is why 31 cannot be ruled before it"
   permitted: "a review package clearly quarantined as NOT_FOR_FAB may be generated, so the board can be read
     and reviewed while it is held"
   forbidden: "any orderable fabrication package, any promotion of the board or its folder, any publication of
     the board file or its evidence"
   lifts_when: "decision 31 is ruled in v2/docs/OWNER-DECISIONS-2026-09-11.md and this entry is deleted"
