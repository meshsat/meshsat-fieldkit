rules:
- id: K-1
  reversal: 'none needed: a coarser grouping is a view over this one'
  rule: 'A selection is the set of per-reference rows that agree on every property that decides the part: kind, value, land,
    the required rating, dielectric or construction, tolerance, power, temperature coefficient, the use a value states and
    any named part. Rows whose requirement differs are separate selections even when one part meets both. ONE EXCEPTION, stated:
    an inductor whose value names a maker''s part is keyed by that part number and its land, and the use the value states
    is left out of its key, so the XAL1010-682ME and the XAL6030-332ME selections hold rows that state a saturation current
    beside rows that state none; the named part is the requirement there, and its document gives the current'
  why: 'the third checkpoint review, section 5: never merge rows whose ratings or functional constraints differ'
- id: K-2
  reversal: none
  rule: 'A row that is two parts, a holder that is placed and what is fitted in it at build (a blade fuse in its holder, a
    coin cell in its holder), has TWO identities: `identity` is the placed part and `fitted` the part fitted in it, each with
    its own maker, part number, rating and document. The selection is as resolved as the less resolved of the two'
  why: 'the first check of pass 1, blocking item 3: the fuse is the protective part, and an identity that names only its holder
    loses it'
- id: V-1
  reversal: declare the net (intent rails or nodes) and the bound or the open item is replaced by the declaration
  rule: 'A capacitor''s voltage requirement is the stated rating, or the voltage across it from the intent declarations at
    the project''s 20 percent derate margin (derate.py), rounded up to a standard rating. A net nobody declared is BOUNDED
    by the highest of every source that can set its level, and only when every source is bounded: the declared voltages on
    an active part''s other pins, a declared net reached through a resistor, ferrite, fuse, diode, switch or link, a pin level
    a maker''s document gives (rule V-2). GROUND IS A FLOOR AND NEVER A CEILING: a ground net, or a net declared at or below
    0 V, enters no maximum, and a node only ground reaches is UNBOUNDED. A SWITCH NODE IS DECLARED OR UNBOUNDED: an inductor
    that is not a ferrite, with either node on a Q, D or U, passes nothing; the project declares its switch nodes in the intent
    (v_max the larger rail the node reaches, v_min -1.0 V) and declares no ringing figure, so an undeclared one is not bounded
    here. A net the intent declares with no maximum is UNBOUNDED. A stated rating is never lowered and is raised only by a
    DECLARED voltage. An UNBOUNDED side leaves an unstated requirement OPEN (the selection is UNRESOLVED: no part is guessed)
    and a stated one NOT CHECKED. AMENDED by stream w5identc (29 September 2026), answering w5ident''s second check W5I-C2-B1:
    (a'') a net the intent marks as a return, or declares with a maximum of at most 0.5 V (board P''s PACK_N at 0.05 V), is
    a floor and never a ceiling; (g) a connector''s pin is set on its far side, so a connector is a source of unknown level
    for an undeclared net unless its value names a passive far end (a button, a reed switch, a thermistor)'
  why: the value strings state a rating on under a third of the capacitors; CMP-001 needs the voltage across the part. Corrected
    after the first check of pass 1 found ground bounding other nets at 0.0 V (83 row-nets) and a boost's switch node reading
    its input rail; the second check found PACK_N bounding six SMBus nets at 0.05 V and connectors read as active parts
- id: V-2
  reversal: declare the net in the intent, which always wins, or correct an entry against the document
  rule: 'The role of a pin is read from its maker''s document filed in the tree where the netlist and the intent cannot say
    it (PIN_ROLES in part_identities.py): an input is not a source; an output''s ceiling is the level the document gives;
    a pin the device holds from its supply pins tracks them; a pin driven at a level the document does not state is a source
    of unknown level. Three parts today: TI BQ4050 (SLUSC67B), TI BQ77207 (SLUSEG7D), PDi E2370KS0C1 (EPD Driving Circuit
    Rev. 02)'
  why: board P's gauge and protector pins and board C's e-paper pump pins are not declared, and the premise of V-1 (a pin
    stays within its part's declared pins) is wrong for a gate drive above the pack
- id: F-1
  reversal: a stated voltage rating in the value
  rule: 'A fuse is its rated current, as the value states it, and the voltage it must interrupt: the highest voltage the intent
    and rule V-1 put on either of its nets. An UNBOUNDED net leaves the requirement open'
  why: 'the first check of pass 1, blocking item 3: a fuse''s rating is a deciding property'
- id: F-2
  reversal: a value that names the element
  rule: 'A MINI blade fuse row is the Keystone 3568 holder the land is drawn for and a Littelfuse MINI element of the stated
    current, in the lowest voltage series whose rating meets the voltage on the fuse''s nets with the 20 percent margin: MINI
    297 (32 V DC) where it does, else MINI 997 (58 V DC), with the margin recorded OPEN where even that falls short. The 25
    A and the 10 A elements, and the MINI and the regular ATO families, are never one part'
  why: Keystone catalogue M65 page 42 lists the 3568 'for Littelfuse Mini 297 or 997 series'; SOURCES.yaml entry pack-blade-fuse-holder
    records the 0297025 as board P's element
  scope_note: 'a rule of w5ident''s resolver: the carried identities were chosen under it; stream w5identc ran no resolver
    and asked no catalogue'
- id: D-1
  reversal: bind the document in SOURCES.yaml by code and the stronger join takes over
  rule: 'A maker document the tree already holds is joined to a selection through v2/vendor/SOURCES.yaml, in this order, and
    the table records which join bound it (datasheet.joined_by): by order code, the repository''s own join (review_packet.sources_index
    on the code fields of an entry); by the part number an entry''s fitted_mpn names; by the part number in a document''s
    title; by the part number in a document''s file name. The last two are weaker and counted apart. Only an entry whose identity
    is MATCH counts (NOT_PINNED when joined by part number), and only a document that is in the tree'
  why: 'the first check of pass 1, blocking item 2: the earlier join matched a code field only when it was exactly a code,
    so 43 selections read OWED whose document is held'
  scope_note: 'a rule of w5ident''s resolver: the carried identities were chosen under it; stream w5identc ran no resolver
    and asked no catalogue'
- id: M-1
  reversal: 'the declaration''s own: the row stops ordering the part, or a compatibility decision with evidence'
  rule: An order code that tools/jlc-mismatch.yaml declares a mismatch on a row (owner condition 1) is never taken as that
    row's order code; the declaration's own words are the reason, and its two ways of lifting are the next action
  why: one declared input for jlc_certify.py, lcsc_fill.py and this table, so a re-derivation cannot put a declared substitution
