  scope_note: 'a rule of w5ident''s resolver: the carried identities were chosen under it; stream w5identc ran no resolver
    and asked no catalogue'
- id: N-1
  reversal: none
  rule: 'NOT_A_PART is copper on the board itself: a solder pad, lead lands, a solder jumper, pogo targets, probe pads. What
    is bought is never NOT_A_PART: a wire soldered in and a header that takes a shunt are UNRESOLVED until named'
  why: the first check of pass 1, minor 2
- id: C-D1
  reversal: a stated dielectric
  rule: a crystal's load capacitor (a net shared with a crystal) is C0G
  why: the crystal's load must not move with temperature or bias
- id: C-D2
  reversal: a stated dielectric
  rule: an unstated dielectric at 1 nF and below on a 0805 or smaller land is C0G
  why: timing, filter and compensation roles at these values; C0G is the standard part there
- id: C-D3
  reversal: a stated X5R, or a hot-spot computation showing +85 C is not approached
  rule: an unstated class 2 dielectric is X7R (X8R or C0G accepted)
  why: worst inside air 62.1 C (pcb_envelope.yaml worst_inside_air_c, lid closed) plus local rise near converters leaves X5R's
    +85 C class limit too close
- id: C-D3b
  reversal: a land or value change by the board author
  rule: where no X7R part is made or stocked at the value, land and rating, X5R is taken and the hot-spot question is recorded
    OPEN on the selection
  why: the land and value are the design's; the dielectric is the only freedom left
- id: C-T
  reversal: a stated tolerance
  rule: 'unstated capacitor tolerance: C0G 5 percent, class 2 below 10 uF 10 percent, 10 uF and above or bulk 20 percent'
  why: the widest standard grade of each class, so no row is held to a tolerance the design did not ask
- id: R-T1
  reversal: a stated tolerance
  rule: unstated resistor tolerance is 5 percent
  why: the widest standard thick-film grade; a 1 percent part meets it
- id: R-S1
  reversal: a stated coefficient
  rule: a shunt below 1 ohm with no stated temperature coefficient needs at most 200 ppm/K
  why: its reading moves at most 1.6 percent over the 80 K the envelope and self-heating span
- id: R-P
  reversal: a source that sets another screen
  rule: a shunt is rated at least twice its I^2 R at the declared peak rail current; any other resistor takes its package's
    standard rating, CHECKED against V^2/R only when it sits between a declared net and ground
  why: a 50 percent stress screen; no authoritative source in this tree backs the number
- id: R-P1
  reversal: a larger land or two shunts in parallel, by the board author
  rule: where no part meets twice the bound, a part rated above the bound itself is taken and the screen exceedance is recorded
    OPEN
  why: the land is the design's; the peak's duration decides whether the screen matters
- id: I-1
  reversal: change the ranking and re-run the resolver
  rule: 'among parts meeting every requirement with JLCPCB stock for five kits: the code the design already carries (generator,
    else lcsc_fill.py''s MAP, else the certified table), then JLCPCB''s basic library, then a preferred part, then a maker
    whose own datasheet is public (MAKER_TIER), then the highest stock'
  why: continuity with earlier decisions and the least assembly cost, then documents that can be filed
  scope_note: 'a rule of w5ident''s resolver: the carried identities were chosen under it; stream w5identc ran no resolver
    and asked no catalogue'
- id: I-2
  reversal: none
  rule: a value that names a maker's part is that part; its order code is the catalogue line whose part number carries every
    character of the name (suffixes for packing only); a header's value names what it connects to and is never searched as
    a part
  why: the design's own words are the identity; the order code is a separate reading
  scope_note: 'a rule of w5ident''s resolver: the carried identities were chosen under it; stream w5identc ran no resolver
    and asked no catalogue'
- id: I-3
  reversal: the page's own reversal
  rule: 'identities already chosen on a page of record are applied as recorded: PROCUREMENT.md HC6-SC-7 (Wurth WR-BHD IDC
    headers, XFCN SMD 2x13), HC6-SC-8 (Mill-Max 0858-0-15-20-82-14-11-0), HC6-SC-10 (NiceRF SA868-V, INFERRED)'
  why: one decision in one place
- id: D-2
  rule: 'A RESOLVED selection names a maker, a manufacturer part number and a held maker''s document with a page, bound one
    of two ways (decision 59, the session''s, 29 September 2026). PRINTED: the page''s text layer prints the part number,
    letter case aside (the characters on either side are not letters or digits); where the part number carries the maker''s
    packing code, the page may print it as the maker''s placeholder (Hirose''s FH34SRJ-24S-0.5SH(##)) if the same page keys
    the placeholder to that code ("(##) : (50)"); a part number that carries no packing code (SS2040FL) is printed as it is,
    the reel being the order code''s business; and the part must be the one the design names: the value text names it (less
    its packing code or a reel suffix) or the netlist''s order code reads as it in this tree''s catalogue reading. DECODED:
    the page is the maker''s own ordering-code table for a scheme written in part_identities.SCHEMES (the document pinned
    by sha256), the tool reads the layout from the page, slices the whole part number by it, reads each code''s meaning in
    its own part of the page and requires every deciding property of the kind (capacitor: value, package, tolerance, rated
    voltage, dielectric, construction; resistor: value, package, tolerance, power) to meet the selection''s requirements as
    the check derives them from the netlist. A DECODED binding is counted apart and never as PRINTED. LIMIT: it shows what
    the part number means in the maker''s scheme, not that the maker makes that value at that rating (the range table). A
    document held back from the public tree is cited by address and sha256 and read where it is fetched'
  why: 'w5ident''s second check, ID-B1 to ID-B3: selections were RESOLVED on documents that do not name the part; round 3''s
    check of this stream, B1 and B2: the check judged on the table''s own requirements, and the first DECODED reader accepted
    permutations and padding'
  reversal: decision 59's reversed_by (pcb_decisions.yaml); a range-table citation added as a second requirement of a DECODED
    binding would narrow it
