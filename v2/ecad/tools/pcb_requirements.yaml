      The supervisor firmware's requirements carry Z-C3 and its image is covered by D-13's software-verified boot; a
      review of the firmware shows no master transaction and no response at 0x60 or at 0x30 to 0x32 (bench V-B08 of
      v2/docs/HW-FW-CONTRACT.md); the Z-EXP-C held-bus cases C-H1 to
      C-H3 show the wipe's fail-secure outcome when a supervisor holds the bus.
