# The needs of CONOPS section 2, quoted. The validator compares each statement with the needs table of the
# document (the table under '| ID | Need | Source |', and only that table) and refuses a difference, and refuses a
# document whose sha256 is not the pin above: an edit to CONOPS takes this file's authority away until someone
# re-reads the needs and re-pins it.
needs:
  - id: NEED-01
    statement: >-
      Relay messages between local off-grid networks and remote correspondents when internet and cellular
      infrastructure are absent or down.
  - id: NEED-02
    statement: "Keep at least one long-range path when any single bearer is unavailable."
  - id: NEED-03
    statement: >-
      Keep the kit's services and every critical peripheral reachable after the loss of any one compute module or any
      one I/O supervisor.
  - id: NEED-04
    statement: >-
      Let an operator and a second crew member run the kit at the kit: see its state, operate it, talk with
      push-to-talk, capture images, and read identity and status with the power off.
  - id: NEED-05
    statement: "Run from the kit's own pack, recharge from vehicle, shore or solar, and power accessories."
  - id: NEED-06
    statement: >-
      Survive carriage and field placement in a sealed case: transit drop, vehicle vibration, driven rain and blowing
      dust when deployed, immersion when closed, with no vent opening.
  - id: NEED-07
    statement: "Operate and store across the adopted temperature envelope, with its declared carve-outs."
  - id: NEED-08
    statement: "Silence every transmitter with one operator action that does not depend on software."
  - id: NEED-09
    statement: "Darken and silence the kit on command (blackout), and give a night-vision-compatible panel (NVG)."
  - id: NEED-10
    statement: >-
      Protect stored keys and data: erase them on command, record case opening, and fill keys only by a signed
      procedure.
  - id: NEED-11
    statement: "Provide position and time, with a second time source and holdover when GNSS is lost."
  - id: NEED-12
    statement: >-
      Sense the kit's own condition and its surroundings, and act on the hazards (water on the floor, battery-bay gas)
      by shutting the pack down.
  - id: NEED-13
    statement: >-
      Keep the energy store safe: cell protection independent of software, fault current bounded at every stage,
      charge only inside the cells' temperature window.
  - id: NEED-14
    statement: >-
      Be serviceable: open the kit, lift the stack out without unscrewing a cable, program and recover every
      programmable device, reach the test points a bring-up needs.
  - id: NEED-15
    statement: >-
      Be verifiable: every requirement has an analysis, inspection or test, and the prototype runs a whole-kit test
      plan with pass criteria before any rating or envelope is claimed.
  - id: NEED-16
    statement: >-
      Transmit only where and how the operator is permitted (bands, power, duty cycle, licence) in the markets the
      owner scopes.
  - id: NEED-17
    statement: "Keep the kit's own transmitters from damaging or blinding its own receivers."
  - id: NEED-18
    statement: >-
      Work in its electromagnetic surroundings: bounded conducted and radiated emissions outside the intentional
      transmissions, and no upset from conducted, radiated or electrostatic disturbance.
  - id: NEED-19
    statement: "Let the operator raise a distress or assistance alert with one deliberate, covered action."

# The owner's rulings this registry applies, dated. `decision` names the entry of pcb_decisions.yaml that
# indexes the same ruling; the validator refuses a mismatch and warns while that file has not recorded it yet.
# D-01, D-02a and D-02b were ruled on 25 September 2026 (about 23:27 to 23:40 CEST), D-02c and every later one
# on 26 September 2026 (about 00:05 to 00:55 CEST); D-08a later on 26 September, and at about 09:30 CEST the owner
# reversed D-08 (D-08-reversal): D-08 keeps its row, reversed, and no record rests on it. `standing-rule` is the
# owner's rule of 26 September 2026 that he is not asked again, under which the session took the choices of the
# next list.
owner_rulings:
  - id: D-01
    authority: OWNER
    ruled_on: "2026-09-25"
    title: "prototype scope"
    ruling: >-
      FULL DESIGN, STAGED ACCEPTANCE. Every ruled function stays designed and fitted where copper exists; prototype 1
      is accepted on a named core: messaging over Iridium, 5G, LoRa and APRS (NEED-01, NEED-02); the three-slot
      failover fabric (NEED-03, ARCH-PCB-B-IOHA tests A1 to A14); pack, vehicle and solar charging (NEED-05); hardware
      EMCON (NEED-08); ZEROIZE of the secure element (NEED-10); pack safety (NEED-13); service and programming access
      (NEED-14). Everything else is built where possible and reported NOT_YET_TESTED.
    core_needs: [NEED-01, NEED-02, NEED-03, NEED-05, NEED-08, NEED-10, NEED-13, NEED-14]
    deferred_named:
      - "Geiger counter"
      - "lightning sensor"
      - DCF77
      - "outside pod"
      - camera
      - "net recording"
      - "tablet bracket"
      - "NVG claim"
      - HF
      - "second pack"
    source: ["owner ruling D-01"]
  - id: D-02a
    authority: OWNER
    ruled_on: "2026-09-25"
    title: "qualification margins"
    ruling: >-
      TEST-PLAN's +55 C operating, +71 C storage and -33 C storage are QUALIFICATION MARGINS over the -20 to +40 C use
      and -20 to +45 C storage envelope, with two pass lines: operate to specification inside the envelope; survive
      and recover at the margin.
    source: ["owner ruling D-02a", "v2/docs/TEST-PLAN.md:18-19", "v2/docs/OPERATING-ENVELOPE.md section 8"]
  - id: D-02b
    authority: OWNER
    ruled_on: "2026-09-25"
    title: "closed-lid operation"
    ruling: >-
      Closed-lid operation in a defined REDUCED MODE (for example GNSS, the LoRa mesh, Iridium and APRS beacons,
      monitor off, one CM5); a closed-lid state and thermal test join TEST-PLAN; a lid sensor is an engineering item
      (the case-open switch can serve both). Accepted consequences: above +35 C ambient the kit runs one module; with
      three loaded modules charging holds off above about +25 C.
    source:
      - "owner ruling D-02b"
      - "v2/docs/OPERATING-ENVELOPE.md section 8"
      - "v2/docs/MESHSAT-709-geometry-appendix.md:2860"
  - id: D-02c
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "severities, altitude and service life"
    ruling: >-
      Severities are TEST-PLAN E1 (26 drops, 1.22 m) and E2 (composite wheeled vehicle, 1 h per axis); altitude 0 to
      3000 m in use and 0 to 4500 m in transport; service life TBD for prototype 1.
    source: ["owner ruling D-02c", "v2/docs/TEST-PLAN.md:16-17", "v2/docs/OPERATING-ENVELOPE.md section 4"]
  - id: D-02d
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "cold start from a cold-soaked pack"
    ruling: >-
      Out of scope for the prototype, stated in the envelope and in CONOPS: a kit cold-soaked below about -10 C at the
      cells needs shore or vehicle power, or warming, before it starts from the pack; once warm, use down to -20 C
      ambient holds. No hardware is added.
    source: ["owner ruling D-02d", "v2/docs/CONOPS.md section 7"]
  - id: D-02e
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "direct sun"
    ruling: >-
      'Operate shaded' is a stated operating condition, with a shade accessory (a lid sun shield or a tarp); full-sun
      design is a later qualification item. No board change.
    source: ["owner ruling D-02e", "v2/docs/CONOPS.md section 7"]
  - id: D-03
    authority: OWNER
    ruled_on: "2026-09-26"
    title: ZEROIZE
    decision: 30
    ruling: >-
      Crypto-erase through the secure element: the drive and eMMC keys are wrapped by a key the secure element holds;
      ZEROIZE destroys it, then running modules drop their RAM keys, then the slots are cut. Firmware and
      provisioning, no board change. Precondition: the ATECC608B slot map must let that key be erased (the full
      datasheet is under NDA); a TPM 2.0 is the fallback. The ONLY trigger is the covered toggle held 5 s; the tamper
      and lid switch logs only; remote wipe is deferred. LEVEL-SENSITIVE after power loss: the toggle is read at boot
      before any slot powers, a wipe-pending record resumes the wipe, and the kit re-arms only when the toggle
      returns. Accepted residual risk: drive unlock at boot depends on the secure element, the panel and the kit I2C
      bus.
    source: ["owner ruling D-03", "v2/ecad/tools/pcb_decisions.yaml:207-255 (decision 30)"]
  - id: D-04
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "markets and obligations"
    ruling: >-
      A non-commercial prototype in the Netherlands and the EU, operated by a licensed radio amateur. No CE or RED
      conformity marking is claimed and no EMC claim is made yet, so every MIL-STD-461 run is characterisation; the
      design keeps an EU route open. Every transmitter is configured to the operator's licence and the EU limits, the
      VHF path gets a band lock, and the pack's transport route is stated (its UN 38.3 status is unknown).
    source: ["owner ruling D-04", "v2/docs/CONOPS.md section 7"]
  - id: D-05
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "EMCON meaning"
    ruling: >-
      Radios dark, as generated and completed: every radio with an emission path is powered off or RF-disabled in
      hardware; the VHF path keeps listening behind its transmit-only gate; GNSS, DCF77 and the lightning sensor
      continue. The gap fixes (the compute modules' own WiFi and Bluetooth onto the line, and the WiFi link cards'
      disable shown to act or their supplies gated) are session work.
    source: ["owner ruling D-05", "v2/docs/CONOPS.md section 4b"]
  - id: D-06
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "pack size and runtime"
    ruling: >-
      One 4S3P 18650 pack (Samsung INR18650-35E) of about 145 Wh, shrink-wrapped in the east pocket, subject to the
      case measurement (D-08). Missions longer than the pack rely on vehicle or solar input. The runtime requirement
      is stated as battery-only hours in an idle and a typical mode at +20 C for an aged pack; the mission duration
      for the solar energy balance is set later by the owner. Session items: a lower charge setting for cell life, and
      pack_4s.py redesigned.
    source: ["owner ruling D-06", "v2/docs/CONOPS.md section 6"]
  - id: D-07
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "5G antenna jacks"
    ruling: >-
      Three 5G jacks (ANT0, ANT2, ANT3), making twelve bulkheads, at the board A site found free (X +46), if the case
      measurement confirms that site and the board E clamp fit; otherwise two jacks on ANT0 and ANT2. The key-M socket
      is replaced by a key-B part either way (session).
    source: ["owner ruling D-07", "v2/docs/CONOPS.md section 7"]
  - id: D-08
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "case measurement and mock-up"
    reversed_by: D-08-reversal
    ruling: >-
      The owner measures his Peli 1450 (about 1 hour) and builds a cardboard mock-up (2 to 3 hours) from the written
      request; the 1450PF frame is bought later, before the face plate is final. The rule against asking the owner to
      measure a COTS part still holds for everything but the case and the mock-up.
    source: ["owner ruling D-08", "v2/docs/CONOPS.md section 7"]
  - id: D-08a
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "the moulding the design targets"
    ruling: >-
      The design targets the current 1450 moulding of Peli's 1451-931 customer drawing dated 15 January 2025. In the
      owner's words, "if it is older i will buy another newer case": the design never adapts to an older moulding, and
      a new 1450 is bought if the build case is older.
    source: ["owner ruling D-08a", "v2/docs/CONOPS.md section 7", "v2/docs/MESHSAT-709-geometry-appendix.md:18882-18897 (32.367 item 1)"]
  - id: D-08-reversal
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "the case measurement withdrawn"
    ruling: >-
      At about 09:30 CEST the owner reversed D-08: "you have the CAD files and all the measurements why do you need from
      me to measure an old case?" The case measurement and the cardboard mock-up are withdrawn and nothing is asked of
      him. The design holds every case-dependent margin against the worst of Peli's own figures (the 1451-931 drawing,
      the STEP bodies, the 1453-314-000 frame sheet, the pelican.com page) plus a stated minimum, a margin resting on
      a tolerance no source states is OPEN, and the OPEN margins, the seals and the stack-up are shown on hardware, in a
      new case of the current moulding (D-08a). The ban on asking the owner to measure a COTS part holds without
      exception.
    source:
      - "owner ruling D-08-reversal"
      - "v2/docs/CONOPS.md section 7"
      - "v2/docs/MESHSAT-709-geometry-appendix.md:18882-18897 (32.367 item 1)"
      - "v2/docs/CASE-MARGINS.md"
  - id: D-09
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "independent review and test route"
    ruling: >-
      The SIDN voucher goes to a ZEROIZE and key-fill security review; a paid battery-and-protection review by a
      qualified electronics engineer happens before the pack is built; an EMC pre-compliance session is booked once
      the prototype exists. The session prepares the review packets and requests; any spend beyond the voucher needs a
      quote and the owner's approval.
    source: ["owner ruling D-09", "v2/docs/CONOPS.md section 7"]
  - id: D-10
    authority: OWNER
    ruled_on: "2026-09-26"
    title: SOS
    ruling: >-
      SOS sends a distress message with the kit's position over the available bearers (Iridium first when nothing else
      is up) to a configured recipient list. It never transmits through EMCON: under EMCON the message is queued and
      the operator is told. Firmware only.
    source: ["owner ruling D-10", "v2/docs/CONOPS.md section 4"]
  - id: D-11
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "peak simultaneity"
    ruling: >-
      Every radio may still transmit at once, for a declared key-down time above a declared state of charge, with the
      accessory outlets at their minimum contract. The session sets both thresholds from the fuse and gauge limits and
      adds a hardware interlock that drops the outlets while the PA keys.
    source: ["owner ruling D-11", "v2/docs/CONOPS.md section 5"]
  - id: D-12
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "external USB data port"
    ruling: >-
      The existing wall USB data path is routed to the sealed Glenair 233-370 receptacle, which is also the console
      and key-fill port; the USB-C becomes a power-only outlet.
    source: ["owner ruling D-12", "v2/docs/CONOPS.md section 7"]
  - id: D-13
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "firmware integrity and the supervisor part"
    ruling: >-
      The prototype's floor is software-verified boot on the STM32H743 supervisors (and on the compute modules if
      Raspberry Pi documents it); a hardware root of trust is required at a production trigger. The H743 is accepted
      formally; the mismatch with the STM32H753 in the schematic closes when the schematic text and the BOM are
      aligned to the H743 and regeneration parity is shown again (plan condition 1).
    source: ["owner ruling D-13", "v2/docs/CONOPS.md section 7"]
  - id: D-14
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "lifting the stack"
    ruling: >-
      The procedure (kit off, pack XT60 unplugged, shore removed) plus an insulating cap over the dock block E5 while
      the stack is out. Lifting live is an accepted, recorded residual risk; a hardware stack-present interlock is
      studied at Review D.
    source: ["owner ruling D-14", "v2/docs/CONOPS.md section 7"]
  - id: D-15
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "cell under-voltage protection"
    decision: 40
    ruling: >-
      A 4S secondary protector that also covers cell under-voltage is used if one can be sourced near the cost of the
      over-voltage-only part; otherwise cell under-voltage stays in the gauge's firmware with a data-flash
      verification at commissioning, an accepted residual. The session floor either way: the over-voltage secondary
      protector, a chemical fuse, the BQ4050's FUSE output and its PTC input.
    source: ["owner ruling D-15", "v2/docs/CONOPS.md section 7", "v2/ecad/tools/pcb_decisions.yaml:863-915 (decision 40)"]
  - id: D-16
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "vehicle surge claim"
    ruling: >-
