      Created from ZEROIZE.md's firmware rule Z-C3 (26 September 2026). The supervisors sit on I2C1 (PB6 and PB7, pins
      92 and 93) with the secure element at 0x60 on the same bus (committed netlist
      v2/ecad/pcb-b-compute-b19/out/pcb-b-compute.net at eadbe571: U41, U51 and U61 pins 92 and 93 on SCL and SDA, U8
