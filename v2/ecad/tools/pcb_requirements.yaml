  - id: REQ-035
    kind: requirement
    candidate: CAND-059
    parent: NEED-10
    statement: >-
      ZEROIZE crypto-erases the kit's stored data: every drive and eMMC key is wrapped by keys only the secure element
      holds, and ZEROIZE destroys them, then running modules drop their RAM keys, then the slots are cut. The only
      trigger is the covered ZEROIZE toggle held closed for 5 s; the tamper and lid switch logs and never triggers it;
      remote wipe is deferred. ZEROIZE is level-sensitive across a power loss: the toggle is read at boot before any
      slot powers, a wipe-pending record resumes the wipe, and the kit re-arms only when the toggle returns.
    acceptance: >-
      On the built prototype: (1) after the toggle is held closed for 5 s, a key operation with either key-encryption
      key fails; (2) no NVMe drive or eMMC unlocks or mounts on any module afterwards, including a module that was
      powered off during the wipe; (3) a toggle released before 5 s wipes nothing; (4) no other input starts a wipe:
      opening and closing the lid wipes nothing; (5) with power removed during the hold or the wipe, the wipe completes
      at the next power-up before any slot powers, and the kit re-arms only after the toggle is returned; (6) both
      key-encryption keys are destroyed and verified within 1.5 s of the end of the 5 s hold; (7) the slot rails are
      cut within 3.0 s of the end of the hold by a hardware timer that does not wait on the secure element, the kit
      bus or any module (SC-08); (8) the panel shows ZEROIZE complete and ZEROIZE incomplete as PANEL.md section 9 sets them (SC-30).
    allocated_to: [c, b, fw_panel, sw]
    verification_method: [MANUAL_REVIEW, SCRIPT, PROTOTYPE_MEASUREMENT]
    verification_phase: SCHEMATIC
    final_phase: PROTOTYPE
    prototype_1: core
    prototype_1_basis: NAMED
    prototype_1_why: "D-01 names ZEROIZE of the secure element as core; D-03 defines what it is."
    satisfied_by:
      rules: [SCH-004]
      decisions: [30]
    rule_coverage: PARTIAL
    rulings: [D-03]
    choices: [SC-08, SC-30]
    waits_on: [S-35]
    status: DEFINED
    evidence_result: NOT_JUDGED
    release_effect: BLOCKER
    residual_risk_accepted:
      by: OWNER
      ruled_on: "2026-09-26"
      ruling: D-03
      what: >-
        Drive unlock at boot depends on the secure element, the panel controller and the kit I2C bus (ARCH-PCB-B-IOHA
        section 10 common modes): a module that reboots while any of them is down cannot unlock its drive until they
        return.
    source:
      - "v2/docs/MESHSAT-709-geometry-appendix.md:2789 (item 5)"
      - "v2/docs/V2-SPEC.md:33-34"
      - "v2/docs/PANEL.md section 6"
      - "v2/docs/PANEL.md section 9"
      - "v2/ecad/tools/pcb_decisions.yaml:207-255 (decision 30)"
      - "v2/docs/TEST-PLAN.md:54"
      - "v2/docs/feasibility/ZEROIZE.md section 3.4"
      - "owner ruling D-03"
      - "v2/ecad/tools/gen_sch_b.py:1264"
    source_check: VERIFIED
    conflict_ref: C-09
    history: >-
      Round 3 carried the time from the end of the hold to the key's destruction as TBD (appendix 32.50 item 5 says
      'keys wiped in milliseconds'; nothing was ruled). ZEROIZE.md section 3.4 bounds the wipe with every retry counted,
      and the session took its pass lines (6) and (7) under the owner's standing rule (SC-08). Earlier drafts proposed
      a 1.0 s line from a nominal figure and a 1.88 s bound that did not hold on a held bus; neither is carried.
    notes: >-
      Pass lines (6) and (7) are the session's under SC-08, from the worst case of ZEROIZE.md section 3.4 and not the
      nominal: the timed phase allows at most 6 GenKey commands, CryptoAuthLib is bounded to one bus retry and a 200 ms
      polling cap at 100 kHz, every bus operation ends within 10 ms, and the phase ends at a 1.5 s deadline whatever the
      secure element or the bus does, so the modules are told to drop their keys before the cut. Enrolment uses one
      LUKS keyslot per drive, derived by ECDH with both key-encryption keys, and no recovery keyslot (ZEROIZE.md section
      3.3). Residual R7 (ZEROIZE.md section 8), for the D-09 security-review packet: the three STM32H743 I/O
      supervisors share SDA and SCL with the secure element, so "only the panel controller commands the part" (P8) holds
      for them only through firmware rule Z-C3 under the owner's D-13 floor of software-verified boot; a supervisor
      whose firmware breaks it can hold the bus, so the wipe ends ZEROIZE INCOMPLETE with both keys intact (the slots
      are still cut at 3.0 s), or run ECDH on slots 0 and 1 (ReqAuth is clear) and so obtain every drive's unlock
      secret, or answer in the secure element's place so that the panel records a verified wipe that did not happen.
      Z-C3 is CON-020. D-03 needs no board change: the hardware path from the switch to the secure element exists
      through the panel controller and the kit I2C bus, and since faf8c981 the toggle drives the panel's local
      ZEROIZE_SW (v2/ecad/tools/gen_sch_c.py:175-178). FEA-001 holds this record.

  - id: ASM-005
    kind: assumption
