  - id: SC-16
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: "Who holds Review A for layer 1, against what, and where is it recorded?"
    taken: >-
      One fresh reviewer, a session or person that wrote none of the pages, holds an AI review, labelled as one and
      never a qualified review, of PRODUCT-BRIEF.md, README.md, v2/README.md, v2/BUILD.md and V2-SPEC.md at one pinned
