  - id: FEA-004
    kind: feasibility
    parent: NEED-05
    title: "the power and thermal bounds"
    statement: >-
      The runtime, the all-transmit bound of D-11, the cells' charge and discharge windows in a sealed case and the PA's
      key-down heat are planning figures: about a fifth of the typical budget has no document, the enclosure
      conductance is not measured, the +35 C and +25 C restrictions are proposed controls, the key-down near 18 A
      exceeds the chain's declared 10 A continuous, and the PA's flange has no sensor.
    acceptance: >-
      The dominant undocumented loads measured or bounded by a maker; the enclosure conductance measured (the early
      heat-balance test or TEST-PLAN E3); PWR-F12 closed (the chain re-declared with a short-time rating, board A's
      pack-node copper judged at 18 A, F2 shown inside its +60 C rating at 18 A); PWR-F15 closed (a flange sensor on the
      PA); the controls C1 to C4 and rules K1 to K5 re-derived at bring-up from the readings.
    feasibility_page: "v2/docs/feasibility/POWER-THERMAL.md"
    blocker_ids: [PWR-F12, PWR-F13, PWR-F15]
    closing_evidence: >-
      The rows of POWER-THERMAL.md section 11's open table closed with their named evidence: the monitor, WiFi card,
      LimeSDR and PA drain on the bench; the enclosure conductance by the heat-balance test of section 10; the chain's
      short-time rating in pcb_energy_chain.yaml and pcb_pack_protection.yaml with F2's reading in the protection test;
      a flange sensor on board D; 'aged' defined for REQ-014.
    owner: >-
