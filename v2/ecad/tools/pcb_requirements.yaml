  - id: CFL-017
    kind: conflict
    parent: NEED-15
    statement: >-
      With its own pack fitted the kit cannot meet D-02a's +55 C operating margin, TEST-PLAN E5's +60 C humidity dwell,
      nor the +71 C and -33 C storage margins, since the stored kit keeps its pack (SC-19): both Samsung
      revisions rate the cells to +60 C in storage and discharge and the maker forbids use above it, and the storage
      floor is -20 C (Ver. 1.1) or 0 C (Version 1.0), while OPERATING-ENVELOPE section 8's arithmetic puts the inside
      air at +65 to +71 C at +55 C ambient (finding BAT-F19). TEST-PLAN runs those levels as stated deviations without
      the cells in the chamber, which measures the rest of the kit and does not resolve this.
    acceptance: >-
      A result for the kit with its pack: a measured pack arrangement that keeps every cell inside its limits at the
      margins (the bounded enclosure heat experiment, POWER-THERMAL section 10), cells rated beyond them (which reopens
      owner ruling D-06), or an owner reading of D-02a that its margins apply to the kit without its cells. Until then
      TEST-PLAN writes E3-S, E3-O, E4-S and E5 as deviations and never reports their pass as the kit's margin with its
      pack.
