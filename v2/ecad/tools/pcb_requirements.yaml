  - id: public-docs
    authority: OWNER
    ruled_on: "2026-09-25"
    title: "the foundation documents are published directly"
    ruling: >-
      The new foundation documents (the product brief, the concept of operations, the requirements and the decision
      table) go directly into the public repository's v2/docs/, not into a private draft area first. Ruled on the
      evening of 25 September 2026 and written down that day only in the session's own notes; recorded here on 27
      September 2026 by the layer 1 closer (MESHSAT-1357).
    source: ["owner ruling public-docs", "v2/docs/PRODUCT-BRIEF.md (Constraints fixed by owner rulings)"]
  - id: standing-rule
    authority: OWNER
    ruled_on: "2026-09-26"
    title: "the owner is not asked again"
    ruling: >-
      The owner is not asked further questions. Where a choice is left, the session takes the option the evidence
      recommends (the W1 decision table's recommendation where one exists) and records it as taken by the session
      under this rule, with its reason, so that it can be reversed.
    source: ["owner ruling standing-rule"]

# Choices the session took under the owner's standing rule of 26 September 2026: each is the session's, never
# the owner's, names the ruling that lets the session take it, says why, and can be reversed. `closes` names the
# open items it answered; `adds_core_needs` a need it added to prototype 1's core. A choice later withdrawn keeps
# its row with `withdrawn_on` and `withdrawn_why`, and nothing rests on it.
session_choices:
  - id: SC-01
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "Does SOS (NEED-19) join prototype 1's core?"
    taken: "Yes: NEED-19 is added to the core D-01 names, with SOS as D-10 defines it."
    why: >-
      D-10 defines SOS's action (firmware only), and W1's decision table recommended NEED-19 for the core; D-01 as
      ruled did not name it. CONOPS section 2a publishes the same choice.
    closes: [D-01-R2]
    adds_core_needs: [NEED-19]
    source: ["v2/docs/CONOPS.md section 2a", "owner ruling D-10"]
  - id: SC-02
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "Which peripherals are critical under NEED-03?"
    taken: >-
      Every USB peripheral ARCH-PCB-B-IOHA section 15 traces is critical, each moving with its bank, and so is the
      kit-to-kit WiFi link, whose antennas move to the standby card (IOHA A11). The LoRa module (slot 3's SPI) and
      cellular data (slot 2's PCIe lane), which have no second path and go down with their module, are NAMED
      EXCEPTIONS to NEED-03 for prototype 1. Prototype 1's NEED-03 acceptance stays IOHA tests A1 to A14, as D-01
      names it.
    why: >-
      Making either bearer critical needs a second LoRa site or the 5G module moved to USB 3, and both change the floor
      plan of board B, the board that is not routed; the exceptions need no board B change, and without them the kit
      is designed to keep at least three of D-01's four messaging bearers through the loss of any one module
      (ARCH-PCB-B-IOHA section 15a). Settled at about 11:35 CEST, with CONOPS sections 2a and 7a, IOHA section 15a and
      appendix 32.366 and 32.367 carrying the same answer. Corrected on 26 September 2026: this registry first recorded
      the two as open design gaps against NEED-03, not accepted exceptions, on the reading that the owner's
      requirement names no exception (V2-SPEC.md line 29), which contradicted IOHA section 15a and appendix 32.366.
      Reverse by naming either bearer critical, which reopens board B's floor plan.
    closes: [D-01-R1, S-38]
    source:
      - "v2/docs/CONOPS.md section 2a"
      - "v2/docs/ARCH-PCB-B-IOHA.md section 15a"
      - "v2/docs/MESHSAT-709-geometry-appendix.md:18791-18795 (32.366)"
      - "v2/docs/MESHSAT-709-geometry-appendix.md:18934-18945 (32.367 item 2)"
  - id: SC-03
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: >-
      Is TEST-PLAN E5's humidity cycle (30 to 60 C at 95 percent RH) a qualification margin or an acceptance test?
    taken: >-
      A qualification margin, judged like E3 and E4 under D-02a: survive and recover at the margin, and operate to
      specification inside the envelope.
    why: >-
      W1's D-02a question put E3, E4 and E5 together and recommended margins for all three; D-02a as ruled names the
      temperature levels of E3 and E4 only. E5's 60 C top is above the +40 C in-use limit, so reading it as an
      acceptance test would claim a wider envelope than the part table supports.
    closes: [D-02a-R1]
    source: ["owner ruling D-02a", "v2/docs/TEST-PLAN.md:28"]
  - id: SC-04
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: >-
      How D-01's core applies record by record where the ruling names a need but not the function, or names the
      function but not the need.
    taken: >-
      A record under a core need is deferred when it serves a function D-01 leaves out (the accessory outlets under
      NEED-05, the HF rail, the case-open record and key fill under NEED-10). A record under a need outside the core
      is core only when it is a condition of a core function: fitting the boards and the pack into the 1450 (NEED-06),
      a core transmitter kept inside the operator's licence and the EU limits (NEED-16), a core transmitter that must
      not blind a core receiver (NEED-17), or the test plan and reviews the core is accepted through (NEED-15). The
      environmental, EMC and self-interference tests outside those conditions are reported NOT_YET_TESTED until they
      run, and keep the pass lines of D-02a and the severities of D-02c.
    why: >-
      D-01 names the core functions and says the rest is reported NOT_YET_TESTED; this reads the ruling literally and
      publishes the same reading as CONOPS section 2a. It replaces the 21 readings of round 3, each of which now names
      this choice.
    source: ["v2/docs/CONOPS.md section 2a", "owner ruling D-01"]
  - id: SC-05
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "Which two modes carry D-06's runtime statement?"
    taken: >-
      PS-IDLE-SPEC (monitor on, radios idle, APRS beacons, as V2-SPEC line 23 words it) and PS-TYP (three modules at
      typical operation), each at +20 C for an aged pack.
    why: "The pair W1's decision table recommended with D-06; CONOPS section 6 publishes the same choice."
    source: ["v2/docs/CONOPS.md section 6", "owner ruling D-06"]
  - id: SC-06
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "Which transport route does D-04's statement name for the pack?"
    taken: >-
      By road, with the kit, as the operator's own equipment; carriage by air or by a parcel carrier waits on a UN
      38.3 test summary for the pack.
    why: >-
      The pack is to be built for the kit, not bought, and has no UN 38.3 test summary; the 4500 m transport ceiling
      of D-02c is the value W1's question tied to no carriage in an unpressurised aircraft hold.
    withdrawn_on: "2026-09-26"
    withdrawn_why: >-
      It read the pack's unknown UN 38.3 status as leaving road carriage open, and it does not: road carriage has its
      own dangerous-goods rules (the ADR, which the Dutch ILT names for road consignments; review of 26 September
      2026, section 5, reference R5), as air and parcel carriage have theirs. No route is claimed: the pack's
      classification, the conditions that apply to it or an exception that applies are to be established first
      (CONOPS section 4, Transport row, and section 7a; appendix 32.367 item 3). REQ-069 carries the requirement.
    source:
      - "v2/docs/CONOPS.md section 7a"
      - "v2/docs/reviews/2026-09-26-foundation-progress-review.md section 5"
      - "v2/docs/MESHSAT-709-geometry-appendix.md:18946-18957 (32.367 item 3)"
  - id: SC-07
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: >-
      How the kit sits in the 1450 once the owner reversed D-08: the face mounting, the frame's height, the antenna
      bulkheads, the connector plate, the RF entry plates and the QMX tray.
    taken: >-
      C1 the face plate on the 1450PF frame over Peli's o-ring, screwed from above into Peli's 6-32 inserts, as Peli
      documents; C2 the ruled gas-discharge arrestors as the twelve antenna bulkheads at Z 59, five east and seven
      west; C3 one connector plate between the hinge fairings carrying all six ruled wall items; C4 one aluminium RF
      entry plate per end wall carrying the arrestors and their common ground; C5 the QMX tray 1.5 mm west; C6 four
      setting legs under the frame's ring giving the frame a designed height.
    why: >-
      Each is laid out against the worst of Peli's own figures for the current moulding (D-08a), with every one of
      the 70 computed margins MET or OPEN and none NOT MET, where MET is a sensitivity reading and not a bound
      on a tolerance no source states, and M17g and M17x fail with the geometry as now assumed, held OPEN until the
      jumper plug is picked (CASE-MARGINS.md's opening summary and its findings 26 to 28); none changes a board, a ruled device or a purchase
      (CASE-MARGINS.md sections 3 and 4; appendix 32.367 item 1). CONOPS section 7a records the same choices.
    source: ["v2/docs/CASE-MARGINS.md section 4", "v2/docs/CONOPS.md section 7a"]
  - id: SC-08
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "How ZEROIZE (D-03) is met on the fitted ATECC608B, and what its timing pass lines are."
    taken: >-
      Keep the ATECC608B-SSHDA-T with two key-encryption keys (slots 0 and 1, SlotConfig 0x2084, KeyConfig 0x0013),
      both needed to unlock any drive and both destroyed by GenKey mode 0x04; enrol every drive and eMMC under both
      with one LUKS keyslot and no recovery keyslot; run the wipe of ZEROIZE.md section 3.4 with REQ-035's pass lines
      of 1.5 s (both keys destroyed and verified) and 3.0 s (the slot rails cut by a hardware timer that waits on
      nothing) from the end of the hold; write firmware rule Z-C3 into the supervisors' requirements (CON-020); keep
      the SLB 9673 TPM 2.0 on board B's U8 site as the fallback under switch conditions S1 and S2.
    why: >-
      Public Microchip documents and CryptoAuthLib v3.8.0 support the mechanism at desk level for the ATECC608B
      (ZEROIZE.md sections 1, 3 and 4). The pass lines come from the worst case with every retry counted and a
      deadline the panel's own bus layer enforces, not from the nominal figure (section 3.4); the fallback changes
      board B's U8 site only (section 6). ZEROIZE.md section 9 records the recommendation; the bench spend for
      Z-EXP-A and Z-EXP-B stays the owner's under D-09 (L-06).
    source: ["v2/docs/feasibility/ZEROIZE.md section 9", "owner ruling D-03"]
  - id: SC-09
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: >-
      How D-02a's qualification margins meet a pack whose cells are rated to +60 C, once board P's secondary
      over-temperature is restored.
    taken: >-
      The BQ7720700's over-temperature stays active on its own 103AT-2 thermistor (J_TS2, R34 270 ohm, R33 18 kohm).
      D-02a's margins stay for the kit and the pack's margins are its cells' limits: TEST-PLAN E3 and E4 store and run
      the kit with the pack removed, and the pack gets its own checks at its cells' limits (a +58 C storage set point
      for 24 h, a discharge check at its 60 C limit, the lowest storage temperature of the governing cell
      specification).
    why: >-
      A qualification target is not a technical justification for disabling a protective function (review of 26
      September 2026, section 2). Both Samsung revisions cap the cells' storage and discharge at +60 C, so a +71 C
      soak exceeds the cells' rating whatever board P does, and TEST-PLAN E3's own pass line ("pack under 60 C")
      already says so (SECONDARY-OT-DECISION.md sections 2, 3 option G, and 5).
    source: ["v2/docs/review-packets/battery/SECONDARY-OT-DECISION.md section 5", "owner ruling D-02a"]
    withdrawn_on: "2026-09-26"
    withdrawn_why: >-
      Its test-plan half removed the pack from every margin because the cells cannot meet them, which the second
      checkpoint review of 26 September 2026 (section 2 B) found changes the tested configuration and procedure without
      reconciling it with the product requirement, and it left the transport state (pack fitted) and the hot use of the
      product with its pack untested. SC-12 takes both halves again: the circuit unchanged, the margins by the product's
      own states.
  - id: SC-10
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "D-11's declared key-down time and state-of-charge floor."
    taken: >-
      PROVISIONAL thresholds, not pass lines: every transmitter at once only above a pack rest voltage of 15.5 V (3.88
      V per cell), the PA keyed alone only above 12.4 V; every PA key-down at most 60 s, started only with every cell at
      most +55 C and the PA's flange at most +75 C, with the outlets, the pack heater and the standby WiFi card off, and
      ended early above 18 A, at a low cell or at +85 C on the flange (POWER-THERMAL.md section 7.2).
    why: >-
      Set from the gauge's 20 A over-current trip with 10 percent margin and the cells' 60 C discharge window. They
      hold only once the pack chain carries a short-time rating, board A's pack-node copper is judged at 18 A and the
      chemical fuse F2 is shown inside its +60 C rating at 18 A (PWR-F12), and once a flange sensor exists (PWR-F15), so
      they stay PROVISIONAL and REQ-018 keeps its TBD (POWER-THERMAL.md sections 0, 7.2 and 11).
    source: ["v2/docs/feasibility/POWER-THERMAL.md section 7.2", "owner ruling D-11"]
  - id: SC-11
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: "How EMCON (D-05) reaches the 5G module, and what the element every row shares costs."
    taken: >-
      SD-EMC-1: the 5G module's firmware-independent inhibit is removal of its supply, staged in the maker's order
      (W_DISABLE1# at once, the host's AT+CFUN=0 handshake, FULL_CARD_POWER_OFF# after T_off, the supply after T_cut),
      both stages at once and latched when EMCON meets a module never turned on, with a named fallback if bench test
      E-05 shows the fitted firmware misses the pin while booting. SD-EMC-6: the one element every row shares (the
      SW_EMCON toggle and the TX_INHIBIT_n conductor) is accepted on condition of a hardware EMCON lamp on board C
      driven from the line state with no processor in its path (CON-021).
    why: >-
      Quectel documents W_DISABLE1# as a firmware-mediated airplane mode, untimed and possibly host-configurable, and
      removal of the supply is the only inhibit its documents give that does not depend on the module's firmware; the
      costs in the fault and booting cases (emission for up to T_off + T_cut, at least 15.9 s, and the module's flash)
      are bounded and accepted there (EMCON.md sections 0, 4.5, 5 and 7).
    source: ["v2/docs/feasibility/EMCON.md section 5", "owner ruling D-05"]
  - id: SC-12
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-26"
    question: >-
      How the pack's temperature protection is coordinated, and how D-02a's qualification margins meet a pack whose
      cells are rated to +60 C, reconciled with the product requirement (second checkpoint review, finding B).
    taken: >-
      The BQ7720700's over-temperature stays active on its own 103AT-2 (J_TS2, R34 270 ohm, R33 18 kohm), an emergency
      backstop at 62.7 to 77.5 C. The gauge's thresholds sit inside the cells' limits by the gauge's own published
      error budget: OTC 44.0 C, OTD 57.5 C, UTC 1.0 C, UTD -9.0 C, the charge ranges T1 1 C, T3 42 C (no charge starts
      above it, the charge inhibit) and T4 43 C, SOT 65.0 C, the die as the FET temperature (PROVISIONAL until the
      bench measures the gradient to the hottest cell and the cells are weighed). Each qualification margin runs in
      the configuration of the state it represents: +71 C and -33 C storage on the kit less its pack, as stated
      deviations (the storage clause as first taken, 'with the pack out', is superseded by SC-19 of 27 September 2026:
      the stored kit keeps its pack), and the pack-fitted exposures (transport soaks, hot use at +40 C and +25 C,
      closed lid, humid use up to +40 C, the pack's own soaks) at the cells' own limits. The +55 C operation and E5's
      +60 C humidity dwell, which the kit cannot take with its pack fitted, run as stated test deviations with the
      pack outside the chamber on an extension of its leads, and their product-level result is recorded as a conflict
      (CFL-017, finding BAT-F19), not closed by them. A kit with its pack fitted is never left where the temperature
      may exceed +60 C.
    why: >-
      The state definitions are session text: the owner approved on 6 September 2026 that a whole-kit test plan be
      written (appendix 32.50 item 16e), the session wrote its states on 7 September (2e33773b, whose deployed state said
      nothing about the pack) and the ConOps took them on 25 September; they put the pack out in storage and fitted in
      transport and use. The cell maker rates storage and discharge to +60 C at most and forbids leaving the cells "in a
      car or similar place where inside of temperature may be over 60°C" (Samsung INR18650-35E Ver. 1.1), and
      OPERATING-ENVELOPE section 8's own arithmetic, beside the owner's D-02a table, puts the inside air at +65 to +71 C at
      the +55 C margin. The choice would be the same with any board P or none, and where the pack is kept out only
      because its cells cannot take a level the test is written as a deviation and its product-level result recorded,
      so no qualification condition is chosen by what the circuit can pass
      (v2/docs/review-packets/battery/THERMAL-COORDINATION.md sections 3, 4, 5, 9 and 9a).
    source: ["v2/docs/review-packets/battery/THERMAL-COORDINATION.md sections 9 and 9a", "owner ruling D-02a"]
  - id: SC-13
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: "One description of the dual SIM (S-13, CFL-010): eSIM plus nano-SIM, or the generator's two nano-SIM holders?"
    taken: >-
      Quectel's compatible design for USIM2 (RM520N series hardware design v1.1 section 4.1.6, Figure 19), which
      gen_sch_b.py already carries: SIM 1 a nano-SIM holder on (U)SIM1, SIM 2 a nano-SIM holder on USIM2 behind four
      0 ohm links at the module, so the same board also builds appendix 32.50 item 12's eSIM-plus-nano-SIM
      configuration with an eSIM-fitted module variant and the links left off. Prototype 1 is built with two nano-SIMs,
      a session default that departs from the configuration the owner approved (eSIM plus nano-SIM, appendix 32.50 item
      12) until the eSIM variant's order code is named; that code stays on the components layer's list.
    why: >-
      It keeps both configurations on one board with no board change and drops nothing the owner approved, where an
      eSIM default would wait on an order code no held document names (v2/vendor/SOURCES.yaml, the RM520N-GL entry).
      The SIM TVS array of at most 10 pF (section 4.1.7) and the eSIM variant's code stay owed under S-13, so CFL-010
      stays open. Reverse by making the eSIM configuration the default build once that code is named; no board change
      either way.
    source:
      - "v2/docs/V2-SPEC.md:41 and correction 22"
      - "v2/ecad/tools/gen_sch_b.py:672-697"
      - "v2/vendor/quectel/quectel-rm520n-series-hardware-design-v1.1.pdf sections 4.1.6 and 4.1.7"
  - id: SC-14
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: "REQ-023: which carried-mass limit does the kit design to?"
    taken: >-
      The kit, closed and latched with the pack and the lid's carried items fitted, is designed to weigh under 45.4 kg
      (100 lb) with its largest dimension under 91 cm (36 in): the man-packed or man-portable row of MIL-STD-810H
      Method 516.8 Table 516.8-IX, whose 122 cm and 26 drops the owner ruled as TEST-PLAN E1 (D-02c).
    why: >-
      The ruled E1 severity presumes that category, so it is the one limit the sources already imply; a tighter
      one-person carry limit would need an ergonomics source this tree does not hold, and none is claimed. At desk the
      sourced floor is about 7.0 kg (ARCHITECTURE.md section 11), and the case's exterior is 417.6 x 330.2 x 173.2 mm on
      Peli's product page, about 478 mm long over the arrestor rows (CASE-MARGINS.md sections 2.2 and 3.4), the table
      classifying by the outside of the item and its case. Reverse by stating another limit: a
      lighter one tightens the design; a heavier one moves E1 into another row (eight corner drops from 76 cm), which
      changes D-02c and so goes to the owner.
    source:
      - "v2/vendor/standards/mil-std-810h-method-516-8.md (Table 516.8-IX)"
      - "owner ruling D-02c"
      - "v2/docs/V2-SPEC.md correction 25"
  - id: SC-15
