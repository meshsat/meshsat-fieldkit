      switched loads and PI_KILL), and the two thresholds sit, in the gauge's own reading, under its discharge
      over-temperature of 57.5 C and inside +60 C by the published terms of the battery packet's error budget
      (THERMAL-COORDINATION.md section 3; CONOPS section 4c); a configuration in which the cells' temperature reaches no
      controller that can remove load reads FAIL. Prototype: TEST-PLAN E3-H, during E3-A and E3-L at +40 C, first on the
