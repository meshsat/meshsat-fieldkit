  - id: REQ-051
    kind: requirement
    parent: NEED-07
    statement: >-
      TEST-PLAN's +55 C operation and +71 C storage (E3) and -33 C storage (E4) are qualification margins over the
      adopted envelope (-20 to +40 C in use, -20 to +45 C storage), each judged on two pass lines: inside the envelope
      the kit is to operate to specification; at the margin it is to show no damage and recover. E5's humidity cycle is
      judged the same way (SC-03, REQ-026). The margins are the kit's: E3-S and E4-S run on the kit less its pack and
      E3-O and E5 with the cells kept out of the heat, each a stated test deviation, since the stored kit keeps its pack
      (SC-19); the exposures with the pack fitted run at the cells' own limits; and the kit with its own pack
      does not meet the +55 C, the +60 C humid and the storage levels (CFL-017, finding BAT-F19).
    acceptance: >-
      Inside the envelope, the functional check (TEST-PLAN section 4) passes at the envelope's limits, the hot and humid
      limits with the pack fitted (TEST-PLAN E3-A, E5-A). At each margin level, in the state the row names (E3-S and E4-S
      stored with the pack out; E3-O and E5 as stated deviations, the pack outside the chamber): no damage, no lost data
      or keys, and full function resumed once the kit is back inside the envelope, with its logs intact. The exposures
      with the pack fitted (E3-T, E4-T) and the pack's own soaks (E3-P, E4-P) run at its cells' limits (TEST-PLAN
      section 6). TEST-PLAN states both pass lines, never reports a margin result as an envelope claim, and never
      reports a deviation's pass as the kit's margin with its pack.
    allocated_to: [kit, procedure]
    verification_method: [MANUAL_REVIEW, PROTOTYPE_MEASUREMENT]
    verification_phase: SCHEMATIC
    final_phase: PROTOTYPE
    prototype_1: deferred
    prototype_1_basis: NEED_DEFAULT
    satisfied_by:
      rules: [ENV-001, ENV-002]
      decisions: [34]
    rule_coverage: PARTIAL
    rulings: [D-02a]
    choices: [SC-03, SC-12, SC-19]
    status: DEFINED
    evidence_result: NOT_JUDGED
    release_effect: MUST_JUSTIFY
