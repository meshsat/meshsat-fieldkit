  - id: SC-33
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      A start-up with the lid closed (Review A, finding B2).
    taken: >-
      The panel controller raises all three slots at every start-up; the bridge enters the reduced mode by the normal
      route (drop SLOT_EN1, bank 1 to slot 2) once it reads the lid closed from the sensor controller; if bank 3 has no
      host the lid is not read and the kit stays normal under C1 and C3.
    why: >-
      The reed lands on the sensor controller alone (gen_sch_e.py lines 524 to 542), which reaches a module only over
      bank 3's USB, so the panel has no lid state before a module runs; this asks nothing new of the supervisors (no
