      board B's TPS23861 PoE controller (U5) answers the broadcast address 0x30 whatever its A3 pin says (TI SLUSBX9I,
      sections 7.3.13 and 8.3.3.1), and 0x30 is supervisor 1's status address; the broadcast address is fixed in the
      part, so it is the supervisors' address that has to move, in their firmware. Corrected 27 September 2026 by the
      layer 5 closer (hc5-layer5): the session's block 0x34 to 0x36 of ARCHITECTURE.md section 5.5 (I3-F01) replaces
