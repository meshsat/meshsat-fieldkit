  - id: SC-35
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      D-11's declared key-down time and state-of-charge floor, as REQ-018's and REQ-059's pass lines.
    taken: >-
      D-11's declared values are SC-10's thresholds, taken as REQ-018's pass lines: every transmitter may key at once
      only above a pack rest voltage of 15.5 V, the PA keyed alone only above 12.4 V, and every PA key-down lasts at
      most 60 s, with the accessory outlets at their minimum contract (0 W, SC-24). REQ-059's key-down duty is
      the same 60 s, begun only with the PA's flange at most +75 C and ended at +85 C (POWER-THERMAL.md section 7.2, K2
      and C4). Whether the chain meets them (PWR-F12, the flange sensor of PWR-F15, the enclosure's heat balance) stays
      FEA-004's, and a failure there reopens these values.
    why: >-
      D-11 lets the session set both thresholds from the fuse and gauge limits, and SC-10 did so from the gauge's 20 A
      over-current trip with 10 percent margin and the cells' 60 C discharge window. What kept them PROVISIONAL is
      whether the chain can carry them, a feasibility question of layer 4 and not a requirement limit (the layer audit);
      left TBD, the pack's configuration, board A's pack-path copper and board D's thermal path have no target. Reverse
      by stating other values in REQ-018 and REQ-059.
    closes: [S-14]
    source: ["v2/docs/feasibility/POWER-THERMAL.md section 7.2", "owner ruling D-11"]
  - id: SC-36
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      How REQ-016's TBD (the solar input window and panel class, and M1's energy balance) is settled.
    taken: >-
      REQ-016 is split. REQ-016 keeps the charging function in the core and states board E's input window as generated:
      a panel whose open-circuit voltage at its coldest operating temperature is at most 25 V (the value board E's
      generator declares for the panel entry, v_max 25.0 on PV_P and PV_IN, against which every part on it is judged;
      the SMCJ28A clamp D4 stands off 28 V above it and conducts from 31.1 V, under the 35 V bulk capacitors), held at
      17.6 V by the LT8705A's input regulation (the FBIN divider R8 and R9), delivering at most 100 W into the stage
      (5.68 A at 17.6 V, on the 10 A fuse F2 and the 10 A JST-VH J_SOLAR). M1's pack-plus-solar energy balance becomes
      its own core record, REQ-072, over M1's duration (SC-21) and the reference day of SC-37.
      Whether the input path carries it is a layer-4 question (S-53), and REQ-016 waits on it.
    why: >-
      The window is a design interface with a hardware effect that the generator already states; the balance is the
      mission's need. Keeping them apart lets the need stand as stated while layer 4 decides whether the input path is
      re-rated, which would restate REQ-016. The first text of this choice took the clamp's 28 V standoff as the window;
      Review B (finding B4) found that wider than the entry the generator declares, so the window is the declared 25 V,
      and a panel above it needs the entry re-declared and PV_P's parts judged again. Reverse by merging the two records
      again.
    source: ["v2/ecad/tools/gen_sch_e.py", "owner ruling D-06"]
  - id: SC-37
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      The solar resource M1's energy balance is judged against: which site, design month and day.
    taken: >-
      The reference day, the design day of M1's energy balance, is the mean day of September at Leiden (52.160 N, 4.497
      E) on a panel inclined at the optimum angle (40 degrees, facing south): 4.0 kWh/m2 a day, the lowest monthly mean
      of April to September in the European Commission's PVGIS-SARAH2 record for 2015 to 2020. It is the month the input
      path is judged against, not a season M1 is limited to: M1 carries no season (CONOPS section 3), and a month with
      less sun asks more of the panel (December's mean on the same plane is 1.1 kWh/m2 a day), which the layer-4
      judgement records beside the design month (S-53).
    why: >-
      A balance needs a stated resource, and none was in the tree. PVGIS is the European Commission's public irradiation
      service, the owner's own location is the reference for the D-04 market, and the worst month of the half year with
      the most sun is the usual design month of a stand-alone solar system. The first text of this choice added that no
      solar-sustained duration was claimed from October to March; Review B (finding B5) found that a narrowing of M1's
      scope made only in a session choice, so that clause is withdrawn and M1 keeps the scope CONOPS states. Reverse by
      naming another site, month or day, which moves the panel rating the input path must take.
    source: ["v2/vendor/solar/pvgis-leiden-monthly-2015-2020.json", "owner ruling D-04", "owner ruling D-06"]
  - id: SC-38
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      REQ-030's bench pass line: what 'silenced' means at an antenna port, and the same line for REQ-071's timing.
    taken: >-
      With EMCON asserted, the power at every antenna port, measured with an external spectrum analyser connected at the
      port in the reference bandwidths of CEPT's ERC Recommendation 74-01 (edition of May 2022, recommends 4: 1 kHz to
      150 kHz, 10 kHz to 30 MHz, 100 kHz to 1 GHz, 1 MHz above) over its Table 1 range for the port's band, is at or
      below a fixed line 10 dB under that recommendation's Table 2 line for receivers and idle or standby transmitters:
      -67 dBm from 9 kHz to 1 GHz and -57 dBm above. The antenna ports of the receivers D-05 keeps listening (the VHF
      port and the GNSS port) pass at or below the Table 2 line itself (-57 dBm and -47 dBm). Each port's spectrum is
      recorded.
    why: >-
      EMCON.md section 6 made every row's pass line 'no emission above the instrument's noise floor' at a resolution
      bandwidth left open, so the line had no instrument setting. A fixed line in the reference bandwidths reads the
      same on any analyser whose floor lies under it; the first text of this choice tied the line to the displayed
      floor, which moved with the set-up (Review B, finding m1). 10 dB under the published receiver line keeps the
      silence EMCON asks for clear of a listening receiver. The ports of the receivers D-05 keeps on cannot meet a line
      under a receiver's own while they listen, and the published line for a receiver or an idle transmitter (a station
      not producing its authorised emission, recommends 12 and 13) is the one that separates listening from
      transmitting. The recommendation is public and the kit claims no conformity with it (D-04): it is a measurement
      threshold. S-02 (RF-002's enumeration of every transmitter) stays a verification dependency, not a limit. Reverse
      by naming another line, a stricter tactical one if the owner rules one.
    source:
      - "v2/vendor/standards/erc-rec-74-01-2022-05.md"
      - "v2/docs/feasibility/EMCON.md section 6"
      - "owner ruling D-05"
  - id: SC-39
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      NEED-03's failure set, and the four common modes ASM-002 names (S-36), decided at layer 3 rather than at Review C.
    taken: >-
      NEED-03's failure set is the loss of one compute module or one I/O supervisor in every way that element can fail:
      dead, unpowered while its neighbours run, held in reset, wedged with its outputs at any level, or shorted on its
      own rails. The four shared elements ASM-002 names (the +5V_DEV and +3V3_DEV converters on board A, the J_PANEL
      ribbon, the KSZ9897R switch, and the kit I2C bus with the panel controller as its one master) are outside that
      set: a fault of one of them on its own is a single point of failure of the kit, named in ASM-002 and in every
      public statement of NEED-03, neither claimed as covered nor recorded as a risk the owner accepted. Inside the set,
      a failed module or supervisor must not take a shared element down with it (REQ-073). Whether each shared
      element is mitigated is architecture work at layer 4 (S-36, Review C).
    why: >-
      NEED-03's own words name the loss of one compute module or one I/O supervisor (CONOPS section 2); reading the four
      shared elements into it would make a requirement the design never claimed, and reading them out without saying so
      would hide them (ARCH-PCB-B-IOHA section 12, rows 11 to 13; ZEROIZE.md section 8, R4 and R7). ASM-001 already
      refuses 'no single point of failure' about the kit. Deciding the scope here ends the cycle the layer audit found,
      where NEED-03's scope waited on Review C while Review B gates the architecture budgets. Reverse by reading any of
      the four into NEED-03, which makes its mitigation a requirement and reopens boards A, B or C.
    source:
      - "v2/docs/ARCH-PCB-B-IOHA.md section 12"
      - "v2/docs/feasibility/ZEROIZE.md section 8"
      - "v2/docs/CONOPS.md section 2"
  - id: SC-40
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      The pack's charge current (S-20, D-06's 'lower charge setting for cell life').
    taken: >-
      The pack is charged at no more than 3.06 A, 1,020 mA per cell of the 3P block, the maker's charge current 'for
      cycle life' (Samsung INR18650-35E Ver. 1.1, clause 3.5), set in the charger's ChargeCurrent and in the gauge's
      charging current; the cell's standard 1,700 mA and its 2,000 mA maximum are not used.
    why: >-
      D-06 asks for a lower charge setting for cell life, and clause 3.5 names the current for cycle life; it is also
      the charge current under which the maker states its 500-cycle capacity (7.9). At 3.0 A the pack takes 46.5 W and
      the constant-current phase to 80 percent lasts 2.7 h (POWER-THERMAL.md section 8, INFERRED). Reverse by setting
      the standard 1,700 mA per cell, which shortens charging and no longer matches the ageing basis.
    closes: [S-20]
    source:
      - "v2/vendor/battery/samsung-35e-orbtronic.pdf"
      - "v2/docs/feasibility/POWER-THERMAL.md section 8"
      - "owner ruling D-06"
  - id: SC-41
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      REQ-042's alarm levels and the path from the sensor controller to the device that opens the pack.
    taken: >-
      Water bridging the case-floor electrodes, or the battery-bay SGP41's VOC signal crossing the alarm level set at
      bring-up from its own clean-air baseline, raises MASTER WARN and makes the sensor controller command the pack
      gauge over the pack SMBus lead (J_SMB) to open both of the pack's protection FETs within 10 s of the reading
      crossing its level: the gauge's SHUTDOWN where no input is present, and where one is (SHUTDOWN is entered only
      with no charger present, SLUUAQ3A 5.4.2 and 13.1.8) its EMERGENCY SHUTDOWN through the Manual FET Control
      sequence, which opens both FETs whatever the input (SLUUAQ3A 5.4.4.2), with its restore timeout (5.4.4.3) set in
      the golden image so that the pack stays open until service; the compute modules and the panel controller end off
      or in reset. The alarm levels are characterisation, set and recorded at bring-up.
    why: >-
      The SGP41 is a digital sensor on an I2C bus, so every path from it to the pack runs through firmware; the gauge's
      own FET control over SMBus is the device that already opens the pack, and it needs no new pin on the four-way lead
      between boards E and P (the J_SMB contract, S-05). 10 s covers the SGP41's VOC response time (under 10 s,
      datasheet Table 1) and the command. The SGP41's datasheet specifies VOC and NOx responses only, with hydrogen as a
      background gas, so the hydrogen half of the approved battery-bay sensing has no specified part (S-49). The first
      text named the gauge's SHUTDOWN alone, which the gauge enters only with no charger present, so with shore, vehicle
      or solar present the pack would have stayed closed (Review B, finding m4); the emergency shutdown covers that
      case. Reverse by adding a hardware shutdown line to the E-P lead, which changes both boards' connector.
    source:
      - "v2/vendor/sensirion/sgp41-datasheet.pdf"
      - "v2/vendor/battery/ti-sluuaq3a-bq4050-trm.pdf"
      - "v2/docs/MESHSAT-709-geometry-appendix.md:2896 (32.54)"
  - id: SC-42
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      How the three compute modules' radios use antennas, and what CON-011 requires while the maker's certification
      position on the kit's antenna path is not known (S-16).
    taken: >-
      Slot 1's module drives the WIFI 2.4 jack through the lead of Raspberry Pi's antenna kit to board A's J_RF3, the
      blind-mate and the wall arrestor, with the kit's antenna on the jack, as generated (gen_sch_b.py, the S-16
      comment; ASSEMBLY.md's lead table). Slots 2 and 3 keep their radios off in hardware unless the panel firmware
      moves the local WiFi to one of them after slot 1 is lost, when that module uses its own on-board antenna
      (dtparam=ant1). CON-011 requires the path between slot 1's module and the kit's antenna to be passive, so the
      radiated power never exceeds the module's approved configuration, and no document to claim the module's approval
      holds through that path until Raspberry Pi's written position is held (S-48).
    why: >-
      The owner ruled the Pi antenna kit on the WIFI 2.4 jack in the device set of 6 September 2026, so moving the
      antenna inside the case would overrule a device ruling and weaken the link under the aluminium face plate, and
      disabling the radios would drop a ruled function. A passive path can only lose power, which the kit can show; the
      approval question is the maker's (the CM5 datasheet, section 4.1.2 and its antenna note) and changes no board.
      Reverse by moving the antenna inside the case (a change of the owner's device ruling) or by disabling the module
      radios.
    closes: [S-16]
    source:
      - "v2/vendor/cm5/cm5-datasheet.pdf"
      - "v2/vendor/cm5/cm5-antenna-kit-product-brief.pdf"
      - "v2/ecad/tools/gen_sch_b.py"
      - "v2/docs/ASSEMBLY.md"
  - id: SC-43
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      The MIL-STD-461 edition and limit curves for the characterisation runs M1 to M5 (S-18).
    taken: >-
      MIL-STD-461G (11 December 2015), with the limits it gives for the 'Ground, Army' installation of its Table V for
      each test TEST-PLAN M1 to M5 runs (CE102, CS101, CS114, RE102, RS103). Every run is characterisation (D-04).
    why: >-
      It is the edition held (the requirement matrix is transcribed for the tree), its Table V has a ground installation
      row for Army equipment, which is the nearest class to a field kit carried in vehicles, and D-04 makes no EMC
      claim, so the edition only fixes the line each characterisation run is read against. A later edition is not held
      here. Reverse by naming another edition or installation row before the pre-compliance session is booked (D-09).
    closes: [S-18]
    source:
      - "v2/vendor/standards/mil-std-461g-requirement-matrix.md"
      - "v2/docs/TEST-PLAN.md section 3"
      - "owner ruling D-04"
  - id: SC-44
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      REQ-040's holdover target.
    taken: >-
      With GNSS and DCF77 both absent, the kit's time stays within 1 s of UTC for 24 h after the last valid time.
    why: >-
      The kit's own uses of time (message and log timestamps, the bearers' schedules) need seconds, not less, and a day
      covers a mission night without a fix. The RTC's order code resolves to a part other than the one the schematic
      names (SOURCES.yaml, board B U9, WRONG_MODEL), so the target is set from the need and the part is judged against
      it at layer 6. Reverse by stating another drift.
    source: ["v2/vendor/SOURCES.yaml", "v2/docs/MESHSAT-709-geometry-appendix.md:2795-2797 (items 11 and 13)"]
  - id: SC-45
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      How the remaining TBDs of deferred and procedure records are settled at requirement level (REQ-010, REQ-011,
      REQ-028, REQ-033, REQ-034, REQ-041, REQ-043, REQ-058 and CON-013).
    taken: >-
      REQ-010: an image goes over Iridium as one message of at most 100,000 bytes, the RockBLOCK 9704's largest packet.
      REQ-011: the tablet and its bracket leave the closed lid unmarked at CASE-MARGINS.md test T9; the model is a part
      pick. REQ-028: no service life, duty-cycle rating, mating-cycle count, fan life or pack cycle life is stated or
      claimed for prototype 1 (D-02c). REQ-033: a dark-adapted observer sees no light from the kit at 1 m and hears no
      sound. REQ-034: the mode's settings are its functional check, and its compatibility target is SC-48's; no
      night-vision compatibility is claimed before that target's examination has passed (D-01 defers the claim, not the
      design). REQ-041: each sensor agrees with a reference within its maker's published accuracy; the kit sets no
      accuracy target of its own; its alarms are REQ-042's and the lightning mast-down alarm (SC-47).
      REQ-043: each fan is one its maker rates IP68, with an operating range covering -20 C to the inside-air bar
      part_temps.py computes; the part is D-18's, and a fan without that rating would be a change of this statement,
      taken openly. REQ-058: during every PA key-down the SDR's receive input stays at or below +7 dBm, 3 dB under the
      maker's absolute maximum of +10 dBm, and the SDR receives again within 1 s of each key-down's end. CON-013: the
      charge hold is the gauge's window; the ambient at which it acts is characterisation.
    why: >-
      Each TBD was either a part pick, a figure a held document gives, or a characterisation the record had written as a
      limit; none removes a function or a protection. Where a design choice sat in a requirement's pass line it moves to
      the part or decision it belongs to, and the requirement keeps its need-level limit (the layer audit). Review B's
      first pass (27 September 2026) found four of the first texts short: REQ-041's dropped the mast-down alarm the
      owner approved (B2), REQ-034's dropped the compatibility target (B3), REQ-043's 'is intended to be' admitted a fan
      the statement excludes (m2), and REQ-058's designed to an absolute maximum with no margin and left NEED-17's
      blinding out (m3); each is restored or tightened here, none lowered. 3 dB is half the power the maker calls the
      absolute maximum, a damage line rather than an operating one, and 1 s is the time a receiver may stay blind after
      a key-down. Reverse any of them by restating that record.
    source:
      - "v2/vendor/rockblock/rb9704-datasheet-RB9704-001-JUN26.pdf"
      - "v2/vendor/limesdr/myriadrf-limesdr-mini-2-0-page-20260925.html"
      - "v2/docs/CASE-MARGINS.md"
      - "owner ruling D-01"
      - "owner ruling D-02c"
  - id: SC-47
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      The lightning detector's mast-down alarm (appendix 32.50, the sensor walk-through, sensor 6, approved as proposed;
      V2-SPEC's sensor line): the level at which it is raised and when it clears (Review B, finding B2).
    taken: >-
      The kit raises the mast-down alarm (MASTER WARN, with the storm distance and the instruction to lower the masts
      shown to the operator) when the AS3935 reports a lightning event whose storm-distance estimate is 10 km or less,
      and clears it once 30 minutes have passed with no event at 10 km or less. The sensor controller reads the sensor
      and raises the alarm; the alarm informs, it moves no switch and removes no power, and lowering the masts is the
      operator's.
    why: >-
      The owner approved the detector 'with a mast-down alarm' and set no level. The sensor's own factsheet quotes the
      United States National Weather Service's 30-30 rule: a storm whose thunder follows the flash within 30 seconds is
      within 10 km, head for shelter, and stay sheltered for 30 minutes after the last thunder; the sensor gives a
      distance estimate to the head of the storm within 40 km (the same factsheet). 10 km is the distance that rule
      names and 30 minutes its hold. The first pass wrote that the kit's only alarm levels were REQ-042's, which dropped
      this alarm (Review B, finding B2). Reverse by naming another distance or hold, or by giving the alarm an action.
    source:
      - "v2/vendor/sciosense/sciosense-as3935-factsheet.pdf"
      - "v2/docs/MESHSAT-709-geometry-appendix.md section 32.50 (the sensor walk-through, sensor 6)"
      - "v2/docs/V2-SPEC.md (the sensor suite line)"
  - id: SC-48
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      REQ-034's night-vision compatibility target: which standard class, and which test (Review B, finding B3).
    taken: >-
      The NVG mode is designed to MIL-STD-3009 (2 February 2001) for a Type I, Class B NVIS and judged by that
      standard's own lighting system NVIS compatible examination (5.7.2): with the panel, its light guides and the
      monitor at their NVG levels, the NVIS, focused on the 50 % square-wave NVG resolution chart at 20 ft (5.7.2.2)
      irradiated to 1.6 x 10^-10 NRB, resolves the same Snellen line as with every light of the kit off, and no light
      leak is seen through it. Each indicator's and the monitor's spectral radiance is recorded against the standard's
      TABLE III as characterisation. No document claims night-vision compatibility until the examination has passed on
      the built prototype.
    why: >-
      D-01 defers the NVG claim, not the design, so the mode needs a target its parts can be chosen against; the first
      pass's 'no claim' left board C's indicators, light guides and the monitor with none (Review B, finding B3).
      MIL-STD-3009 is the public definition of NVIS-compatible lighting (Distribution Statement A; its clauses
      transcribed at v2/vendor/standards/mil-std-3009-nvis-2001-02-02.md), taken here as the design target. Type I is
      the direct-view goggle a ground team wears. Class B, because the standard makes Class A incompatible with red
      lights (3.1.3) and the owner ruled the NVG mode's light red (appendix 32.50 item 16c, 'a low red level'). Its
      examination judges the effect on the goggle's resolution directly, which fits indicators at a low red level that
      no TABLE III row describes. The standard is written for aircraft crew stations, so its use for a ground kit is
      this choice's reading. Reverse by naming Class A (which needs the NVG colour changed, a change of the owner's 16c
      ruling) or another criterion.
    source:
      - "v2/vendor/standards/mil-std-3009-nvis-2001-02-02.md"
      - "v2/docs/MESHSAT-709-geometry-appendix.md section 32.50 (16c)"
      - "owner ruling D-01"
  - id: SC-49
    authority: SESSION
    under: standing-rule
    taken_on: "2026-09-27"
    question: >-
      What the kit does past its heat stage, when the heat stage cannot hold the cells, on the pack and on every input
      (Review B of layer 3, finding B1; Review A of layer 2, finding P2-B2).
    taken: >-
      The hot stop, on the pack's measured cell temperature (the hottest of the gauge's four cell thermistors, which
      board E's sensor controller reads over the pack SMBus once a second), in every mode and on every input state, in
      two steps. H1, at +56.5 C in two readings in a row: the panel controller sheds the kit to its minimum load (every
      running module shut down cleanly on PI_SHDN_REQ and SLOT_EN1..3 dropped within 60 s; the monitor, the heater,
      board D, PoE, the USB-C outlet, the wall port's VBUS and the PA and HF holds off through board A's expanders; the
      charge held by the charger's ChargeOption0 CHRG_INHIBIT bit, never board A's CHG_INHIBIT line, whose HIZ would
      move the load onto the pack; the shared device rail kept, since it feeds the panel controller; the mixer fans at
      full speed; MASTER WARN and the e-paper). H2, at +57.0 C in two readings in a row with H1 acting: the panel
      controller writes the e-paper and pulls PI_KILL, which takes the LTC2954's KILL low and every converter on board A
      off. Released at +46.5 C: from H1 the panel controller raises the heat stage's one module, at most once in 30
      minutes; from H2 only the operator's MAIN, the panel controller raising no slot until the cells read released.
      With the sensor controller lost the panel controller applies the same steps to board B's TMP117 at +55.0 and +56.0
      C, released at +45.0 C. It is FIRMWARE (the sensor controller detects, the panel controller acts), a control and
      not a protection; its path is HOT-R1 (SC-50). The thresholds are PROVISIONAL, re-derived at bring-up from
      TEST-PLAN P14 and E3-H.
    why: >-
      At the recorded low conductance the heat stage's inside air at +40 C is 60.6 C lid closed as generated and 62.1 C
      after BANK-R1 (pcb_envelope.yaml, worst_inside_air_c); on an input the pack carries no current, so its cells sit
      at about that air, above the maker's +60 C ('Don't leave, charge or use the battery in a car or similar place
      where inside of temperature may be over 60 C', Samsung INR18650-35E Ver. 1.1, degree sign omitted), and behind the
      heat stage stood only the gauge's OTD, which removes no heat on an input, and the destructive backstops (board P's
      second level from 62.7 C, which blows F2; the gauge's SOT from 64.2 C; the PTC; THERMAL-COORDINATION.md section
      4). The thresholds come from the battery packet's error budget (THERMAL-COORDINATION.md section 3): its published
      hot-side terms sum to 2.07 K, so a cell is at most 58.57 C when H1 acts and 59.07 C when H2 acts, leaving 1.43 K
      and 0.93 K for the budget's two TBD terms; in the same reading C1's 55.0 C, H1, H2 and OTD's 57.5 C keep 1.5, 0.5
      and 0.5 K apart whatever the sensor's error, so on the pack the kit sheds and stops before the pack drops out; the
      stop's own detection adds at most 0.06 K (records/hc2/hotstop_bounds.out). Two steps, so that the kit keeps its
      controller, its display and an automatic restart while its own heat is at its minimum, and removes the rest only
      when the rise is the ambient's. It lowers no requirement: REQ-052, REQ-024 and the +40 C envelope stay, and
      whether the stop acts inside the envelope is FEA-004's, open until the heat-balance test. Reverse by other
      thresholds (measured ones replace these at bring-up) or by a hardware stage that makes a step redundant
      (S-58); removing the stop reopens the cells' exposure above +60 C.
    source:
      - "v2/docs/review-packets/battery/THERMAL-COORDINATION.md sections 3, 4 and 8"
      - "v2/vendor/battery/samsung-35e-orbtronic.pdf"
      - "v2/vendor/ti/bq25731-datasheet.pdf (SLUSE66A 9.3.8, 9.4.1, 9.6.1)"
      - "v2/docs/CONOPS.md section 4c"
      - "v2/docs/records/hc2/hotstop_bounds.out"
      - "owner ruling D-02b"
