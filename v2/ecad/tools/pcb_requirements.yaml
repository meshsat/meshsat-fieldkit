  - id: CON-012
    kind: constraint
    candidate: CAND-092
    parent: NEED-03
    statement: >-
      When C1's triggers (inside air +50 C or any cell +55 C) recur in the reduced mode the kit runs its heat stage, one
      module (slot 2 as board B is generated, slot 3 once BANK-R1 is in board B), so compute redundancy (NEED-03) is not
      available in hot conditions, and past the heat stage the kit's hot stop acts on the cells' measured temperature,
      shedding to its minimum load, with no module, and then shutting down (REQ-077). The ambients at which
      each happens are bounds until the enclosure is measured: at the independent bound's worst corner the kit runs on
      one module from about +20.1 C lid closed and +24.0 C lid open, both below the +35 C the owner accepted, so NEED-03
      is lost lid open there too, and on none from about +33.2 C lid closed and +36.1 C lid open; whether the hot stop
      acts inside the envelope at all is FEA-004's (CONOPS section 4c; SC-18, SC-49).
    acceptance: >-
      The owner accepted (D-02b) one module above +35 C ambient. Separately, and the session's rather than the owner's
      (27 September 2026): SC-18 enters the heat stage on measured temperatures, and SC-49 acts past
      it, on the cells' measured temperature, before they pass +60 C. Stated in CONOPS section 4c; the ambient at which
      the heat stage is entered is measured by the heat-balance test of POWER-THERMAL.md section 10 and TEST-PLAN E3-A
      and E3-L, and no document states it before then.
