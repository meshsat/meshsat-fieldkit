    taken: >-
      HOT-R1, a board A and board E design item owed before their layout entry: the dock's spare contact, which already
      runs from board E's J_BLK pin 12 (BLK_SPARE, only the test point TP7 as generated) through the dock block to board
      A's J_DOCK pin 12 (DOCK_SPARE), where it lands on the expander U27's input pin 18 and so raises EXP_INT to the
      panel controller, is driven from the sensor controller's free GPIO19 (U10 pin 30, not connected as generated)
      through an open-drain 2N7002 with a gate pull-down on board E, and pulled up with 10 k to board A's 3.3 V; the
      dock contract IF-AE-DOCK names pin 12. Four states on the line: toggled at 1 Hz after each fresh reading of all
      four cells, the cells read and below H1; toggled at 5 Hz, H1; held low, H2 (so is a shorted line, which stops the
      kit); held high, the sensor controller lost. The panel controller reads the line before it raises any slot at a
      start-up.
    why: >-
      As generated the only path from the gauge's reader (board E's U10) to the panel controller is USB through a
      running module's bridge (U10's USB on board B's bank 3 hub, port 2; the panel controller on bank 1, port 2, bank 3
      after BANK-R1), which the heat stage as board B is generated does not have (bank 3 has no host) and which the
      stop's own first step removes, so the panel controller could neither act on the cells' temperature there nor see
      it fall again. The contact and the expander input exist: the change is one GPIO, one transistor and one resistor,
      with no part number new to either board and no contact added. Until it is in both generators the hot stop's
      requirement reads FAIL on the generated boards, a finding reported to the owner. Reverse by a USB-only path, which
      leaves the heat stage as generated without the stop and H1 without its release.
    source:
      - "v2/ecad/tools/gen_sch_e.py (J_BLK, TP7, U10, J_SMB)"
      - "v2/ecad/tools/gen_sch_a.py (J_DOCK, U27, R110, J_AB1, Q1, U1)"
      - "v2/ecad/tools/gen_sch_b.py (PORTS, J_PANEL)"
      - "v2/ecad/tools/gen_sch_c.py (J_PANEL, U3)"
      - "v2/ecad/tools/pcb_interfaces.yaml (IF-AE-DOCK)"
