# THE REQUIREMENTS OF THE V2 FIELD KIT, AS DATA (MESHSAT-1357, foundation baseline, 26 September 2026).
#
# Prototype design. Nothing described here has been built, powered or field deployed, so every result that needs
# hardware starts, and stays, NOT_YET_TESTED until it is measured.
#
# WHAT THIS FILE IS. The project's requirements registry: what the kit must do (needs, from v2/docs/CONOPS.md),
# the requirements and constraints that make each need testable, the assumptions and implementation choices they
# rest on, the conflicts between sources that are still open, the architecture feasibility blockers of prototype
# 1's core, and the statements later records superseded, each with its acceptance criterion, its verification method
# and phase, the rules of pcb_rules.yaml and the decisions of pcb_decisions.yaml that judge or settle it, and its
# source. It sits ABOVE the rule registry: a rule says what a board must satisfy, a requirement says what the kit
# must do and which rules (if any) judge part of it. It does not change pcb_rules.yaml, whose fingerprint pins every
# verdict. rules_lib.py is its only reader (`load_requirements`, `validate_requirements`) and rules_render.py
# generates v2/docs/REQUIREMENTS-TRACE.md from it; that page is never edited by hand.
#
# WHERE IT CAME FROM. Workstream W1 extracted 107 candidate records once from V2-SPEC.md, OPERATING-ENVELOPE.md,
# PANEL.md, ARCH-PCB-B-IOHA.md, TEST-PLAN.md, pcb_board_facts.yaml and the design record, read back against the
# generators, then revised them after an independent challenge and eleven adjudications (A01 to A11, round 2 of
# MESHSAT-1357). The integrator assigned the ids below, applied the owner's rulings of 25 and 26 September 2026
# (listed under owner_rulings), split candidates where a ruling cut through them, and added the records the rulings
# create and one that adjudication A03 settles (clamp orientation, CON-016). The round-3 fix-up applied the rulings
# D-02d to D-17 and the owner's standing rule of 26 September 2026, under which the session took the choices listed
# under session_choices. `candidate` and `conflict_ref` name the W1 draft entries a record came from; they are
# provenance, not sources.
#
# RE-READ AT MAIN eadbe571 (26 September 2026, evening; round-4 challenge of this registry). Main had merged the
# rulings and product documents (4ec785d8, 68bc9e8f), the circuit corrections of every schematic board (faf8c981,
# 458b2873, d90f30e4), the case margins with the owner's D-08 reversal, D-08a, SC-02 and the transport correction
# (b69f20db), the evidence classes (26e847bc), the five feasibility pages of v2/docs/feasibility/, the battery review
# packet and the review routes. Every file:line citation was re-anchored at eadbe571: a cited line that main only
# moved was renumbered mechanically (difflib's alignment of the two revisions), and every citation whose text main
# changed was re-read by hand, as was every reading (evidence) of every record. A circuit defect main has corrected
# is recorded as corrected, with the commit, and never kept as a failure; a document that still describes the
# circuit main replaced is a conflict (CFL-014, CFL-015, CFL-016). The core functions whose feasibility is not closed
# are FEA records.
#
# IDS ARE STABLE. REQ requirement, CON derived constraint, ASM assumption, CHO implementation choice, SPD superseded
# statement, CFL conflict between sources, FEA architecture feasibility blocker. An id is never reused or renumbered.
# No prefix may equal a rule-id prefix of pcb_rules.yaml. Owner rulings are D-nn (and decision-NN for the board-level
# decisions), session choices SC-nn, open items S-nn (session), M-nn (an owner action), L-nn (later, money) and D-18
# (conditional). L-02 keeps its id: its class was corrected to OWNER_ACTION (D-06 leaves the value to the owner).
#
# FIELDS
#   parent              the NEED of CONOPS section 2 the record serves (quoted under `needs`, pinned by sha256)
#   statement           what must be true, in one or two sentences
#   acceptance          the pass line, with units and conditions. A number that is not known is written TBD, and
#                       then `tbd_effect` must say what not knowing it blocks. A figure that is only PROVISIONAL is
#                       never a pass line: it goes in `provisional`, which gates nothing
#   allocated_to        where the record is met: boards (a b c d e e5 p), kit (the whole kit), case, sw (compute
#                       module software), fw_panel, fw_sensor, fw_ioctrl (controller firmware), procedure; or an
#                       interface named in pcb_interfaces.yaml
#   verification_method rules_lib.METHODS; verification_phase is the EARLIEST phase of rules_lib.PHASES at which the
#                       record can be judged, final_phase where a later measurement is also owed
#   prototype_1         core or deferred, from the owner's ruling D-01 (FULL DESIGN, STAGED ACCEPTANCE): prototype 1
#                       is accepted on the named core, everything else is built where possible and reported
#                       NOT_YET_TESTED. prototype_1_basis says why: NEED_DEFAULT (the parent need is in the core list
#                       or is not; SOS joined the list by session choice SC-01), NAMED (an owner ruling names the
#                       function), SESSION (taken by the session under the owner's standing rule of 26 September 2026,
#                       with prototype_1_choice naming the session choice and prototype_1_why the reason)
#   satisfied_by        rules of pcb_rules.yaml that judge part of the record, and decisions of pcb_decisions.yaml
#                       that settle part of it. rule_coverage FULL, PARTIAL or NONE (NONE: no board rule judges it)
#   rulings             owner rulings (owner_rulings below) that set or changed the record; never a reversed one
#   choices             session choices (session_choices below) that set or changed the record; never a withdrawn one
#   waits_on            open items (open_items below, or decision-NN of pcb_decisions.yaml) the record depends on
#   status              DEFINED, TBD (the acceptance carries a TBD), SUPERSEDED, CONFLICT_OPEN, CONFLICT_RESOLVED,
#                       FEASIBILITY_OPEN, FEASIBILITY_CLOSED
#   evidence_result     the record's OWN reading: PASS, FAIL, INCONCLUSIVE (with evidence_phase, evidence naming a file
#                       and line, and evidence_class), NOT_JUDGED (judgeable before hardware, not yet read at requirement
#                       level), NOT_YET_TESTED (needs hardware), NOT_APPLICABLE (superseded). Rule verdicts are read
#                       from rules_status and never copied here. An open conflict reads FAIL on its own sources; a
#                       resolved one reads PASS or FAIL once its corrected sources are read again, NOT_JUDGED before
#   evidence_class      the class of that reading, in the six classes of v2/docs/CURRENT-EVIDENCE.md: CURRENT_CANDIDATE,
#                       VALID_HISTORICAL, AWAITING_REVALIDATION, DESK_REVIEW (the session's own reading of named files;
#                       never a qualified engineer's, never a physical test), PHYSICAL_TEST (built hardware; none
#                       exists), NO_EVIDENCE. A PASS never rests on AWAITING_REVALIDATION or NO_EVIDENCE, and a PASS a
#                       rule judges FULLY is refused while that rule's reading on the record's boards does not count
#   evidence_bound_to   every file a DESK_REVIEW, CURRENT_CANDIDATE or PHYSICAL_TEST reading read, as path@sha256/16:
#                       the committed netlist of each board it judged, the documents it compared. A binding the tree
#                       no longer matches makes the reading stale (a PASS is then refused; a FAIL or INCONCLUSIVE
#                       warns until it is re-read)
#   release_effect      what the record does while it is unmet or unresolved: BLOCKER, MUST_JUSTIFY (a written, dated
#                       justification naming the residual risk; a waiver never turns FAIL into PASS), ADVISORY, NONE
#                       (superseded). The policy applied: core requirements, constraints, open conflicts and open
#                       feasibility blockers BLOCKER; assumptions and choices MUST_JUSTIFY; resolved conflicts ADVISORY;
#                       deferred records MUST_JUSTIFY when hardware carries them (D-01: designed and fitted where copper
#                       exists), else ADVISORY. A deferred record is never a BLOCKER
#   residual_risk_accepted  a risk the owner accepted, with the ruling and its date
#   source              file:line as read at `sources_read_at` (eadbe571) unless the entry says otherwise, or
#                       `owner ruling <id>`, `session choice <id>`, or `none (gap)`. source_check VERIFIED (the cited
#                       artefact was read for this record) or INFERRED (derived; the notes say how)
#   history             what an earlier reading of the record said and what changed it, with the commit
#
# A FEASIBILITY BLOCKER (kind feasibility, FEA-nnn) is a prototype-core function whose feasibility is not closed
# (review of 26 September 2026, section 3 and checkpoint item 1). It carries feasibility_page (the page in
# v2/docs/feasibility/ or the review packet that works it out), blocker_ids (that page's own ids, each found on the
# page), closing_evidence (what closes it), owner, and what it holds: blocks (records that cannot read PASS while it
# is open) and holds_layout_entry (boards). An open blocker reads FAIL or INCONCLUSIVE, never PASS.
#
# The validator (`python3 rules_lib.py requirements`) refuses an unknown need, rule, decision, ruling, session
# choice, open item or interface, a wait on a closed item, a vocabulary value that is not listed, a TBD without its
# effect, a hedged or inferred number in a BLOCKER's pass line, a deferred BLOCKER, a scope the session took without
# naming its choice, a result without its evidence or its evidence class, a PASS on evidence that does not count, a
# stale binding under a PASS, a record resting on a reversed ruling or a withdrawn choice, an item closed by a commit
# this tree does not hold, a feasibility blocker whose page does not carry its ids, and a CONOPS that no longer
# matches its pin or whose needs table cannot be read as one table of distinct needs.

schema_version: 1
