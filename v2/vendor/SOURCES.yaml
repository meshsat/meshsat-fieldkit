    - "every re-taken resistor and capacitor row was decoded from its model (UNI-ROYAL, YAGEO RC, RT and CC, Samsung CL, CCTC, PSA FS, Samwha CS, Milliohm LR, Vishay WSL): 97 rows, value, stated voltage, tolerance and dielectric agree on all 97 (85 by rule, 12 by hand)"
    - "every other row whose value names a part number carries a model that is that part, suffixes for packing only (for example LM74700QDBVRQ1 for LM74700-Q1 on SOT-23-6, TPS22810DRVR for TPS22810DRV, PCA9555PWR for PCA9555PW, and XAL1010-103MED and -153MED for XAL1010-103ME and -153ME, where the held power/coilcraft-xal1010.pdf defines 'D = 13 inch machine-ready reel')"
    - "the 24 MHz hub crystals now resolve to C164058 (12 pF load) where the table had C70571 (18 pF): a substitution with its reason written at lcsc_fill.py:130-134 (18 pF load capacitors give about 12 pF with the board), so not a mismatch"
  standing_rows_not_retaken:
    - "B U9 'DS3231MZ' C9866 resolves to DS3231SN#T&R (the crystal-based part, not the MEMS DS3231M the value names): WRONG_MODEL in the table since before 29f00554 and still on the 45bde541 netlist"
    - "A J_RF1 to J_RF11 C3174425: WRONG_MODEL in the table (asked for 132134-11, JLCPCB's answer 132134), unchanged"
    - "B J_W1A, J_W1B, J_W3A, J_W3B, J_WOA and J_WOB C434808: WRONG_MODEL in the table (the U.FL-R-SMT-1 land, JLCPCB's answer U.FL-R-SMT(10)), unchanged and on the 45bde541 netlist (listed in the second pass; the first pass's sentence below had omitted them)"
  lcsc_fill_after_the_merge: "second pass, 26 September 2026 (scratch, not tree evidence): lcsc_fill.py (the tree's, unmodified) on the six netlist BOMs staged as kicad-cli's export writes them (exclude_from_bom honoured), against the marked table, each board with its own declared-phase lcsc-allow.txt. C PASS; A, B, D, E and P FAIL. D's R11 '1.0k' is filled from the table (C21190) and D has no uncovered blank. Codes refused: the condition 1 rows (A J_HEAT, J_MAINSW and U1; B LED14, LED24, LED34 and LED25; D J_VGG, LED2 and LED5; E J_SMB; P J_SMB and J_TS2), the parser rows (B's four REFCLK and HCSL lines, D R80, R81, Y1 and Y2, E J_TAMP, P J_TS and J_TS2) and the standing rows above (A J_RF1 to J_RF11, B U9, B's six U.FL lands). Blanks no allow line covers: B J_IOCOFF_A to C (bench jumpers), E F1 to F3 and P F1 (the blade holders). The first pass also listed C CAM_H1 and CAM_H2 and P JP1 as uncovered blanks: all three are exclude_from_bom (gen_sch_c.py:301, gen_sch_p.py:476), no BOM carries them and no allow line is owed for them"
  not_decided_here: "no per-board jlc_certify verdict in the tree was re-written: the tree's verdicts judge the deliverable folders, and A32, B21, D12 and E17 have none. CMP-002 and SUP-001 need a re-take over the folder each board declares once it is cut"

