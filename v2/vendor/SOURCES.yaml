# v2/vendor/SOURCES.yaml: identity and source record for the critical parts of the V2 carrier set.
#
# Written 25 September 2026 (MESHSAT-1357, foundation re-baseline, workstream W6) and revised the same night
# after an independent challenge. Published 26 September 2026 by integration I6, which added the owner's rulings
# of 25 to 26 September 2026 where an entry depends on them (the envelope note below, the supervisor and the
# secure element) and closed the first owed item. Read against tree 82dd1e4d; the schematic generators, jlc_certify.py,
# lcsc_fill.py, JLC-CERTIFIED.tsv and v2/vendor/ are byte-identical between e6291404 and 82dd1e4d.
# Prototype work: nothing here has been built, bought for assembly or field deployed.
#
# WHAT THIS FILE IS. For each critical part on the CURRENT schematic generators (v2/ecad/tools/gen_sch_*.py):
# the part as the schematic names it, the part the purchase code actually resolves to, the package, the
# LCSC code, and every held document with its revision, source, sha256 and whether it describes the variant
# that is fitted. It is a document check made inside this project. It is NOT a certification of any kind, and
# a "match" here means only that the named document describes the named order code.
#
# WHAT "CRITICAL" MEANS HERE. A part has an entry when at least one of these holds:
#   (a) its identity or temperature grade decides safety: the pack, its protection, surge and ESD clamps,
#       power control, the pack connector;
#   (b) it is the single part behind a mission function: compute, the switch fabric, a radio, a supervisor;
#   (c) an internal record labels it CERTIFIED while its identity, grade or land is contested.
# Deliberately NOT covered yet, with the reason: the regulators and eFuses of board A's power tree
# (AP64500, TPS62933, LM5176, TPS2596/TPS259631, LM74700-Q1, LM5069) and the PCA9555 expanders. Their held
# datasheets were read line by line for behaviour on 25 September (MESHSAT-1357), but their
# order codes were not audited against the documents. Entries for them are owed (see `owed`).
#
# WHAT IT IS NOT. It is not a second parts registry: buyability stays in release/revA/order/JLC-CERTIFIED.tsv,
# written by tools/jlc_certify.py. That tool's "CERTIFIED" label means only "JLCPCB's catalogue answered with a
# part whose model string passed the tool's comparison". The comparison accepts two part numbers that share
# six leading characters, retries without trailing grade letters, and compares packages without body size or
# pitch, so a CERTIFIED row is not evidence of part identity, grade or land (three rows below prove it: the
# supervisor MCU, the board D hub and the 5G socket). Generated inventory stays in PARTS.md. Folder-level
# provenance stays in sources.txt.
#
# FIELD MEANINGS
#   schematic_name   the part number as the generator writes it, with file:line
#   fitted_mpn       the manufacturer order code the LCSC code resolves to (JLCPCB's or LCSC's model string)
#   identity         MATCH      schematic name and fitted code are the same part (suffixes for packing only)
#                    MISMATCH   they are different parts, or the fitted part contradicts the design's own
#                               requirement; a mismatch stays open until compatibility is proven
#                    NOT_PINNED the schematic names a family or a class and no order code is fixed
#                    NOT_FITTED the part is not instantiated on any current generator
#   grade_vs_envelope  INSIDE / OUTSIDE / TBD against v2/ecad/tools/pcb_envelope.yaml (in use -20 to +40 C
#                    ambient, storage minimum -20 C). OWNER RULING D-02a (25 to 26 September 2026): the envelope
#                    is -20 to +40 C in use and -20 to +45 C in storage, and TEST-PLAN's +55 C operating, +71 C
#                    storage and -33 C storage are QUALIFICATION MARGINS over it, with two pass lines: operate to
#                    specification inside the envelope; survive and recover at the margin. This field judges a
#                    part against the envelope only. No part here is judged against the margins yet (TBD; effect:
#                    a part INSIDE the envelope can still fail the survive-and-recover line at -33 C or +71 C).
#   matches_fitted   does THIS document describe the fitted order code? yes / partial / no, with the reason
#   status           VERIFIED   the artefact was opened and the cited line, table or page read
#                    INFERRED   taken from a record, a file name or reasoning, not re-read against the artefact
#                    PROVISIONAL a verdict that stands on today's evidence but is held open by a named condition
#   stock readings   dated JLCPCB API readings; a stock figure is true only at its time
#
# Every sha256 below was computed on 25 or 26 September 2026 over the file as it sits in this tree.

