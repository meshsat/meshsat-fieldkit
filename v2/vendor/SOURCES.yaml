      what_moved: "no circuit change. Stream r8docs (MESHSAT-1357, review of 26 September 2026 22:35, section 3) filed the documents the ZEROIZE study read from its drafts/ folder and fetched the maker's current summary revision. The held summary above is revision A: its text layer is identical to the file Microchip serves at the revision A URL today (2026-09-26T21:17Z; the bytes differ, a later render), and the maker's current revision is B (October 2021: ISLEEP for the extended range, the SMBus tTIMEOUT, the Trust Platform variants). Nothing in revision B touches the slot map; the NDA precondition of decision 30 stands (owed list)."
