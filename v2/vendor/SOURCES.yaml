    revision: "forum thread; the answer quoted is timestamped 2024-10-04T21:04Z in the page"
    url: "https://e2e.ti.com/support/power-management-group/power-management/f/power-management-forum/1421182/bq77207-help-understanding-application-configuration"
    fetched: "2026-09-26, curl from the runner, 132,619 bytes"
    sha256: "2038e7af80b8c35e3b0a92c07f9d0edd482e146bb0e0bf80072c0c2b6428610c"
    status: VERIFIED
    matches_fitted: "partial: the thread is about the BQ77207 family, not the 00700 variant. The TI engineer's answer reads 'At the moment no current released versions of this device have that capability' (an active-low COUT/DOUT) and 'This protector is most commonly used as a secondary protector meant to flow up a FUSE' (sic; read as 'blow')"

