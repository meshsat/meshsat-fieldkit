      (all 100 pins of the generator's table compared against DS12110 Rev 10 Figure 5 and DS12117 Rev 9 Figure 4,
      p.55 of each, 0 mismatches, a planted swap caught); FDCAN1 on PD0/PD1 and FDCAN2 on PB12/PB13 in AF9 on the
