      (DS12117 Rev 9 section 3.28 p.41; DS12110 revision history 'Removed CRYP peripheral') and Secure access mode
      with ST Root Secure Services and secure firmware install (DS12117 section 3.3.2 p.25; DS12110 revision
      history 'Removed secure firmware upgrade support'). Both parts keep RDP and PCROP (DS12110 p.1 'ROP, PC-ROP,
      active tamper'). No current requirement, generator line or firmware uses an H753-only capability, and no
      supervisor firmware exists. PROVISIONAL, and NOT closable. When this entry was written two reopen conditions
      were live: no secure-boot requirement exists anywhere in the pack (red team finding S2,
      v2/docs/RED-TEAM-2026-09-09.md:363), and decision 30 (ZEROIZE) was open with an option that routes
      ZEROIZE_HW into each supervisor. The owner ruled decision 30 on 25 to 26 September 2026 (ruling D-03):
      crypto-erase through the secure element (drive and eMMC keys wrapped by a key the secure element holds;
      ZEROIZE destroys that key, then running modules drop their RAM keys, then the slots are cut), triggered only
      by the covered toggle held 5 s, level-sensitive after power loss, done in firmware and provisioning with no
      board change. The ruling's text names no H753-only capability: the key it destroys is held by the ATECC608B,
      not by a supervisor's CRYP or HASH unit (INFERRED from the ruling's wording). Which part the supervisors'
      firmware plays in that sequence is not written (TBD; effect: a wipe step that needs CRYP, HASH or secure
      access mode would reopen the mismatch). The secure-boot condition is still live and unruled. The mismatch
      closes only after the owner has ruled on supervisor secure boot and the ZEROIZE firmware's use of the
      supervisors is written; the rename of the schematic record follows those, never precedes them.
