    revision: "forum thread; the answers quoted are timestamped 2024-01-23T21:39Z and 2024-01-24T20:20Z in the page"
    url: "https://e2e.ti.com/support/power-management-group/power-management/f/power-management-forum/1316778/bq25731-bq25731-chargecurrent-start-up-behavior"
    fetched: "2026-09-26, curl from the runner, 147,958 bytes"
    sha256: "96c511cf238d00182bcd82c5e7bdce3d25571c49cbd77f6b57a9171159f0d8c4"
    status: VERIFIED
    matches_fitted: "yes: the thread is about the BQ25731, and the TI expert's answer reads 'Looks like there is a mistake in the description. The POR value is indeed 256mA.' and, on holding charge off at start-up, 'you can use the CELL_BATPRESZ=0V at startup with BQ25731 as well because it will disable battery charging'"
