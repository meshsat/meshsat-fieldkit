  - id: secure-element
    function: "secure element, keys behind ZEROIZE"
    boards: [B]
    schematic_name: {text: "ATECC608B-SSHDA-T", where: "v2/ecad/tools/gen_sch_b.py:750"}
    fitted_mpn: "ATECC608B-SSHDA-T"
    package: "SOIC-8 narrow, I2C, -40 to 85 C, tape and reel"
    lcsc: "C1518769"
    lcsc_reading: {model: "ATECC608B-SSHDA-T", pkg: "SOIC-8", stock: 1091, read: "2026-09-14", source: "JLC-CERTIFIED.tsv"}
    identity: MATCH
    status: VERIFIED
    documents:
      - path: "v2/vendor/microchip/microchip-atecc608b-datasheet.pdf"
        doc_id: "Microchip DS40002239 (ATECC608B Summary Datasheet)"
        revision: "A"
        url: TBD
        sha256: "519e2edac0deefe1755a98e30b8ce2a5a2ff9b9c39acda333bb625b87bdac3ff"
        matches_fitted: "partial: the ordering table lists ATECC608B-SSHDA-T (SOIC, I2C, tape and reel), but this is the SUMMARY sheet; the I2C address 0x60 the generator uses and the slot-erase behaviour decision 30 depends on are not settled by it (the full datasheet is under NDA)"
    decision_30: >-
      OWNER RULING D-03 (25 to 26 September 2026): ZEROIZE is a crypto-erase through this part. The drive and eMMC
      keys are wrapped by a key it holds; ZEROIZE destroys that key, then running modules drop their RAM keys, then
      the slots are cut. The only trigger is the covered toggle held 5 s (the tamper and lid switch only log; a
      remote wipe is deferred); the trigger is level-sensitive after a power loss (read at boot before any slot
      powers, a wipe-pending record resumes, and it re-arms only when the toggle returns). Firmware and
      provisioning, no board change. PRECONDITION, TBD: the ATECC608B slot map must be erasable in the way the
      ruling needs, which only the full (NDA) datasheet settles; TPM 2.0 is the fallback the ruling names (effect:
      if the precondition fails, the fallback part replaces this one and this entry changes). Residual risk
      accepted by the owner: drive unlock at boot depends on this part, the panel and the kit I2C bus.


