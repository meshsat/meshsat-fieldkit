    stc_wp_reference: 100.0
    # what a fixed panel gives of its STC rating at a given irradiance: PVGIS's PVcalc answer for the site (100 Wp,
    # crystalline, free-standing, filed on fnd/d4energy at 71be4943, sha256 1a797a199d1c9f1a77c8abff50ef17c2a0ab2fc5e12ccbefed56e158995d954c)
    # gives the year's losses: angle of incidence -2.99 percent, spectral +1.74, temperature and low irradiance -4.57,
    # and a default system loss of 14 percent (total -19.01). The panel's own losses without the system loss:
    # (1 - 0.1901) / 0.86 = 0.9417. That yield assumes maximum-power-point tracking, which the stage does NOT do (it holds
