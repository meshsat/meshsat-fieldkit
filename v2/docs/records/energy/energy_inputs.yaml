# What the tree's model prints for the four states M1 uses (PLAN, battery-side, W) and their documented bounds.
model_states:
  PS-IDLE-SPEC: {plan: 42.8, low: 33.1, high: 82.8, src: "pwr_budget.out line 3; CONOPS 4a; POWER-THERMAL section 4"}
  PS-RED2:      {plan: 31.38, low: 17.62, high: 55.56, src: "pwr_red2.out, PS-RED2 (slots 2 and 3)"}
  PS-SURV-R:    {plan: 23.27, low: 12.78, high: 46.94, src: "pwr_red2.out, PS-SURV-R (slot 3 alone after BANK-R1)"}
  PS-SURV:      {plan: 21.73, low: 12.45, high: 42.0,  src: "pwr_red2.out, PS-SURV (slot 2 alone)"}

# The state rules, applied to the PS-IDLE-SPEC rows to recount the other states from the same components
# (CONOPS 4a and 4c define the states; pwr_red2.py applies the same rules to pwr_budget's model).
# A CM5 at 'typ' is the maker's 900 mA operating figure (4.5 W at 5 V) in place of the 400 mA idle (2.0 W).
state_rules:
  PS-RED2:
    off_groups: [cm5_s1, fan_s1, pcie33_s1, pcie10_s1, nvme_s1, wifi1, wifi2, monitor]
    cm5_typ: [cm5_s2, cm5_s3]
    note: "slots 2 and 3, monitor off, both link cards off, the 5G module registered and idle, APRS beacons (CONOPS 4c)"
  PS-SURV-R:
    off_groups: [cm5_s1, fan_s1, pcie33_s1, pcie10_s1, nvme_s1, wifi1, wifi2, monitor, cm5_s2, fan_s2, pcie33_s2, pcie10_s2, nvme_s2, modem]
    cm5_typ: [cm5_s3]
    note: "slot 3 alone after BANK-R1: LoRa, APRS, GNSS, both E72, Iridium, the panel and the SOS path; 5G has no host (its data lane is slot 2's)"
  PS-SURV:
    off_groups: [cm5_s1, fan_s1, pcie33_s1, pcie10_s1, nvme_s1, wifi1, wifi2, monitor, cm5_s3, fan_s3, pcie33_s3, pcie10_s3, nvme_s3, lora, pa]
    cm5_typ: [cm5_s2]
    note: "slot 2 alone as board B is generated: Iridium, the panel, GNSS and 5G; neither the LoRa mesh nor APRS"
  # Option (a): the lowest-power state that still meets M1's 'must hold' (a handheld's message reaches a remote
  # correspondent over at least one bearer; the kit keeps running). Built on PS-SURV-R (the one module that carries
  # the owner's D-02b example with the SOS path). Everything named here is a firmware or an operator setting on the
  # generated boards, except the KSZ energy-detect mode and the supervisors' clock, which are firmware items to confirm.
  PS-NIGHT-RELAY:
    base: PS-SURV-R
    off_groups: [mixfans, geiger, usb5, e72]
    low: [ksz, sups]
    night: [panel, pa]
    note: "slot 3 alone (LoRa mesh, Iridium idle, APRS receive with fixed-site beacons, GNSS, the panel at NIGHT lighting, SOS path); the Ethernet switch in energy-detect (two of its ports have no module), the supervisors at 200 MHz, the mixer fans stopped (a cool night, shaded), the Geiger and the QMX deferred by D-01 off, the E72 pair off (not a bearer of M1), the monitor and HDMI off"

distribution_mohm: 22.5      # pwr_budget.py R_DIST since its third cycle, the chemical fuse F2 at its maximum included
node_v: 14.4                 # the pack's nominal 4S node the model evaluates PLAN at

# ------------------------------------------------------------------------------------------------------ the pack
pack:
  cell: "Samsung INR18650-35E"
  series: 4
  parallel: 3
  ruling: "owner ruling D-06 (26 September 2026): one 4S3P block, shrink-wrapped, in the east pocket"
  capacity_min_ah: {value: 3.35, src: "spec Ver. 1.1, 3.1 and 7.2: 'Min 3,350mAh', 'Discharge : 0.2C(680mA), 2.65V cut-off @RT'"}
  capacity_typ_ah: {value: 3.45, src: "Technical Report page 1: 'Capacity (0.2C) Typical 3450mAh'"}
  nominal_v: {value: 3.60, src: "spec 3.3: 'Nominal Voltage 3.60V'"}
  discharge_cutoff_v: {value: 2.65, src: "spec 3.9: 'Discharge Cut-off Voltage 2.65V'"}
  discharge_window_c: {low: -10.0, high: 60.0, src: "spec 3.12: 'Discharge : -10 to 60 C' (cell surface)"}
  charge_window_c: {low: 0.0, high: 45.0, src: "spec 3.12: 'Charge : 0 to 45 C'"}
  cell_mass_g_max: {value: 50.0, src: "spec 3.10: 'Cell Weight 50 g max'"}
  cell_dia_mm_max: {value: 18.55, src: "spec 3.11"}
  cell_len_mm_max: {value: 65.25, src: "spec 3.11"}
  charge_a_per_cell_cycle_life: {value: 1.02, src: "spec 3.5: 'For cycle life : 1,020mA'; D-06's session item is a lower charge setting than the generator's 4 A"}
  # capacity against the discharge current, relative to the standard capacity (spec 7.8)
  rate_factor: {points: [[0.68, 1.00], [3.4, 0.97], [6.8, 0.95], [8.0, 0.92]], src: "spec 7.8: '0.2C (680mA) 100%, 1C (3,400mA) 97%, 2C (6,800mA) 95%, 8000mA 92%'"}
  # capacity against the cell's temperature, relative to 23 C, at 3,400 mA (spec 7.5): ONE cold point; between -10 C
  # and 20 C the tool interpolates linearly (INFERRED). A LOWER bound at the kit's 0.3 to 1.0 A a cell.
  temperature_factor: {points: [[-10.0, 0.4124], [20.0, 1.0], [40.0, 1.0]], src: "spec 7.5: '-10 C 40%, 23 C 97%, 40 C 97%' at 3,400 mA; 40 / 97 = 0.4124; 20 C is inside the standard condition 23 +- 3 C (6.1)"}
  # the mean voltage of a typical cell over its discharge to 2.5 V, from the energy and capacity the Technical Report
  # prints: 12.62 Wh / 3.482 Ah at 0.2C and 11.94 Wh / 3.468 Ah at 3.5 A (page 3 and page 6 of 9); linear in current
  mean_v_points: {points: [[0.68, 3.6244], [3.5, 3.4429]], src: "Technical Report: 'Capacity (mAh) 3,482, Energy (Wh) 12.62 at 0.2C'; 'Capacity (mAh) 3,468 ... Energy (Wh) 11.94 at 3.5 A'; a typical cell at 23 C"}
  # where the discharge ends, and the share of the trace's capacity delivered when the cell reaches that voltage under
  # load (d4energy's AI reading of the Technical Report's page 6 traces by pixel position, energy_data.yaml
  # discharge_traces: at 0.7 A the trace reads 3.048 V at 92.5 percent and 2.950 V at 95 percent; at 3.5 A 3.016 V at
  # 90 percent and 2.949 V at 92.5 percent). Linear between the two currents.
  end_of_discharge:
    graceful: {cell_v_under_load: 3.00, rsoc_reserve: 0.05, src: "CONOPS section 4, Shutdown row, and 4c (PROVISIONAL, a session choice): the gauge's RSOC at 5 percent or the lowest cell at 3.00 V under load for 10 s, whichever comes first"}
    fraction_at_3v00: {points: [[0.7, 0.937], [3.5, 0.905]], src: "d4energy readings/read_curves.out, cell.discharge_at_RT (an AI reading of the maker's figure)"}
    fraction_at_2v80: {points: [[0.7, 0.977], [3.5, 0.960]], src: "the same traces: 2.816 V at 97.5 percent (0.7 A); 2.853 at 95 and 2.729 at 97.5 (3.5 A)"}
    protection_cuv_v: {value: 2.50, src: "pcb_pack_protection.yaml, the gauge's cell under-voltage 2.50 V, 4 s; board P's second level holds the FET off below 2.25 V (D-15)"}
    maker_terminate_v: {value: 2.50, src: "spec Pack Design Guideline, Portable IT: 'terminate discharging' 2.50 V; over-discharge protection 2.30 V"}
  ageing:
    aged_80: {factor: 0.80, src: "REQ-014 and SC-23: 80 percent of the specification minimum (8.04 Ah for the 3P block), the pack replaced below it"}
    aged_60: {factor: 0.60, src: "spec 7.9: 'Capacity after 500cycles ... >= 2,010mAh (60% of Standard Capacity)', the lower bracket"}
  charge:
    current_a: {value: 3.06, src: "1.02 A a cell for cycle life (spec 3.5) x 3; the generator's setting is 4 A and D-06 asks for a lower one"}
    taper_from_soc: 0.85
    energy_efficiency: {value: 0.95, low: 0.90, high: 0.98, src: "INFERRED (d4energy): from the cell's 34.5 mOhm DC resistance at 1 A a cell about 0.98, lowered for the constant-voltage phase and hysteresis; no held document gives it"}

