# energy_inputs.yaml: the inputs of the M1 energy reconciliation (stream energy, MESHSAT-1357, 28 September 2026).
#
# PROTOTYPE DESIGN: nothing in this kit has been built, powered or measured. Every figure below is one of
#   S  a maker's own figure, read in the named document (typical or maximum, as the maker states it)
#   R  a figure inside a maker's bound at a stated duty or workload assumption
#   D  a declaration of a generator (a copper-sizing allocation read from a board's intent), not a consumption figure
#   T  a placeholder with no document at all
# and NOTHING here is a measurement (the tree holds no measured load, no measured pack and no measured stage).
# The readings were made by an AI (an AI review, not a qualified review). Read by energy_budget.py beside it, which
# pins this file and the files under `pinned` by sha256 and refuses to run if any of them changed.
#
# The load table is the one CONOPS.md section 4a rests on: records/rv-pwr/pwr_budget.out ("shares PS-IDLE-SPEC",
# battery-side watts per load, PLAN scenario, 14.4 V, distribution 22.5 mOhm counted once) with the tier that model
# gives each load and, where stream d4energy's energy_data.yaml (branch fnd/d4energy, commit 9b43e274) names the
# maker's document and page for the same load, that citation. The maker's figures for the D rows, where d4energy
# read them, are carried in `maker_w_at_load` so that the declared and the sourced sums can both be printed.

pinned:
  - {path: v2/vendor/solar/pvgis-leiden-monthly-2015-2020.json, sha256: bb2f165c642a36f0f48a9a628b259baf3108b26fb54e138070a1a24a694cd035,
     what: "PVGIS 5.2 MRcalc, Leiden 52.160 N 4.497 E, PVGIS-SARAH2 2015 to 2020: monthly irradiation on the optimally inclined plane (40 degrees, south); PARSED"}
