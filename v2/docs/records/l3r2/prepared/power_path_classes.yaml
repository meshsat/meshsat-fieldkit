classes:
  - {id: A-1, class: existing, closure_item: L3-C37, layer: 8, anchor: "**A-1. The front end limits below what the charge design asks.**", item: "The front end limits below what the charge design asks (confirmed on the makers' figures): its stacked limit, 4.212 / 5.000 / 5.810 A, lies under U3's drawn setting plus the other loads on R11. Correction for the drawn circuit: the derated variant, U3 at 4.00 A (+0.052 A on 0.060 A of other loads, +0.033 A on 0.079 A), which fixes the coordination only and does not meet M1", criterion: "the stacked minimum of the fitted R11 is at least U3's maximum plus the other loads; on the bench, the front end's constant-current onset, measured with an electronic load past U3 at -20, 25 and 62 C, lies above U3's maximum plus 0.06 A"}
  - {id: A-2, class: existing, closure_item: L3-C38, layer: 5, anchor: "**A-2. With E1's fixed setting, the input bus collapses on a short source.**", item: "With E1's fixed setting (4.15 A), the input bus collapses on a short source: established from the netlist and the makers' documented behaviour, the mechanism INFERRED; the defect sits in the E1 setting, not in FW-A16 as written. Correction: a VIN_RAW-dependent IIN_HOST rule for every source, firmware that lowers U3's input limit as VIN_RAW falls; an engineering choice while REQ-072 is met", criterion: "on the bench, with the panel source (or a simulator) stepped below U3's demand, run first at E1's fixed 4.15 A to confirm the collapse (a carried minor of the energy stream's CHECK-5) and then with the VIN_RAW rule: VIN_RAW settles above 12 V and FE_PGOOD never drops"}
  - {id: B-1, class: introduced, closure_item: L3-C39, layer: 8, anchor: "**B-1. L1 runs past its TYPICAL saturation current at the 9 V floor, in service.**", item: "L1 runs past its typical saturation current at the 9 V floor, in service. Correction: an inductor whose saturation current at its operating temperature exceeds the peak at the highest permitted current at 9 V, with margin, or IIN_HOST scheduled on VIN_RAW, its register setting 5.05 A at 9 V (a peak of 15.68 A, 89.6 percent of the typical saturation current, recomputed once the maker's derating is held, C-5); raising the input floor instead is a conditional owner case (REQ-015)", criterion: "analysis: the peak at the highest permitted current is at most 90 percent of the saturation current at the part's temperature, with the maker's derating; bench: L1's current waveform at 9 V with U3 at full draw shows no saturation knee"}
  - {id: B-2, class: introduced, closure_item: L3-C40, layer: 9, anchor: "**B-2. The FETs at the highest permitted current at 9 V.**", item: "The FETs at the highest permitted current at 9 V. Correction, one or both of: hiccup (partial: it catches only parts whose peak limit sits under the fault's peak), or FETs and cooling rated for the fault, for example FETs in parallel; an input-side average limit is not available, and neither remedy is yet shown to fit on board A", criterion: "TJ at most 150 C, or the tree's derating where one applies, at the highest permitted current at 9, 15.1 and 36 V in 62.1 C air, from board A's own thermal resistance or a measurement"}
  - {id: B-3, class: introduced, closure_item: L3-C41, layer: 8, anchor: "**B-3. The copper declarations are passed.**", item: "The copper declarations are passed (VBUS20 and FE_OUT, VIN_RAW). Correction: re-declare VBUS20, FE_OUT, VIN_RAW, _FE_A, _VIN_T and TRK_OUT, and regenerate", criterion: "dc_drop, derate and the track-width gates read PASS on the regenerated board at the new declarations"}
  - {id: B-4, class: introduced, closure_item: L3-C42, layer: 8, anchor: "**B-4. VBUS20's bulk capacitors at the highest permitted current**", item: "VBUS20's bulk capacitors at the highest permitted current. Correction: re-run the generator's node analysis at 9.37 A and 9 V and enlarge or rebalance the bank, or bound the fault current (B-2)", criterion: "every can at most 2.8 A (the maker's figure at 125 C) over the ESR bands at the highest permitted current; on the bench, the worst can's ripple and temperature agree with it"}
  - {id: B-5, class: introduced, closure_item: L3-C43, layer: 5, anchor: "**B-5. A fixed IIN_HOST of 6.2 A drops FW-A16's VIN_RAW scaling**", item: "A fixed IIN_HOST of 6.2 A drops FW-A16's VIN_RAW scaling (INFERRED; the proposal's form of A-2). Correction: as A-2, for the proposal's setting", criterion: "as A-2: with a source stepped below U3's demand, VIN_RAW settles above 12 V and FE_PGOOD never drops"}
