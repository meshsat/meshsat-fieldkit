        for the EU); the others are each radio's own level. DC: only the GNSS antenna bias, the LG290P's VDD_RF"
      current: "n/a: RF only, except the GNSS antenna bias on J_GNSS1 to J_RF4. TBD: that bias current, with the antenna part;
        effect: none on the arrestor (it passes DC at up to 60 V, INFERRED for tens of milliamps) and none on R23 10 R's
