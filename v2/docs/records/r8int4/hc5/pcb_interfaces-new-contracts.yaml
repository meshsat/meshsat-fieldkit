    # ==================================================================================================================
    # CONTRACTS FOR THE INTERFACES THE FIRST TWELVE LEFT OUT (layer 5 closer hc5, MESHSAT-1357, 27 September 2026).
    # First written against main e3aedb25 (netlists A 7b08510106687b3d, B 669d02d07aeaae4b, C 2834f0d8c4071d56,
    # D f13d8b70099ab03e, E d910e49c5f5f50b2, P 4342c4cbe1b43dc4). PASS 2 (the same day, after review) completed every field
    # and read the facts it added, and re-read the refs each contract names, at main 84e52461, where round 8 is integrated
    # but for board B (A 3a786cf31614fe63, B 669d02d07aeaae4b, C 11eabc2dddca5161, D 0dad82b4b6a79290, E f3c1ad6153002976,
    # P 085f833362fbbda8). "(53a98a71)" in a src marks a netlist that is the same at 84e52461.
    # FIELD CONTRACT. Every contract below carries ends, harness, levels, current, default_state, sequencing, mating,
    # hot_plug, judged_by, tbd, findings and serves. A field holds a value, "n/a: <reason>" or "TBD: <what>, effect: <what
    # it holds up>", and every tbd entry names its effect. v2/docs/records/hc5/check_contract_fields.py asserts this on the
    # applied file and prints the table (its output is filed beside it). Every end is owned by the board or part named in
    # `ends`; the harness between two ends is owned by v2/docs/ASSEMBLY.md section 4. Firmware obligations are
    # v2/docs/HW-FW-CONTRACT.md rows. Evidence words as the section header (VERIFIED read in the netlist or the maker's
    # document named; INFERRED arithmetic or reasoning on them). Prototype design: nothing here has been built, mated or
    # powered.
    IF-EXT-DC:
      title: "external DC: the vehicle or shore input and the solar input through the D38999 receptacle to board E"
      kind: external
      ends:
        - {board: e, refs: [J_DCIN, J_SOLAR], part: "JST-VH B2P-VH 1x2 each (C274411): J_DCIN 1 DC_IN, 2 GND_V; J_SOLAR 1 PV_IN, 2 GND",
           src: "E netlist (53a98a71); gen_sch_e.py (J_DCIN, J_SOLAR)"}
        - {case: "the D38999 series III receptacle, shell 13, insert 13-4, on the connector plate. TBD: its MPN (CASE-MARGINS.md section 6), effect: the plate cut-out and the seal are not final"}
        - {cable: "Glenair D38999/26FC4SN plug with M85049/38S13N strain relief; Lapp OLFLEX ROBUST 210 4 x 1.0 or Alpha Wire 25064, 2 m (ASSEMBLY.md section 4, external cables)"}
      pins: {A: "DC positive", B: "DC return", C: "solar positive", D: "solar return"}
      harness: "inside: 18 AWG, 500 mm, VH crimp at E, tied along the back, west and front walls (ASSEMBLY.md section 4)"
      levels: "DC: 9 to 36 V in service (a vehicle or a shore supply; board E's LM5069 U6 starts at 9 V (R21 38.3 k) and stops above
        40 V (R23 6.65 k)); solar: a 36-cell 12 V class panel, about 22 V open circuit, 100 W (J_SOLAR's value text)"
      current:
        dc: "the LM5069 U6 limits at 4.85 to 6.15 A (R19 10 mOhm, VCL 48.5 to 61.5 mV, as read for HW-FW-CONTRACT.md FW-A16);
          behind the 10 A blade F1 at DC_IN since round 8 (E netlist 53a98a71)"
        solar: "the panel's short-circuit current, about 6 A for 100 W at 18 V (INFERRED); behind the 10 A blade F2 at PV_IN"
        contacts: "MIL-DTL-38999 size 16 contacts (M39029/56-352). TBD: their rating read into this record from the held
          Glenair and Amphenol sheets (v2/vendor/d38999/), effect: none at 6.15 A unless the sheets rate size 16 below it"
        vh: "JST-VH, 10 A per the generator's value text. TBD: the VH catalogue (not held), effect: the lead's contact margin is unproven"
      sequencing: "hot-pluggable by design: the LM5069 controls inrush and the tracker's LT8705A starts on its own UVLO; with
        SHORE_INHIBIT high (panel GPIO20, FW-C08) board E's Q8 pulls HS_UVLO low and holds the hot-swap off"
      default_state: "inputs run (SHORE_INHIBIT held low by A R118 and E R26, 100 k each)"
      protection: "board E: the 10 A blades F1 and F2, SMCJ40CA D10 at the entry and SMCJ40A D1 after the ideal diode Q1, the
        LM5069's OV at 40 V (faf8c981); the solar input through the LT8705A tracker (IF-AE-DOCK carries the ORed bus up to A)"
      grounding: "GND_V is board E's vehicle return; GND-002's chassis bond is not drawn (ARCHITECTURE.md 6.5)"
      mating: "the plug locks by its bayonet, key N, with the receptacle's gasket on the plate (ASSEMBLY.md section 4); the
        inside VH housings latch"
      hot_plug: "yes, by design (vehicle use); the solar pair likewise"
      judged_by: "none (no tool names J_DCIN, J_SOLAR or the receptacle)"
      tbd: ["the receptacle MPN (CASE-MARGINS.md section 6); effect: plate cut-out and seal not final",
            "the JST-VH rating document; effect: the inside lead's contact margin unproven",
            "the size 16 contact rating read into this record; effect: none at 6.15 A unless it is below it"]
      findings: [R8E-N01]
      serves: [NEED-05]

    IF-EXT-ETH:
      title: "external Ethernet with PoE out: board B J_ETH to the sealed RJ45 on the connector plate"
      kind: external
      ends:
        - {board: b, ref: J_ETH, part: "Amphenol RJHSE5380 RJ45 jack (v2/vendor/connectors/amphenol-rjhse5380-rj45-jack.pdf); pins 1 MDI_A_P, 2 MDI_A_N, 3 MDI_B_P, 4 MDI_C_P, 5 MDI_C_N, 6 MDI_B_N, 7 MDI_D_P, 8 MDI_D_N, SH GND",
           src: "B netlist J_ETH; gen_sch_b.py:866-873 (T1 magnetics to J_ETH)"}
        - {case: "a sealed RJ45 receptacle on the connector plate. TBD: its part (CASE-MARGINS.md section 6), effect: the plate, the seal and the shield bond are not final"}
      harness: "Cat 5e patch lead, 400 mm, RJ45 both ends (ASSEMBLY.md section 4)"
      levels: "1000BASE-T from the KSZ9897R's port 4 (SWP4_*) through the magnetics T1 (Pulse H5007NL) to MDI_A..D; PoE out on
        pairs 1-2 (+) and 3-6 (-) per the jack's description, 802.3at type 2 from the TPS23861 U5 port 1 on +54V_POE"
      current: "PoE: 0.3 A typical, 0.6 A peak declared at 54 V (gen_sch_a.py:124, gen_sch_b.py:242); 802.3at type 2 allows
        25.5 W at the device; the port's ICUT and ILIM are the TPS23861's registers written by the panel (FW-B14, SLUSBX9I).
        Data pairs: signal only"
      power: {rail: "+54V_POE from board A's LM5176 boost U16 over IF-AB-POWER J_54V",
              enable: "POE_EN = POE_SW_EN AND OUTLET_OK on A (FW-A06): off at power-up and while the PA keys; the TPS23861 detects and classifies before it powers the port (FW-B14)"}
      sequencing: "the port powers only after the panel has configured U5 (FW-B14) and set POE_SW_EN; C2 sheds it on the pack's current or temperature (FW-C09)"
      default_state: "no PoE (POE_EN low at power-up, R114); the switch port links from its straps with the KSZ9897R out of reset"
      grounding: "the jack's shield is on GND in the netlist; GND-002 puts the RJ45 shell on CHASSIS with a 1 nF 2 kV common node
        (GROUNDING-AND-SHIELDS.md), not drawn in any generator"
      mating: "RJ45 latch inside. TBD: the outside receptacle's coupling and sealing cap, with its part; effect: the port's
        seal when no cable is fitted"
      hot_plug: "yes: Ethernet and 802.3at detection are hot-plug by design"
      judged_by: "INT-001 judges SWP4_* (the switch's port 4 to the magnetics T1) through the ETHERNET_CM5 assignment's pattern
        SWP* on board B (pcb_interfaces.yaml boards.b; interfaces.py matches with fnmatchcase). NOTHING judges MDI_A..D (T1 to
        J_ETH): they match neither ETH* nor SWP*, sit in the HV net class (gen_pcb_b3.py:576) with no impedance target and carry
        no declared tolerance (pcb_decisions.yaml decisions 29 and 36, correction of 21 September 2026). Nothing judges the port
        or the PoE budget"
      tbd: ["the sealed RJ45 part; effect: plate, seal and shield bond not final",
            "the PoE class the kit offers (class 4 assumed); effect: FW-B14's ICUT and the +54V_POE budget",
            "the magnetics' surge rating against the arrestor-less wall port; effect: the port's surge protection is unproven",
            "the MDI side (MDI_A..D, T1 to J_ETH): no net class target and no declared tolerance; the KSZ checklist (DS00004151A 6.2 to 6.4) states no intra-pair number, and B21 read 2.74 to 14.68 mm; effect: the cable-side pairs are unjudged at layout (board B's next phase)"]
      findings: [GND-002, HF-F08]
      serves: [NEED-05, NEED-14]

    IF-MON:
      title: "board to device: the Xenarc 709GNK face monitor (A J_MON supply, B J_HDMI video, D J_USB3 touch USB)"
      kind: board_to_device
      ends:
        - {board: a, ref: J_MON, part: "JST-VH 1x2 (C274411): 1 VMON, 2 GND", src: "A netlist J_MON (53a98a71); eFuse U21 (ILM 1.2 A, R90 750 R, OVLO R92 over R93), EN = MON_EN (U27 IO0_1, R111 4.7 k pull-down)"}
        - {board: b, ref: J_HDMI, part: "HDMI type A, Molex 208658-1001 (C916313): TMDS HDMIO_D0..2 and HDMIO_CK from the TS3DV642 cascade, DDC HDMIO_SCL/SDA, CEC, HPD, +5V_HDMI through F2",
           src: "B netlist J_HDMI"}
        - {board: d, ref: J_USB3, part: "JST-PH B4B-PH-K 1x4 (C131334): 1 +5V_D8, 2 USB3_N, 3 USB3_P, 4 GND; board D's TUSB2046I hub U4 port 3 through R20, R21 22 R with R22, R23 15 k pull-downs",
           src: "D netlist J_USB3 (53a98a71); gen_sch_d.py J_USB3 ('spare hub port 3 ... the lead is made up at build')",
           via: "the touch USB, SC-HF-06 (HW-FW-CONTRACT.md section 8), the session's choice of 27 September 2026"}
        - {device: "Xenarc 709GNK: 'Operating Voltage Range: DC 10V ~ 35V', 'Power Consumption: <= 10W', 'Touch Screen Interface: USB port', 'Auto power-on upon signal detection' (v2/vendor/xenarc/xenarc-709gnk-product-manual-v2.pdf)"}
      power: {rail: "VMON = the pack node VBAT (12 to 16.8 V) behind U21, which trips above about 17.6 to 19.0 V (ASSEMBLY.md section 4)",
              margin: "10 W at 10 V is 1.0 A against U21's 1.2 A limit; the pack node sits inside the monitor's 10 to 35 V (INFERRED arithmetic on the manual)"}
      harness: "supply: the monitor's own lead spliced under shrink below the plate, VH at A; HDMI: the monitor's own cable, 500 mm;
        touch: the monitor's USB lead (a type A plug per the manual's 'Attach the USB plug') into a USB A receptacle to PH 1x4
        adapter lead made up at build, PH at D J_USB3 (SC-HF-06; ASSEMBLY.md section 4's touch row and build step 9, and
        PANEL.md section 1's Pass-throughs row, name D8 J_USB3 since 27 September 2026)"
      levels: "supply: 12 to 16.8 V DC (the pack node). Video: HDMI TMDS through the TS3DV642 switches, DDC and CEC at the
        HDMI levels, +5V_HDMI through F2. Touch: USB 2.0 at FULL speed, because board D's TUSB2046I is a full-speed hub; a
        high-speed capable device 'is required to initially attach as a full-speed device' (USB 2.0 section 7.1, Table 7-1,
        RPU row, transcribed in v2/docs/records/hc5/usb-2-0-clauses-cited.md), and a HID touch report is an interrupt
        transfer, which full speed carries (USB 2.0 section 5.7) (VERIFIED on the specification; that the Xenarc's controller works at full speed is INFERRED)"
      current: "supply: at most 1.0 A at 10 V (the manual's 10 W), against U21's 1.2 A limit and the VH's 10 A. Touch VBUS:
        TBD: the touch controller's draw is not in the manual, bounded by USB 2.0 section 7.2.1 (ibid.) at one unit load (100 mA)
        before configuration and five (500 mA) after; effect: board D's +5V_D8 budget carries J_USB3 at 0.05 A
        (gen_sch_d.py loads) and J_USB3's VBUS has no port limit of its own, so a fault on the touch lead is cleared only by
        board A's eFuse U23 (2.0 A) and takes board D down with it (HF-F06)"
      video: "the display owner's HDMI through the two TS3DV642 switches, selected by HDMI_SEL1/2 (FW-C06); round 8 enables each
        switch only while the slot it passes is powered (fnd/r8b FAB-02 c)"
      touch_usb: "board D J_USB3 (SC-HF-06): the only unallocated downstream hub port in the netlists that has a connector
        (board D's port 4 is terminated by R24, R25 with none; all twelve of board B's hub ports are allocated, gen_sch_b.py:764-766; ARCHITECTURE.md section 11 USB row). J_USB3 sits on
        board B's bank 3 hub port 1 through D's hub, so the touch device appears on bank 3's owner; the HAL shares it to the
        display owner over the network (appendix 32.52 line 2837: 'The HAL shares USB and serial devices to the other
        modules over the network ... so every module sees every device'), FW-B19. No board B change"
      sequencing: "MON_EN written by the panel after the expanders (FW-A08); the monitor powers on by itself when signal
        arrives (manual: auto power-on); the touch enumerates when board D's hub is up (D's 5 V comes from A's eFuse U23 with
        the device rail) and is shared after bank 3's owner boots (FW-B19)"
      default_state: "monitor off (MON_EN held low by R111 at power-up); J_USB3's VBUS is +5V_D8, on whenever board D is powered"
      mating: "supply: VH latch at A, splice below the plate; HDMI: type A plug, friction held, retained under a tie (TBD: a
        latching or screw-locked HDMI plug, effect: retention under vibration); touch: PH latch at D"
      hot_plug: "HDMI is hot-plug by its standard; the supply lead and the touch lead are mated with the kit off (SC-HF-04 reading)"
      judged_by: "INT-001 judges the HDMI pairs through the HDMI_CM5 assignment (HDMI*_D*, HDMI*_CK_* on B; HDMIO_D0..2 and
        HDMIO_CK match) and the touch pair through board D's USB_FULL_SPEED assignment (USB* on D; USB3_P and USB3_N match; no
        impedance target, which is what full speed asks); nothing judges the supply"
      tbd: ["the touch controller's VBUS draw; effect: board D's +5V_D8 budget line for J_USB3 (0.05 A today) and PCB-BRING-UP.md's 1.00 A rail figure",
            "a port limit on J_USB3's VBUS (HF-F06, board D's author); effect: a touch-lead fault removes board D",
            "the monitor's resolution (ARCHITECTURE.md section 11); effect: the display switches' data rate only",
            "a latching HDMI plug; effect: retention under vibration"]
      findings: [FAB-02, FAB-04, HF-F06]
      serves: [NEED-04, NEED-09]

