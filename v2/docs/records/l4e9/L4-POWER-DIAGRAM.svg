<text x="1683" y="528" font-size="12" font-weight="bold" fill="#111827">PoE stage</text>
<text x="1683" y="544" font-size="10.5" fill="#1f2937">R227 5 mOhm, U17 on it (drafted)</text>
<text x="1683" y="557" font-size="10.5" fill="#1f2937">U16 boost 54 V at 0.6 A</text>
<rect x="1856" y="496" width="26" height="13" rx="3" fill="#2563eb"/>
<text x="1860" y="506" font-size="9.5" font-weight="bold" fill="#ffffff">C04</text>
<rect x="1676" y="610" width="206" height="71" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
<text x="1683" y="628" font-size="12" font-weight="bold" fill="#111827">PA and HF rails</text>
<text x="1683" y="644" font-size="10.5" fill="#1f2937">U13 13.8 V; key-down at most 60 s</text>
<text x="1683" y="657" font-size="10.5" fill="#1f2937">U15 12 V to the QMX</text>
<text x="1683" y="670" font-size="10.5" fill="#1f2937">outlets off while the PA keys</text>
<rect x="1856" y="596" width="26" height="13" rx="3" fill="#2563eb"/>
<text x="1860" y="606" font-size="9.5" font-weight="bold" fill="#ffffff">C05</text>
<rect x="296" y="700" width="206" height="97" rx="6" fill="#eef2ff" stroke="#374151" stroke-width="1.2"/>
<text x="303" y="718" font-size="12" font-weight="bold" fill="#111827">Panel controller C:U3 RP2040</text>
<text x="303" y="734" font-size="10.5" fill="#1f2937">the kit I2C: the charger,</text>
<text x="303" y="747" font-size="10.5" fill="#1f2937">the expanders, the INA226s</text>
<text x="303" y="760" font-size="10.5" fill="#1f2937">and the key-down rules</text>
<text x="303" y="773" font-size="10.5" fill="#1f2937">acts through C01, C02, C03, C04</text>
<text x="303" y="786" font-size="10.5" fill="#1f2937">  C05</text>
<rect x="848" y="700" width="206" height="71" rx="6" fill="#eef2ff" stroke="#374151" stroke-width="1.2"/>
<text x="855" y="718" font-size="12" font-weight="bold" fill="#111827">Sensor controller E:U10 RP2040</text>
<text x="855" y="734" font-size="10.5" fill="#1f2937">the gauge's SMBus, the mixer</text>
<text x="855" y="747" font-size="10.5" fill="#1f2937">fans, VIN_MON; always on</text>
<text x="855" y="760" font-size="10.5" fill="#1f2937">acts through C06, C07</text>
<rect x="1400" y="700" width="206" height="84" rx="6" fill="#eef2ff" stroke="#374151" stroke-width="1.2"/>
<text x="1407" y="718" font-size="12" font-weight="bold" fill="#111827">Hardware, no firmware</text>
<text x="1407" y="734" font-size="10.5" fill="#1f2937">comparators, the gauge, the</text>
<text x="1407" y="747" font-size="10.5" fill="#1f2937">breaker, the knee, OUTLET_OK</text>
<text x="1407" y="760" font-size="10.5" fill="#1f2937">acts through C08, C09, C10, C11</text>
<text x="1407" y="773" font-size="10.5" fill="#1f2937">  C12, C13</text>
