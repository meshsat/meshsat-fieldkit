<text x="1683" y="398" font-size="12" font-weight="bold" fill="#111827">USB-C outlet U19 + U18</text>
<text x="1683" y="414" font-size="10.5" fill="#1f2937">5 / 9 / 15 V at 3 A</text>
<text x="1683" y="427" font-size="10.5" fill="#1f2937">OCP 3.793 to 4.576 A</text>
<text x="1683" y="440" font-size="10.5" fill="#1f2937">tablet budget 18 W cap (proposal)</text>
<rect x="1831" y="366" width="51" height="13" rx="3" fill="#2563eb"/>
<text x="1835" y="376" font-size="9.5" font-weight="bold" fill="#ffffff">C03 C13</text>
