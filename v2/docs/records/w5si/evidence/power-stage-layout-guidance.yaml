# WHAT EACH MAKER'S LAYOUT GUIDANCE SAYS ABOUT THE POWER STAGES OF BOARDS A, B, C AND E (stream w5si, 27 September 2026,
# MESHSAT-1357). The evidence of finding F-Q1 (v2/docs/records/w5si/F-Q1-power-stage-nodes.md). Prototype design work:
# nothing has been built or measured.
#
# Every quote is the maker's words as pdftotext gives them on the page named (the first page of a PDF is 1), the
# document is named with the sha256/16 of the held file, and tools/verify_citations.py checks all of it: the held file
# is the file cited, and the words are on the page. A quote split by a two-column page is given as its two halves,
# each checked by itself. The extraction was done by a read-only helper and every quote was then checked by that
# script; nothing here is paraphrased inside quotation marks.
#
# edge: what the document's electrical tables say of a gate driver's or a switch node's rise or fall. `minimum: none`
# everywhere: NO MAKER OF THESE NINE PARTS PUBLISHES A MINIMUM, and eight publish no rise or fall time at all.
