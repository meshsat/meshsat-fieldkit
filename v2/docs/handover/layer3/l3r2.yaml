om about 1.4 kg to 4.8 to 5.5 kg on a 100 degree stay ([a1mech README section 5](../../records/a1mech/README.md)); a second charger, gauge and protection board ([a1elec TOPOLOGY.md sections 3a to 3c](../../records/a1elec/TOPOLOGY.md)). REQ-072's pass line becomes 'serves the load at every hour of the 72 without the kit reaching its graceful shutdown', with the charge bus in its steady-state range and the brackets beside the result, and a 3.00 V a cell floor (od_l3_1.py). Nothing is drawn, built or tested; no purchase is authorised."
