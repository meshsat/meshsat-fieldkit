# ------------------------------------------------------------------------------------------------ owner decisions
# The six-row table the owner answers (D-23: options, the recommendation, quantified consequences and dependencies, the
# detailed calculations kept in the evidence package and linked from the table; an option that cannot meet the stated
# mission flagged plainly). Per row:
#   options         each with `flag` where the option cannot meet mission M1 or rests on something no record establishes,
#                   and `held_until` where one option waits on a file the others do not
#   recommendation  the session's; HELD where D-22 or D-23 holds it
#   consequences    quantified, each figure linked to its evidence; every M1 energy figure HELD for the checked basis
#   dependencies    the other rows, the files, and the downstream obligations (named, never layer 3 prerequisites)
#   r11             board A's current-limit resistor (D-23): the result on the held circuit (R11 10 mOhm, as generated)
#                   and the result conditional on the drafted 6.2 mOhm, as two columns of their own table
#   held_until      the l3r2.yaml files the whole row waits on before its recommendation and its figures are stated
#   quantified      row L3-OD6's options table: every figure null (HELD) until the checked energy basis fills it
decisions:
  - id: L3-OD1
    question: "Adopt Option A(i)'s store for mission M1: two separately protected packs of the ruled cell, a base 4S6P across both base pockets (replacing D-06's one 4S3P in the east pocket) and a lid pack with its own protection board, charger and gauge? The solar input is row L3-OD3's."
    options:
      - {id: approve, label: "Approve Option A(i)'s store (a base 4S6P and a lid pack)", flag: "On board A as generated (R11 10 mOhm) it CANNOT MEET M1 with any lid (fact CF-02); conditional on the drafted R11 of 6.2 mOhm its energy is HELD for the checked basis"}
      - {id: reject, label: "Keep D-06's one 4S3P pack; REQ-072 stays FAIL and an open conflict is recorded", flag: "CANNOT MEET M1: the one pack allows at most 9.1 W for M1 against PS-IDLE-SPEC's 42.8 W, at any bus voltage ([ENERGY-RECONCILIATION.md section 9d](../../records/energy/ENERGY-RECONCILIATION.md))"}
    recommendation: "Approve, if the checked energy basis shows a lid option that meets M1 across the kit's supply range with board A's entry re-rated as drafted (R11 6.2 mOhm): on one 145 Wh pack M1 cannot be met, D-20 excludes accepting the shortfall, and no other store inside the fixed case is found. If no lid option meets it, the owner is told that M1 cannot be met in the fixed case with the ruled cell, and what would. The energy figures behind it are HELD (D-22)."
    consequences: "Held circuit (board A as generated, R11 10 mOhm): the front end limits at 4.300 / 5.000 / 5.700 A, below U3's input setting, and M1 is NOT MET with any lid, by 326 to 523 Wh in the model (fact CF-02, [the energy basis check, What holds](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)). Conditional on the drafted R11 of 6.2 mOhm (a front-end limit of 6.935 A at its minimum, above U3's 6.3 A maximum, [a1elec TOPOLOGY.md section 7](../../records/a1elec/TOPOLOGY.md)): each lid's M1 energy HELD for the checked second round (S-127). Either lid: 80 or 84 cells against 12 (4S20P or 4S21P, [a1int RECONCILE.md](../../records/a1int/RECONCILE.md); 964.8 or 1013.0 Wh nominal, strings of 48.24 Wh at the cell's 3,350 mAh minimum and 14.4 V); each pack above the 160 Wh passenger figure the energy record names (the base 289.4 Wh, [ENERGY-RECONCILIATION.md section 8d](../../records/energy/ENERGY-RECONCILIATION.md); a lid of 675.4 or 723.6 Wh by the same arithmetic), no transport route claimed (REQ-069); the lid from about 1.4 kg to 4.8 to 5.5 kg on a 100 degree stay ([a1mech README section 5](../../records/a1mech/README.md)); a second charger, gauge and protection board ([a1elec TOPOLOGY.md sections 3a to 3c](../../records/a1elec/TOPOLOGY.md)); the second pack leaves D-01's deferred list and joins prototype 1's core. It restates REQ-014 and REQ-075 per pack and REQ-072 to two packs, held across the supply range with a 3.00 V a cell floor. Nothing is drawn, built or tested: REQ-072 stays FAIL, and it authorises no purchase."
    dependencies: "Row L3-OD2 (approving forces one lid item out, or both stay on a 4S9P lid) and row L3-OD3 (the array: this row fixes the store only). The checked energy basis (S-127). Board A's R11 re-rate, two downstream obligations that are not layer 3 prerequisites: its implementation in board A's generator (layer 8, closure item L3-C34) and its physical verification on the built board (prototype, L3-C35). The west RF entry re-planned before the west block is taken ([a1mech README section 6](../../records/a1mech/README.md), layer 7); the sealed lid-harness crossing (S-95, layer 7)."
    affected: "D-06 (superseded), D-01 (the second pack joins the core), REQ-014 and REQ-075 (per pack), REQ-072 (two packs, the supply range, the 3.00 V floor), CFL-006, M-02; each pack under REQ-044, REQ-045, REQ-046, REQ-069, CON-006"
    r11: {held: "M1 NOT MET with any lid, by 326 to 523 Wh (fact CF-02)", drafted: "HELD for the checked energy basis (S-127)"}
    held_until: [energy_basis]
    script: od_l3_1.py
    requires: []
  - id: L3-OD2
    question: "Which approved lid item leaves the lid for the lid pack, where does it go, and does its function stay in the kit: the QMX HF set out of the kit, the QMX carried outside the case with HF kept, the tablet bracket out with the tablet's use kept, or both kept on a smaller lid pack?"
    options:
      - {id: qmx-out, label: "The QMX HF set leaves the kit and HF with it, the owner's explicit removal of an approved function; an 8 inch tablet bracket stays; the lid pack is 4S15P"}
      - {id: qmx-outside, label: "The QMX HF set is carried outside the case, HF kept by a sealed case-wall lead; an 8 inch tablet bracket stays; the lid pack is 4S15P", flag: "NO LOCATION ESTABLISHED: outside the case the QMX needs a lead through the back wall, which the ruled connector plate does not carry (fact CF-04); HF leaves the kit unless a place is found", held_until: [relocation_facts]}
      - {id: tablet-out, label: "The tablet bracket leaves the lid and its function (a tablet held in the lid) leaves the kit; the tablet's use stays outside the case over the kit's WiFi and the USB-C outlet; the QMX stays; the lid pack is 4S14P"}
      - {id: both-kept, label: "Both approved lid items stay; the lid pack is 4S9P", flag: "CANNOT MEET M1: the records find a 4S9P lid NOT MET on the reference day at 400, 650 and 1000 Wp with the lid at the day's air ([a1int RECONCILE.md](../../records/a1int/RECONCILE.md)), as in every case of the energy basis's first issue, nominal inputs included ([the energy basis check](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md))"}
    recommendation: "HELD for the checked energy basis (D-22): it depends on which lid meets M1 across the supply range (finding F-01). What the records establish now (fact CF-04): no place in the kit exists for either displaced item, so `qmx-out` removes HF from the kit and `tablet-out` removes the bracket's function, each the owner's explicit decision, and `qmx-outside` has no established place."
