# names the registry entry whose live state the rendered page prints beside the item.
closure:
  - {id: L3-C01, item: "The target configuration is unambiguous", whose: OWNER, closes_by: "rows L3-OD1 to L3-OD4 and L3-OD6 decided on a combination the evidence covers (coherence rules), their conditional scripts applied, the energy basis and the power path filed with accepted checks (L3-C31, L3-C45)", state: AWAITING_OWNER}
  - {id: L3-C02, item: "REQ-072 (M1) against D-06's one pack", whose: OWNER, record: REQ-072, closes_by: "L3-OD1 (and L3-OD2 to L3-OD4); M-02 closes when all four are decided", state: AWAITING_OWNER}
  - {id: L3-C03, item: "REQ-016's window against REQ-072", whose: OWNER, record: REQ-016, closes_by: "L3-OD3 after L3-OD1", state: AWAITING_OWNER}
  - {id: L3-C04, item: "REQ-014's aged capacity (8.04 Ah for one 3P block) under two packs", whose: OWNER, record: REQ-014, closes_by: "rows L3-OD1 and L3-OD2: od_l3_1.py and od_l3_2.py restate it per pack (80 percent of 3.35 Ah a cell times each block's parallel count), for both packs together and for each pack alone", state: AWAITING_OWNER}
  - {id: L3-C05, item: "REQ-075's charge current (3.06 A for one 3P block) under two packs", whose: OWNER, record: REQ-075, closes_by: "rows L3-OD1 and L3-OD2: od_l3_1.py and od_l3_2.py restate it per pack (1,020 mA a cell)", state: AWAITING_OWNER}
  - {id: L3-C06, item: "D-06 against Option A(i)", whose: OWNER, closes_by: "L3-OD1: a ruling that supersedes D-06, its runtime statement kept per pack", state: AWAITING_OWNER}
