# after the independent check CHECK-1, v2/docs/records/l3r2/checks/check-l3r2-1.md, and the owner's review of the draft
# table, owner ruling D-22).
#
# render_l3r2.py (beside this file) renders REQUIREMENTS-L3-R2.md, OWNER-DECISIONS-L3.md and L3-RECONCILIATION.md from
# three inputs: this file, the requirements registry v2/ecad/tools/pcb_requirements.yaml, and the registry as released
# in handover H3 (frozen from v2/release/handover/H3.zip into h3_registry_digest.json, the ZIP read as it is, never
# modified). `--check` refuses a page on disk that differs from what the three render, and the suite runs it
# (v2/ecad/tools/tests/test_l3r2.py).
#
# WHAT IS KEPT HERE AND WHAT IS NOT. The registry is the authority for every requirement, its reading and its open
# items; nothing here repeats a record. What is here is what the registry has no field for: the target in words, the
# proposals made since H3 with their status, the requirement-or-implementation classification, the owner decisions layer
# 3 still needs (with the conditional scripts that apply each answer), the closure list, the layer each open item belongs
# to, each change's downstream impact by layer, and the files the gate waits on (the energy basis, the relocation facts,
# the re-issue of the definition documents, the independent check). A decision's state is NOT kept here: it is read from
# the registry, where the conditional script that applies the owner's answer records a ruling with
# `decides: <row>:<option>`. Prototype design: no V2 board has been fabricated, ordered, assembled or powered.
#
# THE OWNER'S REVIEW OF 30 SEPTEMBER 2026 (D-22) HOLDS ROWS L3-OD1, L3-OD2 AND L3-OD4 until the corrected, independently
# checked energy comparison arrives, and asks that "adverse" be defined by exact weather and operating assumptions. So no
# energy figure is stated here as the design's, the words "typical" and "adverse" are not used for a case, and the rows'
# energy cells read HELD until `energy_basis` below names the filed, checked basis.
#
# THE THIRD ROUND (30 September 2026). The independent check of stream l3plane's energy basis (filed here as
# v2/docs/records/l3r2/checks/energy-basis-check-1/, accepted: no, for three efficiencies of its case WE) confirmed four
# facts, recorded below as CF-01 to CF-04 and used now; nothing here uses a figure of the cases WE, WE60 or WA. The
# owner's instruction on the six-row table (D-23) adds row L3-OD6 (M1's weather basis) as a quantified choice with its
# recommendation and figures held, gives every row its options, recommendation, quantified consequences and dependencies
# with the evidence linked, flags plainly every option that cannot meet M1, and carries board A's current-limit resistor
# R11 as two results: the held circuit (10 mOhm, as generated) and the drafted 6.2 mOhm.
#
# No dash character (U+2013, U+2014) is used in this file or the pages rendered from it.

