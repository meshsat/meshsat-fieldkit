# WHAT IS KEPT HERE AND WHAT IS NOT. The registry is the authority for every requirement, its reading and its open
# items; nothing here repeats a record. What is here is what the registry has no field for: the target in words, the
# proposals made since H3 with their status, the requirement-or-implementation classification, the owner decisions layer
