# The acceptance definitions the review asks for (D-26), each written into the prepared restatement named.
acceptance_definitions:
  - row: L3-OD1
    label: "1b"
    requirement: REQ-072
    script: od_l3_1.py (approve)
    title: "M1's pass line at the kit loads"
    text: >-
      The specified service continues for 72 hours within voltage, power and pack limits; combined stored energy alone is
      not the line. On the reference case stated exactly (L3-FEASIBILITY.md section 2, checked by CHECK-2 of stream l3feas): both
      packs full and aged at the start (80 percent of the cells' specification minimum), the base pack at +20 C and the lid
      pack at the reference day's lowest air, 13.23 C; the load PS-IDLE-SPEC, 42.8 W at the pack terminals, plus the lid
      path's standby drain, split between the packs by capacity; ONE benchmark plane, 40 degrees of slope facing south at
      Leiden, the single exact orientation while no deployment band is established; the installation row L3-OD6 names (TYP
      or WAB); each pack's cutoff its graceful line (5 percent relative state of charge, or its lowest cell at 3.00 V under
      load), the kit's shutdown the base pack at its line; the power-path case the corrected path (case (iii),
      HYPOTHETICAL). Four conditions, all required: (1) every hour of the 72 serves the load, each pack drawn only to its
      own line; (2) the lowest store of the pack or packs still able to carry the kit stays above 4.2 Wh; (3) every path
      within its limits every hour (the lid path under its 8.7 A minimum; the charge currents within U3's 3.968 A, U3B's
      7.936 A and the cells' REQ-075 current); (4) the node at or above every load converter's minimum input with the base
      pack at 12.0 V, an engineering obligation no record reads yet. On the studied candidate conditions 1 and 2 are
      modelled, condition 3 INFERRED and condition 4 not established. After a permitted pack cutoff the remaining supply
      carries the loads.
    choice: "the owner's sub-choice 1b (od_l3_1.py --pass-line): `kit-loads`, the four conditions (the review's criterion, recommended), or `each-pack`, condition (2) held by each pack alone (stricter; no route of the studied candidate meets it in WAB, hf_wab.out 1)"
    superseded_by: "D-28, applied as D-32 (row L3-OD1 closed as layer 4 architecture)"
    superseded_note: "Prepared for row L3-OD1 approve, which the closure did not take, and its 72 hours were the session's SC-21, now superseded. REQ-072's acceptance as it stands (D-32) reads the objective met when the solar-assisted run serves the load for 48 hours or more, 72 hours reported beside it, at the kit loads (the service continues within voltage, power and pack limits, and after a permitted pack cutoff the remaining supply carries the loads, D-26), battery-only and solar-assisted apart, on the power path as drawn and on any corrected path named beside it as hypothetical. The reference case and the four conditions above are this definition's, kept for the store's layer 4 architecture (P-01), not REQ-072's acceptance."
  - row: L3-OD3
    label: "3"
    requirement: REQ-016
    script: od_l3_3.py
    title: "the solar topology apart from its electrical compliance"
    text: >-
      The owner's answer sets the topology, the voltage class and the installation condition (REQ-016); it verifies no
      rating. The interface is stated quantity by quantity with its derivation or obligation (L3-FEASIBILITY.md section
      3b, checked by CHECK-2 of stream l3feas): the available array power; the converter's input power, NOT controlled as drawn
      (O-2); the cold open-circuit exposure, 56.25 V by the 1.25 clause on the held sheet (O-3); the short-circuit and fault
      currents (O-4); the string versus combined-feed protection (O-5); F2 at 20 A and at least 56.25 V DC with its
      interrupting rating (O-6); the lead, J_SOLAR and the wall's solar pair at 20 A or more (O-7); and the panel revision
      pinned (O-1: the held sheet has no revision mark; closed when the maker's sheet for the revision bought is filed with
      its revision mark and sha256, array_calc.py is re-run on it and the set point and voltage basis re-derived).
    superseded_by: "D-28, applied as D-34 (row L3-OD3 answered unchanged)"
    superseded_note: "REQ-016's approved window stays unchanged, so no topology, voltage class or installation condition is set at layer 3. The interface quantities above are this definition's, kept for the 2S2P proposal P-03 with P-01 at layer 4 (closure item L3-C55), where a change to REQ-016 returns to the owner; the solar interface's obligations as drawn are design risk DR-04."
  - row: L3-OD4
    label: "4b"
    requirement: REQ-078
    script: od_l3_4.py (adopt, --push-n)
    title: "the open kit's stability: its full test conditions"
    text: >-
      The push is a design target the owner chooses (10 N is proposed as one, not a standard). Application point and
      direction: at the tablet's far edge, normal to its screen, where the lid carries the tablet; at the QMX set's
      controls, horizontal and backward, where it carries the QMX; the lower of the two where it carries both. Duration: a
      static push (the mechanical result is a static moment balance); the test's hold time is a TEST-PLAN item owed.
      Slope: toward the hinge side, the lid's figure from the mechanical record (feet-inboard bound) or the owner's.
      Support surface: a rigid flat surface, the case on its feet, their place measured by T-A1-3. Lid angle: 100 degrees
      on the stay. Load configuration: the lid pack and lid items fitted, the base contents at the swept case's lightest.
