# ------------------------------------------------------------------------------------------------ (a) the target
target:
  approved: >-
    What the owner has approved to date (handover H3's accepted requirements, then D-19 and D-20 of 28 September and
    D-21, D-22, D-23 and D-24 of 30 September 2026): the V2 kit in the Peli 1450 of the current moulding (the case never changes,
    ruling of 7 September 2026), with the device set of V2-SPEC.md; prototype 1 accepted on D-01's named core (messaging
    over Iridium, 5G, LoRa and APRS; the three-slot failover fabric; pack, vehicle and solar charging; hardware EMCON;
    ZEROIZE; pack safety; service and programming access), everything else designed, fitted where copper exists and
    reported NOT_YET_TESTED; one 4S3P pack of the Samsung INR18650-35E, about 145 Wh, in the east pocket (D-06); a solar
    input window of at most 25 V open circuit at the panel's coldest, held at 17.6 V, at most 100 W into board E's stage
    (REQ-016); mission M1, 72 hours in PS-IDLE-SPEC (42.8 W at the pack terminals) on the kit's own store and its solar
    input, from a full aged store, lid open and the kit shaded, judged on SC-37's reference day (the September mean day
    at Leiden on the optimally inclined plane, 40 degrees facing south), M1 carrying no season (CONOPS section 3); the 72
    hours, the session's SC-21, preserved by D-20 with M1's specified duration and read as approved under D-21, which the
    owner now questions (D-27, row L3-OD7). Battery and solar are mandatory for M1; an external DC source is optional
    and never M1's basis (D-20, D-21, D-22). The approved functions include the lid's QMX HF set (appendix 32.50 item 16a)
    and its tablet bracket (item 16d), both deferred from prototype 1's acceptance by D-01, not withdrawn. Superseded in
    part by D-28, applied as D-32 to D-37 (30 September 2026): M1's 72 hours are a design objective of 48 to 72 hours
    under REQ-072's stated profile, not a mandatory minimum (SC-21 marked superseded in the registry), and no deployment
    condition is stated (D-35); the decided target is rendered from the rows' rulings.
  contradiction: >-
    The approved target is not met by the studied design, and that is why layer 3 is not complete: on D-06's one pack
    the studied candidate fails M1 at desk (REQ-072 FAIL; the pack allows at most 9.1 W for M1 against 42.8 W, energy
    record section 9d, a limit no bus voltage raises), and on it REQ-016's 100 W window and REQ-072 are not both met.
    These are the candidate's shortfalls against the owner's targets, not requirements that contradict (D-26). D-20
    excludes accepting the shortfall and D-21 preserves the mission, so owner decisions on the store (D-06), an approved
    lid item (D-01's deferrals) and the solar input (REQ-016) set the target: rows L3-OD1 to L3-OD4, each recording a
    feasibility item where the studied candidate does not meet the target it sets. Row L3-OD5 closes the
    one other open contradiction, CFL-017, and row L3-OD6 sets the weather M1 is judged in, which D-22 asks to be stated
    exactly. Rows L3-OD1, L3-OD2, L3-OD4 and L3-OD6 were held by the owner (D-22, D-23, D-24) until the corrected,
    independently checked energy comparison and power path were filed; both are, at fnd/l3plane cd8720a1 with the
    accepted check CHECK-5, and the rows now show the checked figures.
  proposed: >-
    Row L3-OD7 comes first (D-27): M1's runtime, 72 hours required (Option B) or 48 hours required with 72 desired
    (Option A), with HF and the tablet kept, HF available or listening, an external battery arrangement authorised at
    VBAT or through the DC entry or not, and the tablet charged or not; its figures are the runtime comparison's (stream
    l3batt, checked), and rows L3-OD1, L3-OD2, L3-OD4 and L3-OD6 are not asked before it is answered. What the rows propose, as far as the session recommends before the energy basis: Option A(i)'s store (row L3-OD1), a
    base pack of 4S6P across both base pockets under board P and a lid pack under its own protection board, 4S20P or
    4S21P in all as the lid is 4S14P or 4S15P (964.8 or 1013.0 Wh nominal: strings of 48.24 Wh at the cell's 3,350 mAh
    minimum and 14.4 V, the arithmetic of D-06's own 144.7 Wh for 3 strings); the solar input of row L3-OD3, four 100 W
    panels in two series pairs (400 Wp at STC) into a 200 W stage, the panels and their folding stand carried outside the
    case; and D-02a's margins read as the kit's without its cells (row L3-OD5). Where the displaced lid item goes and
    whether its function stays in the kit (row L3-OD2), and M1's deployment conditions (row L3-OD4), are recommended only
    from the checked energy basis and the relocation facts. On the circuit as drawn, and in its derated variant, no lid
    meets M1; the resistor-only proposal is inconclusive; every Option A(i) figure that meets M1 is hypothetical, on a
    corrected power path whose findings are open engineering tasks (fact CF-02, finding F-01). M1's weather basis (row L3-OD6) is a
    quantified choice between the average-day benchmark and historical-coverage targets, its figures held for the checked
    basis. REQ-072 stays FAIL until the design is drawn, reviewed and tested: a model result is never a pass.
  alternatives:
    - {row: L3-OD1, option: reject, text: "D-06's one 4S3P pack stands as the store held; battery and solar stay mandatory, REQ-072 stays FAIL and feasibility item FI-01 records the open store problem; layer 3 cannot complete unless the owner explicitly authorises a change to M1 or to the approved functions, which D-20, D-21 and D-22 otherwise preserve."}
    - {row: L3-OD2, option: qmx-out, text: "The QMX HF set leaves the kit and HF leaves with it, the owner's explicit decision to remove an approved function; the lid keeps an 8 inch tablet bracket beside a 4S15P lid pack."}
    - {row: L3-OD2, option: qmx-outside, text: "The QMX HF set leaves the lid and is carried outside the case, its HF function kept through a sealed lead across the case wall; held until a record establishes that place and lead, which none does (fact CF-04); the lid keeps an 8 inch tablet bracket beside a 4S15P lid pack."}
    - {row: L3-OD2, option: both-kept, text: "Both approved lid items stay beside a 4S9P lid pack; no function leaves the kit, the studied candidate does not meet M1 on the records (a1int RECONCILE.md; every case of the energy basis's first issue) and feasibility item FI-04 is recorded."}
    - {row: L3-OD2, option: tablet-out, text: "The tablet bracket leaves the lid; the tablet is carried outside the case and served by the kit's WiFi and the USB-C outlet (REQ-017, deferred from prototype 1's acceptance); the QMX stays in its lid tray beside a 4S14P lid pack."}
    - {row: L3-OD3, option: 1s4p, text: "The four panels all in parallel: REQ-016 restated to at most 200 W, at most 25.6 V open circuit at -20 C cells, the array held at 16.7 to 17.6 V, an entry of 40 A and a fuse per panel; no plane grid has been run for it, so row L3-OD4 cannot adopt a band on it."}
    - {row: L3-OD3, option: keep, text: "REQ-016's 100 W window kept, with the array and entry current the checked energy basis gives for the lid chosen (the 1600 Wp of the options sheet is for 4S18P); no plane grid has been run for it."}
    - {row: L3-OD4, option: reject, text: "No deployment condition is stated: M1's claim stays on SC-37's reference plane (40 degrees, facing south) with no rule for the operator and no open-kit stability requirement."}
    - {row: L3-OD5, option: measure, text: "CFL-017 stays open until the bounded enclosure heat experiment (POWER-THERMAL.md section 10) is run on hardware; layer 3 then completes with it open only by the owner's explicit authorisation."}
    - {row: L3-OD5, option: cells, text: "Cells rated above +60 C are selected, reopening D-06's cell and spending money; CFL-017 stays open until the cell is chosen and its sheet held."}
    - {row: L3-OD6, option: mean-day, text: "M1 stays judged on SC-37's reference mean day, with the benchmark's limitations stated in REQ-072."}
    - {row: L3-OD6, option: coverage, text: "M1 must also meet the owner's share of the real September windows of 2005 to 2020; where the studied candidate's store does not fit the case, feasibility item FI-03 is recorded."}

# Feasibility findings for the owner, stated plainly on every page that shows the target.
findings:
  - id: F-01
    title: "On the power path as drawn no lid meets M1; M1 is met only on a hypothetical corrected power path, and there at the worst established inputs only conditionally"
    text: >-
      The checked basis (fnd/l3plane cd8720a1, CHECK-5) states board A's front end in four cases on SC-37's reference day
      ([three_cases.out 2](../../records/l3plane/three_cases.out)): as drawn, every lid fails M1 by 326.6 to 522.4 Wh at nominal inputs; the derated variant (U3 at 4.00 A) fixes
      current-limit coordination only and every lid fails by 369.9 to 566.0 Wh; the resistor-only proposal is
      inconclusive, between a lower bound where every lid fails by 622.1 to 1079.9 Wh and the corrected path; on the
      corrected path, HYPOTHETICAL until its findings A-1 to C-9 are closed, the 4S14P and 4S15P lids meet at nominal
      inputs. At the worst established inputs (WE: the charge bus at its steady-state minimum of 19.146 V, U3 at 6.1 A,
      CONDITIONAL on three efficiencies no maker document gives for this circuit) the 4S15P lid meets in both array builds
      on the combined line and fails in WAB at U3's 6.0 A bracket and at the bus's 18.782 V endurance bracket (0.6 and
      3.7 Wh unserved); the 4S14P lid fails in WAB (10.8 Wh); the 4S9P lid fails in every case ([energy_basis.out 5](../../records/l3plane/energy_basis.out)). In September's
      actual weather of 2005 to 2020 the corrected path carries at most 22.0 percent of 864 past windows at WE; every
      coverage target of 50 percent or more needs more cells than any established arrangement holds ([weather_basis.out A and B](../../records/l3plane/weather_basis.out)). No figure is
      demonstrated capability; everything is modelled and nothing is built.

# Facts the first check of the energy basis confirmed (energy_basis_checks above), used now under the coordinator's
# instruction of 30 September 2026; each names what it rests on and what is not yet in it. None is a figure of the
# cases WE, WE60 or WA, whose efficiencies the check did not accept (its B2).
facts:
  - id: CF-01
    title: "The charge bus at U3's input (VBUS20): its steady-state range and the brackets beside it"
    text: >-
      The steady-state range, anywhere in the in-use envelope: 19.146 / 20.000 / 20.887 V (minimum, nominal, maximum),
      and 19.205 / 20.823 V on M1's reference day, from the makers' pages for U2's reference and the divider resistors R6
      and R7. Beside it, not in it, the basis gives three brackets: 19.101 V with the divider 20 K above the inside air
      (an ASSUMPTION: board A has no layout; the rise warms the hot end only), 18.782 V with both resistors at their
      makers' 1000 h endurance limits (a test limit at far more stress than the divider sees: a bound, not an
      expectation), and 18.738 V with both together. The soft start (0.59 to 1.00 s after each enable) and the load and
      line transients are outside the steady state and move no hourly balance; the copper from R6's tap to R16 and the
      ground offset at U2 are layout terms not established. The basis takes the steady-state minimum, 19.146 V, as case
      WE, shows the endurance bracket as its own case WEL beside it and not taken, and gives the divider-rise bracket's
      effect as a sensitivity; an M1 claim on the basis accounts for the brackets the same way, stating them beside its
      result. Only the steady-state range lies inside stream s120's DC band of 19.080 to 20.960 V
      (v2/docs/records/s120/vbus20_bound.out); with the brackets the low end is below 19.080 V. The two checks reproduced
      the range (19.1458 / 20.8871 V and 19.2050 / 20.8226 V) and the second confirmed the brackets' treatment (its
      minors 1 to 3 of the first check answered, and its minor 8: the divider's rise gives 19.101 V, not the first check's
      19.072 V).
    source: ["[ENERGY-BASIS.md sections 2 and 6c, at the final tip cd8720a1](../../records/l3plane/ENERGY-BASIS.md)", "[vbus20_range.out](../../records/l3plane/vbus20_range.out)", "[the energy basis check 2, What holds](../../records/l3r2/checks/energy-basis-check-2/CHECK-2.md)", "[the energy basis check 5, the files verified at the tip](../../records/l3r2/checks/energy-basis-check-5/CHECK-5.md)"]
  - id: CF-02
    title: "Board A's front end in four cases: as drawn, derated, the resistor-only proposal and a hypothetical corrected power path"
    text: >-
      (a) As drawn: board A's front-end shunt R11 is 10 mOhm and the LM5176's constant-current loop holds 4.212 / 5.000 /
      5.810 A stacked, under U3's setting plus the other loads on R11 (finding A-1), and with E1's fixed setting the input
      bus collapses on a short source (A-2); every lid fails M1 on the reference day. (a') The derated variant, U3 at 4.00 A,
      makes U3 the limit (+0.052 A on 0.060 A of other loads, +0.033 A on 0.079 A) and fixes current-limit coordination
      only; every lid still fails M1 and carries no past window (D-25). (b) The resistor-only proposal, R11 at 6.2 mOhm and
      U3 at 6.2 A, is not a sufficient solution (D-24): it introduces B-1 to B-5 (L1 past its typical saturation current
      at the 9 V floor, the FETs at the fault current, the copper declarations passed, VBUS20's bulk capacitors over their
      rating at the highest permitted current, and the bus collapse again), so its energy is INCONCLUSIVE; the comparison
      of its limit with U3's (a margin of 0.378 A) stays closed unless its inputs change (D-25). (c) A hypothetical
      corrected path assumes every finding closed, A-1 and A-2, B-1 to B-5 and the missing evidence C-1 to C-9 among which
      Kelvin sensing at R11 within 0.29 mOhm of shared copper at 25 C is an implementation requirement, not a defect of
      the drawn circuit (the A32 layout reading is tied to that revision). Its energy is hypothetical, never demonstrated
      capability. The findings are engineering tasks with measurable criteria (power_path_corrections, closure items
      L3-C37 to L3-C44 and L3-C46 to L3-C53), not layer 3 prerequisites. The record's history: stream r11dep's first
      issue (4e9fa869) was checked once and not accepted (CHECK-3); its second issue (3ef5987e) classified the findings
      and was accepted (CHECK-4, of 06b8ecea); its third issue, at the final tip cd8720a1, set the derated variant at 4.00
      A and was accepted (CHECK-5).
    source: ["[R11-DEPENDENCY.md sections 1 and 2, at the final tip cd8720a1](../../records/r11dep/R11-DEPENDENCY.md)", "[r11_dep.out 3 and 6](../../records/r11dep/r11_dep.out)", "[three_cases.out 1 and 2](../../records/l3plane/three_cases.out)", "[the energy basis check 5](../../records/l3r2/checks/energy-basis-check-5/CHECK-5.md)", "[the energy basis check 4, What holds 2 to 5](../../records/l3r2/checks/energy-basis-check-4/CHECK-4.md)"]
  - id: CF-03
    title: "The weather record the coverage targets of row L3-OD6 are read on"
    text: >-
      PVGIS-SARAH2 hourly irradiance on the 40 degree south plane at Leiden, September 2005 to 2020 (16 Septembers, 11520
      rows), whose mean day matches the reference day's profile within 0.005 W/m2 hour by hour; every 72-hour window
      starting at 06 or 18 UTC on 1 to 27 September, 864 windows, a full store at each window's start. The windows'
      72-hour irradiation is 3.17 kWh/m2 at the lowest, 7.36 at the 10th percentile and 11.45 at the median, against 12.0
      for three reference days (SC-37's 4.0 kWh/m2 a day). The checks fetched PVGIS's September rows again and found them
      equal to the filed ones. The coverage each lid reaches on this record is modelled historical coverage, not a
      probability of success, and rests on the corrected path (case (c)).
    source: ["[weather_basis.out A](../../records/l3plane/weather_basis.out)", "[ENERGY-BASIS.md sections 5 and 8](../../records/l3plane/ENERGY-BASIS.md)", "[the energy basis check 1, What holds (the weather case)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]
  - id: CF-04
    title: "Where a displaced lid item goes: no place in the kit is established"
    text: >-
      The QMX HF set: the base has no volume for it (appendix 32.60: no bay on B16 cleared the unit, the reason it went to
      the lid), and outside the case it would need a lead through the back wall, which the ruled connector plate does not
      carry; the HF function leaves the kit unless a place is found. The tablet bracket: the tablet can be carried outside
      the case and used over the kit's WiFi and the USB-C outlet, but the bracket's function (a tablet held in the lid,
      item 16d) leaves the kit unless a place is found, and no record read establishes how the tablet travels with the
      kit. Nothing is designed for either.
    source: ["[a1mech README section 3 item 2](../../records/a1mech/README.md)", "[DECISION-A1.md](../../records/a1mech/DECISION-A1.md)", "[ENERGY-BASIS.md section 9](../../records/l3plane/ENERGY-BASIS.md)"]

