# The changes that are proposals only (D-22, D-23), stated on every page that shows a row.
proposal_only: >-
  Changes to weather coverage, deployment restrictions, functionality, operating conditions, enclosure constraints,
  mission requirements, charging time or approved resources are proposals for the owner's explicit decision (D-22 to
  D-25): each appears only as a row or an option he answers, naming the requirement it changes with the consequence
  quantified (each row's owner test), never as a closure, and none is taken because the current design passes it.
  Component selection, sensing implementation (Kelvin sensing among it), charging below a source's available power while
  the approved requirements hold, and the other power-path corrections are engineering tasks, tracked downstream (D-24,
  D-25). No option is recommended as feasible because its idealised energy balance passes.

# Remedies that would change a requirement if an engineer chose them instead of the engineering form (D-25: each names the
# requirement and quantifies the consequence). None is asked now: every correction has an engineering form that changes
# no requirement (stream r11dep's second issue, section 6, checked by the energy stream's CHECK-4 as reported; filed with
# power_path_check).
conditional_owner_cases:
  - {remedy: "Raise the full-current input floor so that L1 needs no new part and no schedule (B-1, C-5)", requirement: "REQ-015: 'A 9 to 36 V vehicle and shore input runs the kit and charges the pack'", consequence: "full charge current needs VIN_RAW of 11.00 V or more, so vehicle and shore inputs from 9 to 11 V (a 12 V system's low end) leave full service; on the reference day the tracker holds 15.1 V and no energy is lost; the engineering form instead, U3 scheduled at 5.05 A at 9 V, charges below no source's available power (at 9 V the vehicle entry gives at most 6.15 A, 55 W, against the schedule's about 104 W; R11-DEPENDENCY.md section 2, B-1, and the energy stream's CHECK-4)"}
  - {remedy: "Cap U3's input limit below 6.2 A permanently (B-1 to B-4)", requirement: "REQ-072 (M1)", consequence: "about 20 Wh of the lowest store per 0.1 A at WE on the corrected path (ENERGY-BASIS.md section 4); at the derated 4.00 A every lid fails M1 by 369.9 to 566.0 Wh (three_cases.out 2)"}
  - {remedy: "A part or a bank that does not fit board A's place (B-1, B-2, B-4)", requirement: "CON-006 (the pack pocket bounded by board A's east edge), or REQ-019 (the case never changes) if it went further", consequence: "not quantified: no part is selected; the question arises only if no fitting part exists"}

# The findings a hypothetical corrected power path assumes closed (case (c) of fact CF-02; D-24, D-25), restated by
# restate_power_path.py from the classes of stream r11dep's third issue at the final tip cd8720a1 (the energy stream's
# CHECK-5, accepted; the classes were set in its second issue, accepted by CHECK-4): A-1 and A-2, existing defects of the
# circuit as drawn; B-1 to B-5, defects the resistor-only proposal introduces; C-1 to C-9, missing evidence, not failures.
# Each is an engineering task with its correction and measurable criterion, tracked as a downstream closure item (L3-C37 to
# L3-C44 and L3-C46 to L3-C53), never an owner decision unless a remedy changes a requirement, function, deployment
# condition, enclosure constraint, charging time or approved resource (conditional_owner_cases).
power_path_corrections:
  - {id: A-1, class: "existing defect of the circuit as drawn", closure: L3-C37, layer: 8, item: "The front end limits below what the charge design asks (confirmed on the makers' figures): its stacked limit, 4.212 / 5.000 / 5.810 A, lies under U3's drawn setting plus the other loads on R11. Correction for the drawn circuit: the derated variant, U3 at 4.00 A (+0.052 A on 0.060 A of other loads, +0.033 A on 0.079 A), which fixes the coordination only and does not meet M1", criterion: "the stacked minimum of the fitted R11 is at least U3's maximum plus the other loads; on the bench, the front end's constant-current onset, measured with an electronic load past U3 at -20, 25 and 62 C, lies above U3's maximum plus 0.06 A", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2a, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: A-2, class: "existing defect of the circuit as drawn", closure: L3-C38, layer: 5, item: "With E1's fixed setting (4.15 A), the input bus collapses on a short source: established from the netlist and the makers' documented behaviour, the mechanism INFERRED; the defect sits in the E1 setting, not in FW-A16 as written. Correction: a VIN_RAW-dependent IIN_HOST rule for every source, firmware that lowers U3's input limit as VIN_RAW falls; an engineering choice while REQ-072 is met", criterion: "on the bench, with the panel source (or a simulator) stepped below U3's demand, run first at E1's fixed 4.15 A to confirm the collapse (a carried minor of the energy stream's CHECK-5) and then with the VIN_RAW rule: VIN_RAW settles above 12 V and FE_PGOOD never drops", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2a, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: B-1, class: "defect the resistor-only proposal introduces", closure: L3-C39, layer: 8, item: "L1 runs past its typical saturation current at the 9 V floor, in service. Correction: an inductor whose saturation current at its operating temperature exceeds the peak at the highest permitted current at 9 V, with margin, or IIN_HOST scheduled on VIN_RAW, its register setting 5.05 A at 9 V (a peak of 15.68 A, 89.6 percent of the typical saturation current, recomputed once the maker's derating is held, C-5); raising the input floor instead is a conditional owner case (REQ-015)", criterion: "analysis: the peak at the highest permitted current is at most 90 percent of the saturation current at the part's temperature, with the maker's derating; bench: L1's current waveform at 9 V with U3 at full draw shows no saturation knee", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2b, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: B-2, class: "defect the resistor-only proposal introduces", closure: L3-C40, layer: 9, item: "The FETs at the highest permitted current at 9 V. Correction, one or both of: hiccup (partial: it catches only parts whose peak limit sits under the fault's peak), or FETs and cooling rated for the fault, for example FETs in parallel; an input-side average limit is not available, and neither remedy is yet shown to fit on board A", criterion: "TJ at most 150 C, or the tree's derating where one applies, at the highest permitted current at 9, 15.1 and 36 V in 62.1 C air, from board A's own thermal resistance or a measurement", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2b, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: B-3, class: "defect the resistor-only proposal introduces", closure: L3-C41, layer: 8, item: "The copper declarations are passed (VBUS20 and FE_OUT, VIN_RAW). Correction: re-declare VBUS20, FE_OUT, VIN_RAW, _FE_A, _VIN_T and TRK_OUT, and regenerate", criterion: "dc_drop, derate and the track-width gates read PASS on the regenerated board at the new declarations", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2b, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: B-4, class: "defect the resistor-only proposal introduces", closure: L3-C42, layer: 8, item: "VBUS20's bulk capacitors at the highest permitted current. Correction: re-run the generator's node analysis at 9.37 A and 9 V and enlarge or rebalance the bank, or bound the fault current (B-2)", criterion: "every can at most 2.8 A (the maker's figure at 125 C) over the ESR bands at the highest permitted current; on the bench, the worst can's ripple and temperature agree with it", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2b, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: B-5, class: "defect the resistor-only proposal introduces", closure: L3-C43, layer: 5, item: "A fixed IIN_HOST of 6.2 A drops FW-A16's VIN_RAW scaling (INFERRED; the proposal's form of A-2). Correction: as A-2, for the proposal's setting", criterion: "as A-2: with a source stepped below U3's demand, VIN_RAW settles above 12 V and FE_PGOOD never drops", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2b, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-1, class: "missing evidence, not a failure", closure: L3-C44, layer: 9, item: "Kelvin sensing at R11 and the permitted shared resistance: an implementation requirement, not a defect of the drawn circuit (the A32 reading is tied to that revision)", criterion: "layout extraction: kelvin_check on FE_ISNS_P and FE_ISNS_N reads at most 0.29 mOhm for the two together at 25 C (0.371 mOhm at the working temperature); bench at 25 C: the DC voltage across U2's pins 14 and 13 exceeds I x R11, R11 measured four-wire at its pads, by at most 0.29 mOhm x I (1.7 mV at 6.0 A)", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-2, class: "missing evidence, not a failure", closure: L3-C46, layer: 6, item: "The 6.2 mOhm part's order code", criterion: "a catalogue answer for a 2512 part of 1 percent, 50 ppm/K or better and 3 W, with its sheet filed", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-3, class: "missing evidence, not a failure", closure: L3-C47, layer: 9, item: "Board A's own junction-to-air figure for Q2 to Q5", criterion: "a figure from the laid copper, at most 30 C/W for Q2 and 38 C/W for Q4 in service at 9 V and 39 C/W for Q2 at 15.1 V at the maximum, or a measurement", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-4, class: "missing evidence, not a failure", closure: L3-C48, layer: 6, item: "C11 and C12's ripple rating and DC-bias derating at 36 V", criterion: "the maker's figure, at least 2.5 A a part, or a part that has one", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-5, class: "missing evidence, not a failure", closure: L3-C49, layer: 6, item: "L1's saturation current against temperature", criterion: "the maker's derating read at the part's temperature (it feeds B-1's closure)", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-6, class: "missing evidence, not a failure", closure: L3-C50, layer: 8, item: "Board E's 200 W stage, not designed; the front end's input is the stage's output", criterion: "a stage design that takes the front end's maximum demand at its input, or a bound on that demand in a fault", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-7, class: "missing evidence, not a failure", closure: L3-C51, layer: 6, item: "U3's input-current minimum at 10 mOhm", criterion: "the maker's figure, or a bench reading", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-8, class: "missing evidence, not a failure", closure: L3-C52, layer: 6, item: "The three undocumented efficiencies: board E's stage, board A's front end and the pack's charge efficiency", criterion: "the makers' figures for these circuits, or measurement", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}
  - {id: C-9, class: "missing evidence, not a failure", closure: L3-C53, layer: 9, item: "The VBUS20 loads besides U3", criterion: "a bench reading of R11's current minus R16's at U3's full draw", source: "v2/docs/records/r11dep/R11-DEPENDENCY.md section 2c, at cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f (v2/docs/records/l3r2/checks/energy-basis-check-5/CHECK-5.md, accepted)"}

