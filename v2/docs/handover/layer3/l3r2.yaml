# ------------------------------------------------------------------------------------------------ the closure (D-28, D-29)
# The owner's clarifications of 30 September 2026 close layer 3 (D-28: the energy and runtime requirement; D-29: CFL-017),
# applied to the registry by v2/docs/records/l3r5/apply_l3r5_closure.py. Every mandatory requirement and design objective
# is distinguishable (the registry's `obligation`), each with its acceptance and verification method; the modelled
# baseline is reported prominently; the unresolved engineering is assigned as design risks and layer 4 obligations; and
# the completion statuses of the requirements, the circuit, the PCB, the thermal design, the runtime and the product are
# kept apart.
closure_cycle:
  rulings: [D-28, D-29, D-30]
  applied_by: v2/docs/records/l3r5/apply_l3r5_closure.py
  # The registry as it stood before the closure (the round 5 checkpoint): the prepared owner-decision scripts' dry runs
  # and their tests run on it, since the tree's rows are decided.
  pre_closure_commit: 2cd18f6d36c98ee5b2aa59d3f98588763691d118
  owner_decision_left: "None. CFL-017 was the only candidate for a contradiction between mandatory owner requirements; on D-29 it is a collision between the requirements and the current cell, an engineering selection (cell_provenance), so the requirements are coherent and FEA-008 carries the obligation to layer 4. No approval of the definition re-issue remains his either: his closure instructions D-38 authorise it (the affected passages generated from his choices and accepted by one targeted acceptance review), and its acceptance is the targeted independent review of this closure (L3-C27). Once the closure criteria pass, the baseline is reported COMPLETE without a further review from him, as D-38 instructs."
obligations:
  mandatory:
    - {item: "Battery and solar both present and working", records: [REQ-014, REQ-016, REQ-046, REQ-075], source: "D-20, D-21, D-28 ('Battery and solar remain required')"}
    - {item: "The energy store inside the Peli 1450; no external battery", records: [REQ-014], source: "D-28 ('NO external battery. Battery storage stays inside the Peli 1450.')"}
    - {item: "HF and the tablet functions kept: the QMX HF set in its lid tray and the tablet bracket, both in the lid", records: [REQ-002, REQ-011], source: "D-28 ('Keep both HF and tablet functions'); appendix 32.50 items 16a and 16d; D-01 defers them from prototype 1's acceptance, not from the kit"}
    - {item: "The tablet's charging, a capability within the outlet's electrical and protection limits: optional, reducing endurance, no daily schedule required", records: [REQ-011, REQ-017], source: "D-28; D-12 (the outlet's 45 W contract)"}
    - {item: "Every other approved requirement unchanged, REQ-016's approved solar window among them", records: [REQ-016], source: "D-28 ('Preserve other approved requirements')"}
  objectives:
    - {item: "Mission M1's runtime: 48 to 72 hours under the stated operating profile, not a mandatory minimum", records: [REQ-072], source: "D-28 ('Treat 48-72 hours as the baseline design target under an explicitly stated operating profile')"}
baseline_statement: "The present candidates miss the 48 to 72 hour objective even without tablet charging. With HF and the tablet kept, battery-only from full: D-06's ruled 4S3P pack runs 2.52 h at +20 C (1.04 h at -10 C); the studied in-case candidate, Option A(i)'s base 4S6P and a 4S9P lid (544.4 Wh usable aged at +20 C), runs 12.71 h (5.24 h at -10 C). Solar-assisted on SC-37's mean day, one plane 40 degrees facing south, TYP: D-06's pack does not carry a night (it allows at most 9.1 W for M1 against 42.8 W); the studied candidate stops at 05 UTC of the first night, hour 23 from a 06 UTC start and hour 11 from an 18 UTC start, as drawn (266.7 Wh unserved at 48 h, 494.7 Wh at 72 h) and on the hypothetical corrected path alike (102.2 Wh at 48 h, 165.7 Wh at 72 h, NOM), in 0 of 864 past September windows. The corrected path is not implemented. Optional tablet charging and HF listening reduce endurance further, which the owner accepts (D-28). This is design risk DR-01, assigned to layer 4; REQ-072 reads FAIL at desk."
# L3-R01 of the independent review the owner relayed on 1 October 2026 (v2/docs/records/l3am/): what every layer 3
# solar-assisted figure was computed with. render_l3r2.solar_case verifies it (the quote at its lines of runtime.out,
# the window's in ARRAY.md, the figures against runtime.out by exact keys, the retained window in REQ-016's statement)
# and prints its label wherever a page states such a figure (solar_guard refuses a page that does not).
solar_case:
  id: SAC-P03
  state: HISTORICAL
  finding: L3-R01
  record: v2/docs/records/l3am/DISPOSITIONS.md
  relayed_on_text: "1 October 2026"
  proposal: P-03
  store_proposal: P-01
  short: "400 Wp in 2S2P into the model's 200 W stage window"
  source: {record: v2/docs/records/l3batt/runtime.out, sha16: 87d9c1ee59059763, lines: "27 to 28"}
  pack: "proposal P-01's store (Option A(i)): a base 4S6P and a lid 4S9P of the Samsung INR18650-35E, 544.4 Wh usable aged at +20 C; at the start of the solar-assisted runs 218.4 Wh in the base at +20 C and 284.2 Wh in the lid at 13.23 C, 502.6 Wh together, both full and aged"
  load_profile: "REQ-072's objective_profile: PS-IDLE-SPEC, 42.8 W at the pack terminals over its 39 loads, HF available and not receiving, the tablet not charged; SC-37's mean September day at Leiden on one plane, 40 degrees facing south, TYP (WAB a sensitivity); starts at 06 and 18 UTC"
  array: "proposal P-03's: 400 Wp, four Renogy RNG-100DB-H panels in 2S2P (runtime.out section 2; ENERGY-BASIS.md section 6b)"
  voltage_window: "the 2S2P array's: the stage's input held at the FBIN set point, 34.29 V in TYP and 33.05 or 35.57 V in WAB (ENERGY-BASIS.md section 6b); operating 26 to 44 V at maximum power over the envelope and up to 51.3 V open circuit at -20 C cells (ARRAY.md section 3)"
  window_source: {record: v2/docs/records/a1solar/ARRAY.md, sha16: c4938e4a7598aedc, quote: "operating 26 to 44 V at maximum power over the envelope (section 1), the set point held whenever the stage asks more than the array gives; open circuit up to 51.3 V at -20 C cells"}
  stage_limit: "a 200 W stage window, the energy model's clip; board E as generated implements no 200 W limit (ARRAY.md section 3)"
  retained: {record: REQ-016, ruling: D-34, decides: "L3-OD3:unchanged", quotes: ["an open-circuit voltage of at most 25 V at the panel's coldest operating temperature", "the panel held at 17.6 V by the stage's input regulation", "at most 100 W into the stage"]}
  figures: {stops: "05 UTC of the first night", drawn_unserved_48_72: "266.7 / 494.7", corrected_unserved_48_72: "102.2 / 165.7", windows: "0 of 864"}
  understated: "the inherited counter of v2/docs/records/a1elec/energy_two_pack.py (lines 257 to 280, sha256/16 a3426880bf607d38) credits the sun twice in an hour the kit is stopped: with the load at 0 W the hour's solar power is subtracted from the counted shortfall (line 259) and the same power charges the packs (lines 262 to 280). The engineering collaborator's layer 4 check of 30 September 2026 found it; layer 4 recomputes the figures."
  pending: {task: L4-E2, record: v2/docs/records/l4e/L4-ENERGY-ARCHITECTURE.md}
  conclusion: "The conclusion stands: REQ-072 reads FAIL at desk, design risk DR-01."
  design_risks: [DR-01]
design_risks:
  - {id: DR-01, title: "The 48 to 72 hour objective missed by the present candidates, even without tablet charging", layer: "4: the internal energy architecture inside the Peli 1450 with both lid functions kept (the store's arrangement, Option A(i) and D-06 as proposals P-01 and P-03)", evidence: [v2/docs/records/l3batt/runtime.out, v2/docs/records/energy/ENERGY-RECONCILIATION.md], text: "See the baseline statement: stops at 05 UTC of the first night, 0 of 864 windows; no in-case upgrade found (SHORTLIST.md 3); no external battery (D-28)."}
  - {id: DR-02, title: "Board A's power path as drawn fails; the corrected path is hypothetical, not implemented", layer: "4 (the architecture decisions), then 8 (the circuit) and 9 (verification)", evidence: [v2/docs/records/r11dep/R11-DEPENDENCY.md, v2/docs/records/l3plane/ENERGY-BASIS.md], text: "Existing defects A-1 and A-2, the resistor-only proposal's B-1 to B-5, the missing evidence C-1 to C-9; closure items L3-C34, L3-C35 and L3-C37 to L3-C53."}
  - {id: DR-03, title: "The USB-C outlet's current-sense shunt R138 (10 mOhm, twice the maker's recommended 5 mOhm) trips at 1.92 to 2.26 A, below the 3 A contracts", layer: "4 (board A's outlet), then 8", evidence: [v2/docs/records/l3r5/checks/l3batt-check-3/CHECK-3.md], text: "CHECK-3 of stream l3batt, minor 1, a board A finding: REQ-017's 45 W is not deliverable as drawn on the 5, 9 and 15 V contracts (each a 3.0 A contract above the trip); TI's 5 mOhm puts the trip at 3.8 to 4.5 A. The tablet's charging capability (REQ-011) is judged at the outlet within this protection limit."}
  - {id: DR-04, title: "The solar interface's obligations as drawn: the stage's input power not controlled (O-2) and the panel's revision not pinned (O-1)", layer: "4, 6 and 8", evidence: [v2/docs/records/l3feas/L3-FEASIBILITY.md], text: "L3-FEASIBILITY.md section 3b (checked by CHECK-2 of stream l3feas); O-3 to O-7 as they apply to the array REQ-016's window takes."}
  - {id: DR-05, title: "Three undocumented efficiencies (C-8) and U3's input-current minimum (C-7)", layer: "6 (the makers' figures) and 9 (measured at bring-up)", evidence: [v2/docs/records/l3feas/L3-FEASIBILITY.md], text: "Every solar-assisted figure on the corrected path is CONDITIONAL on them."}
  - {id: DR-06, title: "The current cell and thermal design against the temperature requirements with the pack fitted (CFL-017's modes)", layer: "4: component selection and thermal design", evidence: [v2/vendor/battery/samsung-35e-orbtronic.pdf, v2/vendor/battery/samsung-35e-akkuzentrum.pdf, v2/docs/OPERATING-ENVELOPE.md], text: "FEA-008, obligations LO-01a to LO-01h below."}
  - {id: DR-07, title: "Option A(i)'s lid pack consequences: the open kit's stability on its stay, the 100 degree stay and the sealed lid crossing", layer: "4 with P-01 and P-05", evidence: [v2/docs/records/a1mech/README.md], text: "REQ-078 as prepared goes with the lid pack; with both lid items kept the model stands on 4.8 degrees and tips above 10.8 N at the tablet's far edge on level ground (a1mech README section 5)."}
cell_provenance:
  finding: "The Samsung 35E is named in the owner's pack rulings as the pack's content, and D-06 was ruled at the session's recommendation; no ruling states the cell model as a product requirement, and D-06's subject is the pack's size and runtime. The session reads the model as the current engineering selection that D-06's pack carries, as D-29 itself words it ('the currently selected Samsung 35E cells'), so CFL-017 is a collision between the requirements and the current component, and the requirements are coherent."
  binds: "D-06 binds the pack's size and place (one 4S3P of about 145 Wh in the east pocket); the model it names is the design's current selection. A layer 4 change of cell within that size is a component selection, which restates D-06's parenthesis and needs the owner's approval of the spend. Were the owner to hold that D-06 mandates the 35E itself, CFL-017 would be a conflict between D-06 and D-02a (with REQ-074), and the one decision would be which of the two yields."
  quotes:
    - {source: v2/ecad/tools/pcb_requirements.yaml, where: "owner ruling D-06, titled 'pack size and runtime', ruled 26 September 2026", text: "One 4S3P 18650 pack (Samsung INR18650-35E) of about 145 Wh, shrink-wrapped in the east pocket, subject to the case measurement (D-08)."}
    - {source: v2/docs/MESHSAT-709-geometry-appendix.md, where: "the owner's rulings of 25 and 26 September 2026 (the foundation batch)", text: "Each question was asked one at a time with its options, the reasoning behind each and a recommendation, and each was ruled at the recommendation."}
    - {source: v2/docs/MESHSAT-709-geometry-appendix.md, where: "the same table, D-06", text: "one 4S3P 18650 pack (Samsung 35E) of about 145 Wh, shrink-wrapped in the east pocket, subject to the case measurement"}
    - {source: v2/docs/MESHSAT-709-geometry-appendix.md, where: "section 32.18, 4 September 2026, an earlier architecture", text: "Ruling on the pack (owner, 4 Sep night): the welded pack becomes twelve cells, 1S12P, 42 Ah (12 x Samsung 35E)"}
    - {source: v2/docs/MESHSAT-709-geometry-appendix.md, where: "section 32.27, 4 September 2026, the battery module research", text: "Cell, Samsung INR18650-35E (specification Ver. 1.1)"}
    - {source: v2/docs/handover/layer3/OWNER-INSTRUCTION-2026-09-30.md, where: "D-29", text: "the currently selected Samsung 35E cells"}
