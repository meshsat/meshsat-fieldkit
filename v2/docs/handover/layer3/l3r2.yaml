# owner's instruction on the six-row table (D-23) adds row L3-OD6 (M1's weather basis) as a quantified choice with its
# recommendation and figures held, gives every row its options, recommendation, quantified consequences and dependencies
# with the evidence linked, flags plainly every option that cannot meet M1, and carries board A's current-limit resistor
