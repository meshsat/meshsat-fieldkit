# Feasibility findings for the owner, stated plainly on every page that shows the target.
findings:
  - id: F-01
    title: "The two-pack results were computed on the model's most favourable charge bus and on board A's drafted entry; which lid meets M1, and on which planes, waits on the checked energy basis"
    text: >-
      The published two-pack figures convert U3's input current limit into power at the energy model's charge bus of 20.7
      V (v2/docs/records/a1elec/energy_two_pack.py). Stream l3plane's basis gives the bus at U3's input a steady-state
      range of 19.146 / 20.000 / 20.887 V across the in-use envelope, with brackets below it (19.101 V with the divider 20 K
      warmer, 18.782 V with the resistors at their makers' 1000 h endurance limits, a bound and not an expectation, 18.738
      V with both; fact CF-01), so the model's 20.7 V sits near the top of the steady-state range, and the first check of L3-R2
      (v2/docs/records/l3r2/checks/check-l3r2-1.md, B2) found the margins falling as the bus falls, the tablet-out lid's
      the most. Every Option A(i) figure is hypothetical: it rests on a corrected power path (case (c) of fact CF-02), while
      on the circuit as drawn no lid meets M1 and the resistor-only proposal is not a sufficient solution (D-24). Whether
      each lid option meets M1 across the supply range, and on which planes, is stated only from the
      checked energy basis (open item S-127) and the checked power path (D-24); until then rows L3-OD1, L3-OD2, L3-OD4 and
      L3-OD6 are held (D-22, D-23, D-24) and no figure on these pages is the design's. Every figure named here is modelled, and nothing is
      built.

# Facts the first check of the energy basis confirmed (energy_basis_checks above), used now under the coordinator's
# instruction of 30 September 2026; each names what it rests on and what is not yet in it. None is a figure of the
# cases WE, WE60 or WA, whose efficiencies the check did not accept (its B2).
facts:
  - id: CF-01
    title: "The charge bus at U3's input (VBUS20): its steady-state range and the brackets beside it"
    text: >-
      The steady-state range, anywhere in the in-use envelope: 19.146 / 20.000 / 20.887 V (minimum, nominal, maximum),
      and 19.205 / 20.823 V on M1's reference day, from the makers' pages for U2's reference and the divider resistors R6
      and R7. Beside it, not in it, the basis gives three brackets: 19.101 V with the divider 20 K above the inside air
      (an ASSUMPTION: board A has no layout; the rise warms the hot end only), 18.782 V with both resistors at their
      makers' 1000 h endurance limits (a test limit at far more stress than the divider sees: a bound, not an
      expectation), and 18.738 V with both together. The soft start (0.59 to 1.00 s after each enable) and the load and
      line transients are outside the steady state and move no hourly balance; the copper from R6's tap to R16 and the
      ground offset at U2 are layout terms not established. The basis takes the steady-state minimum, 19.146 V, as case
      WE, shows the endurance bracket as its own case WEL beside it and not taken, and gives the divider-rise bracket's
      effect as a sensitivity; an M1 claim on the basis accounts for the brackets the same way, stating them beside its
      result. Only the steady-state range lies inside stream s120's DC band of 19.080 to 20.960 V
      (v2/docs/records/s120/vbus20_bound.out); with the brackets the low end is below 19.080 V. The two checks reproduced
      the range (19.1458 / 20.8871 V and 19.2050 / 20.8226 V) and the second confirmed the brackets' treatment (its
      minors 1 to 3 of the first check answered, and its minor 8: the divider's rise gives 19.101 V, not the first check's
      19.072 V).
    source: ["ENERGY-BASIS.md section 2 and 6c, branch fnd/l3plane at ec415c09 (checked)", "[the energy basis check 2, What holds](../../records/l3r2/checks/energy-basis-check-2/CHECK-2.md)", "[the energy basis check 1, Independent figures](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]
  - id: CF-02
    title: "Board A's front end: the circuit as drawn, the resistor-only proposal and a hypothetical corrected power path"
    text: >-
      (a) The circuit as drawn: board A's front-end shunt R11 is 10 mOhm and the LM5176's constant-current loop holds
      4.300 / 5.000 / 5.700 A (VSNS 43 / 50 / 57 mV over R11), below U3's input current setting (IIN_HOST, 6.2 A nominal),
      so at U3's full input current the bus leaves voltage regulation, and in the model every lid option fails M1, by 326
      to 523 Wh (case GEN; confirmed by the first check). (a') A derated variant of the circuit as drawn, U3's input limit at
      4.05 A or less: it makes U3, not the front end, the limit (current-limit coordination) and nothing more; it does not
      establish that the other electrical findings are resolved or that M1 is met (D-25), and its energy is HELD for the
      corrected assessment. (b) The resistor-only proposal, R11 at 6.2 mOhm (a front-end limit of 6.935 A at its minimum):
      not a sufficient solution (D-24); the comparison of that limit with U3's (a margin of 0.378 A, which D-25 names
      independently checked) stays closed unless its inputs change. In the record of stream r11dep (its history: stream r11dep's first issue (4e9fa869) was checked once and not accepted (the energy stream's CHECK-3); its second issue (3ef5987e) answers that check, classifying the findings as existing defects A-1 and A-2, defects the proposal introduces B-1 to B-5 and missing evidence C-1 to C-9; a check of that issue with the three cases (CHECK-4, of fnd/l3plane 06b8ecea) is reported accepted, to be filed with power_path_check),
      at the new currents L1 passes its typical saturation current at the 9 V service floor, the FETs pass 150
      C at 9 V on the maker's pad figure (already in the circuit as drawn at its limit's maximum), the input capacitors'
      ripple rating is not established, and U3 limits only with Kelvin sensing at R11 within a permitted shared resistance,
      an implementation requirement (PP-02; D-25: the A32 layout reading is tied to that revision and establishes no defect
      of the current board, which has no layout, and the current netlist shows none); so the resistor alone does not
      establish a supportable power envelope, and every result on it reads CONDITIONAL until the electrical check
      (power_path_check) says otherwise. (c) A hypothetical corrected power path: the energy basis's Option A(i) figures
      assume a front end that carries U3's input limit; they are kept as feasibility figures, labelled hypothetical, never
      demonstrated capability, and the corrections they assume (power_path_corrections, PP-01 to PP-08) stand beside
      them. The corrections are engineering tasks with measurable criteria, tracked downstream (L3-C34, L3-C35, L3-C37 to
      L3-C44), not layer 3 prerequisites.
    source: ["ENERGY-BASIS.md sections 2 and 6c, branch fnd/l3plane at ec415c09 (checked)", "R11-DEPENDENCY.md sections 4, 6 and 7, branch fnd/l3plane at 4e9fa869 (stream r11dep's first issue, checked once and not accepted), and sections 2 and 6 of its second issue at 3ef5987e", "[a1elec TOPOLOGY.md section 7](../../records/a1elec/TOPOLOGY.md)", "[the energy basis check, What holds (the GEN finding)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]
  - id: CF-03
    title: "The weather record the coverage targets of row L3-OD6 are read on"
    text: >-
      PVGIS-SARAH2 hourly irradiance on the 40 degree south plane at Leiden, September 2005 to 2020 (16 Septembers, 11520
      rows), whose mean day matches the reference day's profile within 0.005 W/m2 hour by hour; every 72-hour window
      starting at 06 or 18 UTC on 1 to 27 September, 864 windows, a full store at each window's start. The windows'
      72-hour irradiation is 3.17 kWh/m2 at the lowest, 7.36 at the 10th percentile and 11.45 at the median, against 12.0
      for three reference days (SC-37's 4.0 kWh/m2 a day). The check fetched PVGIS's September rows again and found them
      equal to the filed ones. What a store meets on this record is row L3-OD6's figure, HELD for the second round.
    source: ["ENERGY-BASIS.md section 5, branch fnd/l3plane at 6a283b25, and section 8 at ec415c09 (checked)", "[the energy basis check, What holds (the weather case)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)", "[the energy basis check 2, What holds (the coverage)](../../records/l3r2/checks/energy-basis-check-2/CHECK-2.md)"]
  - id: CF-04
    title: "Where a displaced lid item goes: no place in the kit is established"
    text: >-
      The QMX HF set: the base has no volume for it (appendix 32.60: no bay on B16 cleared the unit, the reason it went to
      the lid), and outside the case it would need a lead through the back wall, which the ruled connector plate does not
      carry; the HF function leaves the kit unless a place is found. The tablet bracket: the tablet can be carried outside
      the case and used over the kit's WiFi and the USB-C outlet, but the bracket's function (a tablet held in the lid,
      item 16d) leaves the kit unless a place is found, and no record read establishes how the tablet travels with the
      kit. Nothing is designed for either.
    source: ["[a1mech README section 3 item 2](../../records/a1mech/README.md)", "[DECISION-A1.md](../../records/a1mech/DECISION-A1.md)", "ENERGY-BASIS.md section 6, branch fnd/l3plane at 6a283b25", "[the energy basis check, What holds (relocation facts)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]

# The changes that are proposals only (D-22, D-23), stated on every page that shows a row.
proposal_only: >-
  Changes to weather coverage, deployment restrictions, functionality, operating conditions, enclosure constraints,
  mission requirements, charging time or approved resources are proposals for the owner's explicit decision (D-22 to
  D-25): each appears only as a row or an option he answers, naming the requirement it changes with the consequence
  quantified (each row's owner test), never as a closure, and none is taken because the current design passes it.
  Component selection, sensing implementation (Kelvin sensing among it), charging below a source's available power while
  the approved requirements hold, and the other power-path corrections are engineering tasks, tracked downstream (D-24,
  D-25). No option is recommended as feasible because its idealised energy balance passes.

