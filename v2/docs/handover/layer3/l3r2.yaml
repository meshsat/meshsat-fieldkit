# Feasibility findings for the owner, stated plainly on every page that shows the target.
findings:
  - id: F-01
    title: "The two-pack results were computed on the model's most favourable charge bus and on board A's drafted entry; which lid meets M1, and on which planes, waits on the checked energy basis"
    text: >-
      The published two-pack figures convert U3's input current limit into power at the energy model's charge bus of 20.7
      V (v2/docs/records/a1elec/energy_two_pack.py). Stream l3plane has since established the bus at U3's input in steady
      regulation at 19.146 / 20.000 / 20.887 V across the in-use envelope (fact CF-01, confirmed by the energy basis
      check), so the model's 20.7 V sits near the top of the range, and the first check of L3-R2
      (v2/docs/records/l3r2/checks/check-l3r2-1.md, B2) found the margins falling as the bus falls, the tablet-out lid's
      the most. Every Option A(i) figure also rests on board A's entry re-rated as drafted: as generated, no lid meets M1
      (fact CF-02). Whether each lid option meets M1 across the supply range, and on which planes, is stated only from the
      checked second round of the energy basis (open item S-127); until then rows L3-OD1, L3-OD2, L3-OD4 and L3-OD6 are
      held (D-22, D-23) and no figure on these pages is the design's. Every figure named here is modelled, and nothing is
      built.

# Facts the first check of the energy basis confirmed (energy_basis_checks above), used now under the coordinator's
# instruction of 30 September 2026; each names what it rests on and what is not yet in it. None is a figure of the
# cases WE, WE60 or WA, whose efficiencies the check did not accept (its B2).
facts:
  - id: CF-01
    title: "The charge bus at U3's input (VBUS20) in steady regulation"
    text: >-
      19.146 / 20.000 / 20.887 V (minimum, nominal, maximum) anywhere in the in-use envelope, and 19.205 / 20.823 V on
      M1's reference day, from the makers' pages for U2's reference and the divider resistors R6 and R7; the check
      reproduced 19.1458 / 20.8871 V and 19.2050 / 20.8226 V and found the stack sound. Not yet in the figure: the
      resistors' ageing and the divider's own heating above the air (the check's minors 1 and 2), and the copper from
      R6's tap to R16, which has no layout. It narrows stream s120's DC band of 19.080 to 20.960 V
      (v2/docs/records/s120/vbus20_bound.out), which assumed 65 K of TCR and no amplifier term. No M1 energy result on
      it is used here before the second round.
    source: ["ENERGY-BASIS.md section 2, branch fnd/l3plane at 6a283b25", "[the energy basis check, What holds and Independent figures](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]
  - id: CF-02
    title: "Board A as generated: the front end limits below U3, and no lid meets M1"
    text: >-
      As generated, board A's front-end shunt R11 is 10 mOhm and the LM5176's constant-current loop holds 4.300 / 5.000 /
      5.700 A (VSNS 43 / 50 / 57 mV over R11), below U3's input current setting (IIN_HOST, 6.2 A nominal): at U3's full
      input current the bus leaves voltage regulation. In the model every lid option then fails M1, by 326 to 523 Wh
      (case GEN). Every Option A(i) result rests on a1elec's drafted re-rate, R11 6.2 mOhm (a front-end limit of 6.935 A
      at its minimum, above U3's 6.3 A maximum), which is not in board A's generator. So each result is stated twice:
      on the held circuit and conditional on the drafted resistor. The change's implementation (layer 8) and its physical
      verification (prototype) are downstream obligations, closure items L3-C34 and L3-C35, not layer 3 prerequisites.
    source: ["ENERGY-BASIS.md sections 2 and 4c, branch fnd/l3plane at 6a283b25", "[a1elec TOPOLOGY.md section 7](../../records/a1elec/TOPOLOGY.md)", "[the energy basis check, What holds (the GEN finding)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]
  - id: CF-03
    title: "The weather record the coverage targets of row L3-OD6 are read on"
    text: >-
      PVGIS-SARAH2 hourly irradiance on the 40 degree south plane at Leiden, September 2005 to 2020 (16 Septembers, 11520
      rows), whose mean day matches the reference day's profile within 0.005 W/m2 hour by hour; every 72-hour window
      starting at 06 or 18 UTC on 1 to 27 September, 864 windows, a full store at each window's start. The windows'
      72-hour irradiation is 3.17 kWh/m2 at the lowest, 7.36 at the 10th percentile and 11.45 at the median, against 12.0
      for three reference days (SC-37's 4.0 kWh/m2 a day). The check fetched PVGIS's September rows again and found them
      equal to the filed ones. What a store meets on this record is row L3-OD6's figure, HELD for the second round.
    source: ["ENERGY-BASIS.md section 5, branch fnd/l3plane at 6a283b25", "[the energy basis check, What holds (the weather case)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]
  - id: CF-04
    title: "Where a displaced lid item goes: no place in the kit is established"
    text: >-
      The QMX HF set: the base has no volume for it (appendix 32.60: no bay on B16 cleared the unit, the reason it went to
      the lid), and outside the case it would need a lead through the back wall, which the ruled connector plate does not
      carry; the HF function leaves the kit unless a place is found. The tablet bracket: the tablet can be carried outside
      the case and used over the kit's WiFi and the USB-C outlet, but the bracket's function (a tablet held in the lid,
      item 16d) leaves the kit unless a place is found, and no record read establishes how the tablet travels with the
      kit. Nothing is designed for either.
    source: ["[a1mech README section 3 item 2](../../records/a1mech/README.md)", "[DECISION-A1.md](../../records/a1mech/DECISION-A1.md)", "ENERGY-BASIS.md section 6, branch fnd/l3plane at 6a283b25", "[the energy basis check, What holds (relocation facts)](../../records/l3r2/checks/energy-basis-check-1/CHECK-1.md)"]

