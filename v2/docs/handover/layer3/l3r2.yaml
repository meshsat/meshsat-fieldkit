# The changes that are proposals only (D-22, D-23), stated on every page that shows a row.
proposal_only: >-
  Changes to weather coverage, deployment restrictions, functionality, operating conditions, enclosure constraints,
  mission requirements, charging time or approved resources are proposals for the owner's explicit decision (D-22 to
  D-25): each appears only as a row or an option he answers, naming the requirement it changes with the consequence
  quantified (each row's owner test), never as a closure, and none is taken because the current design passes it.
  Component selection, sensing implementation (Kelvin sensing among it), charging below a source's available power while
  the approved requirements hold, and the other power-path corrections are engineering tasks, tracked downstream (D-24,
  D-25). No option is recommended as feasible because its idealised energy balance passes.

# Remedies that would change a requirement if an engineer chose them instead of the engineering form (D-25: each names the
# requirement and quantifies the consequence). None is asked now: every correction has an engineering form that changes
# no requirement (stream r11dep's second issue, section 6, checked by the energy stream's CHECK-4 as reported; filed with
