# The combinations the evidence covers; the gate's first condition reads MET only on one of them (CHECK-1, B1).
coherence:
  - {rule: "row L3-OD1 answered approve", why: "rows L3-OD2 to L3-OD4 need it; a reject records an open conflict instead"}
  - {rule: "row L3-OD4 answered adopt only with row L3-OD3 answered 2s2p", why: "the plane grid ran 400 Wp in 2S2P into 200 W; no band exists for 1S4P or for REQ-016 kept"}
  - {rule: "row L3-OD4 answered adopt only with row L3-OD2 not answered both-kept", why: "M1 is not met with a 4S9P lid, so no band is adopted for it"}
  - {rule: "row L3-OD4 answered adopt only after row L3-OD6 answered mean-day", why: "the plane grid runs SC-37's mean day on each plane; no band exists for a coverage target, and a band adopted first would select the benchmark without the owner (D-23; CHECK-2, B1)"}
  - {rule: "row L3-OD2's lid carries the store of row L3-OD6's answer in its build case", why: "row L3-OD6's table marks per lid which carries each basis (weather_basis.out B); a lid it does not mark, or a fit not yet filled, is not a coherent set, and the scripts record an open conflict against REQ-072 (CHECK-2, B2)"}
  - {rule: "one ruling on the array", why: "row L3-OD1 fixes no array; row L3-OD3 alone does, and od_l3_3.py replaces REQ-072's marked phrase with it"}

