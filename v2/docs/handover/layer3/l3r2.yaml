  - {id: L3-C34, item: "Board A's power path corrected for Option A(i)'s currents: implementation (not the resistor alone, D-24)", whose: SESSION, closes_by: "layers 8 and 9: each finding of power_path_corrections (A-1 and A-2, B-1 to B-5, C-1 to C-9, closure items L3-C37 to L3-C44 and L3-C46 to L3-C53) meets its criterion; engineering tasks, not owner decisions and not layer 3 prerequisites (fact CF-02)", state: DOWNSTREAM}
  - {id: L3-C35, item: "Board A's corrected power path: physical verification", whose: SESSION, closes_by: "prototype, tracked apart from the implementation (D-23): the front end's current limit at -20 C, 25 C and the worst inside air; in-service operation at 9, 15.1, 24 and 36 V with U3 at its limit; R11's Kelvin error; temperatures at a forced limit; L1's current at 9 V; the current loop's step response; the vehicle entry's interplay; the input capacitors at 36 V; board E's tracker at the front end's demand (R11-DEPENDENCY.md section 7b, restated from its second issue once power_path_check is filed); not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C37, item: "A-1, existing defect of the circuit as drawn: The front end limits below what the charge design asks (confirmed on the makers' figures): its stacked limit, 4.212 / 5.000 / 5.810 A, lies under U3's drawn setting plus the other loads on R11. Correction for the drawn circuit: the derated variant, U3 at 4.00 A (+0.052 A on 0.060 A of other loads, +0.033 A on 0.079 A), which fixes the coordination only and does not meet M1 (layer 8)", whose: SESSION, closes_by: "the stacked minimum of the fitted R11 is at least U3's maximum plus the other loads; on the bench, the front end's constant-current onset, measured with an electronic load past U3 at -20, 25 and 62 C, lies above U3's maximum plus 0.06 A; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C38, item: "A-2, existing defect of the circuit as drawn: With E1's fixed setting (4.15 A), the input bus collapses on a short source: established from the netlist and the makers' documented behaviour, the mechanism INFERRED; the defect sits in the E1 setting, not in FW-A16 as written. Correction: a VIN_RAW-dependent IIN_HOST rule for every source, firmware that lowers U3's input limit as VIN_RAW falls; an engineering choice while REQ-072 is met (layer 5)", whose: SESSION, closes_by: "on the bench, with the panel source (or a simulator) stepped below U3's demand, run first at E1's fixed 4.15 A to confirm the collapse (a carried minor of the energy stream's CHECK-5) and then with the VIN_RAW rule: VIN_RAW settles above 12 V and FE_PGOOD never drops; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C39, item: "B-1, defect the resistor-only proposal introduces: L1 runs past its typical saturation current at the 9 V floor, in service. Correction: an inductor whose saturation current at its operating temperature exceeds the peak at the highest permitted current at 9 V, with margin, or IIN_HOST scheduled on VIN_RAW, its register setting 5.05 A at 9 V (a peak of 15.68 A, 89.6 percent of the typical saturation current, recomputed once the maker's derating is held, C-5); raising the input floor instead is a conditional owner case (REQ-015) (layer 8)", whose: SESSION, closes_by: "analysis: the peak at the highest permitted current is at most 90 percent of the saturation current at the part's temperature, with the maker's derating; bench: L1's current waveform at 9 V with U3 at full draw shows no saturation knee; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C40, item: "B-2, defect the resistor-only proposal introduces: The FETs at the highest permitted current at 9 V. Correction, one or both of: hiccup (partial: it catches only parts whose peak limit sits under the fault's peak), or FETs and cooling rated for the fault, for example FETs in parallel; an input-side average limit is not available, and neither remedy is yet shown to fit on board A (layer 9)", whose: SESSION, closes_by: "TJ at most 150 C, or the tree's derating where one applies, at the highest permitted current at 9, 15.1 and 36 V in 62.1 C air, from board A's own thermal resistance or a measurement; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C41, item: "B-3, defect the resistor-only proposal introduces: The copper declarations are passed (VBUS20 and FE_OUT, VIN_RAW). Correction: re-declare VBUS20, FE_OUT, VIN_RAW, _FE_A, _VIN_T and TRK_OUT, and regenerate (layer 8)", whose: SESSION, closes_by: "dc_drop, derate and the track-width gates read PASS on the regenerated board at the new declarations; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C42, item: "B-4, defect the resistor-only proposal introduces: VBUS20's bulk capacitors at the highest permitted current. Correction: re-run the generator's node analysis at 9.37 A and 9 V and enlarge or rebalance the bank, or bound the fault current (B-2) (layer 8)", whose: SESSION, closes_by: "every can at most 2.8 A (the maker's figure at 125 C) over the ESR bands at the highest permitted current; on the bench, the worst can's ripple and temperature agree with it; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C43, item: "B-5, defect the resistor-only proposal introduces: A fixed IIN_HOST of 6.2 A drops FW-A16's VIN_RAW scaling (INFERRED; the proposal's form of A-2). Correction: as A-2, for the proposal's setting (layer 5)", whose: SESSION, closes_by: "as A-2: with a source stepped below U3's demand, VIN_RAW settles above 12 V and FE_PGOOD never drops; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C44, item: "C-1, missing evidence, not a failure: Kelvin sensing at R11 and the permitted shared resistance: an implementation requirement, not a defect of the drawn circuit (the A32 reading is tied to that revision) (layer 9)", whose: SESSION, closes_by: "layout extraction: kelvin_check on FE_ISNS_P and FE_ISNS_N reads at most 0.29 mOhm for the two together at 25 C (0.371 mOhm at the working temperature); bench at 25 C: the DC voltage across U2's pins 14 and 13 exceeds I x R11, R11 measured four-wire at its pads, by at most 0.29 mOhm x I (1.7 mV at 6.0 A); an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C46, item: "C-2, missing evidence, not a failure: The 6.2 mOhm part's order code (layer 6)", whose: SESSION, closes_by: "a catalogue answer for a 2512 part of 1 percent, 50 ppm/K or better and 3 W, with its sheet filed; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C47, item: "C-3, missing evidence, not a failure: Board A's own junction-to-air figure for Q2 to Q5 (layer 9)", whose: SESSION, closes_by: "a figure from the laid copper, at most 30 C/W for Q2 and 38 C/W for Q4 in service at 9 V and 39 C/W for Q2 at 15.1 V at the maximum, or a measurement; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C48, item: "C-4, missing evidence, not a failure: C11 and C12's ripple rating and DC-bias derating at 36 V (layer 6)", whose: SESSION, closes_by: "the maker's figure, at least 2.5 A a part, or a part that has one; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C49, item: "C-5, missing evidence, not a failure: L1's saturation current against temperature (layer 6)", whose: SESSION, closes_by: "the maker's derating read at the part's temperature (it feeds B-1's closure); an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C50, item: "C-6, missing evidence, not a failure: Board E's 200 W stage, not designed; the front end's input is the stage's output (layer 8)", whose: SESSION, closes_by: "a stage design that takes the front end's maximum demand at its input, or a bound on that demand in a fault; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C51, item: "C-7, missing evidence, not a failure: U3's input-current minimum at 10 mOhm (layer 6)", whose: SESSION, closes_by: "the maker's figure, or a bench reading; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C52, item: "C-8, missing evidence, not a failure: The three undocumented efficiencies: board E's stage, board A's front end and the pack's charge efficiency (layer 6)", whose: SESSION, closes_by: "the makers' figures for these circuits, or measurement; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C53, item: "C-9, missing evidence, not a failure: The VBUS20 loads besides U3 (layer 9)", whose: SESSION, closes_by: "a bench reading of R11's current minus R16's at U3's full draw; an engineering task (D-24, D-25), not a layer 3 prerequisite", state: DOWNSTREAM}
  - {id: L3-C36, item: "Where a displaced lid item goes, and whether its function stays (D-22: no function removed silently)", whose: SESSION, closes_by: "the records read (fact CF-04): no place in the kit is established for the QMX or the tablet bracket; each option of row L3-OD2 states the function it removes, qmx-outside stays held until a record establishes its place, and both-kept is offered with its flag", state: CLOSED}

