# LAYER 3'S SECOND ISSUE (L3-R2), THE DATA ITS PAGES ARE RENDERED FROM (MESHSAT-1357, 30 September 2026; second round
# after the independent check CHECK-1, v2/docs/records/l3r2/checks/check-l3r2-1.md, and the owner's review of the draft
# table, owner ruling D-22).
#
# render_l3r2.py (beside this file) renders REQUIREMENTS-L3-R2.md, OWNER-DECISIONS-L3.md and L3-RECONCILIATION.md from
# three inputs: this file, the requirements registry v2/ecad/tools/pcb_requirements.yaml, and the registry as released
# in handover H3 (frozen from v2/release/handover/H3.zip into h3_registry_digest.json, the ZIP read as it is, never
# modified). `--check` refuses a page on disk that differs from what the three render, and the suite runs it
# (v2/ecad/tools/tests/test_l3r2.py).
#
# WHAT IS KEPT HERE AND WHAT IS NOT. The registry is the authority for every requirement, its reading and its open
# items; nothing here repeats a record. What is here is what the registry has no field for: the target in words, the
# proposals made since H3 with their status, the requirement-or-implementation classification, the owner decisions layer
# 3 still needs (with the conditional scripts that apply each answer), the closure list, the layer each open item belongs
# to, each change's downstream impact by layer, and the files the gate waits on (the energy basis, the relocation facts,
# the re-issue of the definition documents, the independent check). A decision's state is NOT kept here: it is read from
# the registry, where the conditional script that applies the owner's answer records a ruling with
# `decides: <row>:<option>`. Prototype design: no V2 board has been fabricated, ordered, assembled or powered.
#
# THE OWNER'S REVIEW OF 30 SEPTEMBER 2026 (D-22) HOLDS ROWS L3-OD1, L3-OD2 AND L3-OD4 until the corrected, independently
# checked energy comparison arrives, and asks that "adverse" be defined by exact weather and operating assumptions. So no
# energy figure is stated here as the design's, the words "typical" and "adverse" are not used for a case, and the rows'
# energy cells read HELD until `energy_basis` below names the filed, checked basis. Since round 3c's fill it does: the
# basis at fnd/l3plane cd8720a1 with its accepted check CHECK-5, and the figures on the pages are that basis's.
#
# THE THIRD ROUND (30 September 2026). The independent check of stream l3plane's energy basis (filed here as
# v2/docs/records/l3r2/checks/energy-basis-check-1/, accepted: no, for three efficiencies of its case WE) confirmed four
# facts, recorded below as CF-01 to CF-04 and used now; nothing here uses a figure of the cases WE, WE60 or WA. The
# owner's instruction on the six-row table (D-23) adds row L3-OD6 (M1's weather basis) as a quantified choice with its
# recommendation and figures held, gives every row its options, recommendation, quantified consequences and dependencies
# with the evidence linked, flags plainly every option that cannot meet M1, and carries board A's current-limit resistor
# R11 as two results: the held circuit (10 mOhm, as generated) and the drafted 6.2 mOhm.
#
# ROUND 3B (30 September 2026), on the scoped check CHECK-2 of L3-R2 (accepted so far: no) and the energy basis's second
# check (filed as v2/docs/records/l3r2/checks/energy-basis-check-2/, accepted: yes, of fnd/l3plane ec415c09): row L3-OD4's
# band follows row L3-OD6's mean-day answer and never precedes it; row L3-OD6's table carries the basis's figures per
# build case and its fits per lid, and a lid that does not carry the weather basis chosen never reads coherent; the gate
# verifies the energy basis's check verdict and a re-issue's own approving ruling; CF-01 states the bus's steady-state
# range with its brackets. The figures are NOT filled: energy_basis stays null until the basis's final tip is confirmed,
# and then set_energy_basis.py and fill_l3r2_from_basis.py (v2/docs/records/l3r2/) fill them by exact keys.
#
# THE OWNER'S ADDENDUM (D-24, the same round): every result that depends on board A's front end is stated in three cases,
# never merged: (a) the circuit as drawn, R11 10 mOhm; (b) the resistor-only proposal, R11 6.2 mOhm, not a sufficient
# solution, CONDITIONAL or INCONCLUSIVE until the electrical check (power_path_check) says otherwise; (c) a hypothetical
# corrected power path used for the feasibility figures, whose corrections (power_path_corrections) stand beside every
# figure that rests on it. Energy available only through (c) is hypothetical, never demonstrated capability. The
# corrections are engineering tasks with measurable criteria, tracked downstream (L3-C34, L3-C35, L3-C37 to L3-C44).
#
# THE OWNER'S CORRECTIONS (D-25, the same round): Kelvin sensing at R11 and the permitted shared resistance are
# implementation requirements with measurable criteria (the A32 layout reading stays tied to its revision; the current
# board has no layout); a fourth case (a') states the derated variant, U3's input limit at 4.05 A or less on the circuit as
# drawn, as fixing current-limit coordination only; the independently checked 0.378 A comparison stays closed unless its
# inputs change; and every row carries `owner_test`, the requirement it changes with the consequence quantified.
#
# ROUND 3C (30 September 2026), on the narrow check CHECK-3 of L3-R2 (accepted so far: no): an accepted check is bound to
# the files filed, byte identical to its checked tip (basis_binding.py, set_energy_basis.py, the hold and the gate); the
# reader covers three_cases.out, and row L3-OD1's four-case cells are filled from it by exact keys (four_cases); the history
# of stream r11dep's record is stated as it is; PP-02 carries its bench threshold, PP-03 the REQ-015 case in figures.
#
# THE FILL (round 3c, 30 September 2026): the final basis, fnd/l3plane cd8720a1ab6eed891b1afd8b5df3b8ceedf36c0f, and its
# accepted check CHECK-5 (a delta on CHECK-4, accepted, on CHECK-3, not accepted, and on CHECK-1 and CHECK-2 of ec415c09)
# are filed; energy_basis and power_path_check are named and bound to that tip; restate_power_path.py and
# fill_l3r2_from_basis.py have run; rows L3-OD1, L3-OD2, L3-OD4 and L3-OD6 are restated from the filled figures, each
# linked to its section; row L3-OD4's band is written from the basis (none at U3's 6.0 A bracket). CHECK-5's two minors are
# carried (carried_items), not reopened.
#
# ROUND 3D (30 September 2026), on CHECK-4 of L3-R2 (accepted: no, one text item): row L3-OD6 recommends the weather basis
# only (the mean-day benchmark) and presents the array build neutrally, coupled with row L3-OD2: the WAB build is carried
# by the QMX-out lid only, so choosing it with row L3-OD1 removes HF from the kit (REQ-002, REQ-067, REQ-068), and the TYP
# build keeps both lids. Row L3-OD2 states the same dependency. (Round 5, D-26: HF kept with WAB is a valid target whose
# studied candidate reads INCONCLUSIVE, feasibility item FI-02; the rows state it so.) S-127 is closed by apply_l3r2_s127.py; the text left from
# before the fill is brought current; row L3-OD3's unshown options and both-kept's range are flagged plainly.
#
# ROUND 5, THE SECOND FIX ROUND (30 September 2026), on the collaborator's targeted recheck astra-check-l3r5-2 (accepted:
# no; B1, B3 and M1 accepted, B2 failed again). The stale text was in structures written option-neutral before the owner
# answered the rows and never restated when D-32 to D-37 decided them: `impacts`, `execution_plan_questions`, the
# classification rows, closure items and proposals naming a row, acceptance definitions 3 and 5, the passages' reasons.
# Each now states what the decided option does with its ruling, or is marked superseded in place with it; `impacts`
# entries name their rows, whose state the renderer turns into the entry's label (render_l3r2.impact_state); row
# L3-OD1's closed_as names its proposal, P-01. test_l3r5.py holds the recheck's closure criterion on the rendered views.
#
# No dash character (U+2013, U+2014) is used in this file or the pages rendered from it.

