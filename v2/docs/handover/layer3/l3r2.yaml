# ------------------------------------------------------------------------------------------------ owner decisions
# The six-row table the owner answers (D-23: options, the recommendation, quantified consequences and dependencies, the
# detailed calculations kept in the evidence package and linked from the table; an option that cannot meet the stated
# mission flagged plainly). Per row:
#   options         each with `flag` where the option cannot meet mission M1 or rests on something no record establishes,
#                   and `held_until` where one option waits on a file the others do not
#   recommendation  the session's; never an option taken as feasible on its idealised energy balance (D-24)
#   consequences    quantified, each figure linked to its evidence section; filled from the checked basis (cd8720a1)
#   dependencies    the other rows, the files, and the downstream obligations (named, never layer 3 prerequisites)
#   r11             board A's current-limit resistor (D-23): the result on the held circuit (R11 10 mOhm, as generated)
#                   and the result conditional on the drafted 6.2 mOhm, as two columns of their own table
#   held_until      the l3r2.yaml files the whole row waits on before its recommendation and its figures are stated
#   held_by         the owner ruling that holds the row (D-22 unless named)
#   quantified      row L3-OD6's options table, filled from the checked basis by exact keys
decisions:
  - id: L3-OD1
    owner_test: "Changes an approved resource and requirements: D-06's store, 12 cells of about 145 Wh, becomes 80 or 84 cells, 964.8 or 1013.0 Wh nominal (REQ-014, REQ-075, REQ-072); the lid from about 1.4 kg to 4.8 to 5.5 kg; the second pack joins prototype 1's core (D-01)."
    question: "Adopt Option A(i)'s store for mission M1: two separately protected packs of the ruled cell, a base 4S6P across both base pockets (replacing D-06's one 4S3P in the east pocket) and a lid pack with its own protection board, charger and gauge? The solar input is row L3-OD3's."
    options:
      - {id: approve, label: "Approve Option A(i)'s store (a base 4S6P and a lid pack)", flag: "CANNOT MEET M1 on the circuit as drawn, nor in its derated variant, with any lid; INCONCLUSIVE on the resistor-only proposal; M1 is met only on the HYPOTHETICAL corrected power path, at nominal inputs with the 4S14P or 4S15P lid, and at the worst established inputs only conditionally (the four front-end cases ([three_cases.out 2](../../records/l3plane/three_cases.out), [ENERGY-BASIS.md section 0](../../records/l3plane/ENERGY-BASIS.md)))"}
      - {id: reject, label: "Keep D-06's one 4S3P pack; REQ-072 stays FAIL and an open conflict is recorded", flag: "CANNOT MEET M1: the one pack allows at most 9.1 W for M1 against PS-IDLE-SPEC's 42.8 W, at any bus voltage ([ENERGY-RECONCILIATION.md section 9d](../../records/energy/ENERGY-RECONCILIATION.md))"}
    recommendation: "Approve, as the only store inside the fixed case under which M1 is not already shown to fail; not as a feasible design. On the power path as drawn, and in its derated variant, M1 fails on every lid; on the resistor-only proposal it is inconclusive; it is met only on a hypothetical corrected power path whose sixteen findings (A-1 to C-9) are open engineering tasks, and there, at the worst established inputs, only conditionally on three efficiencies no maker document gives for this circuit. The reasons beyond the energy balance: D-20 excludes accepting the shortfall and D-21 preserves M1, so keeping D-06's one pack leaves a conflict no engineering work can close, while approving the store leaves one that engineering work can close or refute; and the approval buys, builds or authorises nothing. REQ-072 stays FAIL until the corrected path is built and tested."
    consequences: "Checked figures, SC-37's reference day at 40/0, TYP / WAB ([three_cases.out 2 and 3](../../records/l3plane/three_cases.out); checked by [CHECK-5](../../records/l3r2/checks/energy-basis-check-5/CHECK-5.md)). (a) AS DRAWN, R11 10 mOhm and U3 at 4.15 A: NOT MET on every lid, 326.6 to 522.4 Wh unserved at nominal inputs and 422.1 to 616.7 Wh at the worst established inputs; 0 of 864 past windows. (a') DERATED VARIANT, U3 at 4.00 A: fixes current-limit coordination only; NOT MET on every lid, 369.9 to 566.0 Wh unserved at nominal inputs; 0 windows. (b) RESISTOR-ONLY, R11 6.2 mOhm, not a sufficient solution (D-24): INCONCLUSIVE between a lower bound NOT MET by 622.1 to 1079.9 Wh (the bus collapsing on a short source, B-5) and case (c). (c) CORRECTED PATH, HYPOTHETICAL: at nominal inputs the 4S15P lid meets with 125.2 / 106.8 Wh and the 4S14P lid with 93.7 / 75.7 Wh; at the worst established inputs (WE, CONDITIONAL on three undocumented efficiencies) the 4S15P lid meets with 74.3 / 19.5 Wh and the 4S14P lid with 44.0 Wh in TYP and fails by 10.8 Wh in WAB; the 4S9P lid fails in every case. Remaining uncertainties: at U3's 6.0 A bracket or the bus's 18.782 V endurance bracket the 4S15P lid fails in WAB by 0.6 and 3.7 Wh ([energy_basis.out 5](../../records/l3plane/energy_basis.out)); the WE margins need the charge efficiency at 0.936 to 0.949 or better and the stage and front end at 0.907 to 0.929 or better ([ENERGY-BASIS.md section 1](../../records/l3plane/ENERGY-BASIS.md)); per pack (EACH) no lid keeps both packs above the floor at WE in WAB. Required changes: the corrected path's sixteen findings (the table below the main one). Other costs: 80 or 84 cells against 12 (964.8 or 1013.0 Wh nominal, [weather_basis.out B](../../records/l3plane/weather_basis.out)); each pack above the 160 Wh passenger figure (the base 289.4 Wh, [ENERGY-RECONCILIATION.md section 8d](../../records/energy/ENERGY-RECONCILIATION.md)), no transport route claimed (REQ-069); the lid from about 1.4 kg to 4.8 to 5.5 kg on a 100 degree stay ([a1mech README section 5](../../records/a1mech/README.md)); a second charger, gauge and protection board ([a1elec TOPOLOGY.md sections 3a to 3c](../../records/a1elec/TOPOLOGY.md)). REQ-072's pass line becomes 'serves the load at every hour of the 72 without the kit reaching its graceful shutdown', with the charge bus in its steady-state range and the brackets beside the result, and a 3.00 V a cell floor (od_l3_1.py). Nothing is drawn, built or tested; no purchase is authorised."
    dependencies: "Row L3-OD2 (approving forces one lid item out, or both stay on a 4S9P lid that cannot meet M1) and row L3-OD3 (the array: this row fixes the store only). The corrected path's findings A-1 and A-2 (existing defects), B-1 to B-5 (defects the resistor-only proposal introduces) and C-1 to C-9 (missing evidence), each with its correction and closure criterion ([R11-DEPENDENCY.md section 2](../../records/r11dep/R11-DEPENDENCY.md)), are engineering tasks tracked downstream (L3-C37 to L3-C44 and L3-C46 to L3-C53, their implementation L3-C34 and physical verification L3-C35), none a layer 3 prerequisite and none an owner decision unless a remedy changes a requirement (the conditional owner cases). The west RF entry re-planned before the west block is taken ([a1mech README section 6](../../records/a1mech/README.md), layer 7); the sealed lid-harness crossing (S-95, layer 7)."
    affected: "D-06 (superseded), D-01 (the second pack joins the core), REQ-014 and REQ-075 (per pack), REQ-072 (two packs, the supply range, the 3.00 V floor), CFL-006, M-02; each pack under REQ-044, REQ-045, REQ-046, REQ-069, CON-006"
    r11: {held: "AS DRAWN: NOT MET on every lid (three_cases.out 2)", derated: "DERATED VARIANT, U3 at 4.00 A: coordination only; NOT MET on every lid", resistor: "RESISTOR-ONLY: INCONCLUSIVE between a lower bound NOT MET on every lid and case (c)", corrected: "HYPOTHETICAL: the 4S14P and 4S15P lids meet at nominal inputs; at the worst established inputs conditionally"}
    held_until: [energy_basis, power_path_check]
    held_by: "D-22, D-24"
    script: od_l3_1.py
    requires: []
  - id: L3-OD2
    owner_test: "Changes a function: HF out of the kit (REQ-002, REQ-067, REQ-068), or the tablet bracket out (REQ-011); or both kept on a 4S9P lid, where REQ-072 is not met; the lid pack 4S15P, 4S14P or 4S9P; the QMX outside changes an enclosure constraint (the connector plate); coupled with row L3-OD6's build (WAB: the QMX-out lid only; TYP: either lid)."
    question: "Which approved lid item leaves the lid for the lid pack, where does it go, and does its function stay in the kit: the QMX HF set out of the kit, the QMX carried outside the case with HF kept, the tablet bracket out with the tablet's use kept, or both kept on a smaller lid pack?"
    options:
      - {id: qmx-out, label: "The QMX HF set leaves the kit and HF with it, the owner's explicit removal of an approved function; an 8 inch tablet bracket stays; the lid pack is 4S15P", flag: "MEETS M1 ONLY on the hypothetical corrected path: at the worst established inputs (WE, CONDITIONAL) on the combined line in both builds (74.3 / 19.5 Wh), NOT at U3's 6.0 A bracket or the 18.782 V endurance bracket in the WAB build (0.6 and 3.7 Wh unserved; [energy_basis.out 5](../../records/l3plane/energy_basis.out))"}
      - {id: qmx-outside, label: "The QMX HF set is carried outside the case, HF kept by a sealed lead through the case's back wall, which changes the ruled connector plate (it carries no such lead today) and the sealed case, an enclosure constraint the owner decides (D-23); an 8 inch tablet bracket stays; the lid pack is 4S15P", flag: "NO LOCATION ESTABLISHED: outside the case the QMX needs a lead through the back wall, which the ruled connector plate does not carry (fact CF-04); HF leaves the kit unless a place is found; its energy is qmx-out's", held_until: [relocation_facts]}
      - {id: tablet-out, label: "The tablet bracket leaves the lid and its function (a tablet held in the lid) leaves the kit; the tablet's use stays outside the case over the kit's WiFi and the USB-C outlet; the QMX stays; the lid pack is 4S14P", flag: "CANNOT MEET M1 at the worst established inputs in the WAB build, even on the hypothetical corrected path (NOT MET, 10.8 Wh unserved); in TYP it meets with the lid pack empty (44.0 Wh, each-pack line fails); it meets at nominal inputs ([energy_basis.out 5](../../records/l3plane/energy_basis.out))"}
      - {id: both-kept, label: "Both approved lid items stay; the lid pack is 4S9P", flag: "CANNOT MEET M1 in any case, the hypothetical corrected path included (NOT MET by at least 165.7 Wh; 0 of 864 past windows; [ENERGY-BASIS.md section 1 and energy_basis.out 5](../../records/l3plane/ENERGY-BASIS.md))"}
    recommendation: "No option is recommended as feasible, and which approved function leaves is the owner's (D-21, D-22). The session recommends against `both-kept` (it cannot meet M1 in any case) and `qmx-outside` (no place for the QMX exists). Between `qmx-out` and `tablet-out` the figures pull both ways: energy on the hypothetical path favours the QMX out (the one lid carrying the worst established inputs in both builds; the tablet-out lid fails in WAB by 10.8 Wh), while the function and the deployment favour the tablet out (it keeps HF, the kit's only HF bearer, keeps the tablet's use outside the case, and lets the open kit stand on 3 degrees and an 11.7 N push instead of 1 degree and a 6.1 N press). The choice is coupled with row L3-OD6's build: with the WAB build only the QMX out (or outside, with a place) carries M1's benchmark, so the tablet out is then an open conflict; with the TYP build both lids carry it. Neither is shown feasible on the power path as drawn."
    consequences: "Checked figures (case (c), HYPOTHETICAL; [energy_basis.out 5](../../records/l3plane/energy_basis.out), [weather_basis.out A](../../records/l3plane/weather_basis.out)): the 4S15P lid (QMX out) meets on the reference day at nominal inputs (125.2 / 106.8 Wh, TYP / WAB) and at WE on the combined line (74.3 / 19.5 Wh; its lid pack empties in WAB), fails at U3's 6.0 A bracket and the endurance bracket in WAB (0.6, 3.7 Wh unserved), and carries 22.0 / 17.5 percent of 864 past September windows at WE; the 4S14P lid (tablet out) meets at nominal inputs (93.7 / 75.7 Wh), at WE only in TYP with its lid pack empty (44.0 Wh) and fails in WAB (10.8 Wh unserved), and carries 19.2 / 14.0 percent; the 4S9P lid (both kept) fails in every case and carries none. On the power path as drawn every lid fails (row L3-OD1). Limitations and required changes: every lid figure rests on the corrected path's findings A-1 to C-9 and on three undocumented efficiencies. `qmx-out`: HF leaves the kit (appendix 32.50 item 16a); REQ-011 narrowed from 8 to 10 inch to 8 inch; the open kit stands on level ground only (1.2 degrees at the interim feet basis, 7.0 if it tips on its flat bottom's edge), and a 6.1 N press at the tablet's far edge tips it ([a1mech README section 5](../../records/a1mech/README.md)). `qmx-outside`: the lid as `qmx-out`; HF stays only if a place outside the case and a sealed case-wall lead are established, which no record does ([ENERGY-BASIS.md section 9](../../records/l3plane/ENERGY-BASIS.md)). `tablet-out`: the bracket's function leaves the kit, the tablet's use stays outside the case (REQ-017's USB-C outlet, deferred from prototype 1's acceptance), no record establishes how the tablet travels with the kit; the QMX stays in its lid tray; the open kit stands on ground sloping under about 3 degrees toward the hinge (3.6 at the interim basis, 9.5 at the edge), and an 11.7 N backward push at the QMX's controls tips it. `both-kept`: no function leaves; M1 not met and