# ------------------------------------------------------------------------------------------------ (a) the target
target:
  approved: >-
    What the owner has approved to date (handover H3's accepted requirements, then D-19 and D-20 of 28 September and
    D-21, D-22 and D-23 of 30 September 2026): the V2 kit in the Peli 1450 of the current moulding (the case never changes,
    ruling of 7 September 2026), with the device set of V2-SPEC.md; prototype 1 accepted on D-01's named core (messaging
    over Iridium, 5G, LoRa and APRS; the three-slot failover fabric; pack, vehicle and solar charging; hardware EMCON;
    ZEROIZE; pack safety; service and programming access), everything else designed, fitted where copper exists and
    reported NOT_YET_TESTED; one 4S3P pack of the Samsung INR18650-35E, about 145 Wh, in the east pocket (D-06); a solar
    input window of at most 25 V open circuit at the panel's coldest, held at 17.6 V, at most 100 W into board E's stage
    (REQ-016); mission M1, 72 hours in PS-IDLE-SPEC (42.8 W at the pack terminals) on the kit's own store and its solar
    input, from a full aged store, lid open and the kit shaded, judged on SC-37's reference day (the September mean day
    at Leiden on the optimally inclined plane, 40 degrees facing south), M1 carrying no season (CONOPS section 3); the 72
    hours preserved by D-20 and approved by D-21. Battery and solar are mandatory for M1; an external DC source is optional
    and never M1's basis (D-20, D-21, D-22). The approved functions include the lid's QMX HF set (appendix 32.50 item 16a)
    and its tablet bracket (item 16d), both deferred from prototype 1's acceptance by D-01, not withdrawn.
  contradiction: >-
    The approved target is not self-consistent, and that is why layer 3 is not complete: on D-06's one pack M1 fails at
    desk (REQ-072 FAIL; the pack allows at most 9.1 W for M1 against 42.8 W, energy record section 9d, a limit no bus
    voltage raises), and REQ-016's 100 W window and REQ-072 cannot both hold. D-20 excludes accepting the shortfall and
    D-21 preserves the mission, so only owner decisions that change the store (D-06), move an approved lid item (D-01's
    deferrals) and set the solar input (REQ-016) make the target unambiguous: rows L3-OD1 to L3-OD4. Row L3-OD5 closes the
    one other open contradiction, CFL-017, and row L3-OD6 sets the weather M1 is judged in, which D-22 asks to be stated
    exactly. Rows L3-OD1, L3-OD2, L3-OD4 and L3-OD6 are held by the owner (D-22, D-23) until the corrected, independently
    checked energy comparison (open item S-127) is filed.
  proposed: >-
    What the rows propose, as far as the session recommends before the energy basis: Option A(i)'s store (row L3-OD1), a
    base pack of 4S6P across both base pockets under board P and a lid pack under its own protection board, 4S20P or
    4S21P in all as the lid is 4S14P or 4S15P (964.8 or 1013.0 Wh nominal: strings of 48.24 Wh at the cell's 3,350 mAh
    minimum and 14.4 V, the arithmetic of D-06's own 144.7 Wh for 3 strings); the solar input of row L3-OD3, four 100 W
    panels in two series pairs (400 Wp at STC) into a 200 W stage, the panels and their folding stand carried outside the
    case; and D-02a's margins read as the kit's without its cells (row L3-OD5). Where the displaced lid item goes and
    whether its function stays in the kit (row L3-OD2), and M1's deployment conditions (row L3-OD4), are recommended only
    from the checked energy basis and the relocation facts. Every Option A(i) figure rests on board A's entry re-rated as
    drafted (R11 6.2 mOhm): on the circuit as generated no lid meets M1 (fact CF-02). M1's weather basis (row L3-OD6) is a
    quantified choice between the average-day benchmark and historical-coverage targets, its figures held for the checked
    basis. REQ-072 stays FAIL until the design is drawn, reviewed and tested: a model result is never a pass.
  alternatives:
    - {row: L3-OD1, option: reject, text: "D-06's one 4S3P pack stands; REQ-072 stays FAIL and the contradiction with D-06 is recorded as an open conflict; layer 3 cannot complete unless the owner explicitly authorises a change to M1 or to the approved functions, which D-20, D-21 and D-22 otherwise preserve."}
    - {row: L3-OD2, option: qmx-out, text: "The QMX HF set leaves the kit and HF leaves with it, the owner's explicit decision to remove an approved function; the lid keeps an 8 inch tablet bracket beside a 4S15P lid pack."}
    - {row: L3-OD2, option: qmx-outside, text: "The QMX HF set leaves the lid and is carried outside the case, its HF function kept through a sealed lead across the case wall; held until a record establishes that place and lead, which none does (fact CF-04); the lid keeps an 8 inch tablet bracket beside a 4S15P lid pack."}
    - {row: L3-OD2, option: both-kept, text: "Both approved lid items stay beside a 4S9P lid pack; no function leaves the kit, M1 cannot be met on the records (a1int RECONCILE.md; every case of the energy basis's first issue) and an open conflict is recorded."}
    - {row: L3-OD2, option: tablet-out, text: "The tablet bracket leaves the lid; the tablet is carried outside the case and served by the kit's WiFi and the USB-C outlet (REQ-017, deferred from prototype 1's acceptance); the QMX stays in its lid tray beside a 4S14P lid pack."}
    - {row: L3-OD3, option: 1s4p, text: "The four panels all in parallel: REQ-016 restated to at most 200 W, at most 25.6 V open circuit at -20 C cells, the array held at 16.7 to 17.6 V, an entry of 40 A and a fuse per panel; no plane grid has been run for it, so row L3-OD4 cannot adopt a band on it."}
    - {row: L3-OD3, option: keep, text: "REQ-016's 100 W window kept, with the array and entry current the checked energy basis gives for the lid chosen (the 1600 Wp of the options sheet is for 4S18P); no plane grid has been run for it."}
    - {row: L3-OD4, option: reject, text: "No deployment condition is stated: M1's claim stays on SC-37's reference plane (40 degrees, facing south) with no rule for the operator and no open-kit stability requirement."}
    - {row: L3-OD5, option: measure, text: "CFL-017 stays open until the bounded enclosure heat experiment (POWER-THERMAL.md section 10) is run on hardware; layer 3 then completes with it open only by the owner's explicit authorisation."}
