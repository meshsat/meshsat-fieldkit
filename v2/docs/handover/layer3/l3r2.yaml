  - {id: L3-C32, item: "The rows are coherent: no combination leaves two contradictory rulings standing", whose: SESSION, closes_by: "what is enforced, and by what: rows L3-OD2 to L3-OD4 need row L3-OD1 approved (the scripts refuse; the gate reads a reject incoherent); row L3-OD4's adopt needs row L3-OD3 answered 2s2p, row L3-OD2 not both-kept and row L3-OD6 answered mean-day first (the scripts refuse; the gate reads incoherent); row L3-OD2's lid must carry the store of row L3-OD6's answer in its build case by the filled table (od_l3_6.py and od_l3_2.py record an open conflict; the gate reads a lid the table does not mark, or an unfilled fit, incoherent); one ruling on the array by construction (od_l3_1.py writes none, od_l3_3.py replaces REQ-072's marked phrase). Tests hold each refused path, CHECK-2's paths A and B included. Nothing else is checked: a combination these rules do not name is not claimed coherent (CHECK-1, B1; CHECK-2, B1 and B2)", state: CLOSED}
