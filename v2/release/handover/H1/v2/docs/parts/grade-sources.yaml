# v2/docs/parts/grade-sources.yaml: the operating range of every fitted active part and connector of the six schematic
# boards, and of the modules, cells and wall parts no netlist carries, with the document each range was read from.
#
# Written 27 September 2026 (MESHSAT-1357, pre-PCB layer 6, closer hc6) from readings made that night. Prototype design:
# nothing here has been built, bought for assembly or measured. `grade_check.py` beside this file joins it to the
# committed netlists and writes GRADE-CHECK.md; it does not change, and is not read by, pcb_part_temps.yaml, whose rule
# (CMP-001/ENV-001, part_temps.py) stays advisory on its own thirteen rows.
#
# A ROW. `code` (the LCSC code a BOM line carries, or the one lcsc_fill.py gives a blank line) or `match` (footprint and,
# where needed, a word of the value) for a line with no code; `min_c`/`max_c` the range; `kind` TA (ambient or free-air
# operating), TJ (junction only: the ambient check then needs the part's dissipation, layer 9) or TCASE; `where` inside,
# outside_face, plate, pack or outside, which picks the hot bar; `source.class`:
#   held                   a maker document in v2/vendor (path given)
#   maker sheet as LCSC serves it   the maker's sheet from LCSC's datasheet link, fetched 2026-09-27 with its sha256;
#                          not filed in v2/vendor (a copy is re-fetchable from the URL)
#   LCSC parametric        LCSC's own transcription; it disagreed with the maker's sheet more than once this night
#                          (C164047 ESR, the JST VH/PH ranges), so it is used only where no sheet was read
#   none read              no range read: the row reads TBD and is counted, never assumed fine
#   maker sheet (round 8 stream copy)   the maker's sheet a round 8 board stream fetched and will file in v2/vendor
#                          (worktrees r8b and r8c, drafts/<board>/datasheets/); cited by the maker's URL and sha256
#                          until it is filed. Added 27 September 2026 so that those streams' parts join a row
#                          when their netlists land; a row whose code no netlist carries is not shown on the page
# `carve_out` repeats the envelope's own words for a part it declares; `not_a_component` marks copper with no part.
#
# Session picks named in rows (HC6-SC-7 IDC headers, HC6-SC-8 Mill-Max pin) are recommendations recorded on
# v2/docs/parts/PROCUREMENT.md; the generators that would carry them belong to the board authors. A quote reproduces the
# maker's words, except that an em dash in the original is written as a colon (the repository's no-em-dash rule).

