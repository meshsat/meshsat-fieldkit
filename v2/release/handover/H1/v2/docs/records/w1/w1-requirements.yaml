# W1 candidate requirement records, MESHSAT-1357 foundation baseline (draft, never pushed as is).
#
# Written 25 September 2026 by workstream W1. Extracted ONCE from: v2/docs/V2-SPEC.md, OPERATING-ENVELOPE.md,
# PANEL.md, ARCH-PCB-B-IOHA.md, TEST-PLAN.md, v2/ecad/tools/pcb_board_facts.yaml (_product), appendix sections
# 32.49, 32.50, 32.52, 32.53, 32.55, 32.62 (plus 32.51 and 32.57 where a device number lives), and read back
# against the generators where a claim is about what the design carries. The integrator assigns REQ ids;
# CAND ids are provisional and local to this file.
#
# Field meanings:
#   class               requirement | derived_constraint | implementation_choice | assumption | superseded | conflict
#   parent              a NEED id of v2/docs/CONOPS.md section 2
#   acceptance          the pass criterion with units and conditions, or TBD
#   tbd_effect          present when acceptance (or part of it) is TBD: what not knowing it blocks
#   allocated_to        boards (a b c d e e5 p), kit (whole kit), case, sw (compute module software),
#                       fw_panel / fw_sensor / fw_ioctrl (controller firmware), procedure, owner
#   verification_method subset of rules_lib.METHODS
#   verification_phase  the EARLIEST phase of rules_lib.PHASES at which the record can be judged
#   final_phase         where a later measurement is also owed (omitted when equal)
#   rules               existing pcb_rules.yaml ids that would (partly) satisfy it
#   rule_coverage       FULL | PARTIAL | NONE (NONE = no board rule judges it today: a kit-level gap)
#   source              file:line (or key), the place the statement is read from
#   source_check        VERIFIED (the cited artefact was read for this record) | INFERRED (derived, see note)
#   conflict_ref        id in drafts/w1-conflicts.md
#
# Counts are checked by the validator at the end of the W1 session (see the StructuredOutput summary).
# Round 2 (25 Sep 2026): records revised after the challenge and adjudications A01 to A11; CAND-095 to CAND-107 added.

schema: w1-candidates-1
written: "2026-09-25"
methods: [ERC, DRC, SCRIPT, CALCULATION, SIMULATION, MANUAL_REVIEW, VENDOR_CONFIRMATION, PROTOTYPE_MEASUREMENT]
phases: [SCHEMATIC, PLACED_BOARD, ROUTED_BOARD, RELEASE_PACKAGE, ASSEMBLY, PROTOTYPE]
needs_document: v2/docs/CONOPS.md

candidates:

