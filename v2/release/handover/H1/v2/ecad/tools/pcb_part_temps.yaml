# WHAT EACH PART'S OWN MAKER PUBLISHES AS ITS OPERATING TEMPERATURE RANGE (rules CMP-001 and ENV-001,
# 21 September 2026).
#
# The envelope was adopted on 21 September (decision 34) and `pcb_envelope.yaml` carries it as data. This file
# is the other half of the comparison: the range each part states, read out of the sheet in this tree, with the
# clause it was read from. It exists because NO RULE IN THIS PROJECT HAS EVER COMPARED THE TWO, and the first
# part looked at under the adopted envelope was outside it.
#
# WHAT A ROW IS. A quotation from a document in `v2/vendor/`, never a guess and never a class figure dressed as
# a datasheet number: where the sheet is owed, the row says so and the part is NOT judged. A row may declare a
# CARVE-OUT, which is the envelope's own words about a part that is knowingly outside its range at an extreme
# (the e-paper below -15 C, the pack cells at the charge limit); a carve-out is reported and never silently
# passed.
#
# HOW A PART IS MATCHED. By its JLCPCB order code where it has one, because that is what the BOM carries and
# what is bought; otherwise by a substring of the schematic's own value or comment, which is what a
# bench-fitted module has. A part that matches nothing is UNDECLARED and counted, never assumed fine.
schema_version: 1
generated: "2026-09-21"

parts:
  - {name: "Pulse H5007NL 1000BASE-T magnetics", lcsc: "C6384935", where: inside,
     min_c: 0, max_c: 70,
     source: {title: "Pulse H5007 family datasheet", clause: "Electrical Specifications, Operating Temperature",
              quote: "Electrical Specifications @ 25C - Operating Temperature 0C to 70C",
              url_or_path: "v2/vendor/pulse/pulse-h5007nl.pdf", accessed: "2026-09-21"},
     note: "the HX parts of the same sheet are the extended-temperature version, -40 to +85 C (note 1), and the
       Mechanicals page groups H5004, HX5004 and H5007 on one outline, so HX5004NL is the candidate; PIN
       COMPATIBILITY IS NOT CLAIMED here and is the first thing to check before a swap"}

