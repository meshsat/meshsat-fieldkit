# Declared component mismatches under the owner's condition 1 of 25 September 2026: "a part substitution is a component
# mismatch until compatibility is proven". Read by jlc_certify.py and lcsc_fill.py on every run (MESHSAT-1357, round 8,
# 26 September 2026; review of the 22:35 progress report, finding D1).
#
# WHY THIS FILE EXISTS. Fourteen rows of v2/release/revA/order/JLC-CERTIFIED.tsv were marked WRONG_MODEL by hand at
# 2aaa7b7f (thirteen by the parts stream, v2/vendor/SOURCES.yaml jlc_retake_45bde541.table_marks, and board B's U80 by
# the integrator, SOURCES.yaml bbm-xor), and a fifteenth row (board P's J_TS2) carries the same condition 1 reason
# beside a parser refusal. jlc_certify.py reads every one of them CERTIFIED, because each ordered model carries every
# character of the part the row names, and a full run writes the whole table: the next run would have put CERTIFIED
# back on all of them and lcsc_fill.py would have filled and accepted their codes again. Written here, the mismatch is
# an input the tools read, so a re-run and a regeneration keep it.
#
# WHAT AN ENTRY DOES. A row whose LCSC code is `code` (the code its BOM carries, or the code a search picked), and whose
# BOM comment matches `comment_re` when the entry has one (Python re.search), and whose land contains `fp_contains`
# when it has one, reads WRONG_MODEL in jlc_certify with the reason below, whatever the catalogue answered; lcsc_fill
# refuses the code on that row whatever the certified table says. `id`, `code`, `reason` and `record` are required: an
# entry missing one stops jlc_certify before it writes the table (a mismatch is never dropped silently).
#
# HOW A MISMATCH IS LIFTED. Two ways, and only two:
#   1. the row stops ordering the part: its code moves to the recommended part in the GENERATOR (or, for a blank line,
#      in lcsc_fill.py's MAP), or, for the two entries scoped by comment_re, its value text comes to name the ordered
#      part; the entry then matches nothing and jlc_certify names it as matching no row;
#   2. a `compatibility:` decision below names the entry (`clears:`) and cites its evidence: every item a file in this
#      repository (`path`), its sha256 as it sits here, and the words in it that establish compatibility (`finding`),
#      with `ruled_by`, `ruled_on` and `why`. A decision missing any of these, citing a file that is not in the tree, or
#      citing a sha256 the file does not have, is REFUSED: printed, recorded in the verdict, and it lifts nothing.
# Removing an entry by hand is neither; tests/test_certify_mismatch.py holds the entries against the table's marks.

