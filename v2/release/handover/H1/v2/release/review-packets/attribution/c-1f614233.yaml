# Board C (panel backer): every changed reference between 82dd1e4d and 1f614233, read by hand.
# Written for review_packet.py --attribution (MESHSAT-1357, 26 September 2026), in answer to the checker's finding that
# the mechanical fallbacks credited changes with a neighbour's IDs. Each row gives the IDs that are the change's own
# cause, the lines of gen_sch_c.py at 1f614233 that carry them, and the reason in words. The build refuses this file
# unless every ID is written on its cited lines and every cited range names the part or one of its nets, is the part's
# own comment or section header, or the row states the tie. Where the round-4 board C record (a session draft of that
# round, not in the repository) says more than the generator, `record` quotes it; `record` is never counted as an ID.
# Unbuilt prototype design; this reading releases nothing.
