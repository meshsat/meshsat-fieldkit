<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Carrier board, block diagram: power and interconnect only, no radio silicon</title>
  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f6f6f4; stroke: #333333; stroke-width: 1.2; }
    .ext { fill: #ffffff; stroke: #333333; stroke-width: 1.2; }
    .radio { fill: #ffffff; stroke: #333333; stroke-width: 1.2; stroke-dasharray: 2 0; }
    .board { fill: none; stroke: #333333; stroke-width: 2; }
    .pwr { stroke: #a14d00; stroke-width: 3.5; fill: none; }
    .aon { stroke: #2e7d32; stroke-width: 3.5; fill: none; }
    .usb { stroke: #1f4fb4; stroke-width: 2; stroke-dasharray: 7 4; fill: none; }
    .ctl { stroke: #555555; stroke-width: 1.6; stroke-dasharray: 2 3; fill: none; }
    .lead { stroke: #333333; stroke-width: 2.2; fill: none; }
    .t { fill: #111111; }
    .s { fill: #444444; font-size: 11.5px; }
    .h { fill: #111111; font-size: 15px; font-weight: bold; }
  </style>

  <text x="20" y="30" class="h">Carrier board for the V1 field kit: power and interconnect, no radio silicon</text>
  <text x="20" y="49" class="s">Feasibility study, 13 November 2026. Block level only: nothing has been drawn in ECAD, ordered or built.</text>

  <!-- Sources on the kit -->
  <rect x="20" y="90" width="200" height="50" class="ext"/>
  <text x="30" y="111" class="t">X1202 UPS, 5.1 V output</text>
  <text x="30" y="128" class="s">today feeds the Pi 5</text>

  <rect x="20" y="195" width="200" height="50" class="ext"/>
  <text x="30" y="216" class="t">X1202 cells (1S, about 50 Wh)</text>
  <text x="30" y="233" class="s">fused tap at the holders</text>

  <rect x="20" y="325" width="200" height="50" class="ext"/>
  <text x="30" y="346" class="t">Pi 5, one USB 2.0 port</text>
  <text x="30" y="363" class="s">upstream of the board's hub</text>

  <rect x="20" y="465" width="200" height="50" class="ext"/>
  <text x="30" y="486" class="t">Pi 5, I2C1</text>
  <text x="30" y="503" class="s">X1202 gauge already at 0x36</text>

  <!-- The board -->
  <rect x="250" y="70" width="480" height="500" rx="6" class="board"/>
  <text x="262" y="560" class="s">The board: about 100 x 80 mm, 4 layers. No radio on it.</text>

  <rect x="270" y="90" width="170" height="50" class="box"/>
  <text x="280" y="110" class="t">5 V in</text>
  <text x="280" y="127" class="s">2.5 A fuse, TVS, INA219</text>

  <rect x="270" y="185" width="170" height="70" class="box"/>
  <text x="280" y="205" class="t">Always-on 5.1 V</text>
  <text x="280" y="222" class="s">low-cell cutoff, boost,</text>
  <text x="280" y="238" class="s">INA219; runs with the kit off</text>

  <rect x="270" y="320" width="170" height="60" class="box"/>
  <text x="280" y="342" class="t">USB hub, FE1.1s</text>
  <text x="280" y="360" class="s">four USB 2.0 ports</text>

  <rect x="270" y="455" width="170" height="70" class="box"/>
  <text x="280" y="476" class="t">Control</text>
  <text x="280" y="493" class="s">PCA9555: every enable and</text>
  <text x="280" y="509" class="s">fault flag; 3.3 V regulator</text>

  <!-- Port channels and feeds -->
  <g>
    <rect x="510" y="90" width="200" height="46" class="box"/>
    <text x="520" y="108" class="t">Port 1</text>
    <text x="520" y="125" class="s">1.5 A switch, 0.1 ohm, INA219, ESD</text>

    <rect x="510" y="150" width="200" height="46" class="box"/>
    <text x="520" y="168" class="t">Port 2, always-on</text>
    <text x="520" y="185" class="s">1.5 A switch, 0.1 ohm, INA219, ESD</text>

    <rect x="510" y="210" width="200" height="46" class="box"/>
    <text x="520" y="228" class="t">Port 3</text>
    <text x="520" y="245" class="s">1.5 A switch, 0.1 ohm, INA219, ESD</text>

    <rect x="510" y="270" width="200" height="46" class="box"/>
    <text x="520" y="288" class="t">Port 4, spare</text>
    <text x="520" y="305" class="s">1.5 A switch, 0.1 ohm, INA219, ESD</text>

    <rect x="510" y="365" width="200" height="46" class="box"/>
    <text x="520" y="383" class="t">Display feed</text>
    <text x="520" y="400" class="s">2 A load switch, 0.1 ohm, INA219</text>

    <rect x="510" y="425" width="200" height="46" class="box"/>
    <text x="520" y="443" class="t">Satellite modem feed</text>
    <text x="520" y="460" class="s">2 A load switch, 0.1 ohm, INA219</text>
  </g>

  <!-- Modules, unchanged and certified -->
  <rect x="770" y="90" width="210" height="46" class="radio"/>
  <text x="780" y="108" class="t">Cellular modem</text>
  <text x="780" y="125" class="s">LilyGO T-Call A7670E</text>

  <rect x="770" y="150" width="210" height="46" class="radio"/>
  <text x="780" y="168" class="t">APRS radio</text>
  <text x="780" y="185" class="s">PicoAPRS V4, own 850 mAh cell</text>

  <rect x="770" y="210" width="210" height="46" class="radio"/>
  <text x="780" y="228" class="t">Mesh radio</text>
  <text x="780" y="245" class="s">LILYGO T-Echo, own cell</text>

  <rect x="770" y="270" width="210" height="46" class="radio"/>
  <text x="780" y="288" class="t">Spare</text>
  <text x="780" y="305" class="s">RTL-SDR, ZigBee or GPS, refitted</text>

  <rect x="770" y="365" width="210" height="46" class="radio"/>
  <text x="780" y="383" class="t">Touch Display 2</text>
  <text x="780" y="400" class="s">5 V lead; DSI ribbon unchanged</text>

  <rect x="770" y="425" width="210" height="46" class="radio"/>
  <text x="780" y="443" class="t">RockBLOCK Mk2 (9602)</text>
  <text x="780" y="460" class="s">5 V lead; UART unchanged</text>

  <text x="770" y="78" class="s">Radios stay certified modules</text>

  <!-- Power: X1202 output into 5 V in, then a bus to ports 1, 3, 4, the feeds and the hub -->
  <path class="pwr" d="M220,115 H270"/>
  <path class="pwr" d="M440,105 H480 V440"/>
  <path class="pwr" d="M480,105 H510"/>
  <path class="pwr" d="M480,225 H510"/>
  <path class="pwr" d="M480,285 H510"/>
  <path class="pwr" d="M480,380 H510"/>
  <path class="pwr" d="M480,440 H510"/>
  <path class="pwr" d="M480,335 H440"/>
  <!-- Always-on: cells into the boost, boost into port 2 only -->
  <path class="aon" d="M220,220 H270"/>
  <path class="aon" d="M440,205 H462 V165 H473 a7,7 0 0 1 14,0 H510"/>

  <!-- USB data: Pi port into the hub, hub to the four ports -->
  <path class="usb" d="M220,350 H270"/>
  <path class="usb" d="M440,365 H496 V121 H510"/>
  <path class="usb" d="M496,181 H510"/>
  <path class="usb" d="M496,241 H510"/>
  <path class="usb" d="M496,301 H510"/>

  <!-- Control: I2C from the Pi into the control block, then to every channel -->
  <path class="ctl" d="M220,490 H270"/>
  <path class="ctl" d="M440,490 H720 V100 H710"/>
  <path class="ctl" d="M720,160 H710"/>
  <path class="ctl" d="M720,220 H710"/>
  <path class="ctl" d="M720,280 H710"/>
  <path class="ctl" d="M720,375 H710"/>
  <path class="ctl" d="M720,435 H710"/>

  <!-- Leads from the board to the modules -->
  <path class="lead" d="M710,113 H770" marker-end="url(#arrow)"/>
  <path class="lead" d="M710,173 H770" marker-end="url(#arrow)"/>
  <path class="lead" d="M710,233 H770" marker-end="url(#arrow)"/>
  <path class="lead" d="M710,293 H770" marker-end="url(#arrow)"/>
  <path class="lead" d="M710,388 H770" marker-end="url(#arrow)"/>
  <path class="lead" d="M710,448 H770" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(20,600)">
    <path class="pwr" d="M0,0 H40"/>
    <text x="50" y="4" class="s">5 V power</text>
    <path class="aon" d="M120,0 H160"/>
    <text x="170" y="4" class="s">always-on, from the cells</text>
    <path class="usb" d="M330,0 H370"/>
    <text x="380" y="4" class="s">USB 2.0 data</text>
    <path class="ctl" d="M480,0 H520"/>
    <text x="530" y="4" class="s">I2C, enables, faults</text>
    <path class="lead" d="M680,0 H720" marker-end="url(#arrow)"/>
    <text x="730" y="4" class="s">latching lead (JST-GH, JST-VH)</text>
    <text x="0" y="30" class="s">The Pi 5's own four USB ports switch power as one group, so every USB device moves to the board's hub to get a port of its own.</text>
  </g>
</svg>
